    --r-xs:8px; --r-s:10px; --r:14px; --r-l:20px;
    --ff:'Inter','Noto Sans Bengali','Hind Siliguri','Nirmala UI','Segoe UI',system-ui,-apple-system,sans-serif;
    --fm:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
    /* কাচ/কঠিন পৃষ্ঠ — থিম বদলালে এগুলোও বদলায় */
    --glass-1:rgba(255,255,255,.88); --glass-2:rgba(255,255,255,.82); --glass-3:rgba(255,255,255,.7);
    --solid-1:#ffffff; --solid-2:#fbfcfe; --solid-3:#f8fafc; --solid-4:#f7f9fc;
    --row-hover:#fafbfe; --soft-2:#f1f5f9; --soft-line:#e2e8f0; --bar-bg:#eef2f7; --hover-line:#d8dee8;
    --field-bg:rgba(255,255,255,.92); --field-bg-focus:#ffffff; --field-line:#dbe2ec; --field-line-2:#cdd6e3; --field-ph:#a8b3c4;
    --btn-ink-1:#141f36; --btn-ink-2:#0b1220; --btn-ink-3:#1b2942; --btn-ink-4:#111c33;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; overflow-x:hidden; overflow-y:auto !important; min-height:100%; height:auto !important; }
  body{
    margin:0; color:var(--body); font-family:var(--ff); font-size:14px; line-height:1.55;
    background-color:var(--bg);
    overflow-x:hidden !important; overflow-y:auto !important; -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:auto !important; overscroll-behavior-x:hidden;
    position:relative; min-height:100vh; height:auto !important;
    /* Force scroll */
    display:block !important;
    background-image:
      radial-gradient(900px 420px at 6% -8%, rgba(var(--brand-glow),.08) 0%, rgba(var(--brand-glow),0) 62%),
      radial-gradient(760px 420px at 100% -6%, rgba(29,78,216,.06) 0%, rgba(29,78,216,0) 60%),
      linear-gradient(180deg,#fbfcfe 0%, #f4f6fa 55%, #f2f4f8 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4{ color:var(--ink); font-weight:700; letter-spacing:-.012em; margin:0; }
  a{ color:var(--info); }
  ::selection{ background:rgba(var(--brand-glow),.22); }
  :focus-visible{ outline:2px solid rgba(var(--brand-glow),.55); outline-offset:2px; border-radius:6px; }
  .num,.v,.money,td .amt{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }

  /* ── ANIMATED BACKGROUND - HIGHLY VISIBLE ── */
  .blobs{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .blobs i{ position:absolute; display:block; border-radius:50%; filter:blur(45px); opacity:.55; will-change:transform; }
  .blobs i:nth-child(1){ width:600px;height:600px; background:radial-gradient(circle, var(--brand-200) 0%, var(--brand-400) 35%, var(--brand-500) 70%, var(--brand-600) 100%); top:-180px; left:-160px; animation:float1 8s ease-in-out infinite; }
  .blobs i:nth-child(2){ width:540px;height:540px; background:radial-gradient(circle, #c7d2fe 0%, #a5b4fc 40%, #818cf8 70%, #6366f1 100%); bottom:-180px; right:-150px; animation:float2 10s ease-in-out infinite; }
  .blobs i:nth-child(3){ width:420px;height:420px; background:radial-gradient(circle, var(--brand-t2) 0%, var(--brand-200) 40%, var(--brand-400) 80%); top:35%; right:10%; opacity:.45; animation:float1 12s ease-in-out infinite reverse; }
  .blobs i:nth-child(4){ width:320px;height:320px; background:radial-gradient(circle, #bbf7d0 0%, #86efac 60%, #4ade80 100%); top:60%; left:5%; opacity:.35; animation:float2 14s ease-in-out infinite reverse; display:block; }
  .blobs i:nth-child(5){ width:260px;height:260px; background:radial-gradient(circle, #fecaca 0%, #fca5a5 60%, #f87171 100%); top:10%; right:20%; opacity:.30; animation:float1 16s ease-in-out infinite; display:block; }
  @keyframes float1{ 0%,100%{ transform:translate3d(0,0,0) scale(1); } 25%{ transform:translate3d(60px,50px,0) scale(1.12); } 50%{ transform:translate3d(30px,-50px,0) scale(1.08); } 75%{ transform:translate3d(-40px,30px,0) scale(1.10); } }
  @keyframes float2{ 0%,100%{ transform:translate3d(0,0,0) scale(1); } 33%{ transform:translate3d(-50px,-40px,0) scale(1.10); } 66%{ transform:translate3d(40px,30px,0) scale(1.12); } }
  @keyframes pulse1{ 0%,100%{ opacity:.55; } 50%{ opacity:.75; } }
  @keyframes pulse2{ 0%,100%{ opacity:.35; } 50%{ opacity:.60; } }
  @keyframes gradientShift{ 0%{ background-position:0% 50%; } 25%{ background-position:100% 0%; } 50%{ background-position:100% 100%; } 75%{ background-position:0% 100%; } 100%{ background-position:0% 50%; } }
  @keyframes float{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-10px) scale(1.03); } }
  @keyframes shimmer{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(200%); } }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 14px 34px -12px rgba(var(--brand-glow),.75), 0 0 0 1px rgba(var(--brand-glow3),.35) inset, 0 0 20px rgba(var(--brand-glow3),.2); } 50%{ box-shadow:0 18px 44px -12px rgba(var(--brand-glow),.9), 0 0 0 1px rgba(var(--brand-glow3),.5) inset, 0 0 35px rgba(var(--brand-glow3),.35); } }
  /* Auth wrap - FAST VISIBLE animated gradient */
  .auth-wrap{ 
    background:linear-gradient(135deg, var(--brand-050) 0%, var(--brand-100) 20%, var(--brand-t1) 40%, var(--brand-t2) 60%, var(--brand-t3) 80%, var(--brand-050) 100%);
    background-size:300% 300%;
    animation:gradientShift 6s ease infinite;
    position:relative;
    overflow:hidden;
  }
  .auth-wrap::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(700px 400px at 20% 0%, rgba(var(--brand-glow3),.18), transparent 60%),
               radial-gradient(600px 400px at 80% 100%, rgba(99,102,241,.12), transparent 60%),
               radial-gradient(500px 300px at 50% 50%, rgba(251,113,133,.08), transparent 60%);
    animation:pulse1 4s ease-in-out infinite;
  }
  .auth-card{ 
    animation:cardFloat 4s ease-in-out infinite; 
    box-shadow:0 24px 70px -20px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.9) !important;
    position:relative;
  }
  .auth-card::after{
    content:''; position:absolute; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg, transparent, var(--brand-400), var(--brand-500), transparent);
    animation:shimmer 3s ease-in-out infinite;
    z-index:2;
  }
  @keyframes cardFloat{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-6px) rotate(.3deg); } }
  .auth-logo.hero{ animation:logoPop .5s cubic-bezier(.2,.9,.3,1.2), float 3s ease-in-out infinite 0.6s, glowPulse 3s ease-in-out infinite !important; }
  .auth-side .mark.hero-mark{ animation:float 4s ease-in-out infinite, glowPulse 4s ease-in-out infinite !important; }
  @media (prefers-reduced-motion: reduce){ .blobs i{ animation:none; } .auth-wrap{ animation:none; } .auth-card{ animation:none; } .auth-wrap::after{ animation:none; } }

  /* ── শেল: উপরে টপবার, নিচে নেভিগেশন, পাশে হ্যামবার্গার ড্রয়ার ── */
  .app{ display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1; overflow:visible !important; }
  .main{ display:flex; flex-direction:column; flex:1; min-width:0; overflow:visible !important; }

  /* ── নিচের নেভিগেশন (মোবাইল-ফার্স্ট, ডেস্কটপেও) ── */
  .side{
    position:fixed; left:0; right:0; bottom:0; z-index:40; width:100%;
    display:flex; align-items:stretch; color:var(--muted);
    background:var(--glass-1);
    -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%);
    border-top:1px solid var(--line);
    box-shadow:0 -1px 0 rgba(16,24,40,.03), 0 -12px 30px -22px rgba(16,24,40,.5);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .side nav{ display:flex; flex:1; gap:2px; overflow:hidden; justify-content:space-around; flex-wrap:nowrap; }
  .side{ }
  .content{ padding-bottom:120px !important; overflow:visible !important; min-height:50vh; }
  @media(min-width:960px){ .content{ padding-bottom:130px !important; } }
  .app{ min-height:100vh; overflow:visible !important; }
  .main{ flex:1; overflow:visible !important; }
  .side nav::-webkit-scrollbar{ display:none; }
  .side nav a{
    position:relative; flex:1 1 0; min-width:62px; text-decoration:none; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:7px 4px 6px; border-radius:12px; font-size:10.5px; font-weight:600; letter-spacing:.01em;
    transition:background .16s ease, color .16s ease;
  }
  .side nav a .nav-t{ max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side nav a .ic{ width:20px; height:20px; color:var(--faint); transition:color .16s ease, transform .16s ease; }
  .side nav a:hover{ background:var(--line-3); color:var(--ink-2); }
  .side nav a:hover .ic{ color:var(--ink-2); transform:translateY(-1px); }
  .side nav a.active{ color:var(--brand-3); background:var(--brand-soft); font-weight:700; }
  .side nav a.active .ic{ color:var(--brand); }
  .side nav a.active::after{ content:''; position:absolute; top:2px; width:18px; height:3px; border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,var(--brand-400),var(--brand-600)); }
  @media(min-width:960px){
    .side{ left:50%; transform:translateX(-50%); right:auto; width:min(900px, 96vw); bottom:14px;
      border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-l); padding:6px; }
    .side nav a{ flex-direction:row; gap:7px; font-size:12.5px; padding:9px 8px; min-width:0; }
    .side nav a .nav-t{ max-width:none; }
    .side nav a .ic{ width:18px; height:18px; }
    .side nav a.active::after{ display:none; }
  }
  .content{ padding-bottom:120px; }
  @media(min-width:960px){ .content{ padding-bottom:130px; } }

  /* ═══ ড্যাশবোর্ড: বর্গাকার কাচ-কার্ড, ঝলক (glow), এক লাইনে দুটি (৪.৩) ═══ */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; max-width:760px; margin-left:auto; margin-right:auto; }
  .kpi-grid .kpi-card{
    display:flex; flex-direction:column; justify-content:center; position:relative;
    min-height:92px; max-height:118px; padding:11px 12px 10px; border-radius:12px;
    background:linear-gradient(155deg, var(--glass-1) 0%, var(--glass-3) 100%);
    -webkit-backdrop-filter:blur(18px) saturate(165%); backdrop-filter:blur(18px) saturate(165%);
    border:1px solid var(--line); overflow:hidden;
    transition:transform .18s ease, box-shadow .2s ease;
  }
  .kpi-grid .kpi-card::after{ content:''; position:absolute; inset:-40% -30% auto auto; width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 70%); opacity:.4; pointer-events:none; }
  .kpi-grid .kpi-card .kpi{ flex-direction:column; align-items:flex-start; gap:5px; }
  .kpi-grid .kpi-card .kpi .v{ font-size:24px; font-weight:900; letter-spacing:-.03em; line-height:1; }
  .kpi-grid .kpi-card:hover{ transform:translateY(-2px); }
  .kpi-grid .kpi-card[data-act]{ cursor:pointer; position:relative; }
  .kpi-grid .kpi-card[data-act]:hover{ transform:translateY(-3px) scale(1.01); box-shadow:0 12px 32px -12px rgba(0,0,0,.18), var(--shadow-s); }
  .kpi-grid .kpi-card[data-act]:active{ transform:translateY(-1px) scale(.99); }
  .kpi-grid .kpi-card[data-act]::before{ content:''; position:absolute; top:10px; right:10px; width:6px; height:6px; border-radius:50%; background:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,.2); animation:livePulse 2s ease-in-out infinite; }
  @keyframes livePulse{ 0%,100%{ transform:scale(1); opacity:1 } 50%{ transform:scale(1.2); opacity:.7 } }
  .kpi-card.tone-ok{ box-shadow:0 0 0 1px rgba(4,120,87,.16), 0 22px 46px -26px rgba(4,120,87,.72), var(--shadow-s); }
  .kpi-card.tone-bad{ box-shadow:0 0 0 1px rgba(190,18,60,.16), 0 22px 46px -26px rgba(190,18,60,.72), var(--shadow-s); }
  .kpi-card.tone-info{ box-shadow:0 0 0 1px rgba(29,78,216,.16), 0 22px 46px -26px rgba(29,78,216,.72), var(--shadow-s); }
  .kpi-card.tone-brand{ box-shadow:0 0 0 1px rgba(var(--brand-glow),.18), 0 22px 46px -26px rgba(var(--brand-glow),.78), var(--shadow-s); }
  .kpi-card.tone-ok:hover{ box-shadow:0 0 0 1px rgba(4,120,87,.26), 0 26px 54px -24px rgba(4,120,87,.85), var(--shadow); }
  .kpi-card.tone-bad:hover{ box-shadow:0 0 0 1px rgba(190,18,60,.26), 0 26px 54px -24px rgba(190,18,60,.85), var(--shadow); }
  .kpi-card.tone-info:hover{ box-shadow:0 0 0 1px rgba(29,78,216,.26), 0 26px 54px -24px rgba(29,78,216,.85), var(--shadow); }
  .kpi-card.tone-brand:hover{ box-shadow:0 0 0 1px rgba(var(--brand-glow),.28), 0 26px 54px -24px rgba(var(--brand-glow),.9), var(--shadow); }
  .glasscard{ background:linear-gradient(155deg, var(--glass-1), var(--glass-3)) !important;
    -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 18px 40px -26px rgba(16,24,40,.45) !important; }
  @media(max-width:520px){
    .kpi-grid{ gap:7px; max-width:100% !important; }
    .kpi-grid .kpi-card{ min-height:78px; max-height:96px; padding:9px 10px 8px; border-radius:10px; }
    .kpi-grid .kpi-card .kpi{ gap:4px; }
    .kpi-grid .kpi-card .kpi .v{ font-size:20px; font-weight:900; }
    .kpi-grid .kpi-card .kpi .lbl{ font-size:10px; }
    .kpi-grid .kpi-card .kpi .cap{ font-size:9.5px; line-height:1.1; }
    .kpi-grid .kpi-card .ic-badge{ width:28px; height:28px; border-radius:8px; }
    .kpi-grid .kpi-card .ic-badge .ic{ width:14px; height:14px; }
  }
  @media(max-width:760px){
    .kpi-grid{ gap:8px; }
    .kpi-grid .kpi-card{ min-height:84px; padding:10px 11px; }
    .kpi-grid .kpi-card .kpi .v{ font-size:22px; font-weight:900; }
  }
  :root[data-theme="dark"] .kpi-grid .kpi-card::after{ background:radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 70%); }
  :root[data-theme="dark"] .kpi-card.tone-ok{ box-shadow:0 0 0 1px rgba(52,211,153,.2), 0 22px 46px -26px rgba(16,185,129,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-bad{ box-shadow:0 0 0 1px rgba(251,113,133,.2), 0 22px 46px -26px rgba(244,63,94,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-info{ box-shadow:0 0 0 1px rgba(138,180,255,.2), 0 22px 46px -26px rgba(59,130,246,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-brand{ box-shadow:0 0 0 1px rgba(var(--brand-glow2),.22), 0 22px 46px -26px rgba(var(--brand-glow),.75), var(--shadow-s); }

  /* ═══ ☰ মেনুর ডেডিকেটেড স্ক্রিন (মডাল) ═══ */
  button.dr-item{ width:100%; background:transparent; cursor:pointer; font-family:inherit; font-size:13.5px; text-align:left; }
  button.dr-item:hover{ background:var(--line-3); }

  /* ── ব্যবহারকারীর ছোট কার্ড (ড্রয়ারে) ── */
  .uav{ width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center; font-weight:700; font-size:12.5px; color:#fff;
    background:linear-gradient(150deg,#6366f1,#0ea5e9); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
  .uav.g{ background:linear-gradient(150deg,var(--brand-500),#ef4444); }
  .uav.t{ background:linear-gradient(150deg,#10b981,#0d9488); }
  .uav.p{ background:linear-gradient(150deg,#8b5cf6,#d946ef); }
  .umeta{ min-width:0; }
  .umeta .n{ font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .umeta .e{ font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ── হ্যামবার্গার ড্রয়ার ── */
  .scrim{ position:fixed; inset:0; z-index:55; background:rgba(9,14,26,.46);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .22s ease; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; bottom:0; left:0; z-index:60; width:min(360px, 90vw);
    display:flex; flex-direction:column;
    background:var(--solid-1);
    border-right:1px solid var(--line); box-shadow:var(--shadow-l);
    transform:translateX(-102%); transition:transform .28s cubic-bezier(.2,.9,.3,1.02);
  }
  .drawer.open{ transform:none; }
  .drawer .dr-head{ display:flex; align-items:center; gap:11px; padding:14px 14px 12px; border-bottom:1px solid var(--line-2); }
  .drawer .dr-head .mark{ width:38px;height:38px;border-radius:11px; flex:0 0 auto; display:grid; place-items:center; color:#fff;
    background:linear-gradient(160deg,var(--brand-400),var(--brand-deep)); box-shadow:0 10px 22px -12px rgba(var(--brand-deepglow),.9), inset 0 1px 0 rgba(255,255,255,.35); }
  .drawer .dr-head .nm{ font-weight:750; color:var(--ink); font-size:15px; letter-spacing:-.01em; line-height:1.2; }
  .drawer .dr-head .tg{ font-size:11px; color:var(--muted); }
  .drawer .dr-body{ flex:1; overflow-y:auto; padding:12px 12px 22px; }
  .drawer .dr-sec{ font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); padding:14px 8px 6px; }
  .dr-user{ display:flex; align-items:center; gap:11px; padding:11px; border-radius:var(--r); border:1px solid var(--line);
    background:linear-gradient(180deg,var(--solid-1),var(--solid-4)); }
  .dr-user .uav{ width:40px;height:40px;border-radius:12px;font-size:14px; }
  .dr-user .nm{ font-weight:700; color:var(--ink); font-size:13.5px; }
  .dr-user .em{ font-size:11.5px; color:var(--muted); word-break:break-all; }
  .dr-item{ display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:var(--r-s); text-decoration:none;
    color:var(--ink-2); font-size:13.5px; font-weight:600; border:1px solid transparent; transition:.16s; }
  .dr-item .ic{ width:18px; height:18px; color:var(--muted); flex:0 0 auto; }
  .dr-item .ch{ margin-left:auto; color:var(--faint); font-weight:400; }
  .dr-item:hover{ background:var(--line-3); border-color:var(--line); color:var(--ink); }
  .dr-item.active{ background:var(--brand-soft); border-color:rgba(var(--brand-glow),.22); color:var(--brand-3); }
  .dr-item.active .ic{ color:var(--brand); }
  .dr-quick{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dr-quick button{ display:flex; align-items:center; gap:8px; padding:11px 12px; border-radius:var(--r-s); cursor:pointer;
    border:1px solid var(--line); background:var(--glass-1); color:var(--ink-2); font-family:inherit;
    font-size:12.5px; font-weight:600; text-align:left; transition:.16s; }
  .dr-quick button:hover{ border-color:var(--hover-line); background:var(--solid-1); color:var(--ink); transform:translateY(-1px); }
  .dr-quick button .ic{ width:17px; height:17px; color:var(--brand); flex:0 0 auto; }
  .dr-pref{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 8px; flex-wrap:wrap; }
  .dr-pref .t{ font-size:12.5px; font-weight:650; color:var(--ink-2); display:flex; align-items:center; gap:8px; }
  .drawer .adv{ border:1px solid var(--line); border-radius:var(--r); margin-top:12px; overflow:hidden; background:var(--surface-3); }
  .drawer .adv > summary{ cursor:pointer; padding:12px 13px; font-size:12.5px; font-weight:700; color:var(--ink-2);
    display:flex; align-items:center; gap:9px; list-style:none; }
  .drawer .adv > summary::-webkit-details-marker{ display:none; }
  .drawer .adv > summary .ic{ color:var(--muted); }

  .card, .grid, .phead, .filterbar { max-width:100%; }
  .content { width:100%; max-width:100vw; box-sizing:border-box; }
  table { max-width:100%; table-layout:auto; word-break:normal; overflow-wrap:break-word; }
  /* Prevent any element causing horizontal scroll */

  #orgInvitesList .tableWrap th, #orgInvitesList .tableWrap td { padding:8px 6px; white-space:nowrap; }

  /* ── অ্যাপের নিজের ডায়ালগ (confirm/alert/prompt ব্লক হলেও কাজ করে) ── */
  .uidlg{ position:fixed; inset:0; z-index:6000; background:rgba(11,18,32,.52);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:grid; place-items:center; padding:18px; animation:uidlgIn .14s ease-out; }
  @keyframes uidlgIn{ from{ opacity:0 } to{ opacity:1 } }
  .uidlg .box{ width:100%; max-width:400px; background:var(--solid-1, #fff); border:1px solid var(--line, #e6eaf1);
    border-radius:16px; box-shadow:0 30px 70px -20px rgba(16,24,40,.45); padding:18px; display:grid; gap:12px;
    animation:uidlgPop .16s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes uidlgPop{ from{ transform:translateY(8px) scale(.98) } to{ transform:none } }
  .uidlg .ttl{ display:flex; align-items:center; gap:10px; font-weight:800; color:var(--ink, #0b1220); font-size:15px; }

  .uidlg .row{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:2px; }

  /* ── সেটিংস: প্রতিটি সেকশন collapsible — ডিফল্ট বন্ধ ── */
  .set-head{ width:100%; font:inherit; color:inherit; text-align:left; background:transparent; border:0;
    display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; }
  .set-head:hover{ background:var(--row-hover, #fafbfe); }
  .set-head .set-chev{ flex:0 0 auto; width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
    border:1px solid var(--line); background:var(--solid-1); color:var(--muted); transition:transform .18s ease, background .18s ease; }
  .set-head.open .set-chev{ transform:rotate(180deg); background:var(--brand-soft, var(--brand-050)); color:var(--brand-3, var(--brand-700)); border-color:var(--brand-200); }
  .set-body{ padding:0 20px 20px; }
  .set-hint{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin:0 0 12px; padding:9px 12px;
    border:1px dashed var(--line); border-radius:10px; background:var(--solid-2, #fbfcfe); }
  .set-body[hidden]{ display:none !important; }

  /* pull-to-refresh বন্ধ — আঙুল টেনে নামালে অ্যাপ রিফ্রেশ হবে না */
  /* খেয়াল: এখানে overscroll-behavior দিয়ে pull-to-refresh আটকালে মোবাইল/WebView-এ
     টাচ-স্ক্রলও আটকে যাচ্ছিল — তাই CSS দিয়ে না করে JS টাচ-গার্ড (killPullToRefresh) দিয়ে
     আটকানো হচ্ছে, স্ক্রল স্বাভাবিক থাকে */
  /* Single screen fit - no left-right scroll - PWA optimized */
  .app, .main, #content, .content {
    width:100%; max-width:100vw; box-sizing:border-box; overflow:visible;
  }
  .card, .grid, .phead, .filterbar, .kpi-grid, .tableWrap {
    max-width:100%; box-sizing:border-box;
  }
  /* Prevent any wide element causing horizontal scroll */
  .card { overflow:visible; }
  .tableWrap { max-width:100%; overflow-x:auto; }
  /* Single screen fit - no left-right scroll */
  @media(max-width:768px){
    .grid.g2 { grid-template-columns:1fr !important; gap:10px !important; }
    .card { padding:12px !important; margin:0 !important; border-radius:12px !important; }
    .phead { flex-wrap:wrap; gap:8px; }
    .phead .acts { width:100%; display:flex; flex-wrap:wrap; gap:6px; }
    .tableWrap { margin:0; border-radius:8px; max-width:100vw; }
    .filterbar { flex-wrap:wrap; gap:6px !important; max-width:100%; }
    .filterbar .input, .filterbar select { min-width:0; flex:1 1 100px; max-width:100% !important; font-size:13px; }
    /* App members specific - fit single screen */
    #orgInvitesList, #orgMembersList { max-width:100%; overflow:visible; }
    /* Bottom nav - ensure no overflow */
    .side { max-width:100vw; overflow:hidden; }
    .side nav { max-width:100%; }
    /* Content padding for bottom nav */
    .content { padding-left:12px !important; padding-right:12px !important; padding-bottom:100px !important; }
  }
  @media(max-width:480px){
    .content { padding-left:10px !important; padding-right:10px !important; }
    .card { padding:10px !important; }
    .btn { font-size:12px; padding:6px 10px; }
    .btn.s { font-size:11px; padding:5px 8px; }
  }
  /* ── GLOBAL TABLE FIX - Prevent vertical text, allow horizontal scroll ── */
  .tableWrap{ overflow-x:auto !important; overflow-y:visible !important; -webkit-overflow-scrolling:touch; scrollbar-width:thin; max-width:100% !important; }
  .tableWrap table{ min-width:560px !important; width:100%; border-collapse:collapse; table-layout:auto; }
  .tableWrap table th{ white-space:nowrap !important; word-break:keep-all !important; overflow-wrap:normal !important; text-overflow:clip !important; writing-mode:horizontal-tb !important; font-size:11px !important; letter-spacing:.06em !important; font-weight:700 !important; }
  .tableWrap table td{ word-break:normal !important; overflow-wrap:break-word !important; white-space:normal; }
  .tableWrap table td.amt, .tableWrap table td:last-child.amt, .tableWrap table td.money, .tableWrap table td[data-col="amount"]{ white-space:nowrap !important; word-break:keep-all !important; font-variant-numeric:tabular-nums; text-align:right; }
  /* Specific tables min-width */
  .tableWrap table.ledger-table, #ledgerWrap .tableWrap table{ min-width:620px !important; }
  #membersWrap .tableWrap table, #donorsWrap .tableWrap table, #txWrap .tableWrap table{ min-width:580px !important; }
  #orgMembersList .tableWrap table, #orgInvitesList .tableWrap table{ min-width:500px !important; }
  /* Prevent vertical writing anywhere in content */
  .content table th, .content table td, .card table th, .card table td{ writing-mode:horizontal-tb !important; text-orientation:mixed !important; }
  @media(max-width:640px){
    .tableWrap table{ min-width:540px !important; }
    .tableWrap{ margin:0 -4px; border-radius:10px; }
  }

  .tableWrap table thead th{ background:var(--solid-4); }
  .tableWrap td .iconbtn{ display:inline-grid; vertical-align:middle; }
  .tableWrap td .iconbtn + .iconbtn{ margin-left:6px; }
  .amt{ text-align:right; font-weight:700; white-space:nowrap; }
  .amt.in{ color:var(--ok); } .amt.out{ color:var(--bad); } .amt.zero{ color:var(--faint); font-weight:600; }
  .tbl-empty{ text-align:center; color:var(--muted); padding:22px 12px !important; }

  /* ── পিল / ব্যাজ ── */
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3.5px 10px; border-radius:999px;

  .pill .ic{ width:12px; height:12px; }
  .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; display:inline-block; }

  /* ── প্রগ্রেস / বার ── */
  .bar{ height:8px; background:var(--bar-bg); border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .bar > div{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--brand-400),var(--brand-600)); transition:width .5s ease; }

  .bar > div.b-bad{ background:linear-gradient(90deg,#fb7185,#be123c); }

  .catrow{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:12.5px; margin-bottom:10px; }

  /* ── অ্যাভাটার ── */

  /* ── খালি অবস্থা ── */
  .empty{ text-align:center; color:var(--muted); padding:34px 16px; font-size:13px; display:flex; flex-direction:column;
    align-items:center; gap:10px; border:1px dashed var(--line); border-radius:var(--r); background:var(--surface-3); }
  .empty .ic{ width:26px;height:26px; color:var(--faint); }
  .empty .t{ color:var(--ink-2); font-weight:600; font-size:13.5px; }
  .empty .h{ font-size:12px; color:var(--muted); max-width:420px; line-height:1.6; }

  /* ── বার্তা ── */
  .warn,.err,.ok,.banner{ padding:12px 14px; border-radius:var(--r-s); font-size:12.5px; line-height:1.7;
    display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .warn{ background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-line); }
  .err{ background:var(--bad-bg); color:#9f1239; border:1px solid var(--bad-line); }

  .banner{ background:rgba(255,255,255,.75); color:var(--ink-2); border:1px solid var(--line); }
  .warn .ic,.err .ic,.ok .ic,.banner .ic{ margin-top:1px; }
  .warn b,.err b{ font-weight:700; }
  .notice{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-s); font-size:12.5px;
    background:rgba(255,255,255,.7); border:1px solid var(--line); color:var(--ink-2); line-height:1.7; }

  /* ── ৪.৬: ছোট বার্তা-স্ট্রিপ (বড় বাক্স নয়) — লম্বা কথা "বিস্তারিত"-এর ভিতরে ── */
  .noticebar{ padding:8px 10px 8px 12px; font-size:12.5px; line-height:1.5; border-radius:12px; }
  .noticebar .nb-t{ display:inline-flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .noticebar .nb-t .ic{ flex:0 0 auto; }
  .noticebar .nb-sp{ flex:1 1 12px; }
  .noticebar .nb-toggle{ flex:0 0 auto; display:inline-flex; align-items:center; gap:3px; font:inherit; font-weight:600;
    font-size:11.5px; padding:3px 8px; border-radius:999px; cursor:pointer; background:rgba(255,255,255,.6);
    border:1px solid currentColor; color:inherit; opacity:.85; }
  .noticebar .nb-toggle:hover{ opacity:1; }
  .noticebar .nb-toggle .ic{ transition:transform .18s ease; }
  .noticebar.open .nb-toggle .ic{ transform:rotate(180deg); }
  .noticebar .nb-act{ flex:0 0 auto; padding:5px 10px !important; font-size:11.5px !important; }
  .noticebar .nb-body{ flex:1 1 100%; display:none; margin-top:7px; line-height:1.65; opacity:.95; }
  .noticebar.open .nb-body{ display:block; }
  /* এক লাইনে আঁটে না এমন জায়গার জন্য (যেমন লগইন কার্ড) — ছোট রূপ */
  .noticebar.nb-mini{ flex-wrap:nowrap; align-items:center; }
  .noticebar.nb-mini .nb-t{ display:block; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .noticebar.nb-mini .nb-t .ic{ vertical-align:-3px; margin-right:4px; }
  .noticebar.nb-mini .nb-toggle .nb-lbl{ display:none; }
  .noticebar.nb-mini.open{ flex-wrap:wrap; }
  .noticebar.nb-mini.open .nb-t{ white-space:normal; }
  @media(max-width:560px){ .noticebar .nb-toggle .nb-lbl{ display:none; } }
  @media(max-width:520px){
    .noticebar{ padding:8px 10px; }
    .noticebar .nb-toggle span, .noticebar .nb-toggle{ font-size:11px; }
    .noticebar .nb-t{ font-size:12px; }
  }

  /* ── ডায়াগনস্টিক ── */
  .diag{ font-family:var(--fm); font-size:11.5px; background:#0b1220; color:#cbd5e1; padding:14px; border-radius:var(--r-s);
    white-space:pre-wrap; max-height:280px; overflow:auto; line-height:1.65; border:1px solid #1e293b;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05); }

  .stack{ display:flex; flex-direction:column; gap:13px; }

    width:100%; border:1px solid var(--field-line); border-radius:var(--r-s); padding:10px 12px; font-size:13.5px; color:var(--ink);
    background:var(--field-bg); transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;

    background-repeat:no-repeat; background-position:right 10px center; padding-right:32px; cursor:pointer; }
  .fhint{ font-size:11.5px; color:var(--faint); margin-top:5px; }

  /* ── লগইন / স্প্ল্যাশ ── */

  .auth-shell{ width:100%; max-width:1000px; display:grid; grid-template-columns:1.05fr .95fr; gap:0;
    background:var(--surface); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);

               radial-gradient(300px 200px at 80% 100%, rgba(var(--brand-glow2),.15) 0%, transparent 60%); }

  .auth-side .mark{ width:46px;height:46px;border-radius:13px; display:grid; place-items:center; color:#fff;

  .auth-side .foot{ position:relative; z-index:1; font-size:11.5px; color:#7e91ad; display:flex; align-items:center; gap:8px; }

  .auth-card{ padding:30px 28px; background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); display:flex; flex-direction:column; justify-content:center; min-width:0; position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.7); }

  @keyframes logoPop{ from{ transform:scale(.86); opacity:0 } to{ transform:none; opacity:1 } }
  .auth-card h2{ text-align:center; }
  .auth-card .auth-sub{ text-align:center; }
  .forgot-row{ display:flex; justify-content:center; margin-top:12px; }
  .linkbtn{ display:inline-flex; align-items:center; gap:7px; background:transparent; border:0; cursor:pointer;
    color:var(--brand-3); font-size:13px; font-weight:600; font-family:inherit; padding:7px 10px; border-radius:10px; }
  .linkbtn:hover{ background:var(--brand-soft); }

    background:linear-gradient(160deg,var(--brand-400),var(--brand-deep)); box-shadow:0 14px 30px -14px rgba(var(--brand-deepglow),.9), inset 0 1px 0 rgba(255,255,255,.32); }
  .auth-card h2{ font-size:20.5px; text-align:left; letter-spacing:-.02em; margin:0 0 5px; }
  .auth-sub{ color:var(--muted); font-size:12.5px; margin:0 0 16px; }
  .auth-status{ display:flex; justify-content:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .helper{ margin-top:16px; border-top:1px solid var(--line-2); padding-top:12px; }
  .helper summary{ cursor:pointer; font-size:12px; color:var(--muted); font-weight:600; list-style:none; display:flex; align-items:center; gap:7px; }
  .helper summary::-webkit-details-marker{ display:none; }
  .helper summary::before{ content:''; width:14px;height:14px;border-radius:50%; border:1.5px solid var(--faint); display:inline-block;
    background:radial-gradient(circle at 50% 40%, var(--faint) 0 22%, transparent 24%); }
  .helper summary:hover{ color:var(--ink-2); }
  .splash-note{ font-size:11.5px; color:var(--muted); margin-top:14px; line-height:1.75; text-align:center; }

  /* ── ট্যাব ── */
  .tabs{ display:flex; gap:4px; margin-bottom:18px; background:rgba(15,23,42,.045); border:1px solid var(--line); border-radius:var(--r-s); padding:4px; }
  .tabs button{ flex:1; padding:9px 10px; border-radius:var(--r-xs); border:none; font-weight:600; font-size:13px; cursor:pointer;
    font-family:inherit; background:transparent; color:var(--muted); transition:.16s; }
  .tabs button:hover{ color:var(--ink-2); }
  .tabs button.on{ background:var(--solid-1); color:var(--ink); box-shadow:var(--shadow-xs); font-weight:700; }

  /* ── মডাল ── */
  .modal{ position:fixed; inset:0; background:rgba(11,18,32,.42); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    display:flex; align-items:center; justify-content:center; padding:16px; z-index:80; animation:fade .18s ease; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .modal .box{ background:rgba(255,255,255,.97); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:18px; width:100%; max-width:560px; max-height:92vh; overflow:hidden;
    box-shadow:var(--shadow-l); animation:pop .2s cubic-bezier(.2,.9,.3,1.2); display:flex; flex-direction:column; }
  @keyframes pop{ from{ transform:translateY(10px) scale(.985); opacity:.6 } to{ transform:none; opacity:1 } }
  .modal .head{ padding:16px 20px; border-bottom:1px solid var(--line); font-weight:700; color:var(--ink); background:var(--solid-1); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; }
  .modal .head span{ color:var(--ink); font-size:15px; letter-spacing:-.01em; }
  .modal .body{ padding:20px; overflow:auto; flex:1 1 auto; max-height:calc(92vh - 60px); }
  /* Light mode header */
  :root[data-theme="light"] .modal .head{ background:#ffffff; color:#0f172a; border-bottom-color:#e2e8f0; }
  :root[data-theme="light"] .modal .head span{ color:#0f172a; }
  :root[data-theme="light"] .modal .box{ background:rgba(255,255,255,.98); }
  /* Dark mode header - both data-theme dark and system dark */
  :root[data-theme="dark"] .modal .head{ background:#1e293b !important; color:#e2e8f0 !important; border-bottom-color:#334155 !important; }
  :root[data-theme="dark"] .modal .head span{ color:#e2e8f0 !important; }
  :root:not([data-theme="light"]) .modal .head{ background:#1e293b; color:#e2e8f0; border-bottom-color:#334155; }
  :root:not([data-theme="light"]) .modal .head span{ color:#e2e8f0; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .modal .box{ background:rgba(19,26,42,.98) !important; }
    :root:not([data-theme="light"]) .modal .head{ background:#1e293b !important; color:#e2e8f0 !important; }
  }
    display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:15px; letter-spacing:-.01em; position:sticky; top:0;
    background:rgba(255,255,255,.96); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); z-index:1; }
  .modal .body{ padding:20px; }

  /* ── ৪.৫: অ্যাপ আইকনের প্রদীপ — শিখা হালকা করে নড়ে, আভা ধীরে শ্বাস নেয় ── */
  .appmark .flame, .appmark .flame-in{ transform-box:fill-box; transform-origin:50% 100%; will-change:transform; }
  .appmark .flame{ animation:flameFlick 2.9s ease-in-out infinite; }
  .appmark .flame-in{ animation:flameFlickIn 2.1s ease-in-out infinite; }
  .appmark .halo{ transform-box:fill-box; transform-origin:50% 62%; animation:haloPulse 3.4s ease-in-out infinite; }
  @keyframes flameFlick{
    0%,100%{ transform:scale(1,1) rotate(0deg); }
    18%{ transform:scale(.97,1.05) rotate(-1.4deg); }
    38%{ transform:scale(1.03,.96) rotate(1.1deg); }
    58%{ transform:scale(.985,1.03) rotate(-.7deg); }
    78%{ transform:scale(1.02,.98) rotate(.6deg); }
  }
  @keyframes flameFlickIn{
    0%,100%{ transform:scale(1,1) rotate(0deg); opacity:.95; }
    30%{ transform:scale(.94,1.08) rotate(1.6deg); opacity:.9; }
    65%{ transform:scale(1.05,.94) rotate(-1.2deg); opacity:1; }
  }
  @keyframes haloPulse{ 0%,100%{ opacity:.75; transform:scale(1) } 50%{ opacity:1; transform:scale(1.06) } }
  @media (prefers-reduced-motion: reduce){
    .appmark .flame, .appmark .flame-in, .appmark .halo{ animation:none !important; }
  }

  /* ── ৪.৬: খাতা (লেজার) — দুই ভাগ, চলতি ব্যালেন্স ── */
  .ledger-seg{ display:inline-flex; gap:4px; padding:4px; margin-bottom:14px; border-radius:14px;
    background:var(--glass-2); border:1px solid var(--line); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .ledger-seg button{ display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; font:inherit;
    font-size:13px; font-weight:650; color:var(--muted); padding:9px 15px; border-radius:11px; background:transparent; transition:.16s; }
  .ledger-seg button .ic{ width:17px; height:17px; }
  .ledger-seg button:hover{ color:var(--ink-2); background:var(--soft-2); }
  .ledger-seg button.on{ background:var(--solid-1); color:var(--brand-3); box-shadow:var(--shadow-s); }
  tr.ledger-open td{ background:var(--brand-soft); font-size:12.5px; }
  tr.ledger-cur td{ background:var(--brand-soft); }
  table tfoot .bal{ font-weight:750; }
  @media(max-width:520px){
    .ledger-seg{ display:flex; width:100%; }
    .ledger-seg button{ flex:1 1 0; justify-content:center; font-size:12.5px; padding:9px 8px; }
  }
  :root[data-theme="dark"] tr.ledger-open td, :root[data-theme="dark"] tr.ledger-cur td{ background:rgba(var(--brand-glow2),.10); }

  /* ── টোস্ট সিস্টেম (৪.৪) — একাধিক বার্তা সাজিয়ে দেখায় ── */
  /* ৪.৫ — বার্তা এখন উপরে (হেডারের ঠিক নিচে, ডান কোণে); নতুন বার্তা সবচেয়ে নিচে */
  .toasts{ position:fixed; right:18px; top:64px; z-index:400; display:flex; flex-direction:column; gap:9px;
    width:min(380px, calc(100vw - 28px)); pointer-events:none; }
  .toasts > *{ pointer-events:auto; }
  .toast{ position:relative; display:flex; align-items:flex-start; gap:11px; width:100%; max-width:none;
    padding:13px 14px; border-radius:14px; font-size:13.2px; line-height:1.5; color:var(--ink);
    background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--line); border-left:4px solid var(--brand);
    box-shadow:var(--shadow-l), 0 10px 30px -14px rgba(15,23,42,.35);
    animation:toastIn .26s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes toastIn{ from{ transform:translateY(-14px) scale(.985); opacity:0 } to{ transform:none; opacity:1 } }
  .toast.out{ animation:toastOut .22s ease forwards; }
  @keyframes toastOut{ to{ transform:translateY(-12px) scale(.985); opacity:0 } }
  .toast .toast-ic{ flex:0 0 auto; width:26px; height:26px; border-radius:9px; display:grid; place-items:center; margin-top:1px; }
  .toast .toast-tx{ flex:1 1 auto; min-width:0; padding-top:2px; word-break:break-word; }
  .toast .toast-x{ flex:0 0 auto; width:24px; height:24px; border:0; background:transparent; color:var(--faint);
    border-radius:7px; display:grid; place-items:center; cursor:pointer; padding:0; }
  /* ৪.৬: টোস্টের ভিতরের কাজের বাটন (যেমন "ফিরিয়ে আনুন") + সময়ের রেখা */
  .toast .toast-act{ flex:0 0 auto; align-self:center; border:1px solid var(--line); background:var(--solid-1); color:var(--ink-2);
    font:inherit; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:9px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:6px; transition:.15s; }
  .toast .toast-act:hover{ background:var(--brand-soft); border-color:rgba(var(--brand-glow),.35); color:var(--brand-3); }
  .toast .toast-act .toast-secs{ min-width:1.1em; text-align:right; color:var(--brand-3); font-variant-numeric:tabular-nums; }
  .toast .toast-bar{ position:absolute; left:0; right:0; bottom:0; height:3px; border-radius:0 0 14px 14px;
    background:linear-gradient(90deg,var(--brand-2),var(--brand)); transform-origin:left center;
    animation:toastBar linear forwards; }
  .toast.t-ok .toast-bar{ background:linear-gradient(90deg,#10b981,#047857); }
  .toast.t-err .toast-bar{ background:linear-gradient(90deg,#f43f5e,#be123c); }
  .toast.t-warn .toast-bar{ background:linear-gradient(90deg,#fbbf24,#b45309); }
  .toast.t-info .toast-bar{ background:linear-gradient(90deg,#60a5fa,#1d4ed8); }
  @keyframes toastBar{ from{ transform:scaleX(1) } to{ transform:scaleX(0) } }
  :root[data-theme="dark"] .toast .toast-act{ background:rgba(148,163,184,.12); border-color:#2b3752; color:#dbe3ef; }
  :root[data-theme="dark"] .toast .toast-act:hover{ background:rgba(var(--brand-glow2),.16); color:var(--brand-300); }
  .toast .toast-x:hover{ background:var(--soft-2); color:var(--ink-2); }
  .toast.t-ok{ border-left-color:#10b981; }
  .toast.t-ok .toast-ic{ background:rgba(16,185,129,.14); color:#047857; }
  .toast.t-err{ border-left-color:#e11d48; }
  .toast.t-err .toast-ic{ background:rgba(225,29,72,.13); color:#be123c; }
  .toast.t-warn{ border-left-color:#f59e0b; }
  .toast.t-warn .toast-ic{ background:rgba(245,158,11,.16); color:#b45309; }
  .toast.t-info{ border-left-color:#3b82f6; }
  .toast.t-info .toast-ic{ background:rgba(59,130,246,.14); color:#1d4ed8; }
  @media(max-width:520px){
    .toasts{ left:50%; right:auto; transform:translateX(-50%); top:10px; width:calc(100vw - 24px); }
    .toast{ animation:toastInM .26s cubic-bezier(.2,.9,.3,1.15); }
    @keyframes toastInM{ from{ transform:translateY(-14px) scale(.98); opacity:0 } to{ transform:none; opacity:1 } }
  }
  @media print{ .toasts{ display:none !important; } }
  :root[data-theme="dark"] .toast{ background:rgba(17,24,39,.94); border-color:#26314a; color:#e6ecf7; }
  :root[data-theme="dark"] .toast .toast-x{ color:#8b9cba; }
  :root[data-theme="dark"] .toast .toast-x:hover{ background:rgba(148,163,184,.16); color:#e6ecf7; }
  :root[data-theme="dark"] .toast.t-ok .toast-ic{ background:rgba(16,185,129,.2); color:#6ee7b7; }
  :root[data-theme="dark"] .toast.t-err .toast-ic{ background:rgba(225,29,72,.22); color:#fda4af; }
  :root[data-theme="dark"] .toast.t-warn .toast-ic{ background:rgba(245,158,11,.22); color:#fcd34d; }
  :root[data-theme="dark"] .toast.t-info .toast-ic{ background:rgba(59,130,246,.22); color:#93c5fd; }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; }
  .spin-d{ width:26px; height:26px; border:3px solid rgba(var(--brand-glow),.18); border-top-color:var(--brand); border-radius:50%; animation:sp .8s linear infinite; margin:0 auto; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* ── বিবিধ ── */
  summary{ outline:none; }
  .hidecode{ user-select:all; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(100,116,139,.35); border-radius:999px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(100,116,139,.55); background-clip:content-box; }

  .filterbar .input{ max-width:300px; padding-left:34px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='6.3'/><path d='M20 20l-4.7-4.7'/></svg>");
    background-repeat:no-repeat; background-position:11px center; }
  .seg{ display:inline-flex; background:rgba(15,23,42,.045); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .seg button{ border:0; background:transparent; padding:6px 13px; border-radius:999px; font-size:12px; font-weight:600; color:var(--muted);
    cursor:pointer; font-family:inherit; transition:.16s; }

  .metagrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px 18px; }
  .metagrid .k{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .metagrid .va{ color:var(--ink); font-weight:600; font-size:13px; margin-top:3px; }
  .qa{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }

  /* ═══════════ PDF / প্রিন্ট — শুধু রিপোর্ট ═══════════ */
  /* ═══════════ থিম: সিস্টেম / হালকা / গাঢ় (৪.১) ═══════════ */
  :root{ color-scheme:light; }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e9eff8; --ink-2:#cdd7e6; --body:#b4c0d2; --muted:#8b9ab1; --faint:#6f7f97;
    --line:#26324b; --line-2:#1e2840; --line-3:rgba(255,255,255,.08);
    --bg:#070b14;
    --surface:rgba(19,26,42,.82); --surface-2:rgba(19,26,42,.6); --surface-3:rgba(19,26,42,.42);
    --glass-1:rgba(21,29,47,.88); --glass-2:rgba(21,29,47,.8); --glass-3:rgba(21,29,47,.62);
    --solid-1:#151d2f; --solid-2:#131a2b; --solid-3:#182033; --solid-4:#161e30;
    --row-hover:rgba(255,255,255,.04); --soft-2:#1d273c; --soft-line:#2b3852; --bar-bg:#1b2336; --hover-line:#33415e;
    --field-bg:rgba(13,19,33,.72); --field-bg-focus:rgba(13,19,33,.9); --field-line:#2b3852; --field-line-2:#3a4a6b; --field-ph:#63748f;
    --btn-ink-1:#243149; --btn-ink-2:#1a2338; --btn-ink-3:#2c3b57; --btn-ink-4:#212c45;
    --brand-soft:rgba(217,119,6,.14); --brand-glow:217,119,6; --brand-glow2:245,158,11; --brand-glow3:251,191,36; --brand-deepglow:194,65,12;
    --ok:#34d399; --ok-2:#10b981; --ok-bg:rgba(5,150,105,.14); --ok-line:rgba(52,211,153,.3);
    --bad:#fb7185; --bad-2:#f43f5e; --bad-bg:rgba(190,18,60,.16); --bad-line:rgba(251,113,133,.3);
    --info:#8ab4ff; --info-bg:rgba(29,78,216,.18); --info-line:rgba(138,180,255,.3);
    --warn-bg:rgba(217,119,6,.15); --warn-line:rgba(245,158,11,.34); --warn-ink:#fcd34d;
    --shadow-xs:0 1px 2px rgba(0,0,0,.5);
    --shadow-s:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -14px rgba(0,0,0,.7);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 40px -22px rgba(0,0,0,.85);
    --shadow-l:0 34px 80px -30px rgba(0,0,0,.9);
    --navy-1:#060a13; --navy-2:#0b1322; --navy-3:#101a2e;
  }
  :root[data-theme="dark"] body{
    background-image:
      radial-gradient(900px 420px at 6% -8%, rgba(var(--brand-glow),.16) 0%, rgba(var(--brand-glow),0) 62%),
      radial-gradient(760px 420px at 100% -6%, rgba(59,130,246,.14) 0%, rgba(59,130,246,0) 60%),
      linear-gradient(180deg,#080d18 0%, #070b14 58%, #060a12 100%);
  }
  :root[data-theme="dark"] .blobs i{ opacity:.45; filter:blur(50px); } :root[data-theme="dark"] .auth-wrap{ background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #1e293b 70%, #0f172a 100%) !important; background-size:300% 300% !important; animation:gradientShift 6s ease infinite !important; }
  /* Dark mode for new features - Backup/Restore/Reminders/Notifications */
  :root[data-theme="dark"] .notif-panel{ background:rgba(15,23,42,.98) !important; border-left-color:#1e293b !important; }
  :root[data-theme="dark"] .notif-panel > div:first-child{ background:linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important; }
  :root[data-theme="dark"] .notif-item{ background:#1e293b !important; border-color:#334155 !important; color:#e2e8f0 !important; }
  :root[data-theme="dark"] .notif-item.unread{ background:linear-gradient(135deg, #1e293b 0%, var(--brand-900) 100%) !important; border-color:var(--brand-500) !important; }
  :root[data-theme="dark"] .notif-item.overdue{ background:linear-gradient(135deg, #1e293b 0%, #450a0a 100%) !important; border-color:#ef4444 !important; }
  :root[data-theme="dark"] .notif-item.today{ background:linear-gradient(135deg, #1e293b 0%, var(--brand-900) 100%) !important; }
  :root[data-theme="dark"] .notif-item .notif-ic{ filter:brightness(0.9); }
  :root[data-theme="dark"] .card[style*="f0fdf4"], :root[data-theme="dark"] .card[style*="eff6ff"], :root[data-theme="dark"] .card[style*="--brand-050"], :root[data-theme="dark"] .card[style*="f5f3ff"], :root[data-theme="dark"] .card[style*="fef2f2"], :root[data-theme="dark"] .card[style*="--brand-100"], :root[data-theme="dark"] .card[style*="dcfce7"], :root[data-theme="dark"] .card[style*="dbeafe"], :root[data-theme="dark"] .card[style*="ede9fe"], :root[data-theme="dark"] .card[style*="fecaca"], :root[data-theme="dark"] .card[style*="bfdbfe"]{ background:var(--solid-1) !important; border-color:var(--line) !important; }
  :root[data-theme="dark"] [style*="--brand-050"]{ background:linear-gradient(135deg, #1e293b 0%, var(--brand-900) 100%) !important; border-color:var(--brand-600) !important; }
  :root[data-theme="dark"] [style*="--brand-100"]{ background:linear-gradient(135deg, #1e293b 0%, var(--brand-900) 100%) !important; }
  :root[data-theme="dark"] .card[style*="f0fdf4"] div, :root[data-theme="dark"] .card[style*="eff6ff"] div, :root[data-theme="dark"] .card[style*="--brand-050"] div, :root[data-theme="dark"] .card[style*="f5f3ff"] div, :root[data-theme="dark"] .card[style*="fef2f2"] div{ color:var(--ink) !important; }
  :root[data-theme="dark"] .card[style*="f0fdf4"] span, :root[data-theme="dark"] .card[style*="eff6ff"] span, :root[data-theme="dark"] .card[style*="--brand-050"] span{ color:var(--muted) !important; }
  :root[data-theme="dark"] .notif-bell.has-unread .ic{ color:var(--brand-400) !important; }
  /* Reminder cards dark mode */
  :root[data-theme="dark"] [data-reminder-card]{ background:var(--solid-2) !important; border-color:var(--line) !important; }
  :root[data-theme="dark"] [data-reminder-card] div{ color:var(--ink) !important; }
  :root[data-theme="dark"] [data-reminder-card] .muted, :root[data-theme="dark"] [data-reminder-card] span[style*="color:#64748b"], :root[data-theme="dark"] [data-reminder-card] span[style*="color:#475569"]{ color:var(--muted) !important; }
  :root[data-theme="dark"] .card[style*="linear-gradient"]{ background:var(--solid-1) !important; }

    :root:not([data-theme="light"]) .card[style*="f0fdf4"], :root:not([data-theme="light"]) .card[style*="eff6ff"], :root:not([data-theme="light"]) .card[style*="--brand-050"]{ background:#1e293b !important; }
    :root:not([data-theme="light"]) [style*="color:#0f172a"]{ color:#e2e8f0 !important; }
    :root:not([data-theme="light"]) [style*="color:#475569"]{ color:#94a3b8 !important; }

  :root[data-theme="dark"] .auth-side{ background:linear-gradient(165deg,#070c17 0%, #0e1729 55%, #16223a 100%); }

  :root[data-theme="dark"] .kpi .ic-badge.icb-bad{ background:linear-gradient(180deg,rgba(255,255,255,.04),var(--bad-bg)); }

  :root[data-theme="dark"] .dr-item.active{ color:var(--brand-400); border-color:rgba(var(--brand-glow2),.34); background:rgba(var(--brand-glow),.16); }
  :root[data-theme="dark"] .dr-item.active .ic{ color:var(--brand-400); }

  /* রিপোর্ট কার্ড সবসময় কাগজের মতো সাদা — গাঢ় থিমেও পড়তে সুবিধা, প্রিন্টেও নিখুঁত */
  :root[data-theme="dark"] .card.print-area{ background:#ffffff; border-color:#dbe2ec; }
  /* ── পাসওয়ার্ড দেখার (eye) বাটন ── */
  .pw-wrap{ position:relative; display:block; }
  .pw-wrap .input{ padding-right:44px; }
  .pw-eye{ position:absolute; right:5px; top:50%; transform:translateY(-50%); width:34px; height:34px;
    display:grid; place-items:center; border:none; background:transparent; color:var(--faint); cursor:pointer; border-radius:8px; }
  .pw-eye:hover{ color:var(--ink-2); background:var(--line-3); }
  .pw-eye:focus-visible{ outline:2px solid rgba(var(--brand-glow),.5); outline-offset:1px; }
  /* ── পছন্দ (ভাষা আছে / থিম) ── */
  .pref{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-top:1px solid var(--line-2); flex-wrap:wrap; }
  .pref:first-of-type{ border-top:none; padding-top:2px; }
  .pref .pl{ min-width:0; }
  .pref .pt{ font-weight:650; color:var(--ink); font-size:13.5px; display:flex; align-items:center; gap:8px; }
  .pref .ps{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .seg.icons button{ gap:7px; }

  /* ── কালার থিম পিকার (Accent) — হালকা/গাঢ় দুই থিমেই মানানসই ── */
  .pref.accent-pref{ display:block; }
  .accent-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px; }
  .accent-sw{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:11px 6px 9px; border-radius:14px;
    border:1px solid var(--line); background:var(--solid-2); cursor:pointer; font-family:inherit;
    transition:transform .16s, box-shadow .16s, border-color .16s, background .16s; }
  .accent-sw:hover{ transform:translateY(-2px); box-shadow:var(--shadow-s); border-color:var(--hover-line); background:var(--solid-1); }
  .accent-sw:focus-visible{ outline:2px solid rgba(var(--brand-glow),.55); outline-offset:2px; }
  .accent-sw .accent-dot{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 4px rgba(0,0,0,.18), 0 5px 12px -5px rgba(15,23,42,.45); }
  .accent-sw .accent-dot .ic{ width:17px; height:17px; filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.4)); }
  .accent-sw .accent-name{ font-size:10.5px; font-weight:700; color:var(--muted); line-height:1.25; text-align:center; letter-spacing:.01em; }
  .accent-sw.on{ border-color:rgb(var(--brand-glow)); background:var(--brand-soft); box-shadow:0 0 0 3px rgba(var(--brand-glow),.16), var(--shadow-xs); }
  .accent-sw.on .accent-name{ color:var(--brand-700); }
  :root[data-theme="dark"] .accent-sw.on .accent-name{ color:var(--brand-300); }
  :root[data-theme="dark"] .accent-sw{ background:var(--solid-3); }

  /* ═══════════ AMOLED — পিচ ডার্ক (একদম কালো, OLED-এর জন্য) ═══════════ */
  :root[data-theme-mode="amoled"]{
    color-scheme:dark;
    --bg:#000000;
    --surface:rgba(0,0,0,.9); --surface-2:rgba(0,0,0,.66); --surface-3:rgba(0,0,0,.5);
    --glass-1:rgba(8,8,8,.94); --glass-2:rgba(4,4,4,.88); --glass-3:rgba(0,0,0,.74);
    --solid-1:#000000; --solid-2:#040404; --solid-3:#0b0b0b; --solid-4:#070707;
    --row-hover:rgba(255,255,255,.05); --soft-2:#101010; --soft-line:#232323; --bar-bg:#0d0d0d; --hover-line:#2e2e2e;
    --line:#202020; --line-2:#181818; --line-3:rgba(255,255,255,.07);
    --field-bg:rgba(10,10,10,.88); --field-bg-focus:rgba(12,12,12,.96); --field-line:#262626; --field-line-2:#383838; --field-ph:#5d6a7d;
    --btn-ink-1:#121212; --btn-ink-2:#070707; --btn-ink-3:#1c1c1c; --btn-ink-4:#0e0e0e;
    --navy-1:#000000; --navy-2:#020202; --navy-3:#060606;
    --shadow-xs:0 1px 2px rgba(0,0,0,.85);
    --shadow-s:0 1px 2px rgba(0,0,0,.85), 0 8px 22px -14px rgba(0,0,0,.95);
    --shadow:0 1px 2px rgba(0,0,0,.85), 0 18px 40px -22px rgba(0,0,0,1);
    --shadow-l:0 34px 80px -30px rgba(0,0,0,1);
  }
  :root[data-theme-mode="amoled"] body{ background-color:#000000; background-image:none !important; }
  :root[data-theme-mode="amoled"] .blobs{ display:none !important; }
  :root[data-theme-mode="amoled"] .auth-wrap{ background:#000000 !important; animation:none !important; }
  :root[data-theme-mode="amoled"] .auth-wrap::before{ opacity:.18; }
  :root[data-theme-mode="amoled"] .auth-side{ background:#000000 !important; }
  :root[data-theme-mode="amoled"] .auth-card{ background:rgba(0,0,0,.78); }
  :root[data-theme-mode="amoled"] #bootSplash{ background:#000000 !important; }
  :root[data-theme-mode="amoled"] .modal{ background:rgba(0,0,0,.8); }
  :root[data-theme-mode="amoled"] .modal .box{ background:rgba(3,3,3,.98); }
  :root[data-theme-mode="amoled"] .modal .head{ background:#060606 !important; border-bottom-color:#1e1e1e !important; }
  :root[data-theme-mode="amoled"] .scrim{ background:rgba(0,0,0,.82); }
  :root[data-theme-mode="amoled"] .notif-panel{ background:rgba(0,0,0,.98) !important; border-left-color:#1e1e1e !important; }
  :root[data-theme-mode="amoled"] .notif-panel > div:first-child{ background:#000000 !important; }
  :root[data-theme-mode="amoled"] .notif-item{ background:#080808 !important; border-color:#222222 !important; }
  :root[data-theme-mode="amoled"] .notif-item.unread{ background:linear-gradient(135deg,#000000,var(--brand-900)) !important; }
  :root[data-theme-mode="amoled"] .notif-item.overdue{ background:linear-gradient(135deg,#000000,#1a0505) !important; }
  :root[data-theme-mode="amoled"] .notif-item.today{ background:linear-gradient(135deg,#000000,var(--brand-900)) !important; }
  :root[data-theme-mode="amoled"] .settings-card.pwa-card{ background:linear-gradient(135deg,#000000,#120a00) !important; }
  :root[data-theme-mode="amoled"] .settings-card.backup-card{ background:linear-gradient(135deg,#000000,#02100a) !important; }
  :root[data-theme-mode="amoled"] .settings-card.restore-card{ background:linear-gradient(135deg,#000000,#020a12) !important; }
  :root[data-theme-mode="amoled"] .settings-card .card-head{ background:rgba(0,0,0,.4) !important; border-bottom-color:rgba(255,255,255,.07) !important; }
  :root[data-theme-mode="amoled"] .card[style*="linear-gradient"]{ background:#000000 !important; }
  :root[data-theme-mode="amoled"] .chip.dark{ background:#000000; border-color:#232323; }
  :root[data-theme-mode="amoled"] .diag{ background:#000000; border-color:#1f1f1f; }
  :root[data-theme-mode="amoled"] .toast{ background:rgba(0,0,0,.96); border-color:#242424; }
  :root[data-theme-mode="amoled"] .toast .toast-act{ background:rgba(255,255,255,.07); border-color:#2a2a2a; color:#dbe3ef; }
  :root[data-theme-mode="amoled"] [style*="background:#0f172a"]{ background:#070707 !important; }
  :root[data-theme-mode="amoled"] [style*="background:#1e293b"]{ background:#070707 !important; }
  :root[data-theme-mode="amoled"] [data-reminder-card]{ background:#050505 !important; border-color:#202020 !important; }
  @media print{
    @page{ margin:14mm 13mm; }
    html,body{ background:#fff !important; color:#000 !important; }
    .blobs,.side,.top,.mv,.drawer,.scrim,.no-print,.toast,.toasts,.modal,#bootSplash,.helper,.warn,.err,.ok,.btn,.phead,.filterbar,.seg,.dr-quick,.dr-item,.adv{ display:none !important; }
    .app{ display:block !important; }
    .main{ display:block !important; }
    .content{ padding:0 !important; overflow:visible !important; background:none !important; }
    .content > *{ max-width:none !important; margin:0 !important; }
    .content > *:not(.print-area){ display:none !important; }
    .card{ box-shadow:none !important; border:0 !important; background:#fff !important;
      -webkit-backdrop-filter:none !important; backdrop-filter:none !important; border-radius:0 !important; padding:0 !important; }
    .print-area{ display:block !important; }
    .print-area *{ color:#000 !important; background:transparent !important; box-shadow:none !important; border-color:#cbd5e1 !important; }
    .print-area .pill{ border:1px solid #cbd5e1 !important; padding:1px 7px !important; }

    /* সদস্য-চাঁদার PDF শিট */
    .print-area .pdf-ok{ color:#047857 !important; }
    .print-area .pdf-bad{ color:#b91c1c !important; }
    .print-area .pdf-mut{ color:#475569 !important; }
    .print-area .pdf-title{ border-bottom:1.5px solid #0f172a !important; }
    .print-area .pdf-sum > div{ border:1px solid #cbd5e1 !important; background:transparent !important; }

    :root[data-theme="dark"] .print-area{ background:#fff !important; border-color:#dbe2ec !important; }
    :root[data-theme="dark"] .print-area *{ color:#0b1220 !important; }

    :root[data-theme="dark"] .print-area .amt.out{ color:#be123c !important; }

  /* ═══════════════════════════════════════════════════════════════
     ৪.৭ — ডেস্কটপ ফিট: বড় স্ক্রিনে পুরো অ্যাপ রেজোলিউশন অনুযায়ী ফিট,
     আর নিচের নেভিগেশন বাটন সব স্ক্রিনেই নিচে-নিচে থাকে
     ═══════════════════════════════════════════════════════════════ */

  /* ১) বাইরে-বাইরে অনুভূমিক স্ক্রল বা সাদা ফাঁকা জায়গা হবে না */
  html{ overflow-x:hidden; }
  .app, .main, #content, .content{ width:100%; max-width:100% !important; box-sizing:border-box; overflow-x:hidden; }

  /* ২) নিচের নেভিগেশন বার — ডেস্কটপেও নিচে, একটু বড় ও পরিষ্কার */
  @media(min-width:960px){
    .side{
      position:fixed !important; left:50% !important; right:auto !important; bottom:16px !important;
      transform:translateX(-50%); width:min(1180px, 96vw) !important; margin:0 !important;
      border:1px solid var(--line) !important; border-radius:20px !important;
      box-shadow:0 18px 42px -24px rgba(16,24,40,.5), var(--shadow-s) !important;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px)) !important;
    }
    .side nav{ justify-content:space-between; gap:6px; }
    .side nav a{
      flex:1 1 0; min-width:0; flex-direction:row; gap:9px;
      padding:11px 14px; font-size:12.5px; border-radius:14px;
    }
    .side nav a .nav-t{ max-width:none; }
    .side nav a .ic{ width:19px; height:19px; }
    .side nav a.active::after{ display:none !important; }
    .content{ padding-bottom:152px !important; }
  }
  @media(min-width:960px) and (max-width:1366px){
    .side{ width:min(1000px, 96vw) !important; }
    .side nav a{ padding:10px 9px; font-size:11.5px; gap:7px; }
  }

  /* ৩) কনটেন্ট জায়গা: মাঝারি স্ক্রিনে ফিট, বড় স্ক্রিনে লেখা ছড়িয়ে যায় না */
  @media(min-width:720px){
    .content > *{ max-width:100% !important; }
  }
  /* ড্যাশবোর্ডের ৪টি হিসাব-কার্ড ডেস্কটপে পুরো প্রস্থ নেয়, বড় স্ক্রিনে এক লাইনে */
  @media(min-width:960px){
    .kpi-grid{ max-width:100% !important; gap:10px !important; }
    .kpi-grid .kpi-card{ max-height:none !important; min-height:100px; }
  }
  @media(min-width:1100px){
    .kpi-grid{ grid-template-columns:repeat(4, minmax(0,1fr)) !important; }
  }
  @media(min-width:1500px){
    .content{ padding-left:clamp(24px, 3.4vw, 64px) !important; padding-right:clamp(24px, 3.4vw, 64px) !important; }
    .content > *{ max-width:1560px !important; }
    .kpi-grid{ max-width:100% !important; grid-template-columns:repeat(4, minmax(0,1fr)) !important; gap:12px !important; }
    .kpi-grid .kpi-card{ max-height:none !important; min-height:104px; padding:14px 16px !important; }
    .kpi-grid .kpi-card .kpi .v{ font-size:28px; }
    .grid.g2{ grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)) !important; }
    .grid.g3{ grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)) !important; }
    .grid.g4{ grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)) !important; }
    .card{ padding:16px 18px; }
  }
  @media(min-width:2100px){
    .content > *{ max-width:1780px !important; }
  }

  /* ৪) টেবিল: বড় স্ক্রিনে ছোট স্ক্রলবার নয়, পুরো প্রস্থ নেবে */
  @media(min-width:960px){
    .tableWrap table{ min-width:0 !important; width:100% !important; }
    .tableWrap table th, .tableWrap table td{ padding:10px 12px !important; }
  }

  /* ৫) মাঝারি স্ক্রিন (ছোট ল্যাপটপ / ট্যাবলেট ল্যান্ডস্কেপ) — সব ফিট */
  @media(min-width:721px) and (max-width:1100px){

let STORE_PERSISTENT = true;      // localStorage না থাকলে (sandbox/preview) false — তখন সতর্কবার্তা দেখানো হয়
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v===null?null:v; } catch(e){ STORE_PERSISTENT = false; return k in mem?mem[k]:null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ STORE_PERSISTENT = false; mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ STORE_PERSISTENT = false; delete mem[k]; } }
};

  const M = {
    'সদস্য/লেনদেন/দাতা তালিকা (orgId)':'member / txn / donor lists (orgId)',

function fontSafe(t){ return String(t == null ? '' : t).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function techInfo(){

window.__psErrors = [];
window.addEventListener('error', (e) => {
  const msg = (e && (e.message || (e.error && e.error.message))) || L2('অজানা স্ক্রিপ্ট ত্রুটি', 'Unknown script error');
  window.__psErrors.push(msg);

});
window.addEventListener('unhandledrejection', (e) => {
  const msg = (e && e.reason && (e.reason.message || String(e.reason))) || L2('অজানা ত্রুটি', 'Unknown error');
  window.__psErrors.push(msg);
  bootScreenFatal(L2('চালু হওয়ার সময় ত্রুটি', 'Startup error'), msg, L2('<b>ইন্টারনেট ছাড়াই চালান</b> চাপলে অ্যাপ ইন্টারনেট ছাড়াই চলবে।', 'Tap <b>Run without internet</b> to start the app offline.'));

/* ============ সহায়ক: timeout / ত্রুটি-বার্তা (লগইন আটকে যাওয়া রোধ) ============ */
const APP_VER = '5.1';
function withTimeout(p, ms, label){
  p = Promise.resolve(p);
  let t = null;
  const guard = new Promise((_, rej) => {
    t = setTimeout(() => rej(Object.assign(new Error(label || L2('সময় শেষ হয়েছে', 'Timed out')), { __timeout:true })), ms || 20000);
  });
  const done = p.then(v => { clearTimeout(t); return v; }, e => { clearTimeout(t); throw e; });
  done.catch(() => {});      // দেরিতে এলে চুপচাপ এড়িয়ে যাও (unhandled rejection হবে না)
  guard.catch(() => {});
  return Promise.race([done, guard]);
}
function errCode(e){ return String((e && (e.code || e.message)) || ''); }
function permDenied(e){ return /permission-denied|insufficient permissions|PERMISSION_DENIED/i.test(errCode(e)); }
function netFail(e){ return !!(e && (e.__timeout || /network|unavailable|offline|timeout|Failed to fetch|NetworkError|লোড ব্যর্থ|সময় শেষ|CDN/i.test(errCode(e)))); }
function authCode(e){ const m = errCode(e).match(/auth\/[a-z-]+/); return m ? m[0] : ''; }

    'auth/api-key-not-valid': [L2('Firebase API key ঠিক নয়।', 'The Firebase API key is not valid.')],
    'auth/internal-error': [L2('Firebase-এ সাময়িক সমস্যা — আবার চেষ্টা করুন।', 'Temporary Firebase problem — please try again.')],
    'auth/web-storage-unsupported': [L2('এই পরিবেশে ব্রাউজারের স্টোরেজ বন্ধ (প্রিভিউ/এমবেড/ফাইল হিসেবে খোলা), তাই অনলাইন সাইন-ইন চলবে না — ইন্টারনেট ছাড়াই চালান অথবা হোস্ট করা লিংক ব্যবহার করুন।', 'Browser storage is blocked here (preview/embed/opened as a file), so online sign-in cannot work — run without internet or use a hosted link.')],
    'auth/operation-not-supported-in-this-environment': [L2('এই পরিবেশে অনলাইন সাইন-ইন সমর্থিত নয় — ইন্টারনেট ছাড়াই চালান বা হোস্ট করা লিংক ব্যবহার করুন।', 'Online sign-in is not supported in this environment — run without internet or use a hosted link.')],
    'permission-denied': [L2('Firestore-এর নিরাপত্তা-নিয়ম (rules) এই কাজটি আটকে দিয়েছে।', 'Firestore security rules blocked this action.')],
    'unavailable': [L2('Firestore-এ সংযোগ পাওয়া যাচ্ছে না — ইন্টারনেট পরীক্ষা করুন।', 'Cannot reach Firestore — please check your internet connection.')]
  };
  if (M[c]) return M[c][0];
  if (permDenied(e)) return M['permission-denied'][0];
  if (netFail(e)) return L2('সংযোগ পাওয়া যাচ্ছে না বা সময় শেষ — ইন্টারনেট ও Firebase কনফিগ পরীক্ষা করুন।', 'No connection or timed out — check your internet and Firebase setup.');
  return String((e && (e.message || e)) || L2('কিছু ভুল হয়েছে', 'Something went wrong')).replace(/^(Firebase:\s*)?Error:\s*/i, '');
}

    try { await fbTimeout(fb.db.collection(col).doc(id).set(data, { merge:true }), 20000, 'হালনাগাদ'); }
    catch(e){ markWriteBlocked(e); throw e; }
    return { id, ...data };
  }
  const key = localKey(col);
  const arr = await listDemo(col, key);
  const i = arr.findIndex(x => x.id === id);
  if (i >= 0){ arr[i] = { ...arr[i], ...data }; saveDemo(col, arr, key); }
  return { id, ...data };
}

async function delDoc(col, id){
  if (!dataLocal()){ await loadFirebase(); try { await fbTimeout(fb.db.collection(col).doc(id).delete(), 20000, 'মুছে ফেলা'); } catch(e){ markWriteBlocked(e); throw e; } return; }
  const key = localKey(col);
  const arr = (await listDemo(col, key)).filter(x => x.id !== id); saveDemo(col, arr, key);
}

/* ৪.৬ — ভুলে মুছে ফেললে ফিরিয়ে আনা (Undo, ১০ সেকেন্ড) */
async function fetchDoc(col, id){
  const arr = state[col] || [];
  const hit = arr.find(x => x.id === id);
  if (hit) return JSON.parse(JSON.stringify(hit));
  if (!dataLocal()){
    try {
      await loadFirebase();
      const snap = await fbTimeout(fb.db.collection(col).doc(id).get(), 20000, 'পড়া');
      return snap && snap.exists ? snap.data() : null;
    } catch(e){ return null; }
  }
  return null;
}
async function restoreDoc(col, id, data){
  if (!data) return;
  if (!dataLocal()){
    await loadFirebase();
    await fbTimeout(fb.db.collection(col).doc(id).set(data), 20000, 'ফিরিয়ে আনা');
    return;
  }
  const key = localKey(col);
  const arr = await listDemo(col, key);
  if (!arr.some(x => x.id === id)) arr.push({ ...data, id });
  saveDemo(col, arr, key);
}
/* এক বা একাধিক রেকর্ড একসাথে মোছা + ফিরিয়ে আনার সুবিধা */
async function softDeleteMany(items, msg, restoreMsg){
  const saved = [];
  for (const it of items){
    const data = await fetchDoc(it.col, it.id);
    if (data) saved.push({ ...it, data });
    try { await delDoc(it.col, it.id); } catch(e){ /* নিচে বার্তা */ }
  }
  if (!saved.length){ toast(L2('মুছে ফেলা যায়নি', 'Could not delete'), 'err'); return; }
  try { await reload(); } catch(e){}
  render();
  toast(msg, 'ok', {
    duration: 10000,
    action: {
      label: L2('ফিরিয়ে আনুন', 'Undo'),
      secs: 10,
      fn: async () => {
        for (const it of saved){
          try { await restoreDoc(it.col, it.id, it.data); } catch(e){}
        }
        try { await reload(); } catch(e){}
        render();
        toast(restoreMsg || L2('ফিরিয়ে আনা হয়েছে', 'Restored'), 'ok');
      }
    }
  });
}
function softDelete(col, id, msg, restoreMsg){
  return softDeleteMany([{ col, id }], msg, restoreMsg);
}

const LSA = 'ps_accounts', LSO='ps_orgs', LSU='ps_user', LSC='ps_cur_org', LSI='ps_orgInvites';
function genInviteCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = 'PS-';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function demoGetInviteByCode(code){
  code=String(code||'').trim().toUpperCase();
  if(!code) return null;
  try { 
    const arr=JSON.parse(store.get(LSI)||'[]'); 
    let found = arr.find(x=> (x.code||'').toUpperCase()===code);
    if(found) return found;
    // Fallback: search in orgs where inviteCode == code (for backward compat)
    try {
      const orgs=JSON.parse(store.get(LSO)||'[]');
      const o=orgs.find(x=> (x.inviteCode||'').toUpperCase()===code);
      if(o){
        // Reconstruct invite from org
        return { code, orgId:o.id, role:'member', createdAt:o.createdAt||Date.now(), used:false, singleUse:false };
      }
    } catch(e2){}
    return null; 
  } catch(e){ return null; }
}

  let code='';
  let arr=[];

  for(let i=0;i<20;i++){ const c=genInviteCode(); if(!arr.some(x=>x.code===c)){ code=c; break; } }
  if(!code) code=genInviteCode();
  const item={ code, orgId, role, createdAt:Date.now(), createdBy: state.user ? state.user.uid : '', used:false, singleUse:true, usedBy:'', usedAt:0 };

async function demoOrgs(uid){
  const acc=JSON.parse(store.get(LSA)||'[]').find(a=>a.uid===uid);

  const owned = all.filter(o=>acc&&acc.orgIds&&acc.orgIds.includes(o.id));
  const seen={}; owned.forEach(o=>seen[o.id]=true);
  const email = (acc && acc.email ? acc.email.toLowerCase() : '');
  // scan all orgMembers keys
  try {
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || !k.startsWith('ps_orgMembers_')) continue;
      const arr = JSON.parse(localStorage.getItem(k)||'[]');
      for(const m of arr){
        if( (m.uid && m.uid===uid) || (m.email && m.email.toLowerCase()===email) ){

          if(seen[orgId]) continue;
          seen[orgId]=true;
          const org = all.find(o=>o.id===orgId);
          if(org) owned.push(org);
        }
      }
    }
  } catch(e){}
  return owned;

/* Firebase auth — সব ধাপে টাইমআউট, তাই কখনোই "দাঁড়িয়ে থাকবে" না */
async function fbGetInviteByCode(code){
  code=String(code||'').trim().toUpperCase();
  if(!code) return null;
  try {
    await loadFirebase();
    // Try direct get - for signup, user is not yet auth, so rules must allow get without auth
    // If rules block, try with timeout and better error
    let doc = null;
    try {
      doc = await fbTimeout(fb.db.collection('orgInvites').doc(code).get(), 8000, 'invite');
    } catch(e){
      // If permission denied due to auth required, try alternative via users collection check
      // For now return null but log
      console.warn('[Invite] get failed', e);
      // Still try fbGet wrapper which has error handling
      try { doc = await fbGet(fb.db.collection('orgInvites').doc(code), 'invite কোড'); } catch(e2){ doc = null; }
    }
    if(doc && doc.exists) return { code, id:doc.id, ...doc.data() };
    // Fallback: search orgs where inviteCode == code (if old orgs have inviteCode field)
    try {
      const snap = await fbTimeout(fb.db.collection('organizations').where('inviteCode','==',code).limit(1).get(), 8000, 'org by invite');
      if(!snap.empty){
        const d = snap.docs[0];
        return { code, orgId:d.id, role:'member', createdAt:Date.now(), used:false, singleUse:false, ...d.data() };
      }
    } catch(e2){}
    return null;
  } catch(e){ 
    console.warn('[Invite] fbGetInviteByCode error', e);
    return null; 
  }
}

/* ── রিসেট ইমেইল পাঠানো: ভাষা মিলিয়ে, ৬০ সেকেন্ডের কুলডাউন সহ ── */
const RESET_COOLDOWN_MS = 60000;
let lastResetSent = { email: '', at: 0 };
function resetCooldownLeft(email){
  const key = String(email || '').trim().toLowerCase();
  if (!key || lastResetSent.email !== key) return 0;
  const left = RESET_COOLDOWN_MS - (Date.now() - lastResetSent.at);
  return left > 0 ? Math.ceil(left / 1000) : 0;
}
async function fbSendResetEmail(email){
  const em = String(email || '').trim();
  const left = resetCooldownLeft(em);
  if (left > 0){
    const e = new Error(L2('কিছুক্ষণ আগেই রিসেট লিংক পাঠানো হয়েছে — ' + bn(left) + ' সেকেন্ড পরে আবার চেষ্টা করুন। ইমেইল না পেলে Spam ফোল্ডার দেখুন।',
                           'A reset link was just sent — try again in ' + left + ' seconds. If it is not in the inbox, check the spam folder.'));
    e.code = 'app/reset-cooldown';
    throw e;
  }
  await loadFirebase();
  /* ভাষা: বাংলা অ্যাপে Firebase-এর বাংলা টেমপ্লেট, ইংরেজি অ্যাপে ইংরেজি */
  try { fb.auth.languageCode = (LANG === 'en') ? 'en' : 'bn'; } catch(_){}
  await fbTimeout(fb.auth.sendPasswordResetEmail(em), 25000, 'রিসেট ইমেইল');
  lastResetSent = { email: em.toLowerCase(), at: Date.now() };

/* সংগঠনের তালিকা: আগে প্রোফাইলের orgIds থেকে সরাসরি ডকুমেন্ট পড়া (এই নিয়মে সবচেয়ে নির্ভরযোগ্য),
   না পেলে ownerId কুয়েরি — যেটা কাজ করে সেটাই ব্যবহার হয় */
async function fbGetOrgs(uid){
  await loadFirebase();
  const out = [], seen = {};
  // 1) from users.orgIds (লগইনে পড়া প্রোফাইল থাকলে সেটাই ব্যবহার)
  try {
    const cached = fbProfileGet(uid);
    let ids = [];
    if (cached){ ids = cached.orgIds || []; }
    else {
      const s = await fbGet(fb.db.collection('users').doc(uid), 'প্রোফাইল পড়া');
      const pd = (s && s.exists !== false && s.data()) ? (s.data() || {}) : {};
      fbProfilePut(uid, pd);
      ids = pd.orgIds || [];
    }
    ids.forEach(i => seen[i] = true);
    const got = await Promise.all(ids.map(i =>
      fbGet(fb.db.collection('organizations').doc(i), 'সংগঠন পড়া')
        .then(o => (o && o.exists) ? ({ id:i, ...o.data() }) : null)
        .catch(e => { if (permDenied(e)) noteBlocked('সংগঠন ডকুমেন্ট'); return null; })
    ));
    got.forEach(o => { if (o) out.push(o); });
  } catch(e){ if (permDenied(e)) noteBlocked('প্রোফাইল ডেটা (users)'); else noteWarn(fbErrMsg(e)); }
  // 2) from orgMembers where uid == uid
  try {
    const snap = await fbGet(fb.db.collection('orgMembers').where('uid','==',uid), 'orgMembers তালিকা (uid)');
    const mems = fbDocs(snap);
    for(const m of mems){
      const orgId = m.orgId;
      if(!orgId || seen[orgId]) continue;
      seen[orgId]=true;
      try {
        const o = await fbGet(fb.db.collection('organizations').doc(orgId), 'সংগঠন পড়া');
        if (o && o.exists) out.push({ id:orgId, ...o.data() });
      } catch(e){}
    }
  } catch(e){ if(permDenied(e)) noteBlocked('orgMembers তালিকা (uid)'); }
  // 3) also from orgMembers where email == current user's email (invite claimed)
  try {
    const email = (state.user && state.user.email) ? state.user.email.toLowerCase() : '';
    if(email){
      const snap2 = await fbGet(fb.db.collection('orgMembers').where('email','==',email), 'orgMembers তালিকা (email)');
      const mems2 = fbDocs(snap2);
      for(const m of mems2){
        const orgId = m.orgId;
        if(!orgId || seen[orgId]) continue;
        seen[orgId]=true;
        // claim uid if missing
        if(!m.uid){
          try { await fbTimeout(fb.db.collection('orgMembers').doc(m.id).set({ uid }, {merge:true}), 10000, 'invite claim'); } catch(e){}
          // add to user's orgIds
          try {
            await fbTimeout(fb.db.collection('users').doc(uid).set({ orgIds: firebase.firestore.FieldValue.arrayUnion(orgId) }, {merge:true}), 10000, 'প্রোফাইল সংরক্ষণ');
          } catch(e){}
        }
        try {
          const o = await fbGet(fb.db.collection('organizations').doc(orgId), 'সংগঠন পড়া');
          if (o && o.exists) out.push({ id:orgId, ...o.data() });
        } catch(e){}
      }
    }
  } catch(e){}
  if (out.length) return out;
  try {
    return fbDocs(await fbGet(fb.db.collection('organizations').where('ownerId','==',uid), 'সংগঠনের তালিকা'));
  } catch(e){ if (permDenied(e)) noteBlocked('সংগঠনের তালিকা (ownerId)'); else noteWarn(fbErrMsg(e)); return out; }
}
async function fbCreateOrg(name, uid){
  await loadFirebase();
  const ref = await fbTimeout(fb.db.collection('organizations').add({ name, ownerId:uid, createdAt:Date.now() }), 20000, 'সংগঠন তৈরি');
  try {
    const d = await fbTimeout(fb.db.collection('users').doc(uid).get(), 15000, 'প্রোফাইল পড়া');
    const x = (d && d.exists !== false && d.data()) ? (d.data() || {}) : {};
    await fbTimeout(fb.db.collection('users').doc(uid).set({ ...x, orgIds:[...(x.orgIds||[]), ref.id], currentOrgId:ref.id }, { merge:true }), 20000, 'প্রোফাইল সংরক্ষণ');
  } catch(e){ noteWarn(L2('নতুন সংগঠন তৈরি হয়েছে, তবে প্রোফাইলে যোগ করা যায়নি: ', 'New organization created, but it could not be added to your profile: ') + fbErrMsg(e)); }
  // create owner membership
  try {
    const email = (x && x.email) ? x.email : (state.user && state.user.email ? state.user.email : '');
    const nameVal = (x && x.name) ? x.name : (state.user && state.user.name ? state.user.name : '');
    await fbTimeout(fb.db.collection('orgMembers').add({ orgId:ref.id, uid, email:(email||'').toLowerCase(), name:nameVal, role:'owner', addedAt:Date.now(), addedBy:uid }), 15000, 'সদস্য যোগ');
  } catch(e){}
  return { id:ref.id, name };
}

function syncOrg(){
  if (!state.user){ state.currentOrgId = ''; return ''; }
  const orgs = state.orgs || [];
  let id = state.user.currentOrgId || '';
  if (!id || !orgs.some(o => o.id === id)) id = (orgs[0] && orgs[0].id) || state.currentOrgId || '';
  state.currentOrgId = id;
  state.user.currentOrgId = id;
  return id;
}
async function signup(d){

  try {
    const u = useFb() ? await fbSignup(d) : await demoSignup(d);
    state.user = u;
