function formFields(form){ return Object.fromEntries(new FormData(form).entries()); }
function isHiddenField(el){ try { return !!el.closest('.hide') || el.offsetParent === null; } catch(e){ return false; } }
/* নিজের ভ্যালিডেশন — নেটিভ ইংরেজি বাবলের উপর নির্ভরতা নেই, বার্তা বাংলায় */
function validateForm(form){
  const bad = [];
  const els = form.querySelectorAll('input, select, textarea');
  for (let i = 0; i < els.length; i++){
    const el = els[i];
    if (el.disabled || isHiddenField(el)) continue;
    const v = (el.value == null ? '' : String(el.value)).trim();
    let lbl = '';
    try { const wrap = el.closest('label'); lbl = wrap ? wrap.textContent.replace(/\s+/g, ' ').trim().slice(0, 40) : ''; } catch(e){}
    if (el.hasAttribute('required') && !v){ bad.push(lbl ? (lbl + ' — ' + L2('পূরণ করুন', 'is required')) : L2('সব ঘর পূরণ করুন', 'Please fill in all the fields')); continue; }
    if (v && el.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ bad.push(L2('ইমেইলের ঠিকানাটি ঠিক নয় (যেমন: name@gmail.com)', 'The email address is not valid (e.g. name@gmail.com)')); continue; }
    if (v && el.type === 'number' && isNaN(Number(v))){ bad.push(lbl ? (lbl + ' — ' + L2('ঠিক সংখ্যা লিখুন', 'must be a number')) : L2('সংখ্যার ঘর ঠিক নয়', 'Please enter a valid number')); continue; }
    if (v && el.type === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(v)){ bad.push(L2('তারিখ ঠিক নয়', 'The date is not valid')); continue; }
  }
  return bad;
}
function showFormError(form, msg){
  const box = form.querySelector('.formErr');
  let el = box;
  if (!el){ el = document.createElement('div'); el.className = 'err formErr'; el.style.marginBottom = '10px'; form.insertBefore(el, form.firstChild); }
  el.innerHTML = icon('alert', 'ic-sm') + ' ' + esc(msg);
  try { el.scrollIntoView({ block:'nearest' }); } catch(e){}
}
/* run() — ফর্মের আসল কাজ; বার্তা দেখানো/লোডিং অবস্থা run()-এর ভিতরে */
function bindSubmit(form, run){
  if (!form) return;
  form.setAttribute('novalidate', 'novalidate');   // ভ্যালিডেশন আমাদের হাতেই (বার্তা বাংলায়)
  let last = 0;
  const fire = () => {
    const now = Date.now();
    if (now - last < 400) return;                  // ক্লিক ও submit — দুটোই এলে দ্বিগুণ যাবে না
    last = now;
    const bad = validateForm(form);
    if (bad.length){ showFormError(form, bad[0] + (bad.length > 1 ? (' (' + L2('আরও ', 'and ') + bn(bad.length - 1) + L2(' টি ঘর বাকি', ' more field(s) left') + ')') : '')); return; }
    run(formFields(form));
  };
  form.onsubmit = (e) => { e.preventDefault(); e.stopPropagation(); fire(); return false; };
  const btn = form.querySelector('button[type=submit], button:not([type]), input[type=submit]');
  if (btn){
    btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); fire(); return false; };
  }
  form.onkeydown = (e) => {
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){ e.preventDefault(); fire(); }
  };
  return { fire };
}

function renderNotifList(){
  const listEl = document.getElementById('notifList');
  const subEl = document.getElementById('notifSub');
  if(!listEl) return;
  const notifs = state.notifications||[];
  if(subEl) subEl.textContent = notifs.length ? (bn(notifs.length)+' '+L2('নোটিফিকেশন','notifications') + ' · ' + bn(getUnreadCount())+' '+L2('অপঠিত','unread')) : L2('কোনো নোটিফিকেশন নেই','No notifications');

    return;
  }
  listEl.innerHTML = notifs.map(n=>{
    const ic = n.type==='overdue' ? 'alarm' : n.type==='today' ? 'bellRing' : 'clock';
    const cls = 'notif-item ' + (n.type||'') + (n.read ? '' : ' unread');
    return '<div class="'+cls+'" data-notif-id="'+n.id+'" data-reminder-id="'+(n.reminderId||'')+'">'
      + '<div class="notif-ic">'+icon(ic,'ic-sm')+'</div>'
      + '<div style="flex:1; min-width:0"><div style="font-weight:700; font-size:13px; color:#0f172a; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">'+esc(n.title)+'</div>'
      + '<div style="font-size:11.5px; color:#475569; margin-top:2px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden">'+esc(n.body||'')+'</div>'
      + '<div style="font-size:10.5px; color:#94a3b8; margin-top:4px; display:flex; gap:6px; align-items:center">'+icon('calendar','ic-sm')+' '+fmtDate(n.date)+(n.time ? ' · '+esc(n.time) : '')+' · <span class="pill" style="font-size:9px; padding:1px 6px">'+(n.type==='overdue'?L2('ওভারডিউ','Overdue'):n.type==='today'?L2('আজ','Today'):L2('আসন্ন','Upcoming'))+'</span></div></div>'
      + '<button class="iconbtn" data-notif-read="'+n.id+'" style="width:26px; height:26px; flex:0 0 auto">'+icon(n.read?'check':'eye','ic-sm')+'</button>'
      + '</div>';
  }).join('');
  // bind read buttons
  listEl.querySelectorAll('[data-notif-read]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-notif-read');
      const notif = (state.notifications||[]).find(x=>x.id===id);
      if(notif){ notif.read = !notif.read; renderNotifList(); checkReminders(); }
    };
  });
  listEl.querySelectorAll('[data-notif-id]').forEach(el=>{
    el.onclick = ()=>{
      const rid = el.getAttribute('data-reminder-id');
      if(rid){
        const r = (state.reminders||[]).find(x=>x.id===rid);

          setTimeout(()=>{ const card = document.querySelector('[data-id="'+rid+'"]'); if(card) card.scrollIntoView({behavior:'smooth', block:'center'}); }, 300);
        }
      }
    };
  });

async function runAct(act, id){

      newEvent: L2('নতুন ইভেন্ট', 'New event'),

      newDonor: L2('দান যোগ করুন', 'Add donation'),
      newMember: L2('নতুন সদস্য', 'New member'),
      editMember: L2('সদস্য সম্পাদনা', 'Edit member'),
      newReminder: L2('নতুন রিমাইন্ডার', 'New reminder'),
      editReminder: L2('রিমাইন্ডার সম্পাদনা', 'Edit reminder')
    };
    if (act === 'newEvent'){ openModal(t.newEvent, eventForm(null)); bindForm('f', async (d) => { await addDoc('events', { ...d, budget: Number(d.budget || 0) }); }); }
    else if (act === 'editEvent'){ const x = state.events.find(z => z.id === id); openModal(t.editEvent, eventForm(x)); bindForm('f', async (d) => { await updDoc('events', id, { ...d, budget: Number(d.budget || 0) }); }); }
    else if (act === 'delEvent'){
      if(!canManageOrg()){ toast(L2('শুধু সম্পাদক (Secretary) পূজা/ইভেন্ট মুছতে পারেন', 'Only the secretary can delete an event'), 'err'); return; }

          { title: L2('ইভেন্ট মুছে ফেলবেন?', 'Delete this event?'), okLabel: L2('হ্যাঁ, মুছে ফেলুন', 'Yes, delete') })){
        const kids = [];
        ['transactions', 'members', 'donors', 'vendors'].forEach(col => {
          (state[col] || []).forEach(x => { if (x.eventId === id) kids.push({ col, id: x.id }); });
        });
        await softDeleteMany([{ col: 'events', id }, ...kids],
          L2('ইভেন্ট মুছে ফেলা হয়েছে — ' , 'Event deleted — ') + bn(kids.length) + L2(' টি রেকর্ডসহ', ' records with it'),
          L2('ইভেন্ট ও তার সব রেকর্ড ফিরে এসেছে', 'Event and all its records are back'));
      }

    else if (act === 'delTxn'){

/* কনটেন্ট ও হ্যামবার্গার মেনু — দুই জায়গার [data-act] একই ফাংশনে আসে */
function bindContent(){
  const c = document.getElementById('content'); if (!c) return;
  c.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    e.preventDefault();
    // viewer guard
    if(!canWrite() && ['newEvent','editEvent','delEvent','newTxn','editTxn','delTxn','newDonor','editDonor','delDonor','newMember','editMember','delMember','bulkMembers','setEvt','newReminder','editReminder','delReminder','toggleReminder','newVendor','editVendor','delVendor','payVendor','vendorReminder'].includes(b.dataset.act)){
      toast(L2('আপনার শুধু দেখার অনুমতি আছে','You have read-only access'), 'warn');
      return;
    }
    await runAct(b.dataset.act, b.dataset.id);
  });
  // Invite Code generation - Code only + WhatsApp Share
  const genInviteBtn = document.getElementById('genInviteBtn');
  const copyInviteCodeBtn = document.getElementById('copyInviteCodeBtn');
  const shareInviteCodeBtn = document.getElementById('shareInviteCodeBtn');
  const qrInviteCodeBtn = document.getElementById('qrInviteCodeBtn');
  const inviteCodeDisplay = document.getElementById('inviteCodeDisplay');
  const orgInvitesList = document.getElementById('orgInvitesList');
  const renderInvites = () => {
    const invites = state.orgInvites||[];
    let activeCode = '';
    if(inviteCodeDisplay){
      const unused = invites.filter(x=>!x.used);
      const latest = unused.length ? unused[unused.length-1] : (invites.length ? invites[invites.length-1] : null);
      activeCode = latest ? latest.code : (orgNow() && orgNow().inviteCode ? orgNow().inviteCode : '');
      if(activeCode){
        inviteCodeDisplay.textContent = activeCode + (latest && latest.used ? ' (Used)' : '');
        inviteCodeDisplay.style.display='inline-block';
        if(copyInviteCodeBtn) copyInviteCodeBtn.style.display = latest && !latest.used ? 'inline-flex' : 'none';
        if(shareInviteCodeBtn) shareInviteCodeBtn.style.display = latest && !latest.used ? 'inline-flex' : 'none';
        if(qrInviteCodeBtn){ qrInviteCodeBtn.style.display = latest && !latest.used ? 'inline-flex' : 'none'; qrInviteCodeBtn.onclick = () => showInviteQr(activeCode); }
      } else {
        inviteCodeDisplay.textContent = '—';
        if(copyInviteCodeBtn) copyInviteCodeBtn.style.display='none';
        if(shareInviteCodeBtn) shareInviteCodeBtn.style.display='none';
        if(qrInviteCodeBtn) qrInviteCodeBtn.style.display='none';
      }
      if(latest && latest.used) inviteCodeDisplay.style.opacity='0.5'; else inviteCodeDisplay.style.opacity='1';
    }
    if(orgInvitesList){
      if(!invites.length){
        orgInvitesList.innerHTML = '<div class="muted" style="font-size:12px; padding:10px; text-align:center; background:var(--soft); border-radius:8px">No invite code yet — generate above</div>';
      } else {
        // Responsive cards - LINK functionality but only CODE displayed (no link text)
        orgInvitesList.innerHTML = '<div style="display:grid; gap:8px; max-width:100%">'+
          invites.map(inv=>{
            const roleEn = (APP_ROLES.find(x=>x.id===(inv.role||'member'))?.en || inv.role||'member');
            const st = inv.used ? '<span class="pill p-grey" style="font-size:10px">Used'+(inv.usedAt ? ' '+fmtDate(new Date(inv.usedAt).toISOString().slice(0,10)) : '')+'</span>' : '<span class="pill" style="background:#dcfce7; border-color:#86efac; color:#166534; font-size:10px">Active</span>';
            const link = location.origin + location.pathname + '?join='+encodeURIComponent(inv.code);
            const waMsg = encodeURIComponent('Puja Sarathi - Join: '+link+'\nCode: '+inv.code+' ('+roleEn+')');
            const rowStyle = inv.used ? 'opacity:0.6' : '';
            return '<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; background:var(--solid-1); border:1px solid var(--line); border-radius:10px; max-width:100%; '+rowStyle+'">'
              +'<b style="letter-spacing:1px; font-size:13px; background:linear-gradient(135deg,var(--brand-050),var(--brand-100)); border:1px dashed var(--brand-500); padding:4px 8px; border-radius:8px; color:var(--brand-800); flex:0 0 auto">'+esc(inv.code)+'</b>'
              +'<span class="pill '+(inv.role==='secretary'?'':inv.role==='cashier'?'p-info':'p-grey')+'" style="font-size:11px; flex:0 0 auto">'+esc(roleEn)+'</span>'
              +st
              +'<div style="margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; align-items:center">'
              +(inv.used ? '' : '<button class="btn s ghost" style="font-size:11px; padding:4px 8px" data-copy-link="'+esc(link)+'">'+icon('copy','ic-sm')+'Copy Link</button><a class="btn s" style="background:#25D366; color:white; text-decoration:none; font-size:11px; padding:4px 8px" href="https://wa.me/?text='+waMsg+'" target="_blank">WA Share</a><button class="btn s ghost" style="font-size:11px; padding:4px 8px" data-invqr="'+esc(inv.code)+'">'+icon('qr','ic-sm')+'QR</button>')
              +'<button class="iconbtn danger" style="width:28px; height:28px; flex:0 0 auto" data-del-invite="'+esc(inv.code)+'" title="'+L2('মুছুন','Delete')+'">'+icon('trash','ic-sm')+'</button>'
              +'</div></div>';
          }).join('')+'</div>';
        orgInvitesList.querySelectorAll('[data-copy-link]').forEach(b=>{
          b.onclick = async ()=>{
            const link=b.getAttribute('data-copy-link');
            try { await navigator.clipboard.writeText(link); toast('Link copied', 'ok'); } catch(e){ window.psCopyLink && window.psCopyLink(link); }
          };
        });
        orgInvitesList.querySelectorAll('[data-invqr]').forEach(b=>{
          b.onclick = () => showInviteQr(b.getAttribute('data-invqr'));
        });
        orgInvitesList.querySelectorAll('[data-del-invite]').forEach(b=>{
          b.onclick = async ()=>{
            const code=b.getAttribute('data-del-invite');
            if(!code) return;
            if(!await uiConfirm(L2('Invite কোডটি মুছে ফেলা হবে: ','This invite code will be deleted: ')+code, { title: L2('Invite কোড মুছবেন?', 'Delete this invite code?') })){ return; }
            try {
              if(dataLocal()){ await demoDeleteInvite(code); }
              else { await fbDeleteInvite(code); }
              toast(L2('Invite code মুছে ফেলা হয়েছে: ','Invite code deleted: ')+code, 'ok');
              await reload(); render();
            } catch(ex){ toast(fbErrMsg(ex), 'err'); }
          };
        });
      }
    }
  };
  renderInvites();
  if(genInviteBtn){
    genInviteBtn.onclick = async ()=>{
      if(!canManageMembers()){ toast('Only Secretary can generate', 'warn'); return; }
      const roleEl = document.getElementById('inviteCodeRole');
      const selRole = (roleEl && roleEl.value) || 'member';
      genInviteBtn.disabled=true; const old=genInviteBtn.innerHTML; genInviteBtn.innerHTML='<span class="spin"></span> '+L2('বানানো হচ্ছে…','Generating…');
      try {
        const inv = dataLocal() ? await demoCreateInvite(state.currentOrgId, selRole) : await fbCreateInvite(state.currentOrgId, selRole);
        toast('Invite code: '+inv.code+' ('+roleLabel(inv.role)+')', 'ok');
        await reload(); render();
      } catch(ex){ toast(fbErrMsg(ex), 'err'); }
      genInviteBtn.disabled=false; genInviteBtn.innerHTML=old;
    };
  }
  if(copyInviteCodeBtn){
    copyInviteCodeBtn.onclick = async ()=>{
      const invites = state.orgInvites||[];
      const latest = invites.filter(x=>!x.used).slice(-1)[0] || invites.slice(-1)[0];
      const code = latest ? latest.code : (orgNow() && orgNow().inviteCode ? orgNow().inviteCode : '');
      if(!code){ toast('Generate code first', 'warn'); return; }
      const link = location.origin + location.pathname + '?join='+encodeURIComponent(code);
      try { await navigator.clipboard.writeText(link); toast('Link copied', 'ok'); } catch(e){ window.psCopyLink && window.psCopyLink(link); }
    };
  }
  if(shareInviteCodeBtn){
    shareInviteCodeBtn.onclick = ()=>{
      const invites = state.orgInvites||[];
      const latest = invites.filter(x=>!x.used).slice(-1)[0] || invites.slice(-1)[0];
      const code = latest ? latest.code : (orgNow() && orgNow().inviteCode ? orgNow().inviteCode : '');
      if(!code){ toast('Generate code first', 'warn'); return; }
      const roleEl = document.getElementById('inviteCodeRole');
      const role = (roleEl && roleEl.value) || (latest && latest.role) || 'member';
      const roleEn = (APP_ROLES.find(x=>x.id===role)?.en || role);
      const link = location.origin + location.pathname + '?join='+encodeURIComponent(code);
      const msg = 'Puja Sarathi - Join: '+link+'\nCode: '+code+' ('+roleEn+') — Enter at signup';
      const waUrl = 'https://wa.me/?text='+encodeURIComponent(msg);
      if(navigator.share){
        navigator.share({title:'Puja Sarathi Invite', text:msg, url:link}).catch(()=> window.open(waUrl, '_blank'));
      } else {
        window.open(waUrl, '_blank');
      }
    };
  }

  // Role management UI inside settings
  const inviteBtn = document.getElementById('inviteBtn');
  if(inviteBtn){
    inviteBtn.onclick = async () => {
      const emailEl = document.getElementById('inviteEmail');
      const roleEl = document.getElementById('inviteRole');
      const nameEl = document.getElementById('inviteName');
      const email = (emailEl && emailEl.value || '').trim();

/* সেটিংসের প্রতিটি কার্ডকে collapsible বানানো — হেডে ক্লিক করলে বডি খোলে/বন্ধ হয় (ডিফল্ট বন্ধ) */
function makeSettingsCollapsible(){
  try {
    const grid = document.getElementById('settingsGrid');
    if (!grid) return;
    grid.querySelectorAll(':scope > .card').forEach(card => {
      if (card.dataset.setDone) return;
      const head = card.querySelector(':scope > .card-head');
      if (!head) return;
      /* কার্ড চেনার স্থায়ী কী — থিম/রঙ বদলে re-render হলেও খোলা সেকশন খোলাই থাকে */
      const key = (head.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 80);
      const body = document.createElement('div');
      body.className = 'set-body';
      body.hidden = true;
      [...card.children].forEach(k => { if (k !== head) body.appendChild(k); });

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = head.className + ' set-head';
      btn.setAttribute('aria-expanded', 'false');
      while (head.firstChild) btn.appendChild(head.firstChild);

      const chev = document.createElement('span');
      chev.className = 'set-chev';
      chev.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
      btn.appendChild(chev);

      card.insertBefore(btn, card.firstChild);
      card.insertBefore(body, btn.nextSibling);
      head.remove();

      /* আগের রেন্ডারে খোলা ছিল? → এখনও খোলা রাখো */
      try { if (window.PS_SET_OPEN && window.PS_SET_OPEN[key]){
        body.hidden = false;
        btn.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
      } } catch(_){}

      btn.addEventListener('click', () => {
        const willOpen = body.hidden;
        body.hidden = !willOpen;
        btn.classList.toggle('open', willOpen);
        btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        try { window.PS_SET_OPEN = window.PS_SET_OPEN || {}; window.PS_SET_OPEN[key] = willOpen; } catch(_){}
      });
      card.dataset.setDone = '1';
    });
  } catch(e){}
}

function inviteJoinLink(code){
  try { return location.origin + location.pathname + '?join=' + encodeURIComponent(code); }
  catch(e){ return '?join=' + encodeURIComponent(code); }
}
function showInviteQr(code){
  code = String(code || '').trim();
  if(!code){ toast(L2('আগে invite কোড বানান', 'Generate an invite code first'), 'warn'); return; }
  const link = inviteJoinLink(code);
  let svg = '';
  try {
    const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
    svg = qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
  } catch(e){
    try {
      const qr2 = qrcode(0, 'M'); qr2.addData(code); qr2.make();
      svg = qr2.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
    } catch(_){ toast(L2('QR বানানো গেল না', 'Could not build QR'), 'err'); return; }
  }
  const html = '<div style="display:grid; justify-items:center; gap:12px; padding:4px 0 2px">'
    + '<div style="background:#fff; padding:12px; border-radius:14px; border:1px solid var(--line); width:min(250px, 70vw)">'
    + svg.replace('<svg ', '<svg style="width:100%; height:auto; display:block" ') + '</div>'
    + '<div style="text-align:center"><div class="muted" style="font-size:11px; margin-bottom:4px">' + L2('যেকোনো ফোনের ক্যামেরা/QR অ্যাপ দিয়ে স্ক্যান করলেই জয়েন-লিংক খুলবে', 'Scan with any phone camera/QR app — opens the join link') + '</div>'
    + '<b style="letter-spacing:1.5px; font-size:15px; background:linear-gradient(135deg,var(--brand-050),var(--brand-100)); border:1px dashed var(--brand-500); padding:5px 10px; border-radius:8px; color:var(--brand-800)">' + esc(code) + '</b></div>'
    + '<div class="muted" style="font-size:11px; text-align:center; max-width:300px">' + L2('অ্যাপের ভেতরে: Create account → “QR স্ক্যান করুন” চাপলে ক্যামেরা খুলে কোড নিজেই বসে যাবে।', 'In-app: Create account → “Scan QR” opens the camera and fills the code automatically.') + '</div>'
    + '<div style="display:flex; gap:8px"><button type="button" class="btn ghost s" onclick="closeModal()">' + L2('বন্ধ', 'Close') + '</button></div>'
    + '</div>';
  openModal(L2('জয়েন QR কোড', 'Join QR code'), html);
}
function codeFromScanned(t){
  t = String(t == null ? '' : t).trim();
  const m = t.match(/[?&#]join=([^&\s#]+)/i);
  if (m){ try { t = decodeURIComponent(m[1]); } catch(e){ t = m[1]; } }
  t = t.trim().toUpperCase();
  return /^[A-Z0-9][A-Z0-9\-_]{2,31}$/.test(t) ? t : '';
}
window.__psScanInvite = function(){

  const overlay = document.createElement('div');
  overlay.id = 'qrScanOverlay';
  overlay.style.cssText = 'position:fixed; inset:0; z-index:99999; background:rgba(2,4,10,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:18px';
  overlay.innerHTML = '<div style="position:relative; width:min(330px,86vw); aspect-ratio:1/1; background:#000; border-radius:18px; overflow:hidden; border:2px solid var(--brand-500)">'
    + '<video id="qrScanVideo" playsinline autoplay muted style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover"></video>'
    + '<div style="position:absolute; inset:0; display:grid; place-items:center; pointer-events:none"><span style="width:62%; height:62%; border:2.5px solid rgba(255,255,255,.9); border-radius:14px; box-shadow:0 0 0 999px rgba(0,0,0,.38)"></span></div>'
    + '</div>'
    + '<div id="qrScanMsg" style="color:#cbd5e1; font-size:12.5px; text-align:center; max-width:86vw; line-height:1.5">' + L2('QR-টি বাক্সের মধ্যে ধরুন — invite কোড নিজেই বসে যাবে', 'Hold the QR inside the box — the invite code fills itself') + '</div>'
    + '<button class="btn ghost s" id="qrScanClose" style="color:#e2e8f0">' + L2('বন্ধ করুন', 'Close') + '</button>';
  document.body.appendChild(overlay);
  const video = overlay.querySelector('#qrScanVideo');
  let stream = null, raf = 0, stopped = false, det = null, tick = 0;
  const stop = () => { stopped = true; try{ cancelAnimationFrame(raf); }catch(_){} try{ if(stream) stream.getTracks().forEach(t => t.stop()); }catch(_){} const el = document.getElementById('qrScanOverlay'); if(el && el.parentNode) el.parentNode.removeChild(el); };
  overlay.querySelector('#qrScanClose').onclick = stop;
  const done = (raw) => {
    const code = codeFromScanned(raw);
    if (!code) return;
    stop();
    const f = document.getElementById('inviteCodeField');
    if (f){ f.value = code; try{ f.dispatchEvent(new Event('input', {bubbles:true})); }catch(_){} }
    toast(L2('QR থেকে কোড বসেছে: ', 'Code from QR: ') + code, 'ok');
  };
  (async () => {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream;
      await video.play().catch(() => {});
    } catch(e) {
      const m = overlay.querySelector('#qrScanMsg');
      if (m) m.innerHTML = L2('ক্যামেরা খোলা যায়নি — ব্রাউজারে ক্যামেরার পারমিশন দিন (https/হোস্টেড লিংকে চলে)। অথবা ফোনের নিজের ক্যামেরা দিয়ে QR স্ক্যান করে লিংকটি খুলুন — লিংকেই কোড আছে।', 'Could not open the camera — allow camera permission (works on https/hosted link). Or scan the QR with your phone’s own camera and open the link — the code is inside it.');
      return;
    }
    if (window.BarcodeDetector){
      try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e){ det = null; }
    }
    if (det){
      const loop = async () => {
        if (stopped) return;
        try { const hits = await det.detect(video); if (hits && hits.length && hits[0].rawValue){ done(hits[0].rawValue); return; } } catch(e){}
        raf = requestAnimationFrame(loop);
      };
      loop();
    } else if (typeof jsQR === 'function'){
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const loop = () => {
        if (stopped) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA && (++tick % 2 === 0)){
          const w = 440, h = Math.max(120, Math.round(440 * (video.videoHeight || 3) / (video.videoWidth || 4)));
          canvas.width = w; canvas.height = h;
          try {
            ctx.drawImage(video, 0, 0, w, h);
            const img = ctx.getImageData(0, 0, w, h);
            const res = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
            if (res && res.data){ done(res.data); return; }
          } catch(e){}
        }
        raf = requestAnimationFrame(loop);
      };
      loop();
    } else {
      const m = overlay.querySelector('#qrScanMsg');
      if (m) m.textContent = L2('এই ব্রাউজারে স্ক্যানার সাপোর্ট নেই — কোডটি হাতে লিখুন বা লিংক দিয়ে খুলুন।', 'No scanner support in this browser — type the code or open the link.');
    }
  })();
};

async function loadClearAll(){
  try {
    const orgs = await clearOrgsWithEvents();
    clearCtx = { orgs };
    const m = document.querySelector('#modal .body');
    if (m) { m.innerHTML = clearAllHtml(null, orgs); bindClearAll(); }
  } catch(e){
    const m = document.querySelector('#modal .body');
    if (m) m.innerHTML = '<div class="err">' + esc(fbErrMsg(e)) + '</div>';
  }
}

async function clearOrgsWithEvents(){
  let orgs = [];
  if (useFb() && state.user){
    try { orgs = await fbGetOrgs(state.user.uid); } catch(e){}
  } else if (state.user){
    try { orgs = await demoOrgs(state.user.uid); } catch(e){}
  }
  if (!orgs || !orgs.length) orgs = (state.orgs || []).slice();
  const out = [];
  for (const o of orgs){
    let evs = [];
    if (dataLocal()){
      try { evs = (await listDemo('events', localKey('events'))).filter(x => x.orgId === o.id); } catch(e){}
      if (!evs.length) evs = (state.events || []).filter(x => x.orgId === o.id);
    } else {
      try { evs = await listDocs('events', o.id); } catch(e){}
    }
    out.push({ org:o, events: evs || [] });
  }
  return out;
}

function bindClearAll(){
  const body = document.querySelector('#modal .body');
  if (!body) return;
  body.querySelectorAll('[data-clr]').forEach(b => {
    b.onclick = () => {
      const kind = b.dataset.clr;
      const msg = document.getElementById('clrMsg');
      if (kind === 'backup'){ downloadBackup(); return; }
      if (kind === 'cancel'){ clearCtx && clearCtx.pending ? (clearCtx.pending = null, body.innerHTML = clearAllHtml(null, clearCtx.orgs), bindClearAll()) : null; return; }
      if (kind === 'org'){
        clearCtx.pending = { type:'org', id:b.dataset.id, name:b.dataset.name };
        body.innerHTML = clearAllHtml(clearCtx.pending, null); bindClearAll();
        const p = document.getElementById('clrPwd'); if (p) p.focus();
        return;
      }
      if (kind === 'event'){
        clearCtx.pending = { type:'event', id:b.dataset.id, name:b.dataset.name, orgId:b.dataset.org };
        body.innerHTML = clearAllHtml(clearCtx.pending, null); bindClearAll();
        const p = document.getElementById('clrPwd'); if (p) p.focus();
        return;
      }
      if (kind === 'all'){
        const count = (clearCtx.orgs || []).reduce((n,o) => n + o.events.length, 0);
        clearCtx.pending = { type:'all', name:L2('সব সংগঠন', 'all organizations'), count:count };
        body.innerHTML = clearAllHtml(clearCtx.pending, null); bindClearAll();
        const p = document.getElementById('clrPwd'); if (p) p.focus();
        return;
      }
      if (kind === 'device'){
        clearCtx.pending = { type:'device', name:'' };
        body.innerHTML = clearAllHtml(clearCtx.pending, null); bindClearAll();
        const p = document.getElementById('clrPwd'); if (p) p.focus();
        return;
      }
      if (kind === 'do'){ runClearAll(); return; }
    };
  });
  const p = document.getElementById('clrPwd');
  if (p) p.onkeydown = (e) => { if (e.key === 'Enter'){ e.preventDefault(); runClearAll(); } };
}

async function runClearAll(){
  if (clearBusy || !clearCtx || !clearCtx.pending) return;
  const pending = clearCtx.pending;
  const pwd = (document.getElementById('clrPwd') || {}).value || '';
  const msg = document.getElementById('clrMsg');
  const btn = document.getElementById('clrDo');
  if (!pwd){ if (msg) msg.textContent = L2('পাসওয়ার্ড দিন', 'Enter your password'); return; }
  clearBusy = true;
  const resetBtn = () => { if (btn){ btn.disabled = false; btn.innerHTML = icon('trash') + L2('সব বুঝেছি — ডিলিট করুন', 'I understand — delete'); } };
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + L2('যাচাই হচ্ছে…', 'Checking…'); }
  if (msg) msg.textContent = '';
  try {
    const v = await verifyDangerPassword(pwd);
    if (!v.ok){
      const m = v.msg || L2('পাসওয়ার্ড মিলছে না', 'Password does not match');
      if (msg) msg.textContent = m; else toast(m, 'err');
      resetBtn();
      return;
    }
    if (msg) msg.textContent = L2('মুছে ফেলা হচ্ছে…', 'Deleting…');
    let n = 0;
    if (pending.type === 'org'){
      const o = (clearCtx.orgs || []).find(x => x.org.id === pending.id);
      n = await clearDeleteOrg(o ? o.org : { id:pending.id, name:pending.name });
    } else if (pending.type === 'event'){
      const o = (clearCtx.orgs || []).find(x => x.org.id === pending.orgId);
      const ev = o ? o.events.find(e => e.id === pending.id) : null;
      n = await clearDeleteEvent(ev || { id:pending.id, name:pending.name, orgId:pending.orgId }, pending.orgId);
    } else if (pending.type === 'all'){
      for (const o of (clearCtx.orgs || []).slice()) n += await clearDeleteOrg(o.org);
    } else if (pending.type === 'device'){
      clearDeviceData(); n = 0;
    }
    try { await reload(); } catch(e){}
    clearCtx.pending = null;
    toast(pending.type === 'device'
      ? L2('এই ব্রাউজারের ডেটা মুছে ফেলা হয়েছে', 'Data in this browser has been erased')
      : L2('মুছে ফেলা হয়েছে ✓ — ', 'Deleted ✓ — ') + bn(n) + L2(' টি রেকর্ড', ' records'), 'ok');
    render();
    openClearAll();
  } catch(e){
    const m = fbErrMsg(e);
    if (msg) msg.textContent = m; else toast(m, 'err');
    resetBtn();
  } finally {
    clearBusy = false;
  }
}

/* পাসওয়ার্ড যাচাই — লোকাল অ্যাকাউন্টে সরাসরি, Firebase-এ আসল সাইন-ইন দিয়ে */
async function verifyDangerPassword(pw){
  const email = (state.user && state.user.email ? String(state.user.email) : '').trim();
  const uid = state.user ? state.user.uid : '';
  const localCheck = () => {
    try {
      const accs = JSON.parse(store.get(LSA) || '[]');
      const a = accs.find(x => x.uid === uid) || accs.find(x => (x.email || '').toLowerCase() === email.toLowerCase());
      if (!a) return { ok:false, msg: L2('এই অ্যাকাউন্টের তথ্য পাওয়া যায়নি — পাসওয়ার্ড যাচাই করা গেল না', 'Account details not found — password could not be verified') };
      return (String(a.password || '') === String(pw)) ? { ok:true } : { ok:false, msg: L2('পাসওয়ার্ড ভুল', 'Wrong password') };
    } catch(e){ return { ok:false, msg: L2('যাচাই করা গেল না', 'Could not verify') }; }
  };
  if (!useFb()) return localCheck();
  if (!email) return localCheck();
  const wasBusy = authBusy; authBusy++;
  try {
    await loadFirebase();
    await fbTimeout(fb.auth.signInWithEmailAndPassword(email, pw), 20000, 'পাসওয়ার্ড যাচাই');
    return { ok:true };
  } catch(e){
    const code = errCode(e);
    if (/wrong-password|invalid-credential|invalid-login|user-mismatch/i.test(code)) return { ok:false, msg: L2('পাসওয়ার্ড ভুল', 'Wrong password') };
    const lc = localCheck();
    if (lc.ok) return { ok:true };      /* ইন্টারনেট নেই — ব্রাউজারে সেভ করা পাসওয়ার্ড মিলল */
    return { ok:false, msg: fbErrMsg(e) };
  } finally { authBusy = wasBusy; }
}

/* একটা ইভেন্ট + তার সব রেকর্ড মুছে ফেলা */
async function clearDeleteEvent(ev, orgId){
  if (!ev) return 0;
  let n = 0;
  const kids = [];
  for (const col of ['members','transactions','donors','reminders','vendors']){
    let arr = [];
    try { arr = await listDocs(col, orgId, [ev.id]); } catch(e){}
    (arr || []).filter(x => x.eventId === ev.id).forEach(x => kids.push({ col, id:x.id }));
  }
  for (const k of kids){ try { await delDoc(k.col, k.id); n++; } catch(e){} }
  try { await delDoc('events', ev.id); n++; } catch(e){ markWriteBlocked(e); }
  // লোকাল মোডে অবশিষ্ট রেকর্ড
  if (dataLocal()){
    for (const col of ['members','transactions','donors','reminders','vendors']){
      try {
        const arr = await listDemo(col, localKey(col));
        const left = arr.filter(x => x.eventId === ev.id);
        if (left.length){
          for (const x of left){ try { await delDoc(col, x.id); n++; } catch(e){} }
        }
      } catch(e){}
    }
  }
  return n;
}

/* একটা সংগঠন + তার সব ইভেন্ট/রেকর্ড/সদস্য/invite মুছে ফেলা */
async function clearDeleteOrg(org){
  if (!org) return 0;
  let n = 0;
  let evs = [];
  try { evs = dataLocal() ? (await listDemo('events', localKey('events'))).filter(x => x.orgId === org.id) : await listDocs('events', org.id); } catch(e){}
  for (const ev of (evs || [])) n += await clearDeleteEvent(ev, org.id);
  // ইভেন্ট ছাড়া বাকি রেকর্ড
  for (const col of ['members','transactions','donors','reminders','vendors']){
    let arr = [];
    try { arr = await listDocs(col, org.id, (evs || []).map(e => e.id)); } catch(e){}
    for (const x of (arr || [])){ if (x.orgId === org.id || !x.eventId){ try { await delDoc(col, x.id); n++; } catch(e){} } }
  }
  // অ্যাপ-সদস্য ও invite
  try {
    if (dataLocal()){
      store.del('ps_orgMembers_' + org.id);
      try { const u0 = state.user && state.user.uid ? state.user.uid : ''; if (u0) store.del('ps_u_' + u0 + '_orgMembers_' + org.id); } catch(_){}
      try {
        const arr = JSON.parse(store.get(LSI) || '[]').filter(x => x.orgId !== org.id);
        store.set(LSI, JSON.stringify(arr));
      } catch(_){}
    } else {
      try {
        const ms = await fbGet(fb.db.collection('orgMembers').where('orgId','==',org.id), 'সদস্য তালিকা');
        for (const m of fbDocs(ms)){ try { await delDoc('orgMembers', m.id); n++; } catch(_){} }
      } catch(_){}
      try {
        const ivs = await fbGet(fb.db.collection('orgInvites').where('orgId','==',org.id), 'invite তালিকা');
        for (const iv of fbDocs(ivs)){ try { await delDoc('orgInvites', iv.id); n++; } catch(_){} }
      } catch(_){}
    }
  } catch(_){}
  // সংগঠনের ডকুমেন্ট
  try { await delDoc('organizations', org.id); n++; } catch(e){}
  // অ্যাকাউন্ট থেকে সংগঠনটা বাদ
  try {
    if (dataLocal()){
      const accs = JSON.parse(store.get(LSA) || '[]');
      accs.forEach(a => { if (a.orgIds) a.orgIds = a.orgIds.filter(x => x !== org.id); });
      store.set(LSA, JSON.stringify(accs));
      store.set(LSO, JSON.stringify(JSON.parse(store.get(LSO) || '[]').filter(o => o.id !== org.id)));
    } else if (state.user && state.user.uid){
      const uid = state.user.uid;
      const snap = await fbGet(fb.db.collection('users').doc(uid), 'প্রোফাইল পড়া');
      const x = (snap && snap.exists !== false && snap.data()) ? (snap.data() || {}) : {};
      const ids = (x.orgIds || []).filter(y => y !== org.id);
      const cur = (x.currentOrgId === org.id) ? (ids[0] || '') : (x.currentOrgId || '');
      await fbTimeout(fb.db.collection('users').doc(uid).set({ orgIds: ids, currentOrgId: cur }, { merge:true }), 20000, 'প্রোফাইল সংরক্ষণ');
    }
  } catch(e){}
  // এই সেশনে সংগঠনের তালিকা হালনাগাদ
  try { state.orgs = await (useFb() ? fbGetOrgs(state.user.uid) : demoOrgs(state.user.uid)); } catch(e){}
  if (!state.orgs) state.orgs = [];
  if (state.currentOrgId === org.id || !state.orgs.some(o => o.id === state.currentOrgId)){
    state.currentOrgId = (state.orgs[0] && state.orgs[0].id) || '';
    state.user = { ...state.user, currentOrgId: state.currentOrgId };
    state.selectedEventId = '';
    try { useFb() ? await fbSetOrg(state.user.uid, state.currentOrgId) : demoSetOrg(state.user.uid, state.currentOrgId); } catch(_){}
  }
  return n;
}

    closeModal();
    try {

          name: d.name, work: d.work || 'অন্যান্য', phone: d.phone || '', total: total, cat: d.cat || VR_CAT[d.work] || 'অন্যান্য ব্যয়',

}

function bindBulkMemberForm(){

  const countPill = document.getElementById('bulkCount');
  const bulkRoleSel = document.getElementById('bulkRole');

  let rowIdx = 1;
  const getRoleOpts = ()=> ROLES.map(r=>'<option value="'+esc(r)+'">'+bv(r)+'</option>').join('');
  const updateCount = ()=>{
    const n = rowsContainer.querySelectorAll('.bulk-row').length;
    if(countPill) countPill.textContent = bn(n) + ' ' + L2('জন','');
    const rows = rowsContainer.querySelectorAll('.bulk-row');
    rows.forEach(r=>{
      const btn = r.querySelector('.bulk-remove');
      if(btn) btn.style.display = rows.length>1 ? '' : 'none';
    });
  };
  const addRow = ()=>{
    // remember upper category - last row's role or bulkRole
    let lastRole = '';
    const allRows = rowsContainer.querySelectorAll('.bulk-row');
    if(allRows.length){
      const lastRow = allRows[allRows.length-1];
      const lastSel = lastRow.querySelector('select[name^="b_role_"]');
      if(lastSel) lastRole = lastSel.value;
    }
    if(!lastRole && bulkRoleSel) lastRole = bulkRoleSel.value;
    const roleOpts = ROLES.map(r=>'<option value="'+esc(r)+'" '+(r===lastRole ? 'selected' : '')+'>'+bv(r)+'</option>').join('');
    const div = document.createElement('div');
    div.className = 'bulk-row';
    div.style.cssText = 'display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:end; padding:10px; background:var(--solid-1); border:1px solid var(--line); border-radius:10px; animation:pop .18s ease';
    div.innerHTML = `
      <label style="margin:0"><span class="lbl" style="font-size:11px">${icon('user','ic-sm')}${L2('নাম','Name')} *</span><input name="b_name_${rowIdx}" required placeholder="${L2('নাম লিখুন','Enter name')}"></label>
      <label style="margin:0"><span class="lbl" style="font-size:11px">${icon('phone','ic-sm')}${L2('ফোন','Phone')}</span><input name="b_phone_${rowIdx}" placeholder="${L2('ফোন নম্বর','Phone')}"></label>
      <label style="margin:0"><span class="lbl" style="font-size:11px">${icon('shield','ic-sm')}${L2('ভূমিকা','Role')}</span><select name="b_role_${rowIdx}">${roleOpts}</select></label>
      <button type="button" class="iconbtn danger bulk-remove" style="width:32px; height:32px" title="${L2('মুছুন','Remove')}">${icon('trash','ic-sm')}</button>
    `;
    rowsContainer.appendChild(div);
    const remBtn = div.querySelector('.bulk-remove');
    if(remBtn){
      remBtn.onclick = ()=>{ div.remove(); updateCount(); };
    }
    rowIdx++;
    updateCount();
    const inp = div.querySelector('input');
    if(inp) inp.focus();
  };
  if(addBtn) addBtn.onclick = addRow;
  // when bulkRole changes, update all rows that still have default? Actually update first row if empty
  if(bulkRoleSel){
    bulkRoleSel.onchange = ()=>{
      // if only 1 row and its role not manually changed, sync it
      const firstRowSel = rowsContainer.querySelector('select[name^="b_role_"]');
      if(firstRowSel && rowsContainer.querySelectorAll('.bulk-row').length===1){
        firstRowSel.value = bulkRoleSel.value;
      }
    };
    // set initial first row role to bulkRole
    const firstSel = rowsContainer.querySelector('select[name^="b_role_"]');
    if(firstSel) firstSel.value = bulkRoleSel.value;
  }
  rowsContainer.querySelectorAll('.bulk-remove').forEach(btn=>{
    btn.onclick = (e)=>{
      const row = e.target.closest('.bulk-row');
      if(row){ row.remove(); updateCount(); }
    };
  });
  updateCount();
  let busy=false;
  bindSubmit(form, async (d)=>{
    if(busy) return; busy=true;
    const contrib = Number(d.bulkContrib||0);
    const defaultRole = d.bulkRole || ROLES[ROLES.length-1];
    if(!contrib || contrib<=0){
      showFormError(form, L2('সবার জন্য চাঁদা লিখুন','Enter universal contribution'));
      busy=false; return;
    }
    const rows = rowsContainer.querySelectorAll('.bulk-row');
    const members = [];
    for(let i=0;i<rows.length;i++){
      const row = rows[i];
      const nameInput = row.querySelector('input[name^="b_name_"]');
      const phoneInput = row.querySelector('input[name^="b_phone_"]');
      const roleSel = row.querySelector('select[name^="b_role_"]');
      const name = nameInput ? String(nameInput.value||'').trim() : '';
      const phone = phoneInput ? String(phoneInput.value||'').trim() : '';
      const role = roleSel ? String(roleSel.value||'').trim() : defaultRole;
      if(!name){
        showFormError(form, L2('সব সদস্যের নাম লিখুন — '+(i+1)+' নং খালি','Enter all member names — row '+(i+1)+' is empty'));
        busy=false; return;
      }
      members.push({ name, phone, role: role || defaultRole, contribution: contrib, paid: 0, eventId: state.selectedEventId, orgId: state.currentOrgId });
    }
    if(!members.length){
      showFormError(form, L2('কমপক্ষে একজন সদস্য যোগ করুন','Add at least one member'));
      busy=false; return;
    }
    closeModal();
    try{
      for(let m of members){
        await saveGuard(()=> addDoc('members', m));
      }
      await reload();
      toast(L2('বাল্ক সদস্য যোগ হয়েছে ✓ — ','Bulk members added ✓ — ')+bn(members.length)+' '+L2('জন',''), 'ok');
    }catch(ex){
      toast(L2('সেভ করা যায়নি: ','Could not save: ')+(ex.message||''), 'err');
    }
    render();
  });
}
function bindTxnForm(ex){
  const f=document.getElementById('f'); if(!f) return;
  const typeSel=f.querySelector('#typeSel'), catSel=f.querySelector('#catSel');
  const otherWrap=f.querySelector('#catOtherWrap'), otherInput=f.querySelector('#catOtherInput');
  const incWrap=f.querySelector('#incOtherWrap'), incInput=f.querySelector('#incOtherInput');
  const syncOther=()=>{
    const cat = catSel ? catSel.value : '';
    const expOn = !!(cat && cat === EXP_OTHER), incOn = !!(cat && cat === INC_OTHER);
    if(otherWrap) otherWrap.style.display = expOn ? '' : 'none';
    if(incWrap) incWrap.style.display = incOn ? '' : 'none';
    const inp = expOn ? otherInput : (incOn ? incInput : null);
    if(inp) setTimeout(()=>{ try{ inp.focus(); }catch(_){} }, 30);
  };
  if(typeSel) typeSel.onchange=()=>{
    if(catSel){ const prev=catSel.value; catSel.innerHTML=catOptionsHtml(typeSel.value, prev); }
    syncOther();
  };
  if(catSel) catSel.onchange=syncOther;
  syncOther();
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    const cat = String(d.category||'');
    const detail = String(d.expenseDetail||'').trim();
    const incDetail = String(d.incomeDetail||'').trim();
    const noteOld = String(d.note||'').trim();
    /* "অন্যান্য ব্যয় / অন্যান্য আয়" বাছলে লেখা বিবরণটা নোটে ঢুকে যায়, যাতে খাতায় কী খরচ/আয় সেটা বোঝা যায় */
    const anyDetail = (cat === EXP_OTHER) ? detail : (cat === INC_OTHER) ? incDetail : '';
    const note = anyDetail
      ? (noteOld && noteOld.indexOf(anyDetail) < 0 ? (anyDetail + ' — ' + noteOld) : (anyDetail || noteOld))
      : noteOld;
    closeModal();
    const data={...d, amount:Number(d.amount), eventId:state.selectedEventId, orgId:state.currentOrgId, receiptNo:d.receiptNo||'', note:note};
    if(cat === EXP_OTHER && detail) data.expenseDetail = detail; else delete data.expenseDetail;
    if(cat === INC_OTHER && incDetail) data.incomeDetail = incDetail; else delete data.incomeDetail;
    try {
      await saveGuard(() => ex ? updDoc('transactions',ex.id,data) : addDoc('transactions',data));
      await reload();
      toast(L2('লেনদেন সেভ হয়েছে ✓', 'Entry saved ✓'), 'ok');
    }
    catch(err){ /* বার্তা toast-এ */ }
    render();
  });
}

          if (authBusy > 0) return;

            if (!state.user) state.user = { uid:u.uid, name:(u.email||'').split('@')[0], email:u.email||'', orgIds:[], currentOrgId:'' };
            if (!state.orgs) state.orgs = [];

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-route]');
    if (a){ e.preventDefault(); state.route = a.dataset.route; render(); }
  });
  window.closeModal = closeModal;

/* আঙুল দিয়ে উপর থেকে নিচে টানলে ব্রাউজার যেন পেজ রিফ্রেশ না করে (পুরনো WebView-তেও) */
function killPullToRefresh(){
  let startY = 0, armed = false, down = false, gaveUp = false;
  /* পেজ + ভেতরের সব স্ক্রলার একেবারে উপরে আছে কি না */
  const allAtTop = (el) => {
    let n = el;
    while (n && n !== document.body && n !== document.documentElement){
      try {
        const st = getComputedStyle(n);
        if (/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight + 2){
          if (n.scrollTop > 0) return false;      /* ভেতরের স্ক্রলার উপরে নেই → টান আটকাবো না */
        }
      } catch(_){}
      n = n.parentElement;
    }
    return (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  };
  window.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1){ armed = false; return; }
    startY = e.touches[0].clientY; armed = true; down = false; gaveUp = false;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!armed || gaveUp || !e.touches || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    if (dy < -4){ armed = false; return; }         /* আঙুল উপরে = নিচে স্ক্রল — কখনো আটকাবো না */
    if (dy > 8 && down && allAtTop(e.target)){
      if (e.cancelable) e.preventDefault();        /* উপর থেকে নিচে টান = রিফ্রেশ আটকানো */
    }
    if (dy > 8) down = true;
  }, { passive: false });
  const stop = () => { armed = false; down = false; gaveUp = true; };
  window.addEventListener('touchend', stop, { passive: true });
  window.addEventListener('touchcancel', stop, { passive: true });
}
try { killPullToRefresh(); } catch(_){}

  /* প্রিভিউ/এমবেডে (স্টোরেজ বা লগইন চলে না) স্ক্রিনে কিছু না দেখিয়ে ভেতরে ঢুকে যাই —

    };
    setTimeout(() => tryQuietDemo(0), 350);
  }
}

<script>
// PWA Service Worker + Install Prompt
(function(){
  // Register SW for PWA (works on http://localhost and https)
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      // Only register if not file:// protocol
      if(location.protocol === 'file:'){
        console.log('[PWA] File protocol - SW skipped, but manifest still works for installability check');
        return;
      }
      /* প্রিভিউ/এমবেড (sandboxed iframe) বা স্টোরেজ বন্ধ — SW রেজিস্টার করা যায় না,
         চেষ্টা করলে শুধু কনসোলে এরর ওঠে, তাই চুপচাপ বাদ */
      try { if (typeof previewEnv === 'function' && previewEnv()) return; } catch(_){ return; }
      try { if (document.origin === 'null') return; } catch(_){}
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(reg => {
          console.log('[PWA] SW registered:', reg.scope);
          // Check for updates
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if(nw){
              nw.addEventListener('statechanged', () => {
                if(nw.state === 'installed' && navigator.serviceWorker.controller){
                  console.log('[PWA] New content available, refresh to update');
                  // Optionally show update banner
                  try{
                    const b = document.createElement('div');
                    b.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center';
                    b.innerHTML='<span style="display:inline-flex;align-items:center;gap:6px">' + icon('refresh','ic-sm') + ' New version available</span><button onclick="location.reload()" style="background:var(--brand-500);border:0;color:white;padding:4px 10px;border-radius:999px;font-weight:700;cursor:pointer">Reload</button><button onclick="this.parentElement.remove()" style="background:transparent;border:0;color:#94a3b8;cursor:pointer">✕</button>';
                    document.body.appendChild(b);
                    setTimeout(()=> b.remove(), 15000);
                  }catch(_){}
                }
              });
            }
          });
        })
        .catch(err => console.warn('[PWA] SW registration failed:', err));
    });
  }

  // PWA Install Prompt
  let deferredPrompt = null;
  const installBtnId = 'pwaInstallBtn';
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('[PWA] beforeinstallprompt fired');
    // Show install button if exists, or create floating button
    let btn = document.getElementById(installBtnId);
    if(!btn){
      try{
        btn = document.createElement('button');
        btn.id = installBtnId;
        btn.innerHTML = icon('smartphone','ic-sm') + ' Install App';
        btn.style.cssText='position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,var(--brand-500),#ef4444);color:white;border:0;padding:12px 18px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 8px 24px -4px rgba(var(--brand-glow2),.5);z-index:9998;cursor:pointer;display:flex;align-items:center;gap:6px';
        btn.onclick = async () => {
          if(!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] Install outcome:', outcome);
          deferredPrompt = null;
          btn.remove();
        };
        document.body.appendChild(btn);
        // Auto hide after 20s
        setTimeout(()=> { try{ btn.style.opacity='0'; btn.style.transform='translateY(10px)'; setTimeout(()=> btn.remove(), 400);}catch(_){} }, 20000);
      }catch(_){}
    } else {
      btn.style.display = 'flex';
    }
    // Also show in settings if button there
    try{
      const sBtn = document.getElementById('settingsPwaInstall');
      if(sBtn) sBtn.style.display = 'inline-flex';
    }catch(_){}
  });

  window.addEventListener('appinstalled', () => {
    console.log('[PWA] App installed');
    deferredPrompt = null;
    const btn = document.getElementById(installBtnId);
    if(btn) btn.remove();
    try{
      const sBtn = document.getElementById('settingsPwaInstall');
      if(sBtn) sBtn.style.display = 'none';
    }catch(_){}
  });

  // Expose install trigger for settings button
  window.triggerPwaInstall = async () => {
    if(deferredPrompt){
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      return outcome;
    } else {
      // Fallback instructions
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if(isIOS){
        uiAlert('iPhone: Tap Share button (⎙) → Add to Home Screen → Add', { title: 'Install App', danger:false });
      } else {
        uiAlert('To install: Open browser menu (⋮) → Install app / Add to Home Screen', { title: 'Install App', danger:false });
      }
      return 'dismissed';
    }
  };
})();
