    return u;
  } finally { authBusy--; }
}
/* সংগঠনের তথ্য আনার চেষ্টা — ব্যর্থ হলেও লগইন আটকাবে না */
async function loadOrgsQuiet(u){
  if (!state.orgs) state.orgs = [];
  const waits = [0, 400, 1100];        /* আগে ছিল ১২০০ms করে — এখন দ্রুত */
  for (let attempt = 0; attempt < 3; attempt++){
    if (waits[attempt]) await new Promise(r => setTimeout(r, waits[attempt]));
    try {
      const o = useFb() ? await fbGetOrgs(u.uid) : await demoOrgs(u.uid);
      if (o && o.length){ state.orgs = o; return; }
      if (attempt === 2){ state.orgs = o || []; return; }
    } catch(e){ if (attempt === 2){ noteWarn(L2('সংগঠনের তথ্য আনা যায়নি: ', 'Could not fetch organization data: ') + fbErrMsg(e)); } }
  }
}

/* ব্রাউজারে জমানো ডেটা Firebase-এ পাঠানো (নিয়ম ঠিক করার পরে এক ক্লিকে) */
async function migrateLocalToFirebase(){
  if (!useFb()){ toast(L2('Firebase সংযুক্ত নেই — এই ব্রাউজারেই ডেটা জমছে', 'Firebase is not connected — data is stored in this browser'), 'warn'); return; }
  if (LOCAL_STORE){ toast(L2('প্রথমে সেটিংস → “Firebase-এ সেভ” মোডে ফিরুন', 'First switch back to “Save to Firebase” in Settings'), 'warn'); return; }
  if (!state.user) return;
  let ok = 0, bad = 0;
  const oldKey = k => 'ps_u_' + state.user.uid + '_' + k;
  try {
    const eMap = {};
    for (const item of await listDemo('events', oldKey('events'))){
      const { id, createdAt, ...data } = item;
      try { const ref = await fbTimeout(fb.db.collection('events').add({ ...data, createdAt: createdAt||Date.now() }), 20000, 'মাইগ্রেশন'); eMap[id] = ref.id; ok++; }
      catch(e){ bad++; }
    }
    for (const col of ['members','transactions','donors','vendors']){
      for (const item of await listDemo(col, oldKey(col))){
        const { id, createdAt, ...data } = item;
        if (data.eventId && eMap[data.eventId]) data.eventId = eMap[data.eventId];
        try { await fbTimeout(fb.db.collection(col).add({ ...data, createdAt: createdAt||Date.now() }), 20000, 'মাইগ্রেশন'); ok++; }
        catch(e){ bad++; }
      }
    }
    if (!bad){ ['events','members','transactions','donors','vendors'].forEach(c => saveDemo(c, [], oldKey(c))); }
    toast(bad ? L2('পাঠানো হয়েছে ', 'Sent ') + bn(ok) + L2(' টি, যায়নি ', ' entries, failed ') + bn(bad) + L2(' টি (নিয়ম আটকাচ্ছে)', ' (rules are blocking)') : L2('সবগুলোই পাঠানো হয়েছে — ', 'All ') + bn(ok) + L2(' টি এন্ট্রি এখন Firebase-এ', ' entries are now in Firebase'), bad ? 'warn' : 'ok');
    WRITE_BLOCKED = false;
  } catch(e){ toast(L2('পাঠানো যায়নি: ', 'Could not send: ') + fbErrMsg(e), 'err'); }
  await reload(); render();
}

    listDocs('members', orgId, eids),

  ]);

  state.currentRole = getMyRole(orgId);
  state._roleUid = state.user ? state.user.uid : '';

  try{ checkReminders(); }catch(_){}

async function fbInviteMember(orgId, email, role, name){

  if(!email) throw new Error(L2('ইমেইল দিন','Enter email'));
  if(!APP_ROLES.some(r=>r.id===role)) throw new Error('Invalid role');
  const payload = { orgId, email, role, name:name||'', addedAt:Date.now(), addedBy: state.user ? state.user.uid : '', uid:'' };
  // check if user exists to get uid
  if(!dataLocal()){
    await loadFirebase();
    // try to find user by email via users collection? We can't query all, but try where email==?
    try {
      const q = await fbGet(fb.db.collection('users').where('email','==',email).limit(1), 'user খোঁজা');
      const docs = fbDocs(q);
      if(docs.length) payload.uid = docs[0].id || docs[0].uid || '';
    } catch(e){ /* ignore, rules may block */ }
    const ref = await fbTimeout(fb.db.collection('orgMembers').add(payload), 20000, 'সদস্য আমন্ত্রণ');
    // also add orgId to user's orgIds if we have uid
    if(payload.uid){
      try {
        const uRef = fb.db.collection('users').doc(payload.uid);
        const snap = await fbGet(uRef, 'প্রোফাইল পড়া');
        const data = snap && snap.data ? (snap.data()||{}) : {};
        const orgIds = data.orgIds||[];

          await fbTimeout(uRef.set({ orgIds:[...orgIds, orgId] }, {merge:true}), 15000, 'প্রোফাইল সংরক্ষণ');
        }
      } catch(e){}
    }
    return { id:ref.id, ...payload };
  } else {
    // demo local
    const key = 'ps_orgMembers_'+orgId;
    let arr=[];
    try { arr = JSON.parse(store.get(key)||'[]'); } catch(e){}
    // prevent duplicate
    if(arr.some(x=> (x.email||'').toLowerCase()===email)) throw new Error(L2('এই ইমেইল আগেই যোগ করা আছে','This email already added'));

    } catch(e){}
    return item;
  }
}

/* ═══════════════ ৪.৪/৪.৬ — টোস্ট সিস্টেম (পুরো অ্যাপে) ═══════════════
   চার ধরনের টোস্ট: ok (সবুজ ✓) · err (লাল !) · warn (সোনালি) · info (নীল i)
   • একাধিক টোস্ট সাজিয়ে দেখায় (stack), উপরে-ডানে (মোবাইলে উপরে-মাঝে)
   • নিজে থেকে মিলিয়ে যায় (হোভার করলে থেমে থাকে), ✕ চেপে সরানো যায়
   • ৪.৬: কাজের বাটন (যেমন "ফিরিয়ে আনুন") + কাউন্টডাউন + সময়ের রেখা
*/
const TOAST_MAX = 4;
function ensureToastHost(){
  let h = document.getElementById('toastHost');
  if (!h){
    h = document.createElement('div');
    h.id = 'toastHost';
    h.className = 'toasts no-print';
    h.setAttribute('role', 'status');
    h.setAttribute('aria-live', 'polite');
    h.setAttribute('aria-atomic', 'false');
    document.body.appendChild(h);
  }
  return h;
}
function toastKind(t){
  if (/^(❌|⚠️|🚫|⛔)/.test(t) || /আটকে|ব্যর্থ|হয়নি|যায়নি|ভুল|সমস্যা|error|failed|cannot|blocked|incorrect/i.test(t)) return 'err';
  if (/^(⚠️|⚠)/.test(t) || /সতর্ক|rules|নিয়ম|না হলে|তবে |সংযুক্ত নেই|not connected/i.test(t)) return 'warn';
  if (/^(✅|✔|✓)/.test(t)) return 'ok';
  return 'ok';
}
function toastClean(t){
  return String(t == null ? '' : t).replace(/^(✅|❌|⚠️|⚠|🚫|⛔|ℹ️|💾|📄|☁️|🔎|🔐|📥|🧾|🔄)\s*/g, '').trim();
}
function toast(msg, kind, opt){
  opt = opt || {};
  try {
    /* পুরনো এক-আর্গুমেন্ট কল: বার্তা দেখে ধরন ঠিক করি (তবে সেভ-আটকানো বার্তা err-ই থাকে) */
    if (kind !== 'ok' && kind !== 'err' && kind !== 'warn' && kind !== 'info') kind = toastKind(msg);
    if (/rules আটক|security rules blocked/i.test(String(msg))) kind = 'err';
    const txt = toastClean(msg);
    if (!txt) return;
    const host = ensureToastHost();
    while (host.children.length >= TOAST_MAX) host.removeChild(host.firstElementChild);
    const ic = kind === 'err' ? 'alert' : kind === 'warn' ? 'alert' : kind === 'info' ? 'info' : 'check';
    const el = document.createElement('div');
    el.className = 'toast t-' + kind;
    const act = opt.action || null;
    el.innerHTML = '<span class="toast-ic">' + icon(ic, 'ic-sm') + '</span>'
      + '<span class="toast-tx">' + esc(txt) + '</span>'
      + (act ? '<button type="button" class="toast-act" id="toastActBtn">' + esc(act.label || '') + (act.secs ? ' <b class="toast-secs">' + bn(act.secs) + '</b>' : '') + '</button>' : '')
      + '<button type="button" class="toast-x" aria-label="' + L2('বার্তা সরান', 'Dismiss message') + '">' + icon('x', 'ic-sm') + '</button>'
      + (act ? '<span class="toast-bar"></span>' : '');
    if (opt.detail) el.title = String(opt.detail);
    const ms = opt.duration || Math.max(2600, Math.min(10000, 3400 + txt.length * 45));
    let killed = false, tick = null;
    const kill = () => {
      if (killed) return; killed = true;
      clearTimeout(el._t); clearInterval(tick);
      el.classList.add('out');
      setTimeout(() => { try { el.remove(); } catch(e){} }, 240);
    };
    el.querySelector('.toast-x').onclick = kill;
    el.addEventListener('mouseenter', () => clearTimeout(el._t));
    el.addEventListener('mouseleave', () => { if (!killed) el._t = setTimeout(kill, 1800); });
    host.appendChild(el);
    if (act){
      const bar = el.querySelector('.toast-bar');
      if (bar){ bar.style.animationDuration = ms + 'ms'; }
      let left = Math.round(ms / 1000);
      const secEl = el.querySelector('.toast-secs');
      if (secEl){
        tick = setInterval(() => {
          left -= 1;
          if (left <= 0){ clearInterval(tick); return; }
          secEl.textContent = bn(left);
        }, 1000);
      }
      const btn = el.querySelector('.toast-act');
      if (btn) btn.onclick = async () => {
        kill();
        try { await act.fn(); } catch(e){ toast(L2('ফিরিয়ে আনা যায়নি: ', 'Could not undo: ') + (e.message || e), 'err'); }
      };
    }
    el._t = setTimeout(kill, ms);
  } catch(e){
    /* কোনো কারণে টোস্ট না দেখাতে পারলে অ্যাপ আটকাবে না — কনসোলে জানাই */
    try { console.log('[toast]', msg); } catch(_){}
  }
}

function getMyRole(orgId){
  const oid = orgId || state.currentOrgId || '';
  if(!oid || !state.user) return '';
  // Cache only if same org AND same user - prevent member getting secretary cache
  if(state.currentRole && state.currentOrgId===oid && state._roleUid===state.user.uid) return state.currentRole;
  // secretary/owner check - org owner is always secretary
  const org = state.orgs.find(o=>o.id===oid);
  if(org && org.ownerId && org.ownerId===state.user.uid) return 'secretary';
  // check orgMembers state
  const email = (state.user.email||'').toLowerCase();
  const mem = (state.orgMembers||[]).find(m=> (m.orgId===oid) && ( (m.uid && m.uid===state.user.uid) || (m.email && m.email.toLowerCase()===email) ) );
  if(mem && mem.role){
    // normalize old roles
    if(mem.role==='owner' || mem.role==='editor') return 'secretary';
    if(mem.role==='viewer') return 'member';
    return mem.role;
  }
  // fallback: if user orgIds contains, member
  if(state.user.orgIds && state.user.orgIds.includes(oid)) return 'member';
  return '';
}

function icon(name, cls){
  return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}
/* ৪.৬: ছোট বার্তা-স্ট্রিপের "বিস্তারিত" খোলা/বন্ধ (একবারই বাঁধা হয়, প্রতিটি render-এ কাজ করে) */
document.addEventListener('click', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('.nb-toggle') : null;
  if (!t) return;
  const key = t.getAttribute('data-nbkey') || '';
  const box = t.closest('.noticebar');
  if (!box) return;
  window.__psNoticeOpen = window.__psNoticeOpen || {};
  const on = !window.__psNoticeOpen[key];
  window.__psNoticeOpen[key] = on;
  box.classList.toggle('open', on);
  t.setAttribute('aria-expanded', String(on));
});

/* ═══════════════ থিম: সিস্টেম / হালকা / গাঢ় (৪.১) ═══════════════ */
const THEME_KEY = 'ps_theme';
function sysDark(){ try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch(e){ return false; } }
function themeMode(){ try { const v = store.get(THEME_KEY); return (v === 'light' || v === 'dark' || v === 'amoled') ? v : 'system'; } catch(e){ return 'system'; } }
function applyTheme(mode){
  const m = (mode === 'light' || mode === 'dark' || mode === 'amoled') ? mode : themeMode();   /* না দিলে সংরক্ষিত পছন্দ */
  const dark = (m === 'dark') || (m === 'amoled') || (m === 'system' && sysDark());
  try {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-mode', m);
  } catch(e){}
}
function setTheme(mode){
  try { store.set(THEME_KEY, mode); } catch(e){}
  applyTheme(mode);
  try { applyAccent(accentId()); } catch(e){}   /* স্ট্যাটাস-বারের রঙও রিফ্রেশ (AMOLED-এ কালো) */
  render();
  toast(mode === 'amoled' ? L2('AMOLED পিচ-ডার্ক চালু ✓', 'AMOLED pitch-dark on ✓') : L2('থিম বদলানো হলো', 'Theme updated'));
}
function themeLabel(m){
  return m === 'light' ? L2('হালকা', 'Light') : m === 'dark' ? L2('গাঢ়', 'Dark') : m === 'amoled' ? 'AMOLED' : L2('সিস্টেম', 'System');
}
function themeBtns(){
  const m = themeMode();
  return '<button type="button" data-act="theme" data-id="system" class="' + (m === 'system' ? 'on' : '') + '">' + icon('monitor', 'ic-sm') + L2('সিস্টেম', 'System') + '</button>'
       + '<button type="button" data-act="theme" data-id="light" class="' + (m === 'light' ? 'on' : '') + '">' + icon('sun', 'ic-sm') + L2('হালকা', 'Light') + '</button>'
       + '<button type="button" data-act="theme" data-id="dark" class="' + (m === 'dark' ? 'on' : '') + '">' + icon('moon', 'ic-sm') + L2('গাঢ়', 'Dark') + '</button>';
}
function themeHint(){
  const m = themeMode();
  if (m === 'system') return L2('আপনার ফোন/কম্পিউটারের সেটিং অনুযায়ী নিজেই বদলাবে (এখন: ', 'Follows your device setting (now: ') + (sysDark() ? L2('গাঢ়', 'dark') : L2('হালকা', 'light')) + ')';
  if (m === 'amoled') return L2('সবসময় AMOLED — সম্পূর্ণ কালো (পিচ ডার্ক), OLED স্ক্রিনে ব্যাটারি বাঁচে', 'Always AMOLED — true black, saves battery on OLED screens');
  return m === 'dark' ? L2('সবসময় গাঢ় (ডার্ক) থিম', 'Always dark') : L2('সবসময় হালকা থিম', 'Always light');
}
try {
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener)
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themeMode() === 'system') applyTheme('system'); });
} catch(e){}
applyTheme();

function accentId(){ try { const v = store.get(ACCENT_KEY); return ACCENTS.some(a => a.id === v) ? v : 'amber'; } catch(e){ return 'amber'; } }
function accentObj(id){ return ACCENTS.find(x => x.id === (id || accentId())) || ACCENTS[0]; }
function applyAccent(id){
  const a = accentObj(id);
  try { document.documentElement.setAttribute('data-accent', a.id); } catch(e){}
  try {
    const mc = document.documentElement.getAttribute('data-theme-mode') === 'amoled' ? '#000000' : a.tc;
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', mc));
  } catch(e){}
}
function ensureAccentCss(){
  if (document.getElementById('accentBootCss') || document.getElementById('accentVarsCss')) return;
  try {
    const st = document.createElement('style'); st.id = 'accentVarsCss';
    st.textContent = ACCENTS.map(a => {
      const D = Object.assign({}, a.l, a.d || {});
      return ':root[data-accent="' + a.id + '"]{' + Object.keys(a.l).map(k => '--brand-' + k + ':' + a.l[k]).join(';')
        + ';--brand:var(--brand-600);--brand-2:var(--brand-500);--brand-3:var(--brand-700);--brand-soft:' + a.l.soft + ';}'
        + ':root[data-accent="' + a.id + '"][data-theme="dark"]{' + Object.keys(D).map(k => '--brand-' + k + ':' + D[k]).join(';')
        + ';--brand:var(--brand-600);--brand-2:var(--brand-500);--brand-3:var(--brand-700);--brand-soft:' + D.soft + ';}';
    }).join('\n');
    document.head.appendChild(st);
  } catch(e){}
}
function setAccent(id){
  if (id === 'amoled'){ setTheme(themeMode() === 'amoled' ? 'dark' : 'amoled'); return; }
  try { store.set(ACCENT_KEY, id); } catch(e){}
  applyAccent(id);
  render();
  toast(L2('কালার থিম বদলানো হলো ✓', 'Color theme updated ✓'), 'ok');
}
function accentHint(){
  const a = accentObj();
  if (themeMode() === 'amoled') return L2('এখন চলছে: অ্যামোলেড (পিচ ডার্ক) • হাইলাইট রঙ: ', 'Current: AMOLED (pitch dark) • highlight: ') + L2(a.bn, a.en);

}

function pageHead(title, actHtml, sub, eyebrow){
  return '<div class="phead no-print">'
    + '<div><div class="eyebrow">' + esc(eyebrow || (orgNow() ? orgNow().name : L2('পূজা সারথি', 'Puja Sarathi'))) + '</div>'
    + '<h1 class="card-h">' + esc(title) + '</h1>'
    + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>'
    + (actHtml ? '<div class="acts">' + actHtml + '</div>' : '') + '</div>';
}
function kpiCard(label, value, ic, tone, cap, act, route){
  const clickable = act || route ? ' style="cursor:pointer; transition:transform .16s, box-shadow .16s" data-'+(act ? 'act="'+act+'"' : 'route="'+route+'"')+' title="'+esc(label)+'"' : '';
  return '<div class="card hoverable kpi-card' + (tone ? ' tone-' + tone : '') + '"' + clickable + '><div class="kpi"><div class="ic-badge' + (tone ? ' icb-' + tone : '') + '">' + icon(ic, 'ic-lg') + '</div>'
    + '<div style="min-width:0"><div class="lbl">' + esc(label) + '</div>'
    + '<div class="v' + (tone === 'ok' ? ' v-ok' : tone === 'bad' ? ' v-bad' : '') + '">' + value + '</div>'
    + (cap ? '<div class="cap">' + cap + '</div>' : '') + '</div>'
    + (act || route ? '<div style="margin-left:auto; color:var(--faint); display:grid; place-items:center">'+icon('chev','ic-sm')+'</div>' : '')
    + '</div></div>';
}
function statusPill(v){
  const cls = v === 'সম্পন্ন' ? '' : (v === 'পরিকল্পনাধীন' ? 'p-grey' : 'p-info');
  return '<span class="pill ' + cls + '"><span class="dot"></span>' + esc(dv(v)) + '</span>';
}
function typePill(v){
  return '<span class="pill ' + (v === 'ব্যয়' ? 'p-exp' : '') + '">' + esc(dv(v)) + '</span>';
}
function emptyBox(text, ic, hint){
  return '<div class="empty">' + icon(ic || 'info', 'ic-xl') + '<div class="t">' + esc(text) + '</div>'
    + (hint ? '<div class="h">' + esc(hint) + '</div>' : '') + '</div>';
}
function modeLabel(){
  return !useFb() ? L2('এই ডিভাইসে সেভ', 'Saved on this device')
    : (LOCAL_STORE ? L2('এই ডিভাইসে সেভ', 'Saved on this device') : 'Cloud');
}
function initials(txt){
  const s = String(txt || '').trim();
  if (!s) return '?';
  const parts = s.split(/\s+/).slice(0, 2);
  return parts.map(p => p.charAt(0)).join('').toUpperCase();
}
function avTone(seed){
  const s = String(seed || '');
  let n = 0; for (let i = 0; i < s.length; i++) n += s.charCodeAt(i);
  return ['', 'g', 't', 'p'][n % 4];
}

function bindDrawer(){
  const d = document.getElementById('drawer'), s = document.getElementById('scrim'), b = document.getElementById('menuBtn');
  if (!d || !s || !b) return;
  const set = (open) => {
    d.classList.toggle('open', open);
    s.classList.toggle('open', open);
    s.hidden = !open;
    try { open ? d.removeAttribute('inert') : d.setAttribute('inert', ''); } catch(e){}
    d.setAttribute('aria-hidden', open ? 'false' : 'true');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.classList.toggle('on', open);
    if (open) document.body.classList.add('menu-open'); else document.body.classList.remove('menu-open');
  };
  b.onclick = () => set(!d.classList.contains('open'));
  const cl = document.getElementById('drawerClose'); if (cl) cl.onclick = () => set(false);
  s.onclick = () => set(false);
  if (!window.__psEsc){
    window.__psEsc = true;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Esc'){
        const dd = document.getElementById('drawer');
        if (dd && dd.classList.contains('open')){ const bb = document.getElementById('menuBtn'); if (bb) bb.click(); }
      }
    });
  }
  d.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-qact], [data-act]');
    if (a){ e.preventDefault(); set(false); await runAct(a.dataset.qact || a.dataset.act, a.dataset.id); return; }
    if (e.target.closest('[data-route]')) set(false);
  });
  const lo = document.getElementById('drawerLogout');
  if (lo) lo.onclick = async () => { set(false); await logout(); render(); };
  set(false);
}
function renderRoute(){
  switch (state.route){
    case '/events': return viewEvents();
    case '/transactions': return viewTransactions();
    case '/donors': return viewDashboard(); // donation section deleted
    case '/members': return viewMembers();
    case '/app-members': return viewAppMembers();
    case '/reminders': return viewReminders();
    case '/about': return viewAbout();
    case '/reports': return viewReports();
    case '/vendors': return viewVendors();
    case '/settings': return viewSettings();
    default: return viewDashboard();
  }
}

/* ═══ সদস্যের জমা-অবস্থা: কে কত টাকা দিয়েছেন / কে এখনো দেননি ═══ */
function mDue(m){ return Number((m||{}).contribution||0); }
function mPaid(m){ return Number((m||{}).paid||0); }
function mBal(m){ return mDue(m) - mPaid(m); }
function mStatus(m){
  const due = mDue(m), paid = mPaid(m);
  if(due > 0 && paid >= due) return 'paid';   /* পুরো চাঁদা দিয়েছেন */
  if(paid > 0) return 'partial';              /* কিছু দিয়েছেন, বাকি আছে */
  return 'unpaid';                            /* এখনো এক টাকাও দেননি */
}
const M_STATUS = {
  paid:    { bn:'পুরো দিয়েছেন',  en:'Fully paid',     pill:'background:#dcfce7; border-color:#86efac; color:#166534', cls:'pdf-ok' },
  partial: { bn:'আংশিক দিয়েছেন', en:'Partially paid', pill:'background:var(--brand-100); border-color:var(--brand-300); color:var(--brand-800)', cls:'pdf-mut' },
  unpaid:  { bn:'এখনো দেননি',     en:'Not paid yet',   pill:'background:#fee2e2; border-color:#fca5a5; color:#991b1b', cls:'pdf-bad' }
};
function mStatusLabel(s){ const x = M_STATUS[s] || M_STATUS.unpaid; return L2(x.bn, x.en); }
function mStatusPill(s){
  const x = M_STATUS[s] || M_STATUS.unpaid;
  return '<span class="pill" style="' + x.pill + '">' + mStatusLabel(s) + '</span>';
}
function memberStats(list){
  const s = { total:0, due:0, paid:0, bal:0, paidN:0, partialN:0, unpaidN:0, doneN:0, notDoneN:0, paidList:[], partialList:[], unpaidList:[] };
  (list || []).forEach(m => {
    const st = mStatus(m);
    s.total += 1; s.due += mDue(m); s.paid += mPaid(m);
    if(st === 'paid'){ s.paidN += 1; s.paidList.push(m); }
    else if(st === 'partial'){ s.partialN += 1; s.partialList.push(m); }
    else { s.unpaidN += 1; s.unpaidList.push(m); }
  });
  s.bal = s.due - s.paid;
  s.doneN = s.paidN + s.partialN;   /* যারা অন্তত কিছু টাকা দিয়েছেন */
  s.notDoneN = s.unpaidN;           /* যারা এখনো এক টাকাও দেননি */
  return s;
}
const M_FILTERS = ['all','paid','partial','unpaid'];
function memberFilterOf(s){ const f = (s && s.memberFilter) || 'all'; return M_FILTERS.indexOf(f) >= 0 ? f : 'all'; }
function memberFilterLabel(f){
  return f === 'paid' ? L2('শুধু যারা পুরো দিয়েছেন','Only fully paid')
       : f === 'partial' ? L2('শুধু আংশিক দিয়েছেন','Only partially paid')
       : f === 'unpaid' ? L2('শুধু যারা এখনো দেননি','Only not paid yet')
       : L2('সব সদস্য','All members');
}
function filterMembers(list, f){
  if(f === 'all') return (list || []).slice();
  return (list || []).filter(m => mStatus(m) === f);
}
function sortMembers(list, mode){
  const arr = (list || []).slice();
  const byName = (a,b) => String(a.name||'').localeCompare(String(b.name||''), 'bn');
  if(mode === 'balance') return arr.sort((a,b) => (mBal(b) - mBal(a)) || byName(a,b));
  if(mode === 'paid')    return arr.sort((a,b) => (mPaid(b) - mPaid(a)) || byName(a,b));
  if(mode === 'due')     return arr.sort((a,b) => (mDue(b) - mDue(a)) || byName(a,b));
  return arr.sort(byName);
}
function sortOptionsHtml(mode){
  const opts = [
    ['balance', L2('বাকি বেশি আগে','Highest balance first')],
    ['name',    L2('নাম অনুসারে','By name')],
    ['paid',    L2('জমা বেশি আগে','Highest paid first')],
    ['due',     L2('ধার্য বেশি আগে','Highest due first')]
  ];
  return opts.map(o => '<option value="' + o[0] + '" ' + (mode === o[0] ? 'selected' : '') + '>' + o[1] + '</option>').join('');
}
function memberFilterChips(st){
  return [
    ['all',     L2('সব','All'),                   st.total],
    ['paid',    L2('পুরো দিয়েছেন','Fully paid'),   st.paidN],
    ['partial', L2('আংশিক','Partial'),             st.partialN],
    ['unpaid',  L2('এখনো দেননি','Not paid yet'),   st.notDoneN]
  ];
}
/* ফিল্টারের বাটন-সারি: ক্লিক করলে শুধু সেই দলটাই দেখাবে (নিচের সংখ্যাগুলো কতজন) */
function memberChipsHtml(activeId, st, extra, idName){
  const idAttr = (idName === null) ? '' : (' id="' + (idName || 'memberFilterSeg') + '"');
  return '<div class="seg no-print ' + (extra || '') + '"' + idAttr + ' style="flex-wrap:wrap; margin:0 0 2px">'

/* সদস্যের একটা কার্ড (কে কত দিয়েছেন, বাকি কত, WhatsApp/কল) */
function memberCardHtml(m, canW){
  const contrib = mDue(m), paid = mPaid(m), bal = mBal(m), st = mStatus(m);
  const hasPhone = !!(m.phone && String(m.phone).trim());
  const rawPhone = hasPhone ? String(m.phone).replace(/\D/g,'') : '';
  let waNum = rawPhone;
  if(waNum.length === 10) waNum = '91' + waNum;
  if(waNum.startsWith('0')) waNum = waNum.replace(/^0+/, '');
  const orgName = orgNow() ? orgNow().name : '';
  const msgBn = 'নমস্কার ' + m.name + ', ' + (orgName ? orgName + ' - ' : '') + 'আপনার পূজার চাঁদা ' + money(contrib) + ' , জমা দিয়েছেন ' + money(paid) + ', বাকি ' + money(bal) + '। দয়া করে জমা দিন। - পূজা সারথি';
  const msgEn = 'Hello ' + m.name + ', ' + (orgName ? orgName + ' - ' : '') + 'Your puja contribution is ' + money(contrib) + ', paid ' + money(paid) + ', remaining ' + money(bal) + '. Please pay. - Puja Sarathi';
  const msg = L2(msgBn, msgEn);
  const waLink = hasPhone && waNum ? 'https://wa.me/' + waNum + '?text=' + encodeURIComponent(msg) : '';
  const telLink = hasPhone ? 'tel:' + String(m.phone).trim() : '';
  const unpaid = bal > 0;
  let waCallTop = '';
  if(hasPhone){
    waCallTop = '<div style="display:flex; gap:6px; flex-shrink:0">'
      + '<a href="' + telLink + '" class="iconbtn" style="width:34px; height:34px; background:#0f172a; color:white; border-radius:9px; display:grid; place-items:center" title="' + L2('কল করুন','Call') + '">' + icon('phone','ic-sm') + '</a>'
      + '<a href="' + waLink + '" target="_blank" rel="noopener" class="iconbtn" style="width:34px; height:34px; background:#25D366; color:white; border-radius:9px; display:grid; place-items:center" title="' + L2('WhatsApp এ জানান','Notify on WhatsApp') + '">' + icon('whatsapp','ic-sm') + '</a>'
      + '</div>';

  }
  let remainingBox = '';
  if(unpaid && hasPhone){
    remainingBox = '<div style="margin-top:4px; padding:8px 10px; background:linear-gradient(135deg, #fef2f2, #fee2e2); border:1px solid #fca5a5; border-radius:8px; font-size:11px; color:#991b1b; display:flex; align-items:center; gap:6px">' + icon('alert','ic-sm') + L2('বাকি আছে: ','Remaining: ') + money(bal) + '</div>';
  }
  return `
      <div class="card pad-s hoverable" data-member-card data-mstatus="${st}">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="avatar ${avTone(m.name)}">${esc((m.name || '?').charAt(0))}</div>
          <div style="min-width:0; flex:1">
            <div class="strong">${esc(m.name)}</div>
            <div class="muted" style="font-size:12px">${esc(m.role||'')} ${m.note ? '· '+esc(m.note) : ''}</div>
            <div style="margin-top:6px">${mStatusPill(st)}</div>
          </div>
          ${waCallTop}
        </div>
        <hr class="sep" style="margin:12px 0">
        <div style="display:grid; gap:6px">
          <div class="muted" style="display:flex;gap:7px;align-items:center; flex-wrap:wrap">${icon('phone', 'ic-sm')} ${esc(m.phone || '—')}</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap">

            <span class="pill ${paid >= contrib && contrib>0 ? '' : 'p-exp'}">${L2('জমা:','Paid:')} ${money(paid)}</span>
            ${balancePill}
          </div>
          ${remainingBox}

/* ═══════════════ PDF এক্সপোর্ট — সদস্য চাঁদার রিপোর্ট ═══════════════ */
function mWord(n){ return (Number(n) === 1) ? 'member' : 'members'; }
function pdfStamp(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  return fmtDate(today()) + ' • ' + hh + ':' + mm;
}
/* প্রিন্ট-ডায়ালগ খুলে যেভাবে PDF সেভ করা যায় — শিটটা কিছুক্ষণ DOM-এ থাকে, তারপর মুছে যায় */
function printSheet(innerHtml, fileTitle){
  try{
    const old = document.getElementById('pdfSheet');
    if(old) old.remove();
    const sheet = document.createElement('div');
    sheet.id = 'pdfSheet';
    sheet.className = 'print-area pdf-sheet';
    sheet.setAttribute('style','display:none');
    sheet.innerHTML = innerHtml;
    (document.getElementById('content') || document.body).appendChild(sheet);
    const oldTitle = document.title;
    if(fileTitle) document.title = fileTitle;
    let finished = false;
    const finish = () => {
      if(finished) return; finished = true;
      try{ document.title = oldTitle; }catch(_){}
      const s = document.getElementById('pdfSheet'); if(s) s.remove();
      window.removeEventListener('afterprint', finish);
    };
    window.addEventListener('afterprint', finish);
    setTimeout(() => {
      try{ window.print(); }
      catch(e){
        finish();
        toast(L2('এই ব্রাউজারে প্রিন্ট খোলা গেল না','Could not open the print dialog'), 'err');
        return;
      }
      setTimeout(finish, 4000);
      let inFrame = false;
      try{ inFrame = window.self !== window.top; }catch(e){ inFrame = true; }
      if(inFrame) toast(L2('প্রিভিউ-ফ্রেমে প্রিন্ট ব্লক থাকতে পারে — কাজ না হলে অ্যাপটা সরাসরি ব্রাউজারে/Tab-এ খুলুন','Printing may be blocked inside a preview frame — if nothing happens, open the app in a real browser tab'), 'warn', { duration: 8000 });
    }, 120);
  }catch(e){
    toast(L2('PDF তৈরি করা যায়নি','Could not create the PDF'), 'err');
  }
}

/* বাটন থেকে ডাকা হয়: এখন যেই ফিল্টার দেখা যাচ্ছে, ঠিক সেটাই PDF-এ যাবে */
/* ═══════════════════════════════════════════════════════════════════
   EXCEL ইমপোর্ট / টেমপ্লেট — বাইরের লাইব্রেরি ছাড়াই (অফলাইনেও চলে)
   ═══════════════════════════════════════════════════════════════════ */

/* ── ছোট ZIP লেখক (store method) — আসল .xlsx বানাতে ── */
let _crcT = null;
function _crcTable(){
  if (_crcT) return _crcT;
  _crcT = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    _crcT[n] = c >>> 0;
  }
  return _crcT;
}
function crc32Bytes(u8){
  const t = _crcTable(); let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = t[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const nameB = enc.encode(f.name);
    const data = (typeof f.data === 'string') ? enc.encode(f.data) : f.data;
    const crc = crc32Bytes(data);
    const lh = new Uint8Array(30 + nameB.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0x2100, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameB.length, true); lv.setUint16(28, 0, true);
    lh.set(nameB, 30);
    chunks.push(lh, data);

    const ch = new Uint8Array(46 + nameB.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2100, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameB.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameB, 46);
    central.push(ch);
    offset += lh.length + data.length;
  });
  const cdSize = central.reduce((n, c) => n + c.length, 0);
  const eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
  return new Blob([...chunks, ...central, eocd], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ── ZIP পড়া (ইমপোর্টের জন্য) ── */
function unzipEntries(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  const min = Math.max(0, u8.length - 66000);
  for (let i = u8.length - 22; i >= min; i--){ if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if (eocd < 0) throw new Error('ZIP/XLSX ঠিক নেই');
  const total = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let n = 0; n < total && p + 46 <= u8.length; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), cmtLen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
    const lNameLen = dv.getUint16(lho + 26, true), lExtraLen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lNameLen + lExtraLen;
    out[name] = { method, raw: u8.subarray(start, start + compSize) };
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}
async function unzipText(entries, name){
  const f = entries[name];
  if (!f) return null;
  if (f.method === 0) return new TextDecoder().decode(f.raw);
  if (f.method === 8){
    if (typeof DecompressionStream !== 'function'){
      throw new Error(L2('এই ব্রাউজারে চাপা (compressed) Excel ফাইল পড়া যাচ্ছে না — Excel-এ “CSV UTF-8” করে সেভ করে সেটি ইমপোর্ট করুন',
                         'This browser cannot read compressed Excel files — in Excel choose “Save as CSV UTF-8” and import that file'));
    }
    const stream = new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(stream).arrayBuffer());
  }
  throw new Error('ZIP method ' + f.method + ' সমর্থিত নয়');
}

/* ── XML/শিট পড়া ── */
function xmlUnesc(x){
  return String(x == null ? '' : x)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&#x([0-9a-fA-F]+);/g, (m, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (m, d) => String.fromCodePoint(parseInt(d, 10)))
    .replace(/&amp;/g, '&');
}
function parseSharedStrings(xml){
  const out = [];
  if (!xml) return out;
  const re = /<si[ >][\s\S]*?<\/si>/g;
  const items = xml.match(re) || [];
  items.forEach(si => {
    const texts = [...si.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(m => m[1]);
    out.push(xmlUnesc(texts.join('')));
  });
  return out;
}
function colIdxFromRef(ref){
  const m = /^([A-Z]+)/.exec(String(ref || '').toUpperCase());
  if (!m) return -1;
  let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function parseSheetXml(xml, shared){
  const rows = [];
  const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while ((rm = rowRe.exec(xml))){
    const cells = [];
    const cellRe = /<c\b([^>]*)\/>|<c\b([^>]*)>([\s\S]*?)<\/c>/g;
    let cm;
    while ((cm = cellRe.exec(rm[1]))){
      const attrs = cm[1] || cm[2] || '';
      const inner = cm[3] || '';
      const refM = /\br="([A-Za-z]+\d+)"/.exec(attrs);
      const tM = /\bt="([^"]+)"/.exec(attrs);
      const type = tM ? tM[1] : '';
      let val = '';
      if (type === 'inlineStr'){
        const parts = [...inner.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(m => m[1]);
        val = xmlUnesc(parts.join(''));
      } else {
        const vM = /<v[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        const rawV = vM ? vM[1] : '';
        if (type === 's'){ const i = parseInt(rawV, 10); val = (shared && shared[i] != null) ? shared[i] : ''; }
        else if (type === 'b'){ val = rawV === '1' ? 'TRUE' : 'FALSE'; }
        else val = xmlUnesc(rawV);
      }
      const ci = colIdxFromRef(refM ? refM[1] : ('A' + (cells.length + 1)));
      if (ci >= 0) cells[ci] = val;
    }
    rows.push(cells.map(v => (v == null ? '' : v)));
  }
  /* ফাঁকা শেষ সারি/কলাম বাদ */
  while (rows.length && rows[rows.length - 1].every(v => !String(v).trim())) rows.pop();
  return rows;
}
async function xlsxRows(buf){
  const entries = unzipEntries(buf);
  const shared = parseSharedStrings(await unzipText(entries, 'xl/sharedStrings.xml'));
  const names = Object.keys(entries).filter(n => /^xl\/worksheets\/sheet\d*\.xml$/i.test(n)).sort();
  names.sort((a, b) => {
    const na = parseInt((a.match(/(\d+)\.xml$/) || [0, '99'])[1], 10);
    const nb = parseInt((b.match(/(\d+)\.xml$/) || [0, '99'])[1], 10);
    return na - nb;
  });
  if (!names.length) throw new Error(L2('Excel ফাইলে কোনো শিট পাওয়া যায়নি','No sheet found in the Excel file'));
  const sheet = await unzipText(entries, names[0]);
  if (sheet == null) throw new Error(L2('শিট পড়া যায়নি','Could not read the sheet'));
  return parseSheetXml(sheet, shared);
}

/* ── CSV পড়া ── */
function csvRows(text){
  let t = String(text || '').replace(/^\uFEFF/, '');
  const firstLine = (t.split(/\r?\n/)[0] || '');
  const counts = { ',': (firstLine.match(/,/g) || []).length, ';': (firstLine.match(/;/g) || []).length, '\t': (firstLine.match(/\t/g) || []).length };
  const d = Object.keys(counts).reduce((a, b) => counts[b] > counts[a] ? b : a, ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"'){ if (t[i + 1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === d){ row.push(cell); cell = ''; }
      else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c === '\r'){ /* skip */ }
      else cell += c;
    }
  }
  row.push(cell); rows.push(row);
  while (rows.length && rows[rows.length - 1].every(v => !String(v).trim())) rows.pop();
  return rows;
}

/* ── হেডার চেনা + সংখ্যা পড়া ── */
function bnDigitsToEn(s){
  return String(s == null ? '' : s).replace(/[০-৯]/g, ch => String(ch.charCodeAt(0) - 0x09E6));
}
function toAmount(v){
  let x = bnDigitsToEn(v).trim();
  if (!x) return 0;
  x = x.replace(/[₹৳,]/g, '').replace(/[^0-9.\-]/g, '');
  const n = Number(x);
  return isFinite(n) ? n : 0;
}
function normKey(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[০-৯]/g, ch => String(ch.charCodeAt(0) - 0x09E6))
    .replace(/[()\[\]{}.\/:|]/g, ' ')
    .replace(/[^a-z0-9\u0980-\u09FF]+/g, ' ')
    .trim();
}
const XL_COLS = {
  name: ['নাম', 'সদস্যের নাম', 'সদস্য নাম', 'name', 'membername', 'member name', 'members'],
  role: ['পদ', 'ভূমিকা', 'role', 'designation', 'position'],
  phone: ['ফোন', 'মোবাইল', 'ফোন নম্বর', 'phone', 'mobile', 'contact', 'whatsapp', 'number'],
  due: ['চাঁদা', 'চার্য', 'ধার্য', 'পূজার চাঁদা', 'মোট চাঁদা', 'due', 'contribution', 'amount', 'total'],
  paid: ['জমা', 'জমা টাকা', 'দিয়েছেন', 'paid', 'deposit', 'received', 'collected'],
  note: ['নোট', 'মন্তব্য', 'note', 'notes', 'remark', 'remarks', 'comments', 'comment']
};
function detectColumns(headerRow){
  const keys = headerRow.map(normKey);
  const map = {};
  Object.keys(XL_COLS).forEach(field => {
    const words = XL_COLS[field].map(w => normKey(w)).filter(Boolean);
    let hit = -1;
    for (let i = 0; i < keys.length && hit < 0; i++){
      const k = keys[i];
      if (!k) continue;
      for (const w of words){ if (k === w || k.indexOf(w) >= 0){ hit = i; break; } }
    }
    if (hit >= 0) map[field] = hit;
  });
  return map;
}
/* হেডার ছাড়া ফাইল হলে ধরে নেওয়া কলাম-ক্রম: নাম, পদ, ফোন, চাঁদা, জমা, নোট */
function rowsToMembers(rows, map, opts){
  const list = [], warns = [], dupes = [];
  const existing = new Set((state.members || []).map(m => String(m.name || '').trim().toLowerCase()));
  const useMap = map && Object.keys(map).length >= 1;
  rows.forEach((r, idx) => {
    const rowNo = idx + 1;
    const cell = (k) => {
      if (useMap && map[k] != null) return r[map[k]];
      const fallback = { name: 0, role: 1, phone: 2, due: 3, paid: 4, note: 5 }[k];
      return r[fallback];
    };
    const name = String(cell('name') == null ? '' : cell('name')).trim();
    if (!name) return;
    if (/^(নাম|name|member)$/i.test(name)) return;           /* হেডার-সারি আবার এলে বাদ */
    const roleRaw = String(cell('role') == null ? '' : cell('role')).trim();
    const phone = String(cell('phone') == null ? '' : cell('phone')).trim().replace(/[^0-9+\-\s]/g, '');
    const due = Math.max(0, toAmount(cell('due')));
    const paid = Math.max(0, toAmount(cell('paid')));
    const note = String(cell('note') == null ? '' : cell('note')).trim();
    if (!due && !paid) warns.push(L2('সারি ' + rowNo + ': চাঁদা/জমা খালি — ০ ধরে নেওয়া হলো', 'Row ' + rowNo + ': due/paid empty — taken as 0'));
    if (paid > due && due > 0) warns.push(L2('সারি ' + rowNo + ': জমা চাঁদার চেয়ে বেশি (' + paid + ' > ' + due + ')', 'Row ' + rowNo + ': paid is more than due (' + paid + ' > ' + due + ')'));
    if (existing.has(name.toLowerCase())) dupes.push(name);
    list.push({ name: name, role: roleRaw || (opts && opts.defaultRole) || 'সদস্য', phone: phone, contribution: due, paid: paid, note: note });
  });
  return { list: list, warns: warns, dupes: dupes };
}

/* ── Excel টেমপ্লেট ডাউনলোড ── */
function xlCell(ref, text, opts){
  const o = opts || {};
  const t = String(text == null ? '' : text);
  const style = o.bold ? ' s="1"' : '';
  if (o.num) return '<c r="' + ref + '"' + style + '><v>' + t + '</v></c>';
  return '<c r="' + ref + '" t="inlineStr"' + style + '><is><t xml:space="preserve">' + t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</t></is></c>';
}
function xlRow(n, cells){
  return '<row r="' + n + '">' + cells.join('') + '</row>';
}

    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'

    + '<sheets><sheet name="Members" sheetId="1" r:id="rId1"/></sheets></workbook>';

function openMembersImport(){
  if (!canWrite()){ toast(L2('আপনার লেখার অনুমতি নেই','You do not have write access'), 'warn'); return; }
  const f = document.getElementById('membersXlFile');
  if (!f){ toast(L2('ফাইল ইনপুট পাওয়া গেল না','File input not found'), 'warn'); return; }
  f.value = '';
  f.click();
}
async function handleMembersFile(file){
  if (!file) return;
  try {
    toast(L2('ফাইল পড়া হচ্ছে…', 'Reading file…'), 'info');
    const isXlsx = /\.xlsx$/i.test(file.name) || /\.xlsm$/i.test(file.name);
    let rows;
    if (isXlsx) rows = await xlsxRows(await file.arrayBuffer());
    else rows = csvRows(await file.text());
    rows = (rows || []).filter(r => r && r.some(v => String(v || '').trim()));
    if (!rows.length) throw new Error(L2('ফাইলে কোনো সারি পাওয়া যায়নি', 'No rows found in the file'));
    const map = detectColumns(rows[0]);
    const hasHeader = Object.keys(map).length >= 2;
    const body = hasHeader ? rows.slice(1) : rows;
    const parsed = rowsToMembers(body, hasHeader ? map : null, {});
    if (!parsed.list.length) throw new Error(L2('কোনো সদস্যের নাম পাওয়া যায়নি — টেমপ্লেটের মতো করে নাম কলামে লিখুন', 'No member names found — put names in the Name column like the template'));
    parsed.fileName = file.name;
    parsed.hasHeader = hasHeader;
    parsed.colMap = map;
    openModal(L2('Excel থেকে সদস্য ইমপোর্ট', 'Import members from Excel'), membersImportHtml(parsed));
    bindMembersImport(parsed);
  } catch(e){
    toast(L2('ফাইল পড়া গেল না: ', 'Could not read the file: ') + (e.message || e), 'err', { duration: 8000 });
  }
}

function bindMembersImport(p){
  const go = document.getElementById('impGo');
  if (!go) return;
  go.onclick = async () => {
    if (go.disabled) return;
    const evSel = document.getElementById('impEvent');
    const txnSel = document.getElementById('impTxn');
    const eventId = (evSel && evSel.value) || state.selectedEventId || '';
    const makeTxn = !(txnSel && txnSel.value === 'no');
    const msg = document.getElementById('impMsg');
    go.disabled = true;
    go.innerHTML = '<span class="spin"></span>' + L2('যোগ হচ্ছে…', 'Importing…');
    let okN = 0, failN = 0;
    for (const m of p.list){
      try {
        const payload = { name: m.name, role: m.role, phone: m.phone, contribution: Number(m.contribution) || 0,
                          paid: Number(m.paid) || 0, note: m.note, eventId: eventId, orgId: state.currentOrgId };
        const cr = await saveGuard(() => addDoc('members', payload));
        const newId = cr && cr.id ? cr.id : '';
        okN++;
        if (makeTxn && Number(m.paid) > 0){
          try {
            await saveGuard(() => addDoc('transactions', {
              eventId: eventId, orgId: state.currentOrgId, type: 'আয়', category: 'চাঁদা',
              amount: Number(m.paid) || 0, date: today(), method: 'নগদ',
              note: m.name + L2(' — সদস্য চাঁদা', ' — member contribution'),
              receiptNo: 'M-' + String(Date.now()).slice(-5), memberId: newId
            }));
          } catch(_){}
        }
      } catch(ex){ failN++; }
      if (msg) msg.textContent = L2('যোগ হচ্ছে ', 'Adding ') + bn(okN) + '/' + bn(p.list.length) + (failN ? L2(' · ব্যর্থ ', ' · failed ') + bn(failN) : '');
    }
    try { await reload(); } catch(_){}
    closeModal();
    render();
    toast(failN
      ? L2('ইমপোর্ট হয়েছে ', 'Imported ') + bn(okN) + L2(' জন · ব্যর্থ ', ' · failed ') + bn(failN)
      : L2('ইমপোর্ট সফল ✓ — ', 'Import complete ✓ — ') + bn(okN) + L2(' জন সদস্য যোগ হয়েছে', ' members added'), failN ? 'warn' : 'ok', { duration: 8000 });
  };
}

function exportMembersPdf(){
  try{
    const all = state.members || [];
    if(!all.length){ toast(L2('কোনো সদস্য নেই — আগে সদস্য যোগ করুন','No members yet — add members first'), 'warn'); return; }
    const f = memberFilterOf(state);
    const list = sortMembers(filterMembers(all, f), state.memberSort);
    if(!list.length){ toast(L2('এই ফিল্টারে কেউ নেই — তাই ফাঁকা PDF হবে','Nobody in this filter — the PDF would be empty'), 'warn'); return; }
    const st = memberStats(all);
    const html = membersSheetHtml(list, { org: orgNow(), e: ev(), filter: f, stats: st });
    const evName = (ev() && ev().name) ? String(ev().name) : L2('সদস্য','members');
    printSheet(html, 'সদস্য-চাঁদা-' + evName.replace(/[^\w\u0980-\u09FF]+/g,'-') + '-' + today());
    toast(L2('প্রিন্ট ডায়ালগ খুলছে — সেখানে “Save as PDF” বেছে নিন','Opening the print dialog — choose “Save as PDF” there'), 'info');
  }catch(e){
    toast(L2('PDF তৈরি করা যায়নি','Could not create the PDF'), 'err');
  }
}

   ═══════════════════════════════════════════════════════════════════ */
const VR_WORKS = ['ডেকোরেটর','পুরোহিত','ঢাকি','আলো/সাউন্ড','রান্নার ঠিকাদার','মণ্ডপ/তাঁবু','গাড়ি/পরিবহন','ফটোগ্রাফি','অন্যান্য'];
const VR_WORK_EN = { 'ডেকোরেটর':'Decorator','পুরোহিত':'Priest','ঢাকি':'Dhak player','আলো/সাউন্ড':'Light / sound','রান্নার ঠিকাদার':'Caterer','মণ্ডপ/তাঁবু':'Pandal / tent','গাড়ি/পরিবহন':'Vehicle','ফটোগ্রাফি':'Photography','অন্যান্য':'Other' };
const VR_CAT = { 'ডেকোরেটর':'মন্ডপ নির্মাণ','পুরোহিত':'পুরোহিত সম্মানী','ঢাকি':'অন্যান্য ব্যয়','আলো/সাউন্ড':'আলোকসজ্জা','রান্নার ঠিকাদার':'খাবার/প্রসাদ','মণ্ডপ/তাঁবু':'মন্ডপ নির্মাণ','গাড়ি/পরিবহন':'পরিবহন','ফটোগ্রাফি':'অন্যান্য ব্যয়','অন্যান্য':'অন্যান্য ব্যয়' };

function vWork(v){ return L2(v.work || 'অন্যান্য', VR_WORK_EN[v.work] || v.work || 'Other'); }
function vPayments(v){ return Array.isArray(v.payments) ? v.payments : []; }
function vPaid(v){ return vPayments(v).reduce((n, p) => n + (Number(p.amount) || 0), 0); }
function vTotal(v){ return Number(v.total) || 0; }
function vRest(v){ return Math.max(0, vTotal(v) - vPaid(v)); }
function vExtra(v){ return Math.max(0, vPaid(v) - vTotal(v)); }
function vStatus(v){
  if (vTotal(v) <= 0) return 'grey';
  if (vPaid(v) <= 0) return 'due';
  if (vRest(v) <= 0) return 'done';
  return 'part';
}
function vStatusPill(v){
  const st = vStatus(v);
  const map = {
    due:  ['p-exp', L2('এখনো কিছু দেওয়া হয়নি', 'Nothing paid yet')],
    part: ['', L2('আংশিক দেওয়া', 'Partly paid')],
    done: ['', L2('সম্পূর্ণ ✓', 'Fully paid ✓')],
    grey: ['p-grey', L2('চুক্তি লেখা হয়নি', 'No contract amount')]
  };
  const m = map[st] || map.grey;
  const extra = (st === 'done' && vExtra(v) > 0) ? ' · ' + L2('বেশি দেওয়া ', 'Extra paid ') + money(vExtra(v)) : '';
  return '<span class="pill ' + m[0] + '"' + (st === 'done' ? ' style="background:#dcfce7; border-color:#86efac; color:#166534"' : '') + '>' + m[1] + esc(extra) + '</span>';
}
/* এই ইভেন্টের ভেন্ডর (scope = event হলে শুধু নির্বাচিত পূজার) */

function bindVPayForm(v){
  const f = document.getElementById('fPay');
  if (!f) return;
  const chk = document.getElementById('vRemChk');
  const wrap = document.getElementById('vRemWrap');
  if (chk && wrap) chk.onchange = () => wrap.classList.toggle('hide', !chk.checked);
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    const amount = Number(d.amount || 0);
    if (!amount || amount <= 0){ showFormError(f, L2('টাকার পরিমাণ লিখুন', 'Enter the amount')); busy = false; return; }
    closeModal();
    const pay = { id: 'pay_' + uid(), amount: amount, date: d.date || today(), method: d.method || 'নগদ', note: d.note || '', txnId: '' };
    try {
      /* ১) খাতায় ব্যয় এন্ট্রি */
      try {
        const cr = await saveGuard(() => addDoc('transactions', {
          eventId: v.eventId || state.selectedEventId, orgId: state.currentOrgId,
          type: 'ব্যয়', category: v.cat || 'অন্যান্য ব্যয়',
          amount: amount, date: pay.date, method: pay.method,
          note: v.name + ' — ' + (v.work || '') + (pay.note ? ' (' + pay.note + ')' : ''),
          receiptNo: 'V-' + String(Date.now()).slice(-5), vendorId: v.id, vendorName: v.name
        }));
        pay.txnId = cr && cr.id ? cr.id : '';
      } catch(_){}
      /* ২) ভেন্ডরের কিস্তি তালিকায় যোগ */
      const pays = vPayments(v).concat([pay]);
      await saveGuard(() => updDoc('vendors', v.id, { payments: pays }));
      /* ৩) চাইলে রিমাইন্ডার */
      if (d.wantReminder && d.remDate){
        try {
          await addDoc('reminders', {
            title: v.name + L2(' — পরের কিস্তি (', ' — next instalment (') + (v.work || '') + ')',
            description: L2('চুক্তি ', 'Agreed ') + money(vTotal(v)) + L2(' · এখনো বাকি ', ' · still due ') + money(vRest(v)) + L2(' · ফোন: ', ' · phone: ') + (v.phone || '—'),
            date: d.remDate, time: d.remTime || '09:00', eventId: v.eventId || state.selectedEventId, completed: false
          });
        } catch(_){}
      }
      await reload(); render();
      toast(L2('টাকা যোগ হয়েছে ✓ — ', 'Payment added ✓ — ') + money(amount) + L2(' খাতায়ও উঠেছে', ' recorded in the ledger too'), 'ok');
    } catch(ex){ toast(fbErrMsg(ex), 'err'); }
    busy = false;
  });
}
/* একটি কিস্তি মোছা (খাতার এন্ট্রিসহ) */
async function delVendorPayment(vid, payId){
  const v = (state.vendors || []).find(x => x.id === vid);
  if (!v) return;
  const pay = vPayments(v).find(p => p.id === payId);
  if (!pay) return;
  if (!await uiConfirm(L2('এই কিস্তিটি (', 'This instalment (') + money(pay.amount) + L2(') কিস্তির তালিকা ও খাতা — দুই জায়গা থেকেই মুছে যাবে।', ') will be removed from the instalment list and the ledger.'),
      { title: L2('কিস্তি মুছবেন?', 'Delete this instalment?') })) return;
  try {
    const left = vPayments(v).filter(p => p.id !== payId);
    await saveGuard(() => updDoc('vendors', v.id, { payments: left }));
    if (pay.txnId){ try { await delDoc('transactions', pay.txnId); } catch(_){} }
    await reload(); render();
    toast(L2('কিস্তি মুছে ফেলা হয়েছে', 'Instalment removed'), 'ok');
  } catch(ex){ toast(fbErrMsg(ex), 'err'); }
}

async function delVendorDeep(vid){
  const v = (state.vendors || []).find(x => x.id === vid);

    const keep = forgotBtn.innerHTML;

      return;
    }
    forgotBtn.disabled = true; forgotBtn.innerHTML = '<span class="spin"></span>' + L2('পাঠানো হচ্ছে…', 'Sending…');

      await fbSendResetEmail(email);

      /* ৬০ সেকেন্ড বোতামে গোনা দেখাই */
      let left = 60;
      const tick = () => {
        if (left <= 0){ forgotBtn.disabled = false; forgotBtn.innerHTML = keep; return; }
        forgotBtn.disabled = true;
        forgotBtn.innerHTML = icon('lock','ic-sm') + L2('আবার পাঠান (', 'Resend in (') + bn(left) + L2(' সে.)', 's)');
        left--;
        setTimeout(tick, 1000);
      };
      tick();
      return;
    } catch(ex){
      const m = fbErrMsg(ex);
      toast((ex && ex.code === 'app/reset-cooldown' ? '' : L2('পাঠানো যায়নি: ', 'Could not send: ')) + m, 'err', { detail: m, duration: 8000 });

    forgotBtn.disabled = false; forgotBtn.innerHTML = keep;
  };
  root.querySelectorAll('[data-lang]').forEach(b => {

  let busy = false;
  const runAuth = async (d) => {
    if (busy) return;
    const isSignup = !document.getElementById('signupFields').classList.contains('hide');
    const err = document.getElementById('authErr');
    FB_WARN = ''; err.innerHTML = '';
    try {
      if (isSignup){
        const hasInvite = !!(d.inviteCode && String(d.inviteCode).trim());
        if (!d.name || !d.name.trim()) throw new Error(L2('আপনার নাম দিতে হবে', 'Enter your name'));

        if (d.password !== d.confirm) throw new Error(L2('দুইবার লেখা পাসওয়ার্ড মিলছে না', 'The two passwords do not match'));
        d.inviteCode = String(d.inviteCode||'').trim().toUpperCase();
        d.orgName = String(d.orgName||'').trim();
      } else {
        if (!d.email || !d.password) throw new Error(L2('ইমেইল ও পাসওয়ার্ড দুটোই দিতে হবে', 'Enter both email and password'));
      }

      }
      if (isSignup) await withTimeout(signup(d), 45000, L2('অ্যাকাউন্ট তৈরি হতে বেশি সময় লাগছে — ইন্টারনেট সংযোগ বা Firebase কনফিগ পরীক্ষা করুন', 'Account creation is taking too long — check your internet connection or Firebase config'));
      else await withTimeout(login(d), 45000, L2('লগইনে বেশি সময় লাগছে — ইন্টারনেট সংযোগ বা Firebase কনফিগ পরীক্ষা করুন', 'Signing in is taking too long — check your internet connection or Firebase config'));
      await withTimeout(reload(), 60000, L2('ডেটা লোড হতে বেশি সময় লাগছে', 'Loading data is taking too long'));
      busy = false;
      render();
      return;
    } catch(ex){
      busy = false;
      const em = fbErrMsg(ex);
      /* ৪.৬ (সংশোধন): কার্ডের ভিতরের বড় লাল বাক্স আর দেখানো হয় না —
         একই কথা উপরে টোস্টেই (শিরোনাম + কারণ) পরিষ্কার দেখা যায়। */
      err.innerHTML = '';
      toast((isSignup ? L2('অ্যাকাউন্ট তৈরি হয়নি: ', 'Account not created: ') : L2('লগইন হয়নি: ', 'Sign-in failed: ')) + em, 'err', { detail: em });
      const storageIssue = /web-storage-unsupported|operation-not-supported/i.test(errCode(ex));
      if (useFb() && (netFail(ex) || ex.__timeout || storageIssue)){
        /* ইন্টারনেট/Firebase কনফিগ সমস্যা হলে শুধু ছোট ফলব্যাক বাটন (লাল বাক্স নয়) */
        err.innerHTML = '<button type="button" class="btn s brand" id="demoBtn2" style="margin:2px 0 10px">' + icon('bolt') + L2('ইন্টারনেট ছাড়াই চালান', 'Continue without internet') + '</button>';
        const d2 = document.getElementById('demoBtn2');
        if (d2) d2.onclick = () => { quickDemo(); };
      }
      if (document.body.contains(submitBtn)){
        submitBtn.disabled = false;
        submitBtn.innerHTML = isSignup ? icon('spark') + L2('অ্যাকাউন্ট খুলুন', 'Create account') : icon('logout') + L2('লগইন করুন', 'Sign in');
      }
    }
  };
  bindSubmit(f, runAuth);
  // Helper: parse ?join=CODE from URL
  function parseJoinCode(){
    try {
      const u = new URL(location.href);
      let c = u.searchParams.get('join') || u.searchParams.get('code') || u.searchParams.get('invite') || '';
      c = String(c||'').trim().toUpperCase();
      // Also check hash #join=CODE
      if(!c && location.hash){
        const h = new URLSearchParams(location.hash.replace(/^#/, '?'));
        c = (h.get('join') || h.get('code') || '').trim().toUpperCase();
      }
      // Validate format PS-XXXXXX
      if(c && /^PS-[A-Z0-9]{4,10}$/.test(c)) return c;
      // Also accept plain code without PS- prefix? No, require PS-
      return c || '';
    } catch(e){ return ''; }
  }
  // Prefill invite code from ?join=CODE
  try {
    const jc = parseJoinCode();
    const scanBtn = document.getElementById('scanQrBtn');
    if (scanBtn) scanBtn.onclick = () => { try { window.__psScanInvite(); } catch(e){} };

    }
  } catch(e){}
}

function exportCsv(){
  try {
    const t = [...txns()].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const head = ['তারিখ', 'ধরণ', 'খাত', 'মাধ্যম', 'রশিদ', 'নোট', 'পরিমাণ'];

    const lines = [head.map(q).join(',')].concat(t.map(x => [x.date, x.type, catLabel(x.category), x.method, x.receiptNo || '', x.note || '', Number(x.amount || 0)].map(q).join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });

}

function buildBackupData(){
  try{
    const data = {
      version: APP_VER,
      exportedAt: new Date().toISOString(),
      exportedBy: state.user ? (state.user.email || state.user.uid) : 'unknown',
      orgId: state.currentOrgId || '',
      organization: orgNow() || null,
      orgs: state.orgs || [],
      events: state.events || [],
      members: state.members || [],
      transactions: state.transactions || [],
      donors: state.donors || [],
      vendors: state.vendors || [],
      reminders: state.reminders || [],
      orgMembers: state.orgMembers || [],
      orgInvites: state.orgInvites || [],
      // local storage snapshots for demo mode
      localKeys: {}
    };
    // capture all ps_* local keys for current user if demo
    try{
      const keys = ['ps_events','ps_members','ps_transactions','ps_donors','ps_reminders','ps_vendors','ps_organizations','ps_users'];
      keys.forEach(k=>{
        try{
          const v = store.get(k);
          if(v) data.localKeys[k] = JSON.parse(v);
        }catch(_){}
      });
      // profile photos
      try{
        for(let i=0;i<localStorage.length;i++){
          const lk = localStorage.key(i);
          if(lk && lk.startsWith(PROFILE_PHOTO_KEY)){
            try{
              const pv = localStorage.getItem(lk);
              if(pv) data.localKeys[lk] = pv;
            }catch(_){}
          }
        }
      }catch(_){}
      // per-user keys
      if(state.user && state.user.uid){
        ['events','members','transactions','donors','reminders','vendors'].forEach(col=>{
          const key = 'ps_u_' + state.user.uid + '_' + col;
          try{
            const v = store.get(key);
            if(v) data.localKeys[key] = JSON.parse(v);
          }catch(_){}
        });
      }
    }catch(_){}
    return data;
  }catch(e){ console.error('buildBackup error', e); return null; }
}

function downloadBackup(){
  try{
    const data = buildBackupData();
    if(!data){ toast(L2('ব্যাকআপ তৈরি করা যায়নি','Could not create backup'), 'err'); return; }
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const orgName = (orgNow() && orgNow().name ? String(orgNow().name).replace(/[^\w\u0980-\u09FF]+/g,'-') : 'puja');
    const dateStr = new Date().toISOString().slice(0,10);
    a.download = 'puja-sarathi-backup-' + orgName + '-' + dateStr + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
    toast(L2('ব্যাকআপ ডাউনলোড শুরু হয়েছে ✓','Backup download started ✓'), 'ok');
    const msg = document.getElementById('backupMsg');
    if(msg) msg.textContent = L2('ডাউনলোড হয়েছে: ','Downloaded: ') + a.download;
  }catch(e){ toast(L2('ব্যাকআপ ব্যর্থ: ','Backup failed: ') + e.message, 'err'); }
}

async function restoreFromBackupFile(file, mode){
  const msgEl = document.getElementById('restoreMsg');
  if(!file){ toast(L2('ফাইল বাছুন','Choose a file'), 'warn'); return; }
  if(!await uiConfirm(L2('রিস্টোর করলে বর্তমান ডেটা ' + (mode==='replace' ? 'মুছে যাবে' : 'এর সাথে যোগ হবে') + ' — আগে ব্যাকআপ নিয়েছেন তো?','Restore will ' + (mode==='replace' ? 'replace current data' : 'merge with current') + ' — did you take backup?'),
     { title: L2('রিস্টোর করবেন?', 'Restore now?'), okLabel: L2('হ্যাঁ, রিস্টোর করুন', 'Yes, restore') })){ return; }
  try{
    if(msgEl) msgEl.textContent = L2('পড়া হচ্ছে…','Reading…');
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object'){ throw new Error('Invalid backup file'); }
    // basic validation
    if(!data.transactions && !data.events && !data.members && !data.donors && !data.localKeys){
      throw new Error('Backup file has no data');
    }
    if(msgEl) msgEl.textContent = L2('রিস্টোর হচ্ছে…','Restoring…');
    
    if(dataLocal()){
      // DEMO / LOCAL MODE - restore to localStorage
      const myUid = state.user && state.user.uid ? state.user.uid : '';
      const restoreLocal = (col, arr)=>{
        if(!Array.isArray(arr)) return;
        const key = myUid ? ('ps_u_' + myUid + '_' + col) : ('ps_' + col);
        if(mode==='replace'){
          saveDemo(col, arr, key);
        } else {
          // merge - dedupe by id
          const existing = JSON.parse(store.get(key) || '[]');
          const map = {}; existing.forEach(x=> map[x.id]=x);
          arr.forEach(x=>{ if(x && x.id) map[x.id]=x; else if(x) map['id_'+uid()]=x; });
          const merged = Object.values(map);
          saveDemo(col, merged, key);
        }
      };
      if(data.events) restoreLocal('events', data.events);
      if(data.vendors) restoreLocal('vendors', data.vendors);
      if(data.members) restoreLocal('members', data.members);
      if(data.transactions) restoreLocal('transactions', data.transactions);
      if(data.donors) restoreLocal('donors', data.donors);
      if(data.reminders) restoreLocal('reminders', data.reminders);
      if(data.localKeys){
        // also restore any localKeys that match
        Object.keys(data.localKeys).forEach(k=>{
          try{
            const val = data.localKeys[k];
            // profile photo is string, handle separately
            if(typeof val === 'string' && k.startsWith(PROFILE_PHOTO_KEY)){
              if(mode==='replace' || !store.get(k)) store.set(k, val);
              return;
            }
            const arr = val;
            if(!Array.isArray(arr)) return;
            if(mode==='replace'){
              store.set(k, JSON.stringify(arr));
            } else {
              const existing = JSON.parse(store.get(k) || '[]');
              const map = {}; existing.forEach(x=> map[x.id]=x);
              arr.forEach(x=>{ if(x && x.id) map[x.id]=x; });
              store.set(k, JSON.stringify(Object.values(map)));
            }
          }catch(_){}
        });
      }
      if(data.orgs && myUid){
        // orgs stored globally
        try{
          if(mode==='replace'){
            store.set(LSO, JSON.stringify(data.orgs));
          } else {
            const existing = JSON.parse(store.get(LSO)||'[]');
            const map={}; existing.forEach(o=> map[o.id]=o);
            data.orgs.forEach(o=> map[o.id]=o);
            store.set(LSO, JSON.stringify(Object.values(map)));
          }
        }catch(_){}
      }
      toast(L2('রিস্টোর সম্পূর্ণ ✓ — রিলোড হচ্ছে','Restore complete ✓ — reloading'), 'ok');
      setTimeout(async()=>{ await reload(); render(); }, 800);
    } else {
      // FIREBASE MODE - restore to Firestore (only if user is logged in)
      if(!state.user || !state.currentOrgId){ toast(L2('Firebase মোডে রিস্টোর করতে লগইন থাকতে হবে','Must be logged in for Firebase restore'), 'warn'); return; }
      await loadFirebase();
      const orgId = state.currentOrgId;
      const eventIds = (state.events||[]).map(e=>e.id);
      // For each collection, add missing docs
      const cols = [
        {key:'events', col:'events', arr:data.events},
        {key:'members', col:'members', arr:data.members},
        {key:'transactions', col:'transactions', arr:data.transactions},
        {key:'donors', col:'donors', arr:data.donors},
        {key:'reminders', col:'reminders', arr:data.reminders}
      ];
      let total = 0;
      for(const {col, arr} of cols){
        if(!Array.isArray(arr) || !arr.length) continue;
        for(const item of arr){
          try{
            const payload = {...item};
            delete payload.id;
            if(!payload.orgId) payload.orgId = orgId;
            if(col!=='events' && !payload.eventId && state.selectedEventId) payload.eventId = state.selectedEventId;
            // avoid duplicates by checking if same id exists? simplest: add as new if replace mode, else check
            if(mode==='merge'){
              // if item has id and exists, skip? we will just set if id exists
              if(item.id){
                try{
                  const doc = await fb.db.collection(col).doc(item.id).get();
                  if(doc && doc.exists) continue;
                }catch(_){}
              }
            }
            if(item.id && mode==='replace'){
              // try to set with same id for replace
              try{ await fb.db.collection(col).doc(item.id).set({...payload, createdAt: Date.now()}, {merge:true}); total++; continue; }catch(_){}
            }
            await fb.db.collection(col).add({...payload, createdAt: Date.now()});
            total++;
          }catch(e){ console.warn('restore item failed', col, e); }
        }
      }
      toast(L2('রিস্টোর সম্পূর্ণ ✓ ','Restore complete ✓ ') + total + L2(' টি এন্ট্রি',' entries'), 'ok');
      await reload(); render();
    }
  }catch(e){
    console.error(e);
    toast(L2('রিস্টোর ব্যর্থ: ','Restore failed: ') + e.message, 'err');
    if(msgEl) msgEl.textContent = L2('ব্যর্থ: ','Failed: ') + e.message;
  }
}

const REMINDER_SOUND_KEY = 'ps_reminder_sound';
let reminderCheckInterval = null;
let lastNotifiedIds = new Set();

function getReminderSoundEnabled(){
  try{ const v = store.get(REMINDER_SOUND_KEY); return v !== 'off'; }catch(_){ return true; }
}

// Professional notification sound using Web Audio API
function playNotificationSound(){
  if(!getReminderSoundEnabled()) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // Create a pleasant two-tone chime
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    
    osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, now); // A5
    osc2.type = 'sine'; osc2.frequency.setValueAtTime(1320, now); // E6
    filter.type = 'lowpass'; filter.frequency.setValueAtTime(2000, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
    
    osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc1.start(now); osc2.start(now + 0.1);
    osc1.stop(now + 0.8); osc2.stop(now + 0.9);
    
    // Second chime
    setTimeout(()=>{
      try{
        const osc3 = ctx.createOscillator();
        const g2 = ctx.createGain();
        osc3.type = 'sine'; osc3.frequency.setValueAtTime(1046, ctx.currentTime); // C6
        g2.gain.setValueAtTime(0.25, ctx.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc3.connect(g2); g2.connect(ctx.destination);
        osc3.start(); osc3.stop(ctx.currentTime + 0.6);
      }catch(_){}
    }, 300);
  }catch(e){
    // Fallback: try audio element
    try{
      const audio = new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZQAAABkY29kZQ==');
      audio.volume = 0.5; audio.play().catch(()=>{});
    }catch(_){}
  }
}

function buildNotifications(){
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  const notifs = [];
  const reminders = state.reminders || [];
  
  reminders.forEach(r=>{
    if(!r || !r.date) return;
    const rDate = r.date; // YYYY-MM-DD
    const isToday = rDate === todayStr;
    const isOverdue = rDate < todayStr && !r.completed;
    const isUpcoming = (()=>{ 
      const d = new Date(rDate); const diff = Math.ceil((d - now)/86400000); 
      return diff >=0 && diff <=3 && !r.completed; 
    })();
    
    if(isToday || isOverdue || isUpcoming){
      const type = isOverdue ? 'overdue' : isToday ? 'today' : 'upcoming';
      notifs.push({
        id: 'rem_'+r.id,
        reminderId: r.id,
        title: r.title || L2('রিমাইন্ডার','Reminder'),
        body: r.description || '',
        date: r.date,
        time: r.time || '',
        type: type,
        createdAt: r.createdAt || Date.now(),
        read: r.notifiedRead || false
      });
    }
  });
  
  // Sort: overdue first, then today, then upcoming, newest first
  notifs.sort((a,b)=>{
    const order = {overdue:0, today:1, upcoming:2};
    if(order[a.type] !== order[b.type]) return order[a.type] - order[b.type];
    return (b.createdAt||0) - (a.createdAt||0);
  });
  
  state.notifications = notifs;
  return notifs;
}

function getUnreadCount(){
  return (state.notifications||[]).filter(n=>!n.read).length;
}

function checkReminders(){
  try{
    const notifs = buildNotifications();
    const unread = getUnreadCount();
    // Update bell badge
    const badge = document.getElementById('notifBadge');
    if(badge){
      if(unread>0){ badge.textContent = unread>9 ? '9+' : String(unread); badge.style.display='grid'; badge.classList.add('pulse'); }
      else { badge.style.display='none'; badge.classList.remove('pulse'); }
    }
    const bell = document.getElementById('notifBell');
    if(bell){
      if(unread>0) bell.classList.add('has-unread');
      else bell.classList.remove('has-unread');
    }
    
    // Check for new due reminders to notify
    const todayStr = new Date().toISOString().slice(0,10);
    notifs.forEach(n=>{
      if((n.type==='today' || n.type==='overdue') && !lastNotifiedIds.has(n.reminderId)){
        // Only notify once per session per reminder
        if(n.type==='today' || n.type==='overdue'){
          lastNotifiedIds.add(n.reminderId);
          // Show toast
          const msg = n.type==='overdue' 
            ? icon('alarm','ic-sm') + ' ' + L2('ওভারডিউ: ','Overdue: ') + n.title
            : icon('bell','ic-sm') + ' ' + L2('আজ: ','Today: ') + n.title;
          toast(msg, n.type==='overdue' ? 'warn' : 'info');
          playNotificationSound();
          // Browser notification if permitted
          try{
            if('Notification' in window && Notification.permission==='granted'){
              new Notification(n.title, { body: (n.body||'') + ' — ' + n.date + (n.time ? ' ' + n.time : ''), icon: './icons/icon-192.png' });
            }
          }catch(_){}
          // Mark as notified in storage
          try{
            const r = (state.reminders||[]).find(x=>x.id===n.reminderId);
            if(r){ r.lastNotified = Date.now(); }
          }catch(_){}
        }
      }
    });
  }catch(e){ console.warn('checkReminders failed', e); }
}

function startReminderChecker(){
  if(reminderCheckInterval) clearInterval(reminderCheckInterval);
  // Check every 60 seconds
  reminderCheckInterval = setInterval(()=>{ try{ checkReminders(); }catch(_){} }, 60000);
  // Also check on visibility change
  try{
    document.addEventListener('visibilitychange', ()=>{
      if(!document.hidden){ try{ checkReminders(); }catch(_){} }
    });
  }catch(_){}
}

function requestNotificationPermission(){

function getProfilePhoto(uid){
  try{
    const id = uid || (state.user && state.user.uid) || '';
    if(!id) return '';
    // Try Firebase photo first (if stored in user doc)
    const fbPhoto = (state.user && state.user.photoData) ? state.user.photoData : '';
    if(fbPhoto) return fbPhoto;
    // Local storage
    const local = store.get(PROFILE_PHOTO_KEY + id);
    return local || '';
  }catch(_){ return ''; }
}
function setProfilePhoto(uid, base64){
  try{
    const id = uid || (state.user && state.user.uid) || '';
    if(!id) return;
    if(base64){
      store.set(PROFILE_PHOTO_KEY + id, base64);
      // Also try to save to Firebase user doc if in Firebase mode
      if(!dataLocal() && state.user){
        try{
          loadFirebase().then(()=>{
            try{ fb.db.collection('users').doc(id).set({ photoData: base64 }, {merge:true}); }catch(_){}
          });
        }catch(_){}
      }
      // Update state
      if(state.user && state.user.uid===id) state.user.photoData = base64;
    } else {
      store.del(PROFILE_PHOTO_KEY + id);
      if(state.user && state.user.uid===id) delete state.user.photoData;
    }
  }catch(_){}
}

function compressImage(base64, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w>maxSize || h>maxSize){
        if(w>h){ h = Math.round(h*maxSize/w); w=maxSize; }
        else { w = Math.round(w*maxSize/h); h=maxSize; }
      }
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = base64;
  });
}

/* ── এক ট্যাপে ডেমো ডেটা দিয়ে অ্যাপ খুলুন (লগইন পর্দা থেকে) ── */
async function quickDemo(opts){
  opts = opts || {};
  const btn = document.getElementById('quickDemoBtn');
  const old = btn ? btn.innerHTML : '';
  const email = 'demo@pujasarathi.app', pass = 'demo1234';
  const demoAccount = { name: L2('কমিটি সেক্রেটারি','Committee Secretary'), email, password: pass, confirm: pass,
                        orgName: L2('আমাদের পূজা কমিটি','Our Puja Committee'), inviteCode:'' };
  /* Firebase ছাড়া, এই ব্রাউজারেই (memory/localStorage) ডেমো অ্যাকাউন্ট খুলে অ্যাপ চালু */
  const localDemo = async () => {
    goDemo('');
    if (demoHasAccount(email)) await login({ email, password: pass });
    else await signup(demoAccount);
  };
  try{
    if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + L2('খোলা হচ্ছে…','Opening…'); }
    const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
    if (!useFb() || opts.force || previewEnv() || offline){
      await localDemo();
    } else {
      try{
        /* Firebase ধীর/বন্ধ থাকলে যেন ব্যবহারকারী আটকে না থাকেন — ৮ সেকেন্ডেই সিদ্ধান্ত */
        await Promise.race([
          (async () => {
            if (demoHasAccount(email)) await login({ email, password: pass });
            else await signup(demoAccount);
          })(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('demo-timeout')), 8000))
        ]);
      }catch(e){ await localDemo(); }        /* ইন্টারনেট/Firebase সমস্যা — লোকাল ডেমোতে নেমে আসি */
    }
    await reload();
    if (!state.user) await localDemo();      /* কোনো কারণে লগইন না হলে শেষ চেষ্টা */
    await reload();
    render();
    if(!opts.silent){
      toast(L2('অ্যাপ ইন্টারনেট ছাড়াই খোলা হলো ✓','The app is running offline ✓'), 'ok');
    }
  }catch(e){
    if(btn){ btn.disabled = false; btn.innerHTML = old; }
    toast(L2('খোলা গেল না: ','Could not open: ') + fbErrMsg(e), 'err');
  }
}

function openModal(title, bodyHtml){
  closeModal();

  m.innerHTML = '<div class="box"><div class="head"><span>' + esc(title) + '</span>'
    + '<button type="button" class="iconbtn" onclick="closeModal()" aria-label="close">' + icon('x', 'ic-sm') + '</button></div>'
    + '<div class="body">' + bodyHtml + '</div></div>';
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });
  document.addEventListener('keydown', escClose);
  document.body.appendChild(m);
}
function escClose(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  const m = document.getElementById('modal'); if (m) m.remove();
  document.removeEventListener('keydown', escClose);
}
/* ═══════════ অ্যাপের নিজের ডায়ালগ — স্যান্ডবক্স/WebView-এও কাজ করে ═══════════
   ব্রাউজারের confirm()/alert()/prompt() কোথাও কোথাও (preview embed, PWA, WebView)
   নীরবে ব্লক হয়ে যায় — তখন ডিলিট ক্লিকে কিছুই হয় না। তাই নিজেদের ডায়ালগ। */
function uiDialog(opts){
  const o = opts || {};
  return new Promise(resolve => {
    const prevFocus = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'uidlg';
    const msg = String(o.message || '');
    const msgHtml = o.html ? msg : esc(msg);      /* html:true দিলে নিজেদের বানানো নিরাপদ HTML দেখাবে */
    const inp = o.input ? '<input class="inp" id="uiDlgInput" value="' + esc(o.value || '') + '" placeholder="' + esc(o.placeholder || '') + '">' : '';
    wrap.innerHTML = '<div class="box" role="dialog" aria-modal="true">'
      + '<div class="ttl' + (o.danger ? '' : ' ok') + '">' + icon(o.danger ? 'alert' : (o.icon || 'info')) + '<span>' + esc(o.title || L2('নিশ্চিত করুন', 'Please confirm')) + '</span></div>'
      + (msg ? '<div class="msg">' + msgHtml + '</div>' : '')
      + inp
      + '<div class="row">'
      + (o.onlyOk ? '' : '<button type="button" class="btn s ghost" data-ui="no">' + esc(o.cancelLabel || L2('বাতিল', 'Cancel')) + '</button>')
      + '<button type="button" class="btn s ' + (o.danger ? 'danger' : 'brand') + '" data-ui="yes">' + esc(o.okLabel || L2('ঠিক আছে', 'OK')) + '</button>'
      + '</div></div>';
    const done = (val) => {
      try { wrap.remove(); } catch(_){}
      document.removeEventListener('keydown', onKey, true);
      try { prevFocus && prevFocus.focus && prevFocus.focus(); } catch(_){}
      resolve(val);
    };
    function onKey(e){
      if (e.key === 'Escape'){ e.stopPropagation(); done(o.input ? null : false); }
      else if (e.key === 'Enter' && o.input){ e.stopPropagation(); e.preventDefault(); const v = wrap.querySelector('#uiDlgInput'); done(v ? v.value : ''); }
      else if (e.key === 'Enter' && !o.input){ e.stopPropagation(); done(true); }
    }
    wrap.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ui]');
      if (b){ done(b.dataset.ui === 'yes' ? (o.input ? (wrap.querySelector('#uiDlgInput') || {}).value || '' : true) : (o.input ? null : false)); return; }
      if (e.target === wrap && !o.noCancelOnBackdrop) done(o.input ? null : false);
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(wrap);
    setTimeout(() => {
      const b = wrap.querySelector('[data-ui="yes"]'); const v = wrap.querySelector('#uiDlgInput');
      try { v ? (v.focus(), v.select()) : (b && b.focus()); } catch(_){}
    }, 30);
  });
}
async function uiConfirm(message, opts){
  const o = Object.assign({ message: message, danger: true, okLabel: L2('হ্যাঁ, মুছে ফেলুন', 'Yes, delete') }, opts || {});
  if (typeof o.message === 'object' && o.message !== null) Object.assign(o, o.message);
  return await uiDialog(o) === true;
}
async function uiAlert(message, opts){
  await uiDialog(Object.assign({ message: message, onlyOk: true, danger: false, okLabel: L2('ঠিক আছে', 'OK') }, opts || {}));
  return true;
}
async function uiPrompt(message, opts){
  const v = await uiDialog(Object.assign({ message: message, input: true, danger: false, okLabel: L2('সেভ করুন', 'Save') }, opts || {}));
  return (typeof v === 'string' && v.trim()) ? v.trim() : null;
}
window.uiConfirm = uiConfirm; window.uiAlert = uiAlert; window.uiPrompt = uiPrompt;

/* টোস্ট এখন toast_v44.js-এ (৪.৪) — পুরনো একক-টোস্ট এখান থেকে সরানো হলো */
async function saveGuard(fn){
  try { return await fn(); }
  catch(ex){
    if (errCode(ex) === 'already-exists' || /already exists/i.test(errCode(ex))) return null;
    markWriteBlocked(ex);
    toast(L2('সংরক্ষণ হয়নি: ', 'Not saved: ') + fbErrMsg(ex));
    try { await reload(); } catch(e){}
    throw ex;
  }
}
window.addEventListener('unhandledrejection', (e) => {
  try {
    const m = fbErrMsg(e.reason);
    if (!/cancel|abort/i.test(String((e.reason && e.reason.message) || ''))) console.log('[পূজা সারথি] silent failure:', m);
  } catch(_){}
});
