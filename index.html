<script>/* থিম-বুট: সংরক্ষিত পছন্দ বা সিস্টেম অনুযায়ী আগেই ঠিক করা হয় */
(function(){try{
  var t=null; try{ t=localStorage.getItem('ps_theme'); }catch(e){}
  var dark=(t==='dark')||((t!=='light')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  var m=(t==='light'||t==='dark')?t:'system';
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  document.documentElement.setAttribute('data-theme-mode', m);
  if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(m==='system'){
      document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); } });
}catch(e){}})();</script>
<style>
/* ═══════════════════════════════════════════════════════════════
     পূজা সারথি ৪.০ — প্রফেশনাল ডিজাইন সিস্টেম (glass, restrained)
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --ink:#0b1220; --ink-2:#1f2937; --body:#334155; --muted:#64748b; --faint:#94a3b8;
    --line:#e6eaf1; --line-2:#eef1f7; --line-3:rgba(15,23,42,.08);
    --bg:#f5f7fa;
    --surface:rgba(255,255,255,.88); --surface-2:rgba(255,255,255,.62); --surface-3:rgba(255,255,255,.42);
    --brand:#d97706; --brand-2:#f59e0b; --brand-3:#b45309; --brand-soft:#fffbeb;
    --navy-1:#0a1120; --navy-2:#111c33; --navy-3:#16233d;
    --ok:#047857; --ok-2:#059669; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
    --bad:#be123c; --bad-2:#e11d48; --bad-bg:#fff1f2; --bad-line:#fecdd3;
    --info:#1d4ed8; --info-bg:#eff6ff; --info-line:#bfdbfe;
    --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-ink:#92400e;
    --shadow-xs:0 1px 2px rgba(16,24,40,.05);
    --shadow-s:0 1px 2px rgba(16,24,40,.04), 0 6px 16px -10px rgba(16,24,40,.16);
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 14px 34px -18px rgba(16,24,40,.26);
    --shadow-l:0 30px 70px -24px rgba(16,24,40,.34);
    --r-xs:8px; --r-s:10px; --r:14px; --r-l:20px;
    --ff:'Inter','Noto Sans Bengali','Hind Siliguri','Nirmala UI','Segoe UI',system-ui,-apple-system,sans-serif;
    --fm:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
    /* কাচ/কঠিন পৃষ্ঠ — থিম বদলালে এগুলোও বদলায় */
    --glass-1:rgba(255,255,255,.88); --glass-2:rgba(255,255,255,.82); --glass-3:rgba(255,255,255,.7);
    --solid-1:#ffffff; --solid-2:#fbfcfe; --solid-3:#f8fafc; --solid-4:#f7f9fc;
    --row-hover:#fafbfe; --soft-2:#f1f5f9; --soft-line:#e2e8f0; --bar-bg:#eef2f7; --hover-line:#d8dee8;
    --field-bg:rgba(255,255,255,.92); --field-bg-focus:#ffffff; --field-line:#dbe2ec; --field-line-2:#cdd6e3; --field-ph:#a8b3c4;
    --btn-ink-1:#141f36; --btn-ink-2:#0b1220; --btn-ink-3:#1b2942; --btn-ink-4:#111c33;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; color:var(--body); font-family:var(--ff); font-size:14px; line-height:1.55;
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 420px at 6% -8%, rgba(217,119,6,.08) 0%, rgba(217,119,6,0) 62%),
      radial-gradient(760px 420px at 100% -6%, rgba(29,78,216,.06) 0%, rgba(29,78,216,0) 60%),
      linear-gradient(180deg,#fbfcfe 0%, #f4f6fa 55%, #f2f4f8 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4{ color:var(--ink); font-weight:700; letter-spacing:-.012em; margin:0; }
  a{ color:var(--info); }
  ::selection{ background:rgba(217,119,6,.22); }
  :focus-visible{ outline:2px solid rgba(217,119,6,.55); outline-offset:2px; border-radius:6px; }
  .num,.v,.money,td .amt{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }

  /* ── পরিবেশ আলো (খুব সূক্ষ্ম) ── */
  .blobs{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .blobs i{ position:absolute; display:block; border-radius:50%; filter:blur(70px); opacity:.34; }
  .blobs i:nth-child(1){ width:420px;height:420px; background:#fcd34d; top:-140px; left:-120px; animation:float1 26s ease-in-out infinite; }
  .blobs i:nth-child(2){ width:380px;height:380px; background:#c7d2fe; bottom:-150px; right:-120px; animation:float2 30s ease-in-out infinite; }
  .blobs i:nth-child(3){ width:300px;height:300px; background:#fed7aa; top:42%; right:16%; opacity:.22; animation:float1 34s ease-in-out infinite reverse; }
  @keyframes float1{ 50%{ transform:translate3d(26px,20px,0) scale(1.05); } }
  @keyframes float2{ 50%{ transform:translate3d(-22px,-18px,0) scale(1.04); } }
  @media (prefers-reduced-motion: reduce){ .blobs i{ animation:none; } *{ transition:none !important; } }

  /* ── শেল: উপরে টপবার, নিচে নেভিগেশন, পাশে হ্যামবার্গার ড্রয়ার ── */
  .app{ display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1; }
  .main{ display:flex; flex-direction:column; flex:1; min-width:0; }

  /* ── নিচের নেভিগেশন (মোবাইল-ফার্স্ট, ডেস্কটপেও) ── */
  .side{
    position:fixed; left:0; right:0; bottom:0; z-index:40; width:100%;
    display:flex; align-items:stretch; color:var(--muted);
    background:var(--glass-1);
    -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%);
    border-top:1px solid var(--line);
    box-shadow:0 -1px 0 rgba(16,24,40,.03), 0 -12px 30px -22px rgba(16,24,40,.5);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .side nav{ display:flex; flex:1; gap:2px; overflow:hidden; justify-content:space-around; flex-wrap:nowrap; }
  .side{ overscroll-behavior:none; }
  .content{ padding-bottom:120px !important; }
  @media(min-width:960px){ .content{ padding-bottom:130px !important; } }
  .app{ min-height:100dvh; }
  .main{ flex:1; overflow:visible; }
  .side nav::-webkit-scrollbar{ display:none; }
  .side nav a{
    position:relative; flex:1 1 0; min-width:62px; text-decoration:none; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:7px 4px 6px; border-radius:12px; font-size:10.5px; font-weight:600; letter-spacing:.01em;
    transition:background .16s ease, color .16s ease;
  }
  .side nav a .nav-t{ max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side nav a .ic{ width:20px; height:20px; color:var(--faint); transition:color .16s ease, transform .16s ease; }
  .side nav a:hover{ background:var(--line-3); color:var(--ink-2); }
  .side nav a:hover .ic{ color:var(--ink-2); transform:translateY(-1px); }
  .side nav a.active{ color:var(--brand-3); background:var(--brand-soft); font-weight:700; }
  .side nav a.active .ic{ color:var(--brand); }
  .side nav a.active::after{ content:''; position:absolute; top:2px; width:18px; height:3px; border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,#fbbf24,#d97706); }
  @media(min-width:960px){
    .side{ left:50%; transform:translateX(-50%); right:auto; width:min(900px, 96vw); bottom:14px;
      border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-l); padding:6px; }
    .side nav a{ flex-direction:row; gap:7px; font-size:12.5px; padding:9px 8px; min-width:0; }
    .side nav a .nav-t{ max-width:none; }
    .side nav a .ic{ width:18px; height:18px; }
    .side nav a.active::after{ display:none; }
  }
  .content{ padding-bottom:120px; }
  @media(min-width:960px){ .content{ padding-bottom:130px; } }

  /* ═══ ড্যাশবোর্ড: বর্গাকার কাচ-কার্ড, ঝলক (glow), এক লাইনে দুটি (৪.৩) ═══ */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; max-width:760px; margin-left:auto; margin-right:auto; }
  .kpi-grid .kpi-card{
    display:flex; flex-direction:column; justify-content:center; position:relative;
    min-height:132px; max-height:190px; aspect-ratio:1.9 / 1; padding:16px 16px 15px; border-radius:14px;
    background:linear-gradient(155deg, var(--glass-1) 0%, var(--glass-3) 100%);
    -webkit-backdrop-filter:blur(18px) saturate(165%); backdrop-filter:blur(18px) saturate(165%);
    border:1px solid var(--line); overflow:hidden;
    transition:transform .18s ease, box-shadow .2s ease;
  }
  .kpi-grid .kpi-card::after{ content:''; position:absolute; inset:-40% -30% auto auto; width:170px; height:170px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 70%); opacity:.5; pointer-events:none; }
  .kpi-grid .kpi-card .kpi{ flex-direction:column; align-items:flex-start; gap:9px; }
  .kpi-grid .kpi-card .kpi .v{ font-size:26px; letter-spacing:-.03em; }
  .kpi-grid .kpi-card:hover{ transform:translateY(-2px); }
  .kpi-card.tone-ok{ box-shadow:0 0 0 1px rgba(4,120,87,.16), 0 22px 46px -26px rgba(4,120,87,.72), var(--shadow-s); }
  .kpi-card.tone-bad{ box-shadow:0 0 0 1px rgba(190,18,60,.16), 0 22px 46px -26px rgba(190,18,60,.72), var(--shadow-s); }
  .kpi-card.tone-info{ box-shadow:0 0 0 1px rgba(29,78,216,.16), 0 22px 46px -26px rgba(29,78,216,.72), var(--shadow-s); }
  .kpi-card.tone-brand{ box-shadow:0 0 0 1px rgba(217,119,6,.18), 0 22px 46px -26px rgba(217,119,6,.78), var(--shadow-s); }
  .kpi-card.tone-ok:hover{ box-shadow:0 0 0 1px rgba(4,120,87,.26), 0 26px 54px -24px rgba(4,120,87,.85), var(--shadow); }
  .kpi-card.tone-bad:hover{ box-shadow:0 0 0 1px rgba(190,18,60,.26), 0 26px 54px -24px rgba(190,18,60,.85), var(--shadow); }
  .kpi-card.tone-info:hover{ box-shadow:0 0 0 1px rgba(29,78,216,.26), 0 26px 54px -24px rgba(29,78,216,.85), var(--shadow); }
  .kpi-card.tone-brand:hover{ box-shadow:0 0 0 1px rgba(217,119,6,.28), 0 26px 54px -24px rgba(217,119,6,.9), var(--shadow); }
  .glasscard{ background:linear-gradient(155deg, var(--glass-1), var(--glass-3)) !important;
    -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 18px 40px -26px rgba(16,24,40,.45) !important; }
  @media(max-width:520px){
    .kpi-grid{ gap:10px; max-width:100% !important; }
    .kpi-grid .kpi-card{ min-height:118px; max-height:none; aspect-ratio:1 / 1; padding:12px 12px 11px; border-radius:12px; }
    .kpi-grid .kpi-card .kpi .v{ font-size:20px; }
    .kpi-grid .kpi-card .kpi .lbl{ font-size:11px; }
    .kpi-grid .kpi-card .kpi .cap{ font-size:10.5px; }
    .kpi-grid .kpi-card .ic-badge{ width:34px; height:34px; border-radius:10px; }
  }
  :root[data-theme="dark"] .kpi-grid .kpi-card::after{ background:radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 70%); }
  :root[data-theme="dark"] .kpi-card.tone-ok{ box-shadow:0 0 0 1px rgba(52,211,153,.2), 0 22px 46px -26px rgba(16,185,129,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-bad{ box-shadow:0 0 0 1px rgba(251,113,133,.2), 0 22px 46px -26px rgba(244,63,94,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-info{ box-shadow:0 0 0 1px rgba(138,180,255,.2), 0 22px 46px -26px rgba(59,130,246,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-brand{ box-shadow:0 0 0 1px rgba(245,158,11,.22), 0 22px 46px -26px rgba(217,119,6,.75), var(--shadow-s); }

  /* ═══ ☰ মেনুর ডেডিকেটেড স্ক্রিন (মডাল) ═══ */
  button.dr-item{ width:100%; background:transparent; cursor:pointer; font-family:inherit; font-size:13.5px; text-align:left; }
  button.dr-item:hover{ background:var(--line-3); }

  /* ── ব্যবহারকারীর ছোট কার্ড (ড্রয়ারে) ── */
  .uav{ width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center; font-weight:700; font-size:12.5px; color:#fff;
    background:linear-gradient(150deg,#6366f1,#0ea5e9); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
  .uav.g{ background:linear-gradient(150deg,#f59e0b,#ef4444); }
  .uav.t{ background:linear-gradient(150deg,#10b981,#0d9488); }
  .uav.p{ background:linear-gradient(150deg,#8b5cf6,#d946ef); }
  .umeta{ min-width:0; }
  .umeta .n{ font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .umeta .e{ font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ── হ্যামবার্গার ড্রয়ার ── */
  .scrim{ position:fixed; inset:0; z-index:55; background:rgba(9,14,26,.46);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .22s ease; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; bottom:0; left:0; z-index:60; width:min(360px, 90vw);
    display:flex; flex-direction:column;
    background:var(--solid-1);
    border-right:1px solid var(--line); box-shadow:var(--shadow-l);
    transform:translateX(-102%); transition:transform .28s cubic-bezier(.2,.9,.3,1.02);
  }
  .drawer.open{ transform:none; }
  .drawer .dr-head{ display:flex; align-items:center; gap:11px; padding:14px 14px 12px; border-bottom:1px solid var(--line-2); }
  .drawer .dr-head .mark{ width:38px;height:38px;border-radius:11px; flex:0 0 auto; display:grid; place-items:center; color:#fff;
    background:linear-gradient(160deg,#fbbf24,#c2410c); box-shadow:0 10px 22px -12px rgba(194,65,12,.9), inset 0 1px 0 rgba(255,255,255,.35); }
  .drawer .dr-head .nm{ font-weight:750; color:var(--ink); font-size:15px; letter-spacing:-.01em; line-height:1.2; }
  .drawer .dr-head .tg{ font-size:11px; color:var(--muted); }
  .drawer .dr-body{ flex:1; overflow-y:auto; padding:12px 12px 22px; }
  .drawer .dr-sec{ font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); padding:14px 8px 6px; }
  .dr-user{ display:flex; align-items:center; gap:11px; padding:11px; border-radius:var(--r); border:1px solid var(--line);
    background:linear-gradient(180deg,var(--solid-1),var(--solid-4)); }
  .dr-user .uav{ width:40px;height:40px;border-radius:12px;font-size:14px; }
  .dr-user .nm{ font-weight:700; color:var(--ink); font-size:13.5px; }
  .dr-user .em{ font-size:11.5px; color:var(--muted); word-break:break-all; }
  .dr-item{ display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:var(--r-s); text-decoration:none;
    color:var(--ink-2); font-size:13.5px; font-weight:600; border:1px solid transparent; transition:.16s; }
  .dr-item .ic{ width:18px; height:18px; color:var(--muted); flex:0 0 auto; }
  .dr-item .ch{ margin-left:auto; color:var(--faint); font-weight:400; }
  .dr-item:hover{ background:var(--line-3); border-color:var(--line); color:var(--ink); }
  .dr-item.active{ background:var(--brand-soft); border-color:rgba(217,119,6,.22); color:var(--brand-3); }
  .dr-item.active .ic{ color:var(--brand); }
  .dr-quick{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dr-quick button{ display:flex; align-items:center; gap:8px; padding:11px 12px; border-radius:var(--r-s); cursor:pointer;
    border:1px solid var(--line); background:var(--glass-1); color:var(--ink-2); font-family:inherit;
    font-size:12.5px; font-weight:600; text-align:left; transition:.16s; }
  .dr-quick button:hover{ border-color:var(--hover-line); background:var(--solid-1); color:var(--ink); transform:translateY(-1px); }
  .dr-quick button .ic{ width:17px; height:17px; color:var(--brand); flex:0 0 auto; }
  .dr-pref{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 8px; flex-wrap:wrap; }
  .dr-pref .t{ font-size:12.5px; font-weight:650; color:var(--ink-2); display:flex; align-items:center; gap:8px; }
  .drawer .adv{ border:1px solid var(--line); border-radius:var(--r); margin-top:12px; overflow:hidden; background:var(--surface-3); }
  .drawer .adv > summary{ cursor:pointer; padding:12px 13px; font-size:12.5px; font-weight:700; color:var(--ink-2);
    display:flex; align-items:center; gap:9px; list-style:none; }
  .drawer .adv > summary::-webkit-details-marker{ display:none; }
  .drawer .adv > summary .ic{ color:var(--muted); }
  .drawer .adv[open] > summary{ border-bottom:1px solid var(--line); }
  .drawer .adv .adv-in{ padding:12px 12px 14px; display:flex; flex-direction:column; gap:12px; }
  .drawer .dr-foot{ padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line-2);
    display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11px; color:var(--muted); }

  /* ── টপবার ── */
  .top{   /* ৪.৫: হালকা ও ছোট হেডার — FIXED single line */
    position:sticky; top:0; z-index:30; padding:6px clamp(8px,1.6vw,16px); display:flex; gap:7px; align-items:center; flex-wrap:nowrap;
    background:var(--glass-2);
    -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%);
    border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(16,24,40,.02), 0 8px 24px -22px rgba(16,24,40,.5);
  }
  .top .tbt{ min-width:0; flex:0 1 auto; display:flex; flex-direction:column; justify-content:center; }
  @media(max-width:520px){ .top .tbt .eyebrow{ display:none; } }
  .menu-btn{ width:34px; height:34px; flex:0 0 auto; border-radius:10px; }
  .menu-btn .ic{ width:19px; height:19px; }
  .menu-btn.on{ background:var(--brand-soft); border-color:rgba(217,119,6,.25); color:var(--brand-3); }
  .brand-mini{ display:flex; align-items:center; gap:9px; min-width:0; }
  .brand-mini .mark{ width:30px;height:30px;border-radius:9px; flex:0 0 auto; display:grid; place-items:center; color:#fff;
    background:linear-gradient(160deg,#fbbf24,#c2410c); box-shadow:0 8px 18px -12px rgba(194,65,12,.9), inset 0 1px 0 rgba(255,255,255,.32); }
  .brand-mini .nm{ font-weight:750; color:var(--ink); font-size:14px; letter-spacing:-.015em; white-space:nowrap; }
  .top .tbt .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
  .top .tbt .tt{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:190px; }
  .top .right{ margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:nowrap; min-width:0; flex:1 1 auto; justify-content:flex-end; }
  .top .iconbtn{ width:34px; height:34px; border-radius:10px; flex:0 0 auto; }
  .vdiv{ width:1px; height:24px; background:var(--line); margin:0 2px; flex:0 0 auto; }
  .selwrap{ position:relative; display:inline-flex; align-items:center; flex:1 1 0; min-width:0; max-width:230px; }
  .selwrap .ic{ position:absolute; left:10px; pointer-events:none; color:var(--faint); }
  .selwrap select{
    border:1px solid var(--line); border-radius:9px; padding:6px 26px 6px 28px; font-size:12px; font-weight:600; color:var(--ink-2);
    background:var(--glass-1) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 9px center;
    appearance:none; width:100%; max-width:100%; min-width:0; text-overflow:ellipsis; cursor:pointer; transition:border-color .16s, box-shadow .16s;
  }
  .selwrap .ic{ width:15px; height:15px; left:9px; }
  @media(max-width:760px){
    .top{ padding:6px 10px; gap:6px; }
    .top .tbt .tt{ font-size:13px; max-width:120px; }
    .top .right{ gap:5px; }
    .selwrap{ max-width:none; }
    .selwrap select{ padding:6px 24px 6px 26px; font-size:11.5px; }
  }
  @media(max-width:520px){
    .top .tbt{ max-width:90px; }
    .top .tbt .tt{ max-width:90px; font-size:12px; }
  }
  @media(max-width:420px){
    .top .tbt{ display:none; }               /* ফোনে জায়গা বাঁচাতে শুধু ☰ + নির্বাচন — তবুও single line */
    .top .right{ flex:1 1 auto; }
    .selwrap{ flex:1 1 0; }
  }
  .selwrap select:hover{ border-color:var(--hover-line); }
  .selwrap select:focus{ outline:none; border-color:var(--brand-2); box-shadow:0 0 0 4px rgba(245,158,11,.14); }
  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2);
    background:var(--glass-1); border:1px solid var(--line); border-radius:999px; padding:6px 12px; max-width:230px; }
  .chip .ic{ color:var(--muted); }
  .chip.dark{ background:#0f172a; color:#e2e8f0; border-color:#0f172a; }
  .chip.dark .ic{ color:#fbbf24; }
  .lang{ display:inline-flex; background:rgba(15,23,42,.05); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; }
  .lang button{ border:0; background:transparent; padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--muted);
    cursor:pointer; font-family:inherit; letter-spacing:.01em; transition:.16s; }
  .lang button.on{ background:var(--solid-1); color:var(--brand-3); box-shadow:var(--shadow-xs); }
  .iconbtn{ width:34px;height:34px; display:grid; place-items:center; border-radius:var(--r-s); border:1px solid var(--line);
    background:var(--glass-2); color:var(--ink-2); cursor:pointer; font-family:inherit; transition:.16s; }
  .iconbtn:hover{ background:var(--solid-1); border-color:var(--hover-line); color:var(--ink); }
  .iconbtn.danger:hover{ color:var(--bad); border-color:var(--bad-line); background:var(--bad-bg); }

  /* ── কনটেন্ট ── */
  .content{ padding:20px clamp(14px,2.4vw,26px) 46px; flex:1; overflow:auto; }
  .content > *{ max-width:1220px; margin-left:auto; margin-right:auto; }
  .content > * + *{ margin-top:14px; }
  .grid{ display:grid; gap:14px; }
  .g2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  @media(max-width:1080px){ .g4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:940px){ .g3{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:720px){ .g2,.g3,.g4{ grid-template-columns:1fr; } }

  /* ── কার্ড ── */
  .card{
    background:var(--surface);
    -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-s); padding:18px;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .card.pad-s{ padding:14px; }
  .card.hoverable:hover{ box-shadow:var(--shadow); transform:translateY(-1px); border-color:var(--hover-line); }
  @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    .card,.top,.auth-card,.modal .box{ background:var(--solid-1); }
  }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .card-head .t{ display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
  .card-head .t .ic{ color:var(--brand); }
  .card-head .s{ color:var(--muted); font-size:12px; margin-top:3px; font-weight:400; }
  .card h3{ margin:0 0 12px; font-size:14.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:9px; letter-spacing:-.01em; }
  .card h3 .ic{ color:var(--brand); }
  .sep{ height:1px; background:var(--line-2); margin:14px 0; border:0; }
  .muted{ color:var(--muted); font-size:12.5px; }
  .faint{ color:var(--faint); font-size:12px; }
  .strong{ color:var(--ink); font-weight:700; }

  /* ── পেজ হেডার ── */
  .phead{ display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:2px; }
  .phead .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); margin-bottom:4px; }
  .card-h{ margin:0; font-size:22px; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .phead .sub{ display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12.5px; margin-top:5px; }
  .phead .sub .ic{ width:14px; height:14px; }
  .phead .acts{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ── KPI ── */
  .kpi{ display:flex; gap:13px; align-items:flex-start; }
  .kpi .ic-badge{ width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto; padding:0; gap:0; overflow:hidden;
    background:linear-gradient(180deg,var(--solid-1),var(--solid-4)); border:1px solid var(--line); color:var(--brand); box-shadow:var(--shadow-xs); }
  .kpi .ic-badge.icb-ok{ background:linear-gradient(180deg,#fff,var(--ok-bg)); border-color:var(--ok-line); color:var(--ok); }
  .kpi .ic-badge.icb-bad{ background:linear-gradient(180deg,#fff,var(--bad-bg)); border-color:var(--bad-line); color:var(--bad); }
  .kpi .ic-badge.icb-info{ background:linear-gradient(180deg,#fff,var(--info-bg)); border-color:var(--info-line); color:var(--info); }
  .kpi .lbl{ font-size:12px; font-weight:600; letter-spacing:.01em; color:var(--muted); }
  .kpi .v{ font-size:23px; font-weight:750; letter-spacing:-.025em; color:var(--ink); margin-top:3px; line-height:1.15; }
  .kpi .cap{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .kpi .v{ padding:0; } .kpi .v.v-ok{ color:var(--ok); } .kpi .v.v-bad{ color:var(--bad); }
  .stat .v{ font-size:23px; font-weight:750; letter-spacing:-.025em; margin-top:3px; color:var(--ink); }

  /* ── আইকন ── */
  .ic{ width:18px; height:18px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
  .ic-lg{ width:22px; height:22px; }
  .ic-xl{ width:28px; height:28px; }
  .ic-sm{ width:15px; height:15px; }

  /* ── বাটন ── */
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    background:linear-gradient(180deg,var(--btn-ink-1),var(--btn-ink-2)); color:#fff; border:1px solid var(--btn-ink-2);
    border-radius:var(--r-s); padding:9px 15px; font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer;
    box-shadow:0 1px 2px rgba(16,24,40,.16), inset 0 1px 0 rgba(255,255,255,.08); transition:transform .14s ease, box-shadow .16s ease, background .16s ease;
  }
  .btn:hover{ background:linear-gradient(180deg,var(--btn-ink-3),var(--btn-ink-4)); transform:translateY(-1px); box-shadow:0 6px 18px -8px rgba(11,18,32,.55); }
  .btn:active{ transform:translateY(0); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; box-shadow:none; transform:none; }
  .btn.s{ padding:7px 11px; font-size:12.5px; border-radius:var(--r-xs); gap:6px; }
  .btn.lg{ padding:12px 18px; font-size:14.5px; border-radius:var(--r-s); width:100%; }
  .btn.ghost{ background:var(--glass-1); color:var(--ink-2); border:1px solid var(--line); box-shadow:var(--shadow-xs); }
  .btn.ghost:hover{ background:var(--solid-1); border-color:var(--hover-line); color:var(--ink); }
  .btn.brand{ background:linear-gradient(180deg,#f59e0b,#d97706); border-color:#c2410c; box-shadow:0 1px 2px rgba(194,65,12,.25), inset 0 1px 0 rgba(255,255,255,.28); }
  .btn.brand:hover{ background:linear-gradient(180deg,#fbbf24,#db7f06); }
  .btn.danger{ background:linear-gradient(180deg,#e11d48,#be123c); border-color:#9f1239; }
  .btn.danger.ghost{ background:var(--glass-1); color:var(--bad); border-color:var(--bad-line); box-shadow:var(--shadow-xs); }
  .btn.danger.ghost:hover{ background:var(--bad-bg); }
  .btn.green{ background:linear-gradient(180deg,#059669,#047857); border-color:#065f46; }
  .btn.plain{ background:transparent; border-color:transparent; box-shadow:none; color:var(--muted); }
  .btn.plain:hover{ background:var(--line-3); color:var(--ink); transform:none; }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  /* ── টেবিল ── */
  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  thead th{ position:sticky; top:0; z-index:1; text-align:left; padding:10px 12px; background:var(--solid-3);
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); border-bottom:1px solid var(--line); }
  tbody td{ padding:11px 12px; border-bottom:1px solid var(--line-2); color:var(--body); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:0; }
  tbody tr{ transition:background .14s ease; }
  tbody tr:hover td{ background:var(--row-hover); }
  tfoot td{ padding:11px 12px; font-weight:700; color:var(--ink); border-top:1px solid var(--line); background:var(--solid-2); }
  .tableWrap{ overflow:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--glass-3); }
  .tableWrap table thead th{ background:var(--solid-4); }
  .tableWrap td .iconbtn{ display:inline-grid; vertical-align:middle; }
  .tableWrap td .iconbtn + .iconbtn{ margin-left:6px; }
  .amt{ text-align:right; font-weight:700; white-space:nowrap; }
  .amt.in{ color:var(--ok); } .amt.out{ color:var(--bad); } .amt.zero{ color:var(--faint); font-weight:600; }
  .tbl-empty{ text-align:center; color:var(--muted); padding:22px 12px !important; }

  /* ── পিল / ব্যাজ ── */
  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3.5px 10px; border-radius:999px;
    background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-line); white-space:nowrap; letter-spacing:.01em; }
  .pill.p-exp{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad-line); }
  .pill.p-grey{ background:var(--soft-2); color:var(--ink-2); border-color:var(--soft-line); }
  .pill.p-info{ background:var(--info-bg); color:var(--info); border-color:var(--info-line); }
  .pill .ic{ width:12px; height:12px; }
  .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; display:inline-block; }

  /* ── প্রগ্রেস / বার ── */
  .bar{ height:8px; background:var(--bar-bg); border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .bar > div{ height:100%; border-radius:999px; background:linear-gradient(90deg,#fbbf24,#d97706); transition:width .5s ease; }
  .bar > div.b-ok{ background:linear-gradient(90deg,#34d399,#047857); }
  .bar > div.b-bad{ background:linear-gradient(90deg,#fb7185,#be123c); }
  .bar > div.b-info{ background:linear-gradient(90deg,#60a5fa,#1d4ed8); }
  .catrow{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:12.5px; margin-bottom:10px; }
  .catrow .nm{ color:var(--ink-2); font-weight:600; }
  .catrow .vl{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .catrow .bar{ grid-column:1 / -1; margin-top:6px; height:7px; }

  /* ── অ্যাভাটার ── */
  .avatar{ width:38px;height:38px;border-radius:11px; display:grid; place-items:center; font-weight:700; font-size:14px;
    background:linear-gradient(150deg,#6366f1,#0ea5e9); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.28); flex:0 0 auto; }
  .avatar.g{ background:linear-gradient(150deg,#f59e0b,#ef4444); }
  .avatar.t{ background:linear-gradient(150deg,#10b981,#0d9488); }
  .avatar.p{ background:linear-gradient(150deg,#8b5cf6,#d946ef); }

  /* ── খালি অবস্থা ── */
  .empty{ text-align:center; color:var(--muted); padding:34px 16px; font-size:13px; display:flex; flex-direction:column;
    align-items:center; gap:10px; border:1px dashed var(--line); border-radius:var(--r); background:var(--surface-3); }
  .empty .ic{ width:26px;height:26px; color:var(--faint); }
  .empty .t{ color:var(--ink-2); font-weight:600; font-size:13.5px; }
  .empty .h{ font-size:12px; color:var(--muted); max-width:420px; line-height:1.6; }

  /* ── বার্তা ── */
  .warn,.err,.ok,.banner{ padding:12px 14px; border-radius:var(--r-s); font-size:12.5px; line-height:1.7;
    display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .warn{ background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-line); }
  .err{ background:var(--bad-bg); color:#9f1239; border:1px solid var(--bad-line); }
  .ok{ background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-line); }
  .banner{ background:rgba(255,255,255,.75); color:var(--ink-2); border:1px solid var(--line); }
  .warn .ic,.err .ic,.ok .ic,.banner .ic{ margin-top:1px; }
  .warn b,.err b{ font-weight:700; }
  .notice{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-s); font-size:12.5px;
    background:rgba(255,255,255,.7); border:1px solid var(--line); color:var(--ink-2); line-height:1.7; }

  /* ── ৪.৬: ছোট বার্তা-স্ট্রিপ (বড় বাক্স নয়) — লম্বা কথা "বিস্তারিত"-এর ভিতরে ── */
  .noticebar{ padding:8px 10px 8px 12px; font-size:12.5px; line-height:1.5; border-radius:12px; }
  .noticebar .nb-t{ display:inline-flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .noticebar .nb-t .ic{ flex:0 0 auto; }
  .noticebar .nb-sp{ flex:1 1 12px; }
  .noticebar .nb-toggle{ flex:0 0 auto; display:inline-flex; align-items:center; gap:3px; font:inherit; font-weight:600;
    font-size:11.5px; padding:3px 8px; border-radius:999px; cursor:pointer; background:rgba(255,255,255,.6);
    border:1px solid currentColor; color:inherit; opacity:.85; }
  .noticebar .nb-toggle:hover{ opacity:1; }
  .noticebar .nb-toggle .ic{ transition:transform .18s ease; }
  .noticebar.open .nb-toggle .ic{ transform:rotate(180deg); }
  .noticebar .nb-act{ flex:0 0 auto; padding:5px 10px !important; font-size:11.5px !important; }
  .noticebar .nb-body{ flex:1 1 100%; display:none; margin-top:7px; line-height:1.65; opacity:.95; }
  .noticebar.open .nb-body{ display:block; }
  /* এক লাইনে আঁটে না এমন জায়গার জন্য (যেমন লগইন কার্ড) — ছোট রূপ */
  .noticebar.nb-mini{ flex-wrap:nowrap; align-items:center; }
  .noticebar.nb-mini .nb-t{ display:block; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .noticebar.nb-mini .nb-t .ic{ vertical-align:-3px; margin-right:4px; }
  .noticebar.nb-mini .nb-toggle .nb-lbl{ display:none; }
  .noticebar.nb-mini.open{ flex-wrap:wrap; }
  .noticebar.nb-mini.open .nb-t{ white-space:normal; }
  @media(max-width:560px){ .noticebar .nb-toggle .nb-lbl{ display:none; } }
  @media(max-width:520px){
    .noticebar{ padding:8px 10px; }
    .noticebar .nb-toggle span, .noticebar .nb-toggle{ font-size:11px; }
    .noticebar .nb-t{ font-size:12px; }
  }

  /* ── ডায়াগনস্টিক ── */
  .diag{ font-family:var(--fm); font-size:11.5px; background:#0b1220; color:#cbd5e1; padding:14px; border-radius:var(--r-s);
    white-space:pre-wrap; max-height:280px; overflow:auto; line-height:1.65; border:1px solid #1e293b;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05); }
  .mono{ font-family:var(--fm); }

  /* ── ফর্ম ── */
  .stack{ display:flex; flex-direction:column; gap:13px; }
  label{ display:block; font-size:12.5px; color:var(--body); }
  label .lbl{ display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink-2); margin-bottom:6px; font-size:12.5px; }
  label .lbl .ic{ color:var(--muted); width:16px; height:16px; }
  input,select,textarea{ font-family:inherit; }
  label input,label select,label textarea,.input{
    width:100%; border:1px solid var(--field-line); border-radius:var(--r-s); padding:10px 12px; font-size:13.5px; color:var(--ink);
    background:var(--field-bg); transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  label input:hover,label select:hover,label textarea:hover,.input:hover{ border-color:var(--field-line-2); }
  label input:focus,label select:focus,label textarea:focus,.input:focus{
    outline:none; border-color:var(--brand-2); background:var(--field-bg-focus); box-shadow:0 0 0 4px rgba(245,158,11,.14);
  }
  label input::placeholder,label textarea::placeholder{ color:var(--field-ph); }
  label select{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; padding-right:32px; cursor:pointer; }
  .fhint{ font-size:11.5px; color:var(--faint); margin-top:5px; }
  .req{ color:var(--bad); }
  .hide{ display:none !important; }
  @media(max-width:680px){ .hide-sm{ display:none !important; } }
  .formErr{ margin-bottom:12px; }

  /* ── লগইন / স্প্ল্যাশ ── */
  .auth-wrap{ min-height:100vh; display:grid; place-items:center; padding:20px; position:relative; z-index:1; }
  .auth-shell{ width:100%; max-width:1000px; display:grid; grid-template-columns:1.05fr .95fr; gap:0;
    background:var(--surface); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--line); border-radius:26px; box-shadow:var(--shadow-l); overflow:hidden; }
  @media(max-width:880px){ .auth-shell{ grid-template-columns:1fr; max-width:460px; } .auth-side{ display:none !important; } }
  .auth-side{ position:relative; padding:38px 34px; color:#dbe3ef; display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(165deg,#0a1120 0%, #111c33 55%, #1b2745 100%); }
  .auth-side::after{ content:''; position:absolute; inset:auto 0 0 0; height:60%; pointer-events:none;
    background:radial-gradient(440px 260px at 20% 118%, rgba(217,119,6,.30) 0%, rgba(217,119,6,0) 72%); }
  .auth-side .mark{ width:46px;height:46px;border-radius:13px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(160deg,#fbbf24,#c2410c); box-shadow:0 16px 34px -14px rgba(194,65,12,.95), inset 0 1px 0 rgba(255,255,255,.35); }
  .auth-side h2{ color:#fff; font-size:25px; letter-spacing:-.02em; margin:20px 0 6px; }
  .auth-side .tg{ color:#93a5c1; font-size:13.5px; line-height:1.65; max-width:330px; }
  .auth-side .feats{ margin-top:26px; display:flex; flex-direction:column; gap:13px; position:relative; z-index:1; }
  .auth-side .feat{ display:flex; gap:11px; align-items:flex-start; font-size:13px; color:#c3cfe2; }
  .auth-side .feat .tick{ width:26px;height:26px;border-radius:8px; display:grid; place-items:center; flex:0 0 auto;
    background:rgba(245,158,11,.16); border:1px solid rgba(245,158,11,.3); color:#fbbf24; }
  .auth-side .foot{ position:relative; z-index:1; font-size:11.5px; color:#7e91ad; display:flex; align-items:center; gap:8px; }
  .auth-side .foot2{ position:relative; z-index:1; margin-top:14px; }
  .auth-side .foot2 .lang{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); }
  .auth-side .foot2 .lang button{ color:#c3cfe2; }
  .auth-side .foot2 .lang button.on{ background:#fff; color:#0b1220; }
  .auth-card{ padding:30px 28px; background:rgba(255,255,255,.55); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%); display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .auth-card .brandline{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:20px; }
  .auth-card .brandline.hero{ margin-bottom:22px; }
  .auth-logo.hero{ width:76px; height:76px; border-radius:22px; display:grid; place-items:center; overflow:hidden; padding:0;
    box-shadow:0 14px 34px -12px rgba(217,119,6,.75), 0 0 0 1px rgba(251,191,36,.35) inset;
    animation:logoPop .45s cubic-bezier(.2,.9,.3,1.2); }
  .auth-logo.hero .appmark{ width:76px; height:76px; display:block; }
  .mark .appmark, .mark.hero-mark .appmark{ width:100%; height:100%; display:block; border-radius:inherit; }
  .drawer .dr-head .mark{ overflow:hidden; }
  .auth-side .mark.hero-mark{ padding:0; overflow:hidden; }
  @keyframes logoPop{ from{ transform:scale(.86); opacity:0 } to{ transform:none; opacity:1 } }
  .auth-card h2{ text-align:center; }
  .auth-card .auth-sub{ text-align:center; }
  .forgot-row{ display:flex; justify-content:center; margin-top:12px; }
  .linkbtn{ display:inline-flex; align-items:center; gap:7px; background:transparent; border:0; cursor:pointer;
    color:var(--brand-3); font-size:13px; font-weight:600; font-family:inherit; padding:7px 10px; border-radius:10px; }
  .linkbtn:hover{ background:var(--brand-soft); }
  .linkbtn:disabled{ opacity:.6; cursor:default; }
  .forgot-row.hide{ display:none; }
  .auth-logo{ width:46px;height:46px;border-radius:13px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(160deg,#fbbf24,#c2410c); box-shadow:0 14px 30px -14px rgba(194,65,12,.9), inset 0 1px 0 rgba(255,255,255,.32); }
  .auth-card h2{ font-size:20.5px; text-align:left; letter-spacing:-.02em; margin:0 0 5px; }
  .auth-sub{ color:var(--muted); font-size:12.5px; margin:0 0 16px; }
  .auth-status{ display:flex; justify-content:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .helper{ margin-top:16px; border-top:1px solid var(--line-2); padding-top:12px; }
  .helper summary{ cursor:pointer; font-size:12px; color:var(--muted); font-weight:600; list-style:none; display:flex; align-items:center; gap:7px; }
  .helper summary::-webkit-details-marker{ display:none; }
  .helper summary::before{ content:''; width:14px;height:14px;border-radius:50%; border:1.5px solid var(--faint); display:inline-block;
    background:radial-gradient(circle at 50% 40%, var(--faint) 0 22%, transparent 24%); }
  .helper summary:hover{ color:var(--ink-2); }
  .splash-note{ font-size:11.5px; color:var(--muted); margin-top:14px; line-height:1.75; text-align:center; }

  /* ── ট্যাব ── */
  .tabs{ display:flex; gap:4px; margin-bottom:18px; background:rgba(15,23,42,.045); border:1px solid var(--line); border-radius:var(--r-s); padding:4px; }
  .tabs button{ flex:1; padding:9px 10px; border-radius:var(--r-xs); border:none; font-weight:600; font-size:13px; cursor:pointer;
    font-family:inherit; background:transparent; color:var(--muted); transition:.16s; }
  .tabs button:hover{ color:var(--ink-2); }
  .tabs button.on{ background:var(--solid-1); color:var(--ink); box-shadow:var(--shadow-xs); font-weight:700; }

  /* ── মডাল ── */
  .modal{ position:fixed; inset:0; background:rgba(11,18,32,.42); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    display:flex; align-items:center; justify-content:center; padding:16px; z-index:80; animation:fade .18s ease; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .modal .box{ background:rgba(255,255,255,.97); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:var(--r-l); width:100%; max-width:560px; max-height:92vh; overflow:auto;
    box-shadow:var(--shadow-l); animation:pop .2s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop{ from{ transform:translateY(10px) scale(.985); opacity:.6 } to{ transform:none; opacity:1 } }
  .modal .head{ padding:16px 20px; border-bottom:1px solid var(--line); font-weight:700; color:var(--ink);
    display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:15px; letter-spacing:-.01em; position:sticky; top:0;
    background:rgba(255,255,255,.96); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); z-index:1; }
  .modal .body{ padding:20px; }

  /* ── ৪.৫: অ্যাপ আইকনের প্রদীপ — শিখা হালকা করে নড়ে, আভা ধীরে শ্বাস নেয় ── */
  .appmark .flame, .appmark .flame-in{ transform-box:fill-box; transform-origin:50% 100%; will-change:transform; }
  .appmark .flame{ animation:flameFlick 2.9s ease-in-out infinite; }
  .appmark .flame-in{ animation:flameFlickIn 2.1s ease-in-out infinite; }
  .appmark .halo{ transform-box:fill-box; transform-origin:50% 62%; animation:haloPulse 3.4s ease-in-out infinite; }
  @keyframes flameFlick{
    0%,100%{ transform:scale(1,1) rotate(0deg); }
    18%{ transform:scale(.97,1.05) rotate(-1.4deg); }
    38%{ transform:scale(1.03,.96) rotate(1.1deg); }
    58%{ transform:scale(.985,1.03) rotate(-.7deg); }
    78%{ transform:scale(1.02,.98) rotate(.6deg); }
  }
  @keyframes flameFlickIn{
    0%,100%{ transform:scale(1,1) rotate(0deg); opacity:.95; }
    30%{ transform:scale(.94,1.08) rotate(1.6deg); opacity:.9; }
    65%{ transform:scale(1.05,.94) rotate(-1.2deg); opacity:1; }
  }
  @keyframes haloPulse{ 0%,100%{ opacity:.75; transform:scale(1) } 50%{ opacity:1; transform:scale(1.06) } }
  @media (prefers-reduced-motion: reduce){
    .appmark .flame, .appmark .flame-in, .appmark .halo{ animation:none !important; }
  }

  /* ── ৪.৬: খাতা (লেজার) — দুই ভাগ, চলতি ব্যালেন্স ── */
  .ledger-seg{ display:inline-flex; gap:4px; padding:4px; margin-bottom:14px; border-radius:14px;
    background:var(--glass-2); border:1px solid var(--line); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .ledger-seg button{ display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; font:inherit;
    font-size:13px; font-weight:650; color:var(--muted); padding:9px 15px; border-radius:11px; background:transparent; transition:.16s; }
  .ledger-seg button .ic{ width:17px; height:17px; }
  .ledger-seg button:hover{ color:var(--ink-2); background:var(--soft-2); }
  .ledger-seg button.on{ background:var(--solid-1); color:var(--brand-3); box-shadow:var(--shadow-s); }
  tr.ledger-open td{ background:var(--brand-soft); font-size:12.5px; }
  tr.ledger-cur td{ background:var(--brand-soft); }
  table tfoot .bal{ font-weight:750; }
  @media(max-width:520px){
    .ledger-seg{ display:flex; width:100%; }
    .ledger-seg button{ flex:1 1 0; justify-content:center; font-size:12.5px; padding:9px 8px; }
  }
  :root[data-theme="dark"] tr.ledger-open td, :root[data-theme="dark"] tr.ledger-cur td{ background:rgba(245,158,11,.10); }

  /* ── টোস্ট সিস্টেম (৪.৪) — একাধিক বার্তা সাজিয়ে দেখায় ── */
  /* ৪.৫ — বার্তা এখন উপরে (হেডারের ঠিক নিচে, ডান কোণে); নতুন বার্তা সবচেয়ে নিচে */
  .toasts{ position:fixed; right:18px; top:64px; z-index:400; display:flex; flex-direction:column; gap:9px;
    width:min(380px, calc(100vw - 28px)); pointer-events:none; }
  .toasts > *{ pointer-events:auto; }
  .toast{ position:relative; display:flex; align-items:flex-start; gap:11px; width:100%; max-width:none;
    padding:13px 14px; border-radius:14px; font-size:13.2px; line-height:1.5; color:var(--ink);
    background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--line); border-left:4px solid var(--brand);
    box-shadow:var(--shadow-l), 0 10px 30px -14px rgba(15,23,42,.35);
    animation:toastIn .26s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes toastIn{ from{ transform:translateY(-14px) scale(.985); opacity:0 } to{ transform:none; opacity:1 } }
  .toast.out{ animation:toastOut .22s ease forwards; }
  @keyframes toastOut{ to{ transform:translateY(-12px) scale(.985); opacity:0 } }
  .toast .toast-ic{ flex:0 0 auto; width:26px; height:26px; border-radius:9px; display:grid; place-items:center; margin-top:1px; }
  .toast .toast-tx{ flex:1 1 auto; min-width:0; padding-top:2px; word-break:break-word; }
  .toast .toast-x{ flex:0 0 auto; width:24px; height:24px; border:0; background:transparent; color:var(--faint);
    border-radius:7px; display:grid; place-items:center; cursor:pointer; padding:0; }
  /* ৪.৬: টোস্টের ভিতরের কাজের বাটন (যেমন "ফিরিয়ে আনুন") + সময়ের রেখা */
  .toast .toast-act{ flex:0 0 auto; align-self:center; border:1px solid var(--line); background:var(--solid-1); color:var(--ink-2);
    font:inherit; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:9px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:6px; transition:.15s; }
  .toast .toast-act:hover{ background:var(--brand-soft); border-color:rgba(217,119,6,.35); color:var(--brand-3); }
  .toast .toast-act .toast-secs{ min-width:1.1em; text-align:right; color:var(--brand-3); font-variant-numeric:tabular-nums; }
  .toast .toast-bar{ position:absolute; left:0; right:0; bottom:0; height:3px; border-radius:0 0 14px 14px;
    background:linear-gradient(90deg,var(--brand-2),var(--brand)); transform-origin:left center;
    animation:toastBar linear forwards; }
  .toast.t-ok .toast-bar{ background:linear-gradient(90deg,#10b981,#047857); }
  .toast.t-err .toast-bar{ background:linear-gradient(90deg,#f43f5e,#be123c); }
  .toast.t-warn .toast-bar{ background:linear-gradient(90deg,#fbbf24,#b45309); }
  .toast.t-info .toast-bar{ background:linear-gradient(90deg,#60a5fa,#1d4ed8); }
  @keyframes toastBar{ from{ transform:scaleX(1) } to{ transform:scaleX(0) } }
  :root[data-theme="dark"] .toast .toast-act{ background:rgba(148,163,184,.12); border-color:#2b3752; color:#dbe3ef; }
  :root[data-theme="dark"] .toast .toast-act:hover{ background:rgba(245,158,11,.16); color:#fcd34d; }
  .toast .toast-x:hover{ background:var(--soft-2); color:var(--ink-2); }
  .toast.t-ok{ border-left-color:#10b981; }
  .toast.t-ok .toast-ic{ background:rgba(16,185,129,.14); color:#047857; }
  .toast.t-err{ border-left-color:#e11d48; }
  .toast.t-err .toast-ic{ background:rgba(225,29,72,.13); color:#be123c; }
  .toast.t-warn{ border-left-color:#f59e0b; }
  .toast.t-warn .toast-ic{ background:rgba(245,158,11,.16); color:#b45309; }
  .toast.t-info{ border-left-color:#3b82f6; }
  .toast.t-info .toast-ic{ background:rgba(59,130,246,.14); color:#1d4ed8; }
  @media(max-width:520px){
    .toasts{ left:50%; right:auto; transform:translateX(-50%); top:10px; width:calc(100vw - 24px); }
    .toast{ animation:toastInM .26s cubic-bezier(.2,.9,.3,1.15); }
    @keyframes toastInM{ from{ transform:translateY(-14px) scale(.98); opacity:0 } to{ transform:none; opacity:1 } }
  }
  @media print{ .toasts{ display:none !important; } }
  :root[data-theme="dark"] .toast{ background:rgba(17,24,39,.94); border-color:#26314a; color:#e6ecf7; }
  :root[data-theme="dark"] .toast .toast-x{ color:#8b9cba; }
  :root[data-theme="dark"] .toast .toast-x:hover{ background:rgba(148,163,184,.16); color:#e6ecf7; }
  :root[data-theme="dark"] .toast.t-ok .toast-ic{ background:rgba(16,185,129,.2); color:#6ee7b7; }
  :root[data-theme="dark"] .toast.t-err .toast-ic{ background:rgba(225,29,72,.22); color:#fda4af; }
  :root[data-theme="dark"] .toast.t-warn .toast-ic{ background:rgba(245,158,11,.22); color:#fcd34d; }
  :root[data-theme="dark"] .toast.t-info .toast-ic{ background:rgba(59,130,246,.22); color:#93c5fd; }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; }
  .spin-d{ width:26px; height:26px; border:3px solid rgba(217,119,6,.18); border-top-color:var(--brand); border-radius:50%; animation:sp .8s linear infinite; margin:0 auto; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* ── বিবিধ ── */
  summary{ outline:none; }
  .hidecode{ user-select:all; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(100,116,139,.35); border-radius:999px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(100,116,139,.55); background-clip:content-box; }
  .filterbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .filterbar .input{ max-width:300px; padding-left:34px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='6.3'/><path d='M20 20l-4.7-4.7'/></svg>");
    background-repeat:no-repeat; background-position:11px center; }
  .seg{ display:inline-flex; background:rgba(15,23,42,.045); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .seg button{ border:0; background:transparent; padding:6px 13px; border-radius:999px; font-size:12px; font-weight:600; color:var(--muted);
    cursor:pointer; font-family:inherit; transition:.16s; }
  .seg button.on{ background:var(--solid-1); color:var(--ink); box-shadow:var(--shadow-xs); }
  .metagrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px 18px; }
  .metagrid .k{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .metagrid .va{ color:var(--ink); font-weight:600; font-size:13px; margin-top:3px; }
  .qa{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }

  /* ═══════════ PDF / প্রিন্ট — শুধু রিপোর্ট ═══════════ */
  /* ═══════════ থিম: সিস্টেম / হালকা / গাঢ় (৪.১) ═══════════ */
  :root{ color-scheme:light; }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e9eff8; --ink-2:#cdd7e6; --body:#b4c0d2; --muted:#8b9ab1; --faint:#6f7f97;
    --line:#26324b; --line-2:#1e2840; --line-3:rgba(255,255,255,.08);
    --bg:#070b14;
    --surface:rgba(19,26,42,.82); --surface-2:rgba(19,26,42,.6); --surface-3:rgba(19,26,42,.42);
    --glass-1:rgba(21,29,47,.88); --glass-2:rgba(21,29,47,.8); --glass-3:rgba(21,29,47,.62);
    --solid-1:#151d2f; --solid-2:#131a2b; --solid-3:#182033; --solid-4:#161e30;
    --row-hover:rgba(255,255,255,.04); --soft-2:#1d273c; --soft-line:#2b3852; --bar-bg:#1b2336; --hover-line:#33415e;
    --field-bg:rgba(13,19,33,.72); --field-bg-focus:rgba(13,19,33,.9); --field-line:#2b3852; --field-line-2:#3a4a6b; --field-ph:#63748f;
    --btn-ink-1:#243149; --btn-ink-2:#1a2338; --btn-ink-3:#2c3b57; --btn-ink-4:#212c45;
    --brand-soft:rgba(217,119,6,.14);
    --ok:#34d399; --ok-2:#10b981; --ok-bg:rgba(5,150,105,.14); --ok-line:rgba(52,211,153,.3);
    --bad:#fb7185; --bad-2:#f43f5e; --bad-bg:rgba(190,18,60,.16); --bad-line:rgba(251,113,133,.3);
    --info:#8ab4ff; --info-bg:rgba(29,78,216,.18); --info-line:rgba(138,180,255,.3);
    --warn-bg:rgba(217,119,6,.15); --warn-line:rgba(245,158,11,.34); --warn-ink:#fcd34d;
    --shadow-xs:0 1px 2px rgba(0,0,0,.5);
    --shadow-s:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -14px rgba(0,0,0,.7);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 40px -22px rgba(0,0,0,.85);
    --shadow-l:0 34px 80px -30px rgba(0,0,0,.9);
    --navy-1:#060a13; --navy-2:#0b1322; --navy-3:#101a2e;
  }
  :root[data-theme="dark"] body{
    background-image:
      radial-gradient(900px 420px at 6% -8%, rgba(217,119,6,.16) 0%, rgba(217,119,6,0) 62%),
      radial-gradient(760px 420px at 100% -6%, rgba(59,130,246,.14) 0%, rgba(59,130,246,0) 60%),
      linear-gradient(180deg,#080d18 0%, #070b14 58%, #060a12 100%);

<script>
"use strict";
/* ============ Safe storage ============ */
const mem = {};
let STORE_PERSISTENT = true;      // localStorage না থাকলে (sandbox/preview) false — তখন সতর্কবার্তা দেখানো হয়
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v===null?null:v; } catch(e){ STORE_PERSISTENT = false; return k in mem?mem[k]:null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ STORE_PERSISTENT = false; mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ STORE_PERSISTENT = false; delete mem[k]; } }
};

/* ═══════════════ ভাষা: বাংলা / English ═══════════════ */
let LANG = 'en';   /* ৪.১: ডিফল্ট English — সেটিংস/টপবার থেকে বাংলায় বদলানো যায় */
try { const sv = store.get('ps_lang'); if (sv === 'en' || sv === 'bn') LANG = sv; } catch(e){}
function L2(bn, en){ return LANG === 'en' ? en : bn; }
function setLang(l){
  LANG = (l === 'en') ? 'en' : 'bn';
  try { store.set('ps_lang', LANG); } catch(e){}
  try { document.documentElement.lang = LANG; } catch(e){}
}
function langBtns(cls){

}
/* ডেটা সবসময় বাংলা মানেই জমে (আগের ডেটার সঙ্গে মিল থাকতে) — শুধু দেখানোর সময় অনুবাদ হয় */

  'অনুদান':'Grant','অন্যান্য আয়':'Other income',

/* শুধু http/https ঠিকানাতেই Firebase চলে। ফাইল/content থেকে খুললে (ফোনের Files অ্যাপ, Drive, ইত্যাদি)
   ব্রাউজার Firebase-কে ব্লক করে — তাই সেখানে সরাসরি ডেমো মোড, কোনো এরর নয়। */
const WEB_ORIGIN = (typeof location !== 'undefined' && (location.protocol === 'http:' || location.protocol === 'https:'));
const FORCE_DEMO = !WEB_ORIGIN;
const USE_FB = WEB_ORIGIN && !FORCE_DEMO && !!(FB && FB.apiKey && !FB.apiKey.includes('YOUR_'));
let DEMO_FALLBACK = false, DEMO_REASON = '';
function useFb(){ return USE_FB && !DEMO_FALLBACK; }
function goDemo(reason){ DEMO_FALLBACK = true; DEMO_REASON = reason || ''; scopeMode = null; }

/* ============ Firebase loader (CDN) ============ */
let fb = { app:null, auth:null, db:null, ready:false, loading:null };
function loadFirebase(){
  if (fb.loading) return fb.loading;
  const p = new Promise((resolve, reject) => {
    const fail = (e) => { fb.loadErr = e; reject(e); };
    if (typeof firebase !== 'undefined' && firebase.app) {
      try { initFb(); return resolve(true); } catch(e){ return fail(e); }
    }
    const v = '10.12.2';
    const urls = [
      'https://www.gstatic.com/firebasejs/' + v + '/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/' + v + '/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/' + v + '/firebase-firestore-compat.js'
    ];
    let i = 0, done = false;
    (function next(){
      if (done) return;
      if (i >= urls.length){ try { initFb(); done = true; resolve(true); } catch(e){ done = true; fail(e); } return; }
      const s = document.createElement('script');
      const tm = setTimeout(() => {
        if (done) return; done = true;
        try { s.remove(); } catch(_){}
        fail(new Error(L2('Firebase স্ক্রিপ্ট লোড হলো না (নেটওয়ার্ক/সিডিএন ব্লকড?)', 'Firebase script did not load (network/CDN blocked?)')));
      }, 7000);
      s.src = urls[i++];
      s.onload = () => { clearTimeout(tm); next(); };
      s.onerror = () => { clearTimeout(tm); if (done) return; done = true; fail(new Error(L2('Firebase স্ক্রিপ্ট লোড ব্যর্থ (সিডিএন ব্লকড?)', 'Firebase script failed to load (CDN blocked?)'))); };
      document.head.appendChild(s);
    })();
  });
  fb.loading = p.catch(e => { fb.loading = null; throw e; });   // ব্যর্থ হলে পরে আবার চেষ্টা করা যাবে
  return fb.loading;
}
function initFb(){
  if (fb.ready) return;
  firebase.initializeApp(FB);
  fb.auth = firebase.auth();
  fb.db = firebase.firestore();
  fb.ready = true;
}

/* ============ Data layer ============ */
const COLS = ['events','members','transactions','donors','organizations','users','orgMembers','orgInvites'];
function lc(col){ return 'ps_'+col; }
async function listDemo(col, key){ try { return JSON.parse(store.get(key || lc(col))||'[]'); } catch(e){ return []; } }
function saveDemo(col, arr, key){ store.set(key || lc(col), JSON.stringify(arr)); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function fbTimeout(p, ms, what){
  /* ৪.৬: ইন্টারনেট ধীর হলে যে বার্তা আসে, সেটাও বাছা ভাষায় */
  const w = what || 'Firebase';
  const EN = {
    'সংরক্ষণ':'Saving','হালনাগাদ':'Updating','মুছে ফেলা':'Deleting','পড়া':'Reading','ফিরিয়ে আনা':'Restoring',
    'মাইগ্রেশন':'Moving data','লগইন':'Signing in','লগআউট':'Signing out','রিসেট ইমেইল':'Sending reset email',
    'অ্যাকাউন্ট তৈরি':'Creating account','সংগঠন তৈরি':'Creating organization','সংগঠন বদল':'Switching organization',
    'প্রোফাইল সংরক্ষণ':'Saving profile','প্রোফাইল পড়া':'Reading profile','write test':'Write test','Firebase':'Firebase'
  };
  const en = EN[w] || (LANG === 'en' ? 'The request' : w);
  return withTimeout(p, ms || 18000, L2(w + ' — সময় শেষ', en + ' — timed out'));
}
/* কোন ধরনের কুয়েরি এই প্রজেক্টের নিয়মে অনুমোদিত, তা একবার পরীক্ষা করে ঠিক করা হয় */
async function detectScope(orgId){
  if (scopeMode) return scopeMode;
  if (!orgId){ scopeMode = 'event'; return scopeMode; }
  await loadFirebase();
  try {
    await fbGet(fb.db.collection('members').where('orgId','==',orgId).limit(1), 'অনুমতি পরীক্ষা');
    scopeMode = 'org';
  } catch(e){
    if (permDenied(e)) { scopeMode = 'event'; }
    else { scopeMode = 'org'; }   // নেটওয়ার্ক সমস্যা — পরের বার আবার চেষ্টা হবে
  }
  return scopeMode;
}
function fbDocs(snap){ return snap.docs.map(d => ({ id:d.id, ...d.data() })); }
/* সার্ভার থেকে পড়া হয় আগে — SDK-এর ক্যাশে অসম্পূর্ণ/ব্যর্থ লেখা থাকলে সেটা আসল ডেটা বলে ভুল না হয় */
async function fbGet(ref, label){
  try { return await fbTimeout(ref.get({ source:'server' }), 18000, label); }
  catch(e){
    if (permDenied(e)) throw e;
    return await fbTimeout(ref.get(), 18000, label);   // ইন্টারনেট নেই → ক্যাশে থেকে চেষ্টা
  }
}
let WRITE_BLOCKED = false;          // নিয়ম লেখা আটকালে true
let WRITE_MSG = '';
/* ব্রাউজার-সেভ মোড: Firebase লগইন থাকবে, কিন্তু ডেটা এই ব্রাউজারেই জমবে (rules দরকার নেই) */
let LOCAL_STORE = false;
try { LOCAL_STORE = (store.get('ps_local_mode') === '1'); } catch(e){}
async function setLocalMode(on){
  LOCAL_STORE = !!on;
  try { store.set('ps_local_mode', on ? '1' : '0'); } catch(e){}
  /* মোড বদলালে স্ক্রিনে যা দেখা যাচ্ছে তা লোকাল স্টোরে কপি হয় — অ্যাপ হঠাৎ খালি দেখায় না */
  if (on && state.user){
    const pairs = [['events',state.events],['members',state.members],['transactions',state.transactions],['donors',state.donors]];
    for (const [col, arr] of pairs){
      try {
        const key = 'ps_u_' + state.user.uid + '_' + col;
        const have = await listDemo(col, key);
        if ((!have || !have.length) && arr && arr.length) saveDemo(col, arr.map(x => ({ ...x })), key);
      } catch(e){}
    }
  }
}
function dataLocal(){ return !useFb() || LOCAL_STORE; }
/* লোকাল ডেটা অ্যাকাউন্ট-ভিত্তিক আলাদা রাখা হয়, যাতে একাধিক অ্যাকাউন্ট মিশে না যায় */
function localKey(col){ return (LOCAL_STORE && state.user && state.user.uid) ? ('ps_u_' + state.user.uid + '_' + col) : lc(col); }
function markWriteBlocked(e){
  if (permDenied(e)){ WRITE_BLOCKED = true; WRITE_MSG = L2('Firestore নিরাপত্তা-নিয়ম ডেটা সেভ করতে দিচ্ছে না (পরীক্ষায় দেখা গেছে: transactions / members / donors লেখা ও পড়া নিষিদ্ধ)।', 'Firestore security rules are not allowing data to be saved (tested: writing and reading transactions / members / donors are blocked).'); }
}
function dedupe(arr){ const t = {}; return arr.filter(x => t[x.id] ? false : (t[x.id] = true)); }

async function listDocs(col, orgId, eventIds){
  RULES_ISSUES = [];        // প্রতিবার তালিকা আনার সময় নতুন করে হিসাব হয় (পুরনো সতর্কতা জমে থাকে না)
  if (dataLocal()){
    let arr = await listDemo(col, localKey(col));
    if (orgId && col === 'events') arr = arr.filter(x => x.orgId === orgId || !x.orgId);
    return arr;
  }
  await loadFirebase();
  const c = fb.db.collection(col);

  if (col === 'events'){
    if (orgId){
      try { return fbDocs(await fbGet(c.where('orgId','==',orgId), 'পূজার তালিকা')); }
      catch(e){ if (permDenied(e)) noteBlocked('পূজার তালিকা (orgId)'); else noteWarn(fbErrMsg(e)); }
    }
    try { const all = fbDocs(await fbGet(c, 'পূজার তালিকা')); return orgId ? all.filter(x => !x.orgId || x.orgId === orgId) : all; }
    catch(e){ if (permDenied(e)){ if (orgId) noteBlocked('পূজার তালিকা (ফিল্টার ছাড়া)'); } else noteWarn(fbErrMsg(e)); return []; }
  }

  const mode = await detectScope(orgId);
  if (mode === 'org'){
    try {
      const got = fbDocs(await fbGet(c.where('orgId','==',orgId), col + ' তালিকা'));
      if (got.length) return got;
      /* ফাঁকা ফলাফল এলেও থামা যাবে না — নিরাপত্তা-নিয়মে ফাঁকা কুয়েরি "সফল" দেখাতে পারে,
         তাই eventId দিয়েও যাচাই করা হয় (তাহলে ডেটা কোনোভাবেই হারাবে না) */
    }
    catch(e){
      if (permDenied(e)){ scopeMode = 'event'; noteBlocked(col + ' তালিকা (orgId)'); }
      else noteWarn(fbErrMsg(e));
    }
  }
  const ids = eventIds || [];
  if (!ids.length) return [];
  const out = [];
  for (let k = 0; k < ids.length; k++){
    try { fbDocs(await fbGet(c.where('eventId','==',ids[k]), col + ' তালিকা')).forEach(x => out.push(x)); }
    catch(e){ if (permDenied(e)) noteBlocked(col + ' তালিকা (eventId)'); else noteWarn(fbErrMsg(e)); }
  }
  return dedupe(out);
}

async function addDoc(col, data){
  const org = state.currentOrgId || '';
  const payload = { ...data };
  if (col !== 'users' && col !== 'organizations'){
    if (payload.orgId === undefined && org) payload.orgId = org;
    if (payload.eventId === undefined && col !== 'events' && state.selectedEventId) payload.eventId = state.selectedEventId;
  }
  if (!dataLocal()){
    await loadFirebase();
    try {
      const ref = await fbTimeout(fb.db.collection(col).add({ ...payload, createdAt: Date.now() }), 20000, 'সংরক্ষণ');
      return { id: ref.id, ...payload };
    } catch(e){
      /* লগআউট/রিকানেক্টের সময় SDK নিজের পাঠানো লেখাটিই আবার পাঠায় → already-exists।
         ডেটা সেভ হয়েই আছে, তাই এটিকে সফল ধরা হয়। */
      if (errCode(e) === 'already-exists' || /already exists/i.test(errCode(e))) return { id: '', ...payload };
      markWriteBlocked(e);
      throw e;
    }
  }
  const key = localKey(col);
  const arr = await listDemo(col, key);
  const item = { ...payload, id: 'id_' + uid(), createdAt: Date.now() };
  arr.push(item); saveDemo(col, arr, key); return item;
}

async function updDoc(col, id, data){
  if (!dataLocal()){
    await loadFirebase();
    try { await fbTimeout(fb.db.collection(col).doc(id).set(data, { merge:true }), 20000, 'হালনাগাদ'); }
    catch(e){ markWriteBlocked(e); throw e; }
    return { id, ...data };
  }
  const key = localKey(col);
  const arr = await listDemo(col, key);
  const i = arr.findIndex(x => x.id === id);
  if (i >= 0){ arr[i] = { ...arr[i], ...data }; saveDemo(col, arr, key); }
  return { id, ...data };
}

async function delDoc(col, id){
  if (!dataLocal()){ await loadFirebase(); try { await fbTimeout(fb.db.collection(col).doc(id).delete(), 20000, 'মুছে ফেলা'); } catch(e){ markWriteBlocked(e); throw e; } return; }
  const key = localKey(col);
  const arr = (await listDemo(col, key)).filter(x => x.id !== id); saveDemo(col, arr, key);
}

/* ৪.৬ — ভুলে মুছে ফেললে ফিরিয়ে আনা (Undo, ১০ সেকেন্ড) */
async function fetchDoc(col, id){
  const arr = state[col] || [];
  const hit = arr.find(x => x.id === id);
  if (hit) return JSON.parse(JSON.stringify(hit));
  if (!dataLocal()){
    try {
      await loadFirebase();
      const snap = await fbTimeout(fb.db.collection(col).doc(id).get(), 20000, 'পড়া');
      return snap && snap.exists ? snap.data() : null;
    } catch(e){ return null; }
  }
  return null;
}
async function restoreDoc(col, id, data){
  if (!data) return;
  if (!dataLocal()){
    await loadFirebase();
    await fbTimeout(fb.db.collection(col).doc(id).set(data), 20000, 'ফিরিয়ে আনা');
    return;
  }
  const key = localKey(col);
  const arr = await listDemo(col, key);
  if (!arr.some(x => x.id === id)) arr.push({ ...data, id });
  saveDemo(col, arr, key);
}
/* এক বা একাধিক রেকর্ড একসাথে মোছা + ফিরিয়ে আনার সুবিধা */
async function softDeleteMany(items, msg, restoreMsg){
  const saved = [];
  for (const it of items){
    const data = await fetchDoc(it.col, it.id);
    if (data) saved.push({ ...it, data });
    try { await delDoc(it.col, it.id); } catch(e){ /* নিচে বার্তা */ }
  }
  if (!saved.length){ toast(L2('মুছে ফেলা যায়নি', 'Could not delete'), 'err'); return; }
  try { await reload(); } catch(e){}
  render();
  toast(msg, 'ok', {
    duration: 10000,
    action: {
      label: L2('ফিরিয়ে আনুন', 'Undo'),
      secs: 10,
      fn: async () => {
        for (const it of saved){
          try { await restoreDoc(it.col, it.id, it.data); } catch(e){}
        }
        try { await reload(); } catch(e){}
        render();
        toast(restoreMsg || L2('ফিরিয়ে আনা হয়েছে', 'Restored'), 'ok');
      }
    }
  });
}
function softDelete(col, id, msg, restoreMsg){
  return softDeleteMany([{ col, id }], msg, restoreMsg);
}

  const all=JSON.parse(store.get(LSO)||'[]');
  const owned = all.filter(o=>acc&&acc.orgIds&&acc.orgIds.includes(o.id));
  const seen={}; owned.forEach(o=>seen[o.id]=true);
  const email = (acc && acc.email ? acc.email.toLowerCase() : '');
  // scan all orgMembers keys
  try {
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || !k.startsWith('ps_orgMembers_')) continue;
      const arr = JSON.parse(localStorage.getItem(k)||'[]');
      for(const m of arr){
        if( (m.uid && m.uid===uid) || (m.email && m.email.toLowerCase()===email) ){
          const orgId=m.orgId;
          if(seen[orgId]) continue;
          seen[orgId]=true;
          const org = all.find(o=>o.id===orgId);
          if(org) owned.push(org);
        }
      }
    }
  } catch(e){}
  return owned;
}

async function fbGetInviteByCode(code){

    return null;
  } catch(e){ return null; }

async function fbCreateInvite(orgId, role='member'){
  await loadFirebase();
  role = (role||'member');
  if(!['member','cashier','secretary'].includes(role)) role='member';
  let code='';
  for(let i=0;i<20;i++){ const c=genInviteCode(); try { const d=await fb.db.collection('orgInvites').doc(c).get(); if(!d.exists){ code=c; break; } } catch(e){ code=c; break; } }

  try { await fbTimeout(fb.db.collection('organizations').doc(orgId).set({ inviteCode:code }, {merge:true}), 10000, 'invite সেভ'); } catch(e){}

    }
  }
  const c = await fbTimeout(fb.auth.createUserWithEmailAndPassword(d.email, d.password), 25000, 'অ্যাকাউন্ট তৈরি');
  const u = c.user;
  try {

    await fbTimeout(fb.db.collection('users').doc(u.uid).set({ name:d.name, email:d.email, orgIds:[orgRef.id], currentOrgId:orgRef.id }, { merge:true }), 25000, 'প্রোফাইল সংরক্ষণ');
    try { await fbTimeout(fb.db.collection('orgMembers').add({ orgId:orgRef.id, uid:u.uid, email:d.email.toLowerCase(), name:d.name, role:'secretary', addedAt:Date.now(), addedBy:u.uid }), 10000, 'সদস্য যোগ'); } catch(e){}
    return { uid:u.uid, name:d.name, email:d.email, orgIds:[orgRef.id], currentOrgId:orgRef.id };
  } catch(e){
    noteWarn(L2('অ্যাকাউন্ট তৈরি হয়েছে, তবে সংগঠনের তথ্য সেভ হয়নি: ', 'Account created, but the organization details were not saved: ') + fbErrMsg(e));

/* সংগঠনের তালিকা: আগে প্রোফাইলের orgIds থেকে সরাসরি ডকুমেন্ট পড়া (এই নিয়মে সবচেয়ে নির্ভরযোগ্য),
   না পেলে ownerId কুয়েরি — যেটা কাজ করে সেটাই ব্যবহার হয় */
async function fbGetOrgs(uid){
  await loadFirebase();
  const out = [], seen = {};
  // 1) from users.orgIds
  try {
    const s = await fbGet(fb.db.collection('users').doc(uid), 'প্রোফাইল পড়া');
    const ids = (s && s.exists !== false && s.data()) ? (s.data().orgIds || []) : [];
    for (let k = 0; k < ids.length; k++){
      if (seen[ids[k]]) continue; seen[ids[k]] = true;
      try {
        const o = await fbGet(fb.db.collection('organizations').doc(ids[k]), 'সংগঠন পড়া');
        if (o && o.exists) out.push({ id:ids[k], ...o.data() });
      } catch(e){ if (permDenied(e)) noteBlocked('সংগঠন ডকুমেন্ট'); }
    }
  } catch(e){ if (permDenied(e)) noteBlocked('প্রোফাইল ডেটা (users)'); else noteWarn(fbErrMsg(e)); }
  // 2) from orgMembers where uid == uid
  try {
    const snap = await fbGet(fb.db.collection('orgMembers').where('uid','==',uid), 'orgMembers তালিকা (uid)');
    const mems = fbDocs(snap);
    for(const m of mems){
      const orgId = m.orgId;
      if(!orgId || seen[orgId]) continue;
      seen[orgId]=true;
      try {
        const o = await fbGet(fb.db.collection('organizations').doc(orgId), 'সংগঠন পড়া');
        if (o && o.exists) out.push({ id:orgId, ...o.data() });
      } catch(e){}
    }
  } catch(e){ if(permDenied(e)) noteBlocked('orgMembers তালিকা (uid)'); }
  // 3) also from orgMembers where email == current user's email (invite claimed)
  try {
    const email = (state.user && state.user.email) ? state.user.email.toLowerCase() : '';
    if(email){
      const snap2 = await fbGet(fb.db.collection('orgMembers').where('email','==',email), 'orgMembers তালিকা (email)');
      const mems2 = fbDocs(snap2);
      for(const m of mems2){
        const orgId = m.orgId;
        if(!orgId || seen[orgId]) continue;
        seen[orgId]=true;
        // claim uid if missing
        if(!m.uid){
          try { await fbTimeout(fb.db.collection('orgMembers').doc(m.id).set({ uid }, {merge:true}), 10000, 'invite claim'); } catch(e){}
          // add to user's orgIds
          try {
            await fbTimeout(fb.db.collection('users').doc(uid).set({ orgIds: firebase.firestore.FieldValue.arrayUnion(orgId) }, {merge:true}), 10000, 'প্রোফাইল সংরক্ষণ');
          } catch(e){}
        }
        try {
          const o = await fbGet(fb.db.collection('organizations').doc(orgId), 'সংগঠন পড়া');
          if (o && o.exists) out.push({ id:orgId, ...o.data() });
        } catch(e){}
      }
    }
  } catch(e){}
  if (out.length) return out;
  try {
    return fbDocs(await fbGet(fb.db.collection('organizations').where('ownerId','==',uid), 'সংগঠনের তালিকা'));
  } catch(e){ if (permDenied(e)) noteBlocked('সংগঠনের তালিকা (ownerId)'); else noteWarn(fbErrMsg(e)); return out; }
}

const state = { user:null, orgs:[], events:[], members:[], transactions:[], donors:[], orgMembers:[], orgInvites:[], currentOrgId:'', currentRole:'', selectedEventId:'', route:'/', modal:null, fbErr:'', ledgerTab:'entries', reportFilter:{type:'all', category:'all', q:''} };

/* state.currentOrgId আর state.user.currentOrgId — দুটোই সবসময় মিলিয়ে রাখা হয় (আগে এটাই সেট হতো না) */
function syncOrg(){
  if (!state.user){ state.currentOrgId = ''; return ''; }
  const orgs = state.orgs || [];
  let id = state.user.currentOrgId || '';
  if (!id || !orgs.some(o => o.id === id)) id = (orgs[0] && orgs[0].id) || state.currentOrgId || '';
  state.currentOrgId = id;
  state.user.currentOrgId = id;
  return id;
}
async function signup(d){
  authBusy++;                    // এর মধ্যে onAuthStateChanged যেন হস্তক্ষেপ না করে
  try {
    const u = useFb() ? await fbSignup(d) : await demoSignup(d);
    state.user = u;
    await loadOrgsQuiet(u);
    syncOrg();
    return u;
  } finally { authBusy--; }
}
/* সংগঠনের তথ্য আনার চেষ্টা — ব্যর্থ হলেও লগইন আটকাবে না */
async function loadOrgsQuiet(u){
  if (!state.orgs) state.orgs = [];
  for (let attempt = 0; attempt < 3; attempt++){
    try {
      const o = useFb() ? await fbGetOrgs(u.uid) : await demoOrgs(u.uid);
      if (o && o.length){ state.orgs = o; return; }
      if (attempt === 2){ state.orgs = o || []; return; }
    } catch(e){ if (attempt === 2){ noteWarn(L2('সংগঠনের তথ্য আনা যায়নি: ', 'Could not fetch organization data: ') + fbErrMsg(e)); } }
    await new Promise(r => setTimeout(r, 1200));   // নতুন অ্যাকাউন্টের ডকুমেন্ট লেখা শেষ হওয়ার জন্য অপেক্ষা
  }
}
async function login(d){

  try {
    const u = useFb() ? await fbLogin(d) : await demoLogin(d);
    state.user = u;                     // লগইন সফল — এখন আর কোনো কারণেই আটকে থাকবে না

/* ব্রাউজারে জমানো ডেটা Firebase-এ পাঠানো (নিয়ম ঠিক করার পরে এক ক্লিকে) */
async function migrateLocalToFirebase(){
  if (!useFb()){ toast(L2('Firebase সংযুক্ত নেই — এই ব্রাউজারেই ডেটা জমছে', 'Firebase is not connected — data is stored in this browser'), 'warn'); return; }
  if (LOCAL_STORE){ toast(L2('প্রথমে সেটিংস → “Firebase-এ সেভ” মোডে ফিরুন', 'First switch back to “Save to Firebase” in Settings'), 'warn'); return; }
  if (!state.user) return;
  let ok = 0, bad = 0;
  const oldKey = k => 'ps_u_' + state.user.uid + '_' + k;
  try {
    const eMap = {};
    for (const item of await listDemo('events', oldKey('events'))){
      const { id, createdAt, ...data } = item;
      try { const ref = await fbTimeout(fb.db.collection('events').add({ ...data, createdAt: createdAt||Date.now() }), 20000, 'মাইগ্রেশন'); eMap[id] = ref.id; ok++; }
      catch(e){ bad++; }
    }
    for (const col of ['members','transactions','donors']){
      for (const item of await listDemo(col, oldKey(col))){
        const { id, createdAt, ...data } = item;
        if (data.eventId && eMap[data.eventId]) data.eventId = eMap[data.eventId];
        try { await fbTimeout(fb.db.collection(col).add({ ...data, createdAt: createdAt||Date.now() }), 20000, 'মাইগ্রেশন'); ok++; }
        catch(e){ bad++; }
      }
    }
    if (!bad){ ['events','members','transactions','donors'].forEach(c => saveDemo(c, [], oldKey(c))); }
    toast(bad ? L2('পাঠানো হয়েছে ', 'Sent ') + bn(ok) + L2(' টি, যায়নি ', ' entries, failed ') + bn(bad) + L2(' টি (নিয়ম আটকাচ্ছে)', ' (rules are blocking)') : L2('সবগুলোই পাঠানো হয়েছে — ', 'All ') + bn(ok) + L2(' টি এন্ট্রি এখন Firebase-এ', ' entries are now in Firebase'), bad ? 'warn' : 'ok');
    WRITE_BLOCKED = false;
  } catch(e){ toast(L2('পাঠানো যায়নি: ', 'Could not send: ') + fbErrMsg(e), 'err'); }
  await reload(); render();
}

async function fbInviteMember(orgId, email, role, name){
  email = String(email||'').trim().toLowerCase();
  if(!email) throw new Error(L2('ইমেইল দিন','Enter email'));
  if(!APP_ROLES.some(r=>r.id===role)) throw new Error('Invalid role');
  const payload = { orgId, email, role, name:name||'', addedAt:Date.now(), addedBy: state.user ? state.user.uid : '', uid:'' };
  // check if user exists to get uid
  if(!dataLocal()){
    await loadFirebase();
    // try to find user by email via users collection? We can't query all, but try where email==?
    try {
      const q = await fbGet(fb.db.collection('users').where('email','==',email).limit(1), 'user খোঁজা');
      const docs = fbDocs(q);
      if(docs.length) payload.uid = docs[0].id || docs[0].uid || '';
    } catch(e){ /* ignore, rules may block */ }
    const ref = await fbTimeout(fb.db.collection('orgMembers').add(payload), 20000, 'সদস্য আমন্ত্রণ');
    // also add orgId to user's orgIds if we have uid
    if(payload.uid){
      try {
        const uRef = fb.db.collection('users').doc(payload.uid);
        const snap = await fbGet(uRef, 'প্রোফাইল পড়া');
        const data = snap && snap.data ? (snap.data()||{}) : {};
        const orgIds = data.orgIds||[];
        if(!orgIds.includes(orgId)){
          await fbTimeout(uRef.set({ orgIds:[...orgIds, orgId] }, {merge:true}), 15000, 'প্রোফাইল সংরক্ষণ');
        }
      } catch(e){}
    }
    return { id:ref.id, ...payload };
  } else {
    // demo local
    const key = 'ps_orgMembers_'+orgId;
    let arr=[];
    try { arr = JSON.parse(store.get(key)||'[]'); } catch(e){}
    // prevent duplicate
    if(arr.some(x=> (x.email||'').toLowerCase()===email)) throw new Error(L2('এই ইমেইল আগেই যোগ করা আছে','This email already added'));
    const item = { ...payload, id:'om_'+uid() };
    arr.push(item);
    store.set(key, JSON.stringify(arr));
    // also add to demo accounts orgIds if exists
    try {
      const accs = JSON.parse(store.get(LSA)||'[]');
      const a = accs.find(x=> (x.email||'').toLowerCase()===email);
      if(a && !a.orgIds.includes(orgId)){ a.orgIds.push(orgId); store.set(LSA, JSON.stringify(accs)); }
    } catch(e){}
    return item;
  }
}
