function buildBackupData(){
  try{
    const data = {
      version: APP_VER,
      exportedAt: new Date().toISOString(),
      exportedBy: state.user ? (state.user.email || state.user.uid) : 'unknown',
      orgId: state.currentOrgId || '',
      organization: orgNow() || null,
      orgs: state.orgs || [],
      events: state.events || [],
      members: state.members || [],
      transactions: state.transactions || [],
      donors: state.donors || [],
      reminders: state.reminders || [],
      orgMembers: state.orgMembers || [],
      orgInvites: state.orgInvites || [],
      // local storage snapshots for demo mode
      localKeys: {}
    };
    // capture all ps_* local keys for current user if demo
    try{
      const keys = ['ps_events','ps_members','ps_transactions','ps_donors','ps_reminders','ps_organizations','ps_users'];
      keys.forEach(k=>{
        try{
          const v = store.get(k);
          if(v) data.localKeys[k] = JSON.parse(v);
        }catch(_){}
      });
      // profile photos
      try{
        for(let i=0;i<localStorage.length;i++){
          const lk = localStorage.key(i);
          if(lk && lk.startsWith(PROFILE_PHOTO_KEY)){
            try{
              const pv = localStorage.getItem(lk);
              if(pv) data.localKeys[lk] = pv;
            }catch(_){}
          }
        }
      }catch(_){}
      // per-user keys
      if(state.user && state.user.uid){
        ['events','members','transactions','donors','reminders'].forEach(col=>{
          const key = 'ps_u_' + state.user.uid + '_' + col;
          try{
            const v = store.get(key);
            if(v) data.localKeys[key] = JSON.parse(v);
          }catch(_){}
        });
      }
    }catch(_){}
    return data;
  }catch(e){ console.error('buildBackup error', e); return null; }
}

function downloadBackup(){
  try{
    const data = buildBackupData();
    if(!data){ toast(L2('ব্যাকআপ তৈরি করা যায়নি','Could not create backup'), 'err'); return; }
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const orgName = (orgNow() && orgNow().name ? String(orgNow().name).replace(/[^\w\u0980-\u09FF]+/g,'-') : 'puja');
    const dateStr = new Date().toISOString().slice(0,10);
    a.download = 'puja-sarathi-backup-' + orgName + '-' + dateStr + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
    toast(L2('ব্যাকআপ ডাউনলোড শুরু হয়েছে ✓','Backup download started ✓'), 'ok');
    const msg = document.getElementById('backupMsg');
    if(msg) msg.textContent = L2('ডাউনলোড হয়েছে: ','Downloaded: ') + a.download;
  }catch(e){ toast(L2('ব্যাকআপ ব্যর্থ: ','Backup failed: ') + e.message, 'err'); }
}

async function restoreFromBackupFile(file, mode){
  const msgEl = document.getElementById('restoreMsg');
  if(!file){ toast(L2('ফাইল বাছুন','Choose a file'), 'warn'); return; }
  if(!confirm(L2('রিস্টোর করলে বর্তমান ডেটা ' + (mode==='replace' ? 'মুছে যাবে' : 'এর সাথে যোগ হবে') + ' — আগে ব্যাকআপ নিয়েছেন তো?','Restore will ' + (mode==='replace' ? 'replace current data' : 'merge with current') + ' — did you take backup?'))){ return; }
  try{
    if(msgEl) msgEl.textContent = L2('পড়া হচ্ছে…','Reading…');
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object'){ throw new Error('Invalid backup file'); }
    // basic validation
    if(!data.transactions && !data.events && !data.members && !data.donors && !data.localKeys){
      throw new Error('Backup file has no data');
    }
    if(msgEl) msgEl.textContent = L2('রিস্টোর হচ্ছে…','Restoring…');
    
    if(dataLocal()){
      // DEMO / LOCAL MODE - restore to localStorage
      const uid = state.user && state.user.uid ? state.user.uid : '';
      const restoreLocal = (col, arr)=>{
        if(!Array.isArray(arr)) return;
        const key = uid ? ('ps_u_' + uid + '_' + col) : ('ps_' + col);
        if(mode==='replace'){
          saveDemo(col, arr, key);
        } else {
          // merge - dedupe by id
          const existing = JSON.parse(store.get(key) || '[]');
          const map = {}; existing.forEach(x=> map[x.id]=x);
          arr.forEach(x=>{ if(x && x.id) map[x.id]=x; else if(x) map['id_'+uid()]=x; });
          const merged = Object.values(map);
          saveDemo(col, merged, key);
        }
      };
      if(data.events) restoreLocal('events', data.events);
      if(data.members) restoreLocal('members', data.members);
      if(data.transactions) restoreLocal('transactions', data.transactions);
      if(data.donors) restoreLocal('donors', data.donors);
      if(data.reminders) restoreLocal('reminders', data.reminders);
      if(data.localKeys){
        // also restore any localKeys that match
        Object.keys(data.localKeys).forEach(k=>{
          try{
            const val = data.localKeys[k];
            // profile photo is string, handle separately
            if(typeof val === 'string' && k.startsWith(PROFILE_PHOTO_KEY)){
              if(mode==='replace' || !store.get(k)) store.set(k, val);
              return;
            }
            const arr = val;
            if(!Array.isArray(arr)) return;
            if(mode==='replace'){
              store.set(k, JSON.stringify(arr));
            } else {
              const existing = JSON.parse(store.get(k) || '[]');
              const map = {}; existing.forEach(x=> map[x.id]=x);
              arr.forEach(x=>{ if(x && x.id) map[x.id]=x; });
              store.set(k, JSON.stringify(Object.values(map)));
            }
          }catch(_){}
        });
      }
      if(data.orgs && uid){
        // orgs stored globally
        try{
          if(mode==='replace'){
            store.set(LSO, JSON.stringify(data.orgs));
          } else {
            const existing = JSON.parse(store.get(LSO)||'[]');
            const map={}; existing.forEach(o=> map[o.id]=o);
            data.orgs.forEach(o=> map[o.id]=o);
            store.set(LSO, JSON.stringify(Object.values(map)));
          }
        }catch(_){}
      }
      toast(L2('রিস্টোর সম্পূর্ণ ✓ — রিলোড হচ্ছে','Restore complete ✓ — reloading'), 'ok');
      setTimeout(async()=>{ await reload(); render(); }, 800);
    } else {
      // FIREBASE MODE - restore to Firestore (only if user is logged in)
      if(!state.user || !state.currentOrgId){ toast(L2('Firebase মোডে রিস্টোর করতে লগইন থাকতে হবে','Must be logged in for Firebase restore'), 'warn'); return; }
      await loadFirebase();
      const orgId = state.currentOrgId;
      const eventIds = (state.events||[]).map(e=>e.id);
      // For each collection, add missing docs
      const cols = [
        {key:'events', col:'events', arr:data.events},
        {key:'members', col:'members', arr:data.members},
        {key:'transactions', col:'transactions', arr:data.transactions},
        {key:'donors', col:'donors', arr:data.donors},
        {key:'reminders', col:'reminders', arr:data.reminders}
      ];
      let total = 0;
      for(const {col, arr} of cols){
        if(!Array.isArray(arr) || !arr.length) continue;
        for(const item of arr){
          try{
            const payload = {...item};
            delete payload.id;
            if(!payload.orgId) payload.orgId = orgId;
            if(col!=='events' && !payload.eventId && state.selectedEventId) payload.eventId = state.selectedEventId;
            // avoid duplicates by checking if same id exists? simplest: add as new if replace mode, else check
            if(mode==='merge'){
              // if item has id and exists, skip? we will just set if id exists
              if(item.id){
                try{
                  const doc = await fb.db.collection(col).doc(item.id).get();
                  if(doc && doc.exists) continue;
                }catch(_){}
              }
            }
            if(item.id && mode==='replace'){
              // try to set with same id for replace
              try{ await fb.db.collection(col).doc(item.id).set({...payload, createdAt: Date.now()}, {merge:true}); total++; continue; }catch(_){}
            }
            await fb.db.collection(col).add({...payload, createdAt: Date.now()});
            total++;
          }catch(e){ console.warn('restore item failed', col, e); }
        }
      }
      toast(L2('রিস্টোর সম্পূর্ণ ✓ ','Restore complete ✓ ') + total + L2(' টি এন্ট্রি',' entries'), 'ok');
      await reload(); render();
    }
  }catch(e){
    console.error(e);
    toast(L2('রিস্টোর ব্যর্থ: ','Restore failed: ') + e.message, 'err');
    if(msgEl) msgEl.textContent = L2('ব্যর্থ: ','Failed: ') + e.message;
  }
}

/* ═══════════════ Reminder & Notification System — Professional ═══════════════ */
const REMINDER_SOUND_KEY = 'ps_reminder_sound';
let reminderCheckInterval = null;
let lastNotifiedIds = new Set();

function getReminderSoundEnabled(){
  try{ const v = store.get(REMINDER_SOUND_KEY); return v !== 'off'; }catch(_){ return true; }
}
function setReminderSoundEnabled(on){
  try{ store.set(REMINDER_SOUND_KEY, on ? 'on' : 'off'); }catch(_){}
}

// Professional notification sound using Web Audio API
function playNotificationSound(){
  if(!getReminderSoundEnabled()) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // Create a pleasant two-tone chime
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    
    osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, now); // A5
    osc2.type = 'sine'; osc2.frequency.setValueAtTime(1320, now); // E6
    filter.type = 'lowpass'; filter.frequency.setValueAtTime(2000, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
    
    osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc1.start(now); osc2.start(now + 0.1);
    osc1.stop(now + 0.8); osc2.stop(now + 0.9);
    
    // Second chime
    setTimeout(()=>{
      try{
        const osc3 = ctx.createOscillator();
        const g2 = ctx.createGain();
        osc3.type = 'sine'; osc3.frequency.setValueAtTime(1046, ctx.currentTime); // C6
        g2.gain.setValueAtTime(0.25, ctx.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc3.connect(g2); g2.connect(ctx.destination);
        osc3.start(); osc3.stop(ctx.currentTime + 0.6);
      }catch(_){}
    }, 300);
  }catch(e){
    // Fallback: try audio element
    try{
      const audio = new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZQAAABkY29kZQ==');
      audio.volume = 0.5; audio.play().catch(()=>{});
    }catch(_){}
  }
}

function buildNotifications(){
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  const notifs = [];
  const reminders = state.reminders || [];
  
  reminders.forEach(r=>{
    if(!r || !r.date) return;
    const rDate = r.date; // YYYY-MM-DD
    const isToday = rDate === todayStr;
    const isOverdue = rDate < todayStr && !r.completed;
    const isUpcoming = (()=>{ 
      const d = new Date(rDate); const diff = Math.ceil((d - now)/86400000); 
      return diff >=0 && diff <=3 && !r.completed; 
    })();
    
    if(isToday || isOverdue || isUpcoming){
      const type = isOverdue ? 'overdue' : isToday ? 'today' : 'upcoming';
      notifs.push({
        id: 'rem_'+r.id,
        reminderId: r.id,
        title: r.title || L2('রিমাইন্ডার','Reminder'),
        body: r.description || '',
        date: r.date,
        time: r.time || '',
        type: type,
        createdAt: r.createdAt || Date.now(),
        read: r.notifiedRead || false
      });
    }
  });
  
  // Sort: overdue first, then today, then upcoming, newest first
  notifs.sort((a,b)=>{
    const order = {overdue:0, today:1, upcoming:2};
    if(order[a.type] !== order[b.type]) return order[a.type] - order[b.type];
    return (b.createdAt||0) - (a.createdAt||0);
  });
  
  state.notifications = notifs;
  return notifs;
}

function getUnreadCount(){
  return (state.notifications||[]).filter(n=>!n.read).length;
}

function checkReminders(){
  try{
    const notifs = buildNotifications();
    const unread = getUnreadCount();
    // Update bell badge
    const badge = document.getElementById('notifBadge');
    if(badge){
      if(unread>0){ badge.textContent = unread>9 ? '9+' : String(unread); badge.style.display='grid'; badge.classList.add('pulse'); }
      else { badge.style.display='none'; badge.classList.remove('pulse'); }
    }
    const bell = document.getElementById('notifBell');
    if(bell){
      if(unread>0) bell.classList.add('has-unread');
      else bell.classList.remove('has-unread');
    }
    
    // Check for new due reminders to notify
    const todayStr = new Date().toISOString().slice(0,10);
    notifs.forEach(n=>{
      if((n.type==='today' || n.type==='overdue') && !lastNotifiedIds.has(n.reminderId)){
        // Only notify once per session per reminder
        if(n.type==='today' || n.type==='overdue'){
          lastNotifiedIds.add(n.reminderId);
          // Show toast
          const msg = n.type==='overdue' 
            ? L2('⏰ ওভারডিউ: ','⏰ Overdue: ') + n.title
            : L2('🔔 আজ: ','🔔 Today: ') + n.title;
          toast(msg, n.type==='overdue' ? 'warn' : 'info');
          playNotificationSound();
          // Browser notification if permitted
          try{
            if('Notification' in window && Notification.permission==='granted'){
              new Notification(n.title, { body: (n.body||'') + ' — ' + n.date + (n.time ? ' ' + n.time : ''), icon: './icons/icon-192.png' });
            }
          }catch(_){}
          // Mark as notified in storage
          try{
            const r = (state.reminders||[]).find(x=>x.id===n.reminderId);
            if(r){ r.lastNotified = Date.now(); }
          }catch(_){}
        }
      }
    });
  }catch(e){ console.warn('checkReminders failed', e); }
}

function startReminderChecker(){
  if(reminderCheckInterval) clearInterval(reminderCheckInterval);
  // Check every 60 seconds
  reminderCheckInterval = setInterval(()=>{ try{ checkReminders(); }catch(_){} }, 60000);
  // Also check on visibility change
  try{
    document.addEventListener('visibilitychange', ()=>{
      if(!document.hidden){ try{ checkReminders(); }catch(_){} }
    });
  }catch(_){}
}

function requestNotificationPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().then(p=>{
        if(p==='granted') toast(L2('নোটিফিকেশন অনুমতি দেওয়া হয়েছে ✓','Notification permission granted ✓'), 'ok');
      });
    }
  }catch(_){}
}

function getProfilePhoto(uid){
  try{
    const id = uid || (state.user && state.user.uid) || '';
    if(!id) return '';
    // Try Firebase photo first (if stored in user doc)
    const fbPhoto = (state.user && state.user.photoData) ? state.user.photoData : '';
    if(fbPhoto) return fbPhoto;
    // Local storage
    const local = store.get(PROFILE_PHOTO_KEY + id);
    return local || '';
  }catch(_){ return ''; }
}
function setProfilePhoto(uid, base64){
  try{
    const id = uid || (state.user && state.user.uid) || '';
    if(!id) return;
    if(base64){
      store.set(PROFILE_PHOTO_KEY + id, base64);
      // Also try to save to Firebase user doc if in Firebase mode
      if(!dataLocal() && state.user){
        try{
          loadFirebase().then(()=>{
            try{ fb.db.collection('users').doc(id).set({ photoData: base64 }, {merge:true}); }catch(_){}
          });
        }catch(_){}
      }
      // Update state
      if(state.user && state.user.uid===id) state.user.photoData = base64;
    } else {
      store.del(PROFILE_PHOTO_KEY + id);
      if(state.user && state.user.uid===id) delete state.user.photoData;
    }
  }catch(_){}
}

function compressImage(base64, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w>maxSize || h>maxSize){
        if(w>h){ h = Math.round(h*maxSize/w); w=maxSize; }
        else { w = Math.round(w*maxSize/h); h=maxSize; }
      }
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = base64;
  });
}

/* ============ Modals ============ */
function openModal(title, bodyHtml){
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = '<div class="box"><div class="head"><span>' + esc(title) + '</span>'
    + '<button type="button" class="iconbtn" onclick="closeModal()" aria-label="close">' + icon('x', 'ic-sm') + '</button></div>'
    + '<div class="body">' + bodyHtml + '</div></div>';
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });
  document.addEventListener('keydown', escClose);
  document.body.appendChild(m);
}
function escClose(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  const m = document.getElementById('modal'); if (m) m.remove();
  document.removeEventListener('keydown', escClose);
}

async function saveGuard(fn){
  try { return await fn(); }
  catch(ex){
    if (errCode(ex) === 'already-exists' || /already exists/i.test(errCode(ex))) return null;
    markWriteBlocked(ex);
    toast(L2('সংরক্ষণ হয়নি: ', 'Not saved: ') + fbErrMsg(ex));
    try { await reload(); } catch(e){}
    throw ex;
  }
}
window.addEventListener('unhandledrejection', (e) => {
  try {
    const m = fbErrMsg(e.reason);
    if (!/cancel|abort/i.test(String((e.reason && e.reason.message) || ''))) console.log('[পূজা সারথি] silent failure:', m);
  } catch(_){}
});

function formFields(form){ return Object.fromEntries(new FormData(form).entries()); }
function isHiddenField(el){ try { return !!el.closest('.hide') || el.offsetParent === null; } catch(e){ return false; } }
/* নিজের ভ্যালিডেশন — নেটিভ ইংরেজি বাবলের উপর নির্ভরতা নেই, বার্তা বাংলায় */
function validateForm(form){
  const bad = [];
  const els = form.querySelectorAll('input, select, textarea');
  for (let i = 0; i < els.length; i++){
    const el = els[i];
    if (el.disabled || isHiddenField(el)) continue;
    const v = (el.value == null ? '' : String(el.value)).trim();
    let lbl = '';
    try { const wrap = el.closest('label'); lbl = wrap ? wrap.textContent.replace(/\s+/g, ' ').trim().slice(0, 40) : ''; } catch(e){}
    if (el.hasAttribute('required') && !v){ bad.push(lbl ? (lbl + ' — ' + L2('পূরণ করুন', 'is required')) : L2('সব ঘর পূরণ করুন', 'Please fill in all the fields')); continue; }
    if (v && el.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ bad.push(L2('ইমেইলের ঠিকানাটি ঠিক নয় (যেমন: name@gmail.com)', 'The email address is not valid (e.g. name@gmail.com)')); continue; }
    if (v && el.type === 'number' && isNaN(Number(v))){ bad.push(lbl ? (lbl + ' — ' + L2('ঠিক সংখ্যা লিখুন', 'must be a number')) : L2('সংখ্যার ঘর ঠিক নয়', 'Please enter a valid number')); continue; }
    if (v && el.type === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(v)){ bad.push(L2('তারিখ ঠিক নয়', 'The date is not valid')); continue; }
  }
  return bad;
}
function showFormError(form, msg){
  const box = form.querySelector('.formErr');
  let el = box;
  if (!el){ el = document.createElement('div'); el.className = 'err formErr'; el.style.marginBottom = '10px'; form.insertBefore(el, form.firstChild); }
  el.innerHTML = icon('alert', 'ic-sm') + ' ' + esc(msg);
  try { el.scrollIntoView({ block:'nearest' }); } catch(e){}
}
/* run() — ফর্মের আসল কাজ; বার্তা দেখানো/লোডিং অবস্থা run()-এর ভিতরে */
function bindSubmit(form, run){
  if (!form) return;
  form.setAttribute('novalidate', 'novalidate');   // ভ্যালিডেশন আমাদের হাতেই (বার্তা বাংলায়)
  let last = 0;
  const fire = () => {
    const now = Date.now();
    if (now - last < 400) return;                  // ক্লিক ও submit — দুটোই এলে দ্বিগুণ যাবে না
    last = now;
    const bad = validateForm(form);
    if (bad.length){ showFormError(form, bad[0] + (bad.length > 1 ? (' (' + L2('আরও ', 'and ') + bn(bad.length - 1) + L2(' টি ঘর বাকি', ' more field(s) left') + ')') : '')); return; }
    run(formFields(form));
  };
  form.onsubmit = (e) => { e.preventDefault(); e.stopPropagation(); fire(); return false; };
  const btn = form.querySelector('button[type=submit], button:not([type]), input[type=submit]');
  if (btn){
    btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); fire(); return false; };
  }
  form.onkeydown = (e) => {
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){ e.preventDefault(); fire(); }
  };
  return { fire };
}

  if(evtSelBtn){
    evtSelBtn.onclick = ()=> openEventChooser();
  }
  const lo = document.getElementById('logoutBtn');
  if (lo) lo.onclick = async () => { await logout(); render(); };
  const ao = document.getElementById('addOrgBtn');
  if (ao) {
    const canAdd = canManageOrg() || (state.orgs && state.orgs.length===0);
    ao.style.display = canAdd ? '' : 'none';
    ao.onclick = () => {
      const n = prompt(L2('নতুন সংগঠনের নাম:', 'New organization name:'));
      if (n && n.trim()){ addOrg(n.trim()).then(() => reload()).then(() => render()).catch(ex => { noteWarn(fbErrMsg(ex)); render(); }); }
    };
  }
  const rb = document.getElementById('roleBadge');
  if(rb){
    const r = getMyRole();
    if(r){
      rb.textContent = roleLabel(r);
      rb.style.display = '';
      rb.className = 'pill ' + (r==='secretary' || r==='owner' ? '' : r==='member' || r==='viewer' ? 'p-grey' : 'p-info');
      rb.title = roleDesc(r);
    } else {
      rb.style.display='none';
    }
  }
  // Profile button
  const profileBtn = document.getElementById('profileBtn');
  if(profileBtn) profileBtn.onclick = (e)=>{ e.preventDefault(); openProfileModal(); };
  // Notification bell - professional
  const notifBell = document.getElementById('notifBell');
  const notifPanel = document.getElementById('notifPanel');
  const notifScrim = document.getElementById('notifScrim');
  const notifClose = document.getElementById('notifClose');
  const notifList = document.getElementById('notifList');
  const openNotif = (open)=>{
    if(!notifPanel || !notifScrim) return;
    if(open){
      try{ buildNotifications(); renderNotifList(); }catch(_){}
      notifPanel.classList.add('open');
      notifPanel.setAttribute('aria-hidden','false');
      notifScrim.hidden = false;
      notifScrim.classList.add('open');
      setTimeout(()=>{ try{ notifScrim.style.background='rgba(0,0,0,.25)'; }catch(_){} },10);
    } else {
      notifPanel.classList.remove('open');
      notifPanel.setAttribute('aria-hidden','true');
      notifScrim.classList.remove('open');
      notifScrim.style.background='transparent';
      setTimeout(()=>{ notifScrim.hidden = true; }, 280);
    }
  };
  window.openNotifPanel = openNotif;
  if(notifBell){
    notifBell.onclick = (e)=>{ e.preventDefault(); const isOpen = notifPanel && notifPanel.classList.contains('open'); openNotif(!isOpen); };
    // Initial badge update
    try{ checkReminders(); }catch(_){}
  }
  if(notifClose) notifClose.onclick = ()=> openNotif(false);
  if(notifScrim) notifScrim.onclick = ()=> openNotif(false);
  const notifMarkAll = document.getElementById('notifMarkAll');
  if(notifMarkAll) notifMarkAll.onclick = ()=>{
    (state.notifications||[]).forEach(n=> n.read = true);
    (state.reminders||[]).forEach(r=>{ if(r) r.notifiedRead = true; });
    try{ saveDemo('reminders', state.reminders, localKey('reminders')); }catch(_){}
    renderNotifList(); checkReminders();
    toast(L2('সব পড়া হিসেবে চিহ্নিত','Marked all as read'), 'ok');
  };
  const notifClearAll = document.getElementById('notifClearAll');
  if(notifClearAll) notifClearAll.onclick = ()=>{
    if(confirm(L2('সব নোটিফিকেশন ক্লিয়ার করবেন?','Clear all notifications?'))){
      state.notifications = [];
      lastNotifiedIds.clear();
      renderNotifList(); checkReminders();
    }
  };
  const notifGoRem = document.getElementById('notifGoReminders');
  if(notifGoRem) notifGoRem.onclick = (e)=>{ e.preventDefault(); openNotif(false); state.route='/reminders'; render(); };
  
  // Start reminder checker
  try{ startReminderChecker(); }catch(_){}
  
  document.querySelectorAll('[data-lang]').forEach(b => { b.onclick = () => { setLang(b.dataset.lang); render(); }; });
}

function renderNotifList(){
  const listEl = document.getElementById('notifList');
  const subEl = document.getElementById('notifSub');
  if(!listEl) return;
  const notifs = state.notifications||[];
  if(subEl) subEl.textContent = notifs.length ? (bn(notifs.length)+' '+L2('নোটিফিকেশন','notifications') + ' · ' + bn(getUnreadCount())+' '+L2('অপঠিত','unread')) : L2('কোনো নোটিফিকেশন নেই','No notifications');
  if(!notifs.length){
    listEl.innerHTML = '<div class="empty" style="border:none; background:transparent; padding:30px 16px">'+icon('bell','ic-xl')+'<div class="t">'+L2('কোনো নোটিফিকেশন নেই','No notifications')+'</div><div class="h">'+L2('রিমাইন্ডার যোগ করলে এখানে দেখাবে','Reminders will appear here')+'</div></div>';
    return;
  }
  listEl.innerHTML = notifs.map(n=>{
    const ic = n.type==='overdue' ? 'alarm' : n.type==='today' ? 'bellRing' : 'clock';
    const cls = 'notif-item ' + (n.type||'') + (n.read ? '' : ' unread');
    return '<div class="'+cls+'" data-notif-id="'+n.id+'" data-reminder-id="'+(n.reminderId||'')+'">'
      + '<div class="notif-ic">'+icon(ic,'ic-sm')+'</div>'
      + '<div style="flex:1; min-width:0"><div style="font-weight:700; font-size:13px; color:#0f172a; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">'+esc(n.title)+'</div>'
      + '<div style="font-size:11.5px; color:#475569; margin-top:2px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden">'+esc(n.body||'')+'</div>'
      + '<div style="font-size:10.5px; color:#94a3b8; margin-top:4px; display:flex; gap:6px; align-items:center">'+icon('calendar','ic-sm')+' '+fmtDate(n.date)+(n.time ? ' · '+esc(n.time) : '')+' · <span class="pill" style="font-size:9px; padding:1px 6px">'+(n.type==='overdue'?L2('ওভারডিউ','Overdue'):n.type==='today'?L2('আজ','Today'):L2('আসন্ন','Upcoming'))+'</span></div></div>'
      + '<button class="iconbtn" data-notif-read="'+n.id+'" style="width:26px; height:26px; flex:0 0 auto">'+icon(n.read?'check':'eye','ic-sm')+'</button>'
      + '</div>';
  }).join('');
  // bind read buttons
  listEl.querySelectorAll('[data-notif-read]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-notif-read');
      const notif = (state.notifications||[]).find(x=>x.id===id);
      if(notif){ notif.read = !notif.read; renderNotifList(); checkReminders(); }
    };
  });
  listEl.querySelectorAll('[data-notif-id]').forEach(el=>{
    el.onclick = ()=>{
      const rid = el.getAttribute('data-reminder-id');
      if(rid){
        const r = (state.reminders||[]).find(x=>x.id===rid);
        if(r){
          // mark read
          const nid = el.getAttribute('data-notif-id');
          const notif = (state.notifications||[]).find(x=>x.id===nid);
          if(notif) notif.read = true;
          openNotifPanel(false);
          state.route='/reminders';
          render();
          setTimeout(()=>{ const card = document.querySelector('[data-id="'+rid+'"]'); if(card) card.scrollIntoView({behavior:'smooth', block:'center'}); }, 300);
        }
      }
    };
  });
}
function openNotifPanel(open){
  if(window.openNotifPanel) window.openNotifPanel(open);
}

/* কনটেন্ট ও হ্যামবার্গার মেনু — দুই জায়গার [data-act] একই ফাংশনে আসে */
function bindContent(){
  const c = document.getElementById('content'); if (!c) return;
  c.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    e.preventDefault();
    // viewer guard
    if(!canWrite() && ['newEvent','editEvent','delEvent','newTxn','editTxn','delTxn','newDonor','newMember','editMember','delMember','bulkMembers','setEvt','newReminder','editReminder','delReminder','toggleReminder'].includes(b.dataset.act)){
      toast(L2('আপনার শুধু দেখার অনুমতি আছে','You have read-only access'), 'warn');
      return;
    }
    await runAct(b.dataset.act, b.dataset.id);
  });
  // Invite Code generation - Code only + WhatsApp Share
  const genInviteBtn = document.getElementById('genInviteBtn');
  const copyInviteCodeBtn = document.getElementById('copyInviteCodeBtn');
  const shareInviteCodeBtn = document.getElementById('shareInviteCodeBtn');
  const inviteCodeDisplay = document.getElementById('inviteCodeDisplay');
  const orgInvitesList = document.getElementById('orgInvitesList');
  const renderInvites = () => {
    const invites = state.orgInvites||[];
    let activeCode = '';
    if(inviteCodeDisplay){
      const unused = invites.filter(x=>!x.used);
      const latest = unused.length ? unused[unused.length-1] : (invites.length ? invites[invites.length-1] : null);
      activeCode = latest ? latest.code : (orgNow() && orgNow().inviteCode ? orgNow().inviteCode : '');
      if(activeCode){
        inviteCodeDisplay.textContent = activeCode + (latest && latest.used ? ' (Used)' : '');
        inviteCodeDisplay.style.display='inline-block';
        if(copyInviteCodeBtn) copyInviteCodeBtn.style.display = latest && !latest.used ? 'inline-flex' : 'none';
        if(shareInviteCodeBtn) shareInviteCodeBtn.style.display = latest && !latest.used ? 'inline-flex' : 'none';
      } else {
        inviteCodeDisplay.textContent = '—';
        if(copyInviteCodeBtn) copyInviteCodeBtn.style.display='none';
        if(shareInviteCodeBtn) shareInviteCodeBtn.style.display='none';
      }
      if(latest && latest.used) inviteCodeDisplay.style.opacity='0.5'; else inviteCodeDisplay.style.opacity='1';
    }
    if(orgInvitesList){
      if(!invites.length){
        orgInvitesList.innerHTML = '<div class="muted" style="font-size:12px; padding:10px; text-align:center; background:var(--soft); border-radius:8px">No invite code yet — generate above</div>';
      } else {
        // Responsive cards - LINK functionality but only CODE displayed (no link text)
        orgInvitesList.innerHTML = '<div style="display:grid; gap:8px; max-width:100%">'+
          invites.map(inv=>{
            const roleEn = (APP_ROLES.find(x=>x.id===(inv.role||'member'))?.en || inv.role||'member');
            const st = inv.used ? '<span class="pill p-grey" style="font-size:10px">Used'+(inv.usedAt ? ' '+fmtDate(new Date(inv.usedAt).toISOString().slice(0,10)) : '')+'</span>' : '<span class="pill" style="background:#dcfce7; border-color:#86efac; color:#166534; font-size:10px">Active</span>';
            const link = location.origin + location.pathname + '?join='+encodeURIComponent(inv.code);
            const waMsg = encodeURIComponent('Puja Sarathi - Join: '+link+'\nCode: '+inv.code+' ('+roleEn+')');
            const rowStyle = inv.used ? 'opacity:0.6' : '';
            return '<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; background:var(--solid-1); border:1px solid var(--line); border-radius:10px; max-width:100%; '+rowStyle+'">'
              +'<b style="letter-spacing:1px; font-size:13px; background:linear-gradient(135deg,#fffbeb,#fef3c7); border:1px dashed #f59e0b; padding:4px 8px; border-radius:8px; color:#92400e; flex:0 0 auto">'+esc(inv.code)+'</b>'
              +'<span class="pill '+(inv.role==='secretary'?'':inv.role==='cashier'?'p-info':'p-grey')+'" style="font-size:11px; flex:0 0 auto">'+esc(roleEn)+'</span>'
              +st
              +'<div style="margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; align-items:center">'
              +(inv.used ? '' : '<button class="btn s ghost" style="font-size:11px; padding:4px 8px" data-copy-link="'+esc(link)+'">'+icon('copy','ic-sm')+'Copy Link</button><a class="btn s" style="background:#25D366; color:white; text-decoration:none; font-size:11px; padding:4px 8px" href="https://wa.me/?text='+waMsg+'" target="_blank">WA Share</a>')
              +'<button class="iconbtn danger" style="width:28px; height:28px; flex:0 0 auto" data-del-invite="'+esc(inv.code)+'" title="'+L2('মুছুন','Delete')+'">'+icon('trash','ic-sm')+'</button>'

        orgInvitesList.querySelectorAll('[data-copy-link]').forEach(b=>{

          };
        });

      try {
        const inv = dataLocal() ? await demoCreateInvite(state.currentOrgId, selRole) : await fbCreateInvite(state.currentOrgId, selRole);
        toast('Invite code: '+inv.code+' ('+roleLabel(inv.role)+')', 'ok');
        await reload(); render();
      } catch(ex){ toast(fbErrMsg(ex), 'err'); }
      genInviteBtn.disabled=false; genInviteBtn.innerHTML=old;
    };
  }
  if(copyInviteCodeBtn){
    copyInviteCodeBtn.onclick = async ()=>{
      const invites = state.orgInvites||[];
      const latest = invites.filter(x=>!x.used).slice(-1)[0] || invites.slice(-1)[0];
      const code = latest ? latest.code : (orgNow() && orgNow().inviteCode ? orgNow().inviteCode : '');
      if(!code){ toast('Generate code first', 'warn'); return; }
      const link = location.origin + location.pathname + '?join='+encodeURIComponent(code);
      try { await navigator.clipboard.writeText(link); toast('Link copied', 'ok'); } catch(e){ prompt('Copy link', link); }
    };
  }
  if(shareInviteCodeBtn){
    shareInviteCodeBtn.onclick = ()=>{
      const invites = state.orgInvites||[];
      const latest = invites.filter(x=>!x.used).slice(-1)[0] || invites.slice(-1)[0];
      const code = latest ? latest.code : (orgNow() && orgNow().inviteCode ? orgNow().inviteCode : '');
      if(!code){ toast('Generate code first', 'warn'); return; }
      const roleEl = document.getElementById('inviteCodeRole');
      const role = (roleEl && roleEl.value) || (latest && latest.role) || 'member';

      const msg = 'Puja Sarathi - Join: '+link+'\nCode: '+code+' ('+roleEn+') — Enter at signup';
      const waUrl = 'https://wa.me/?text='+encodeURIComponent(msg);
      if(navigator.share){
        navigator.share({title:'Puja Sarathi Invite', text:msg, url:link}).catch(()=> window.open(waUrl, '_blank'));
      } else {
        window.open(waUrl, '_blank');
      }
    };

  // Role management UI inside settings
  const inviteBtn = document.getElementById('inviteBtn');
  if(inviteBtn){
    inviteBtn.onclick = async () => {

      inviteBtn.disabled=true; const old=inviteBtn.innerHTML; inviteBtn.innerHTML='<span class="spin"></span> '+L2('যোগ হচ্ছে…','Adding…');
      try {
        await fbInviteMember(state.currentOrgId, email, role, name);
        toast(L2('সদস্য যোগ হয়েছে: ','Member added: ')+email, 'ok');
        if(emailEl) emailEl.value=''; if(nameEl) nameEl.value='';
        await reload(); render();
      } catch(ex){
        toast(L2('যোগ করা যায়নি: ','Could not add: ')+fbErrMsg(ex), 'err');
      }
      inviteBtn.disabled=false; inviteBtn.innerHTML=old;
    };
  }
  // render orgMembers list
  const listEl = document.getElementById('orgMembersList');
  if(listEl){
    const members = state.orgMembers||[];
    const _canManage = canManageMembers();
    const _isOwner = canManageOrg();
    const cntEl = document.getElementById('appMemberCount');
    if(cntEl) cntEl.textContent = bn(members.length);
    if(!members.length){
      listEl.innerHTML = '<div class="empty" style="padding:16px; text-align:center; max-width:100%">'+icon('users','ic-xl')+'<div class="t">No members yet (only you)</div><div class="h">Generate invite code above to add members</div><div class="muted" style="font-size:11px; margin-top:8px">Debug: orgId='+(state.currentOrgId||'none')+' | user='+(state.user?state.user.email:'none')+' | orgMembers loaded: '+members.length+'</div></div>';
    } else {
      // Responsive cards - fit single screen, no horizontal overflow
      listEl.innerHTML = '<div style="display:grid; gap:8px; max-width:100%">'+
        members.map(m=>{
          const isMe = (state.user && ( (m.uid && m.uid===state.user.uid) || (m.email && (m.email||'').toLowerCase()===(state.user.email||'').toLowerCase()) ) );
          return '<div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px; background:var(--solid-1); border:1px solid var(--line); border-radius:12px; max-width:100%; box-sizing:border-box">'
            +'<span class="avatar '+avTone(m.name||m.email)+'" style="flex:0 0 auto; width:36px; height:36px; font-size:13px">'+esc((m.name||m.email||'?').charAt(0))+'</span>'
            +'<div style="flex:1 1 120px; min-width:0; max-width:100%"><div class="strong" style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">'+esc(m.name|| (m.email||'').split('@')[0] )+(isMe?' <span class="pill p-info" style="font-size:9px">You</span>':'')+'</div><div class="muted" style="font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">'+esc(m.email||'')+' · '+(m.addedAt? fmtDate(new Date(m.addedAt).toISOString().slice(0,10)) : '')+'</div></div>'
            +'<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; flex:0 0 auto">'
            +( _canManage && m.role!=='owner' ? '<select data-role-change="'+m.id+'" style="padding:4px 24px 4px 8px; border-radius:8px; border:1px solid var(--line); font-size:11px; font-weight:600; max-width:110px">'+ APP_ROLES.map(r=>'<option value="'+r.id+'" '+(r.id===m.role?'selected':'')+'>'+L2(r.bn,r.en)+'</option>').join('')+'</select>' : '<span class="pill '+(m.role==='secretary'||m.role==='owner'?'':(m.role==='member'||m.role==='viewer')?'p-grey':'p-info')+'" style="font-size:11px">'+roleLabel(m.role)+'</span>')
            +(_canManage ? (m.role==='owner' && !_isOwner ? '' : '<button class="iconbtn danger" style="width:28px; height:28px" data-rm-member="'+m.id+'" title="Remove">'+icon('trash','ic-sm')+'</button>') : '')

  const ml = document.getElementById('modeLocal'); if (ml) ml.onclick = async () => { await setLocalMode(true); toast(L2('ব্রাউজার-সেভ মোড চালু হয়েছে', 'Browser-save mode enabled')); await reload(); render(); };
  const mc = document.getElementById('modeCloud'); if (mc) mc.onclick = async () => { await setLocalMode(false); toast(L2('Firebase-এ সেভ মোড চালু হয়েছে', 'Firebase save mode enabled')); await reload(); render(); };
  const mg = document.getElementById('migrateBtn'); if (mg) mg.onclick = () => { migrateLocalToFirebase(); };
  const lb = document.getElementById('localModeBtn'); if (lb) lb.onclick = async () => { await setLocalMode(true); toast(L2('ব্রাউজার-সেভ মোড চালু হয়েছে — এখন থেকে ডেটা এই ব্রাউজারে জমবে', 'Browser-save mode enabled — data now stays in this browser')); await reload(); render(); };
  // Backup
  const bb = document.getElementById('backupBtn'); if (bb) bb.onclick = () => { downloadBackup(); };
  const bi = document.getElementById('backupInfoBtn'); if (bi) bi.onclick = () => {
    const d = buildBackupData();
    if(!d) return;
    const info = L2('ব্যাকআপে আছে:','Backup contains:') + '\n• ' + (d.orgs?.length||0) + ' orgs\n• ' + (d.events?.length||0) + ' events\n• ' + (d.transactions?.length||0) + ' transactions\n• ' + (d.members?.length||0) + ' members\n• ' + (d.donors?.length||0) + ' donors\n• ' + (d.orgMembers?.length||0) + ' app members\n• ' + (d.orgInvites?.length||0) + ' invites\n\n' + L2('ভার্সন: ','Version: ') + d.version + '\n' + L2('সময়: ','Time: ') + d.exportedAt;
    alert(info);
  };
  // Restore
  const rf = document.getElementById('restoreFile');
  const rbBtn = document.getElementById('restoreBtn');
  const rcBtn = document.getElementById('restoreClearBtn');
  if(rf){
    rf.onchange = () => {
      const file = rf.files && rf.files[0];
      if(rbBtn) rbBtn.disabled = !file;
      const msg = document.getElementById('restoreMsg');
      if(msg) msg.textContent = file ? L2('ফাইল রেডি: ','File ready: ') + file.name + ' (' + Math.round(file.size/1024) + ' KB)' : '';
    };
  }
  if(rbBtn) rbBtn.onclick = async () => {
    const file = document.getElementById('restoreFile')?.files?.[0];
    if(!file){ toast(L2('ফাইল বাছুন','Choose file'), 'warn'); return; }
    const mode = document.querySelector('input[name="restoreMode"]:checked')?.value || 'replace';
    await restoreFromBackupFile(file, mode);
  };
  if(rcBtn) rcBtn.onclick = () => {
    const rf2 = document.getElementById('restoreFile');
    if(rf2) rf2.value = '';
    if(rbBtn) rbBtn.disabled = true;
    const msg = document.getElementById('restoreMsg');
    if(msg) msg.textContent = '';
    document.querySelectorAll('input[name="restoreMode"]').forEach((r,i)=> r.checked = i===0);
  };
  const rb = document.getElementById('resetBtn');
  if (rb) rb.onclick = () => {
    if (confirm(L2('ব্রাউজারে জমানো সব ডেমো ডেটা মুছে ফেলবেন?', 'Clear all demo data stored in this browser?'))){
      ['ps_events','ps_members','ps_transactions','ps_donors','ps_reminders','ps_organizations','ps_users',LSA,LSO,LSU,LSC,LSI].forEach(k => store.del(k));
      // also per-user reminders
      try{ const uid = state.user && state.user.uid ? state.user.uid : ''; if(uid){ ['events','members','transactions','donors','reminders'].forEach(col=> store.del('ps_u_'+uid+'_'+col)); } }catch(_){}
      alert(L2('রিসেট হয়েছে', 'Reset done'));
    }
  };
}

function bindForm(formId, onSave, afterSave){
  const f=document.getElementById(formId); if(!f) return;
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    closeModal();
    try {
      await saveGuard(() => onSave(d));
      if (afterSave) await afterSave(d);
      await reload();
      toast(L2('সেভ হয়েছে ✓', 'Saved ✓'), 'ok');
    } catch(ex){ /* বার্তা toast-এ দেখানো হয়েছে */ }
    render();
  });
}

    // remember upper category - last row's role or bulkRole
    let lastRole = '';
    const allRows = rowsContainer.querySelectorAll('.bulk-row');
    if(allRows.length){
      const lastRow = allRows[allRows.length-1];
      const lastSel = lastRow.querySelector('select[name^="b_role_"]');
      if(lastSel) lastRole = lastSel.value;
    }
    if(!lastRole && bulkRoleSel) lastRole = bulkRoleSel.value;
    const roleOpts = ROLES.map(r=>'<option value="'+esc(r)+'" '+(r===lastRole ? 'selected' : '')+'>'+bv(r)+'</option>').join('');
    const div = document.createElement('div');
    div.className = 'bulk-row';
    div.style.cssText = 'display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:end; padding:10px; background:var(--solid-1); border:1px solid var(--line); border-radius:10px; animation:pop .18s ease';
    div.innerHTML = `
      <label style="margin:0"><span class="lbl" style="font-size:11px">${icon('user','ic-sm')}${L2('নাম','Name')} *</span><input name="b_name_${rowIdx}" required placeholder="${L2('নাম লিখুন','Enter name')}"></label>
      <label style="margin:0"><span class="lbl" style="font-size:11px">${icon('phone','ic-sm')}${L2('ফোন','Phone')}</span><input name="b_phone_${rowIdx}" placeholder="${L2('ফোন নম্বর','Phone')}"></label>
      <label style="margin:0"><span class="lbl" style="font-size:11px">${icon('shield','ic-sm')}${L2('ভূমিকা','Role')}</span><select name="b_role_${rowIdx}">${roleOpts}</select></label>
      <button type="button" class="iconbtn danger bulk-remove" style="width:32px; height:32px" title="${L2('মুছুন','Remove')}">${icon('trash','ic-sm')}</button>
    `;
    rowsContainer.appendChild(div);
    const remBtn = div.querySelector('.bulk-remove');
    if(remBtn){
      remBtn.onclick = ()=>{ div.remove(); updateCount(); };
    }
    rowIdx++;
    updateCount();
    const inp = div.querySelector('input');
    if(inp) inp.focus();
  };
  if(addBtn) addBtn.onclick = addRow;
  // when bulkRole changes, update all rows that still have default? Actually update first row if empty
  if(bulkRoleSel){
    bulkRoleSel.onchange = ()=>{
      // if only 1 row and its role not manually changed, sync it
      const firstRowSel = rowsContainer.querySelector('select[name^="b_role_"]');
      if(firstRowSel && rowsContainer.querySelectorAll('.bulk-row').length===1){
        firstRowSel.value = bulkRoleSel.value;
      }
    };
    // set initial first row role to bulkRole
    const firstSel = rowsContainer.querySelector('select[name^="b_role_"]');
    if(firstSel) firstSel.value = bulkRoleSel.value;
  }
  rowsContainer.querySelectorAll('.bulk-remove').forEach(btn=>{
    btn.onclick = (e)=>{
      const row = e.target.closest('.bulk-row');
      if(row){ row.remove(); updateCount(); }
    };
  });
  updateCount();
  let busy=false;
  bindSubmit(form, async (d)=>{
    if(busy) return; busy=true;
    const contrib = Number(d.bulkContrib||0);
    const defaultRole = d.bulkRole || ROLES[ROLES.length-1];
    if(!contrib || contrib<=0){
      showFormError(form, L2('সবার জন্য চাঁদা লিখুন','Enter universal contribution'));
      busy=false; return;
    }
    const rows = rowsContainer.querySelectorAll('.bulk-row');
    const members = [];
    for(let i=0;i<rows.length;i++){
      const row = rows[i];
      const nameInput = row.querySelector('input[name^="b_name_"]');
      const phoneInput = row.querySelector('input[name^="b_phone_"]');
      const roleSel = row.querySelector('select[name^="b_role_"]');
      const name = nameInput ? String(nameInput.value||'').trim() : '';
      const phone = phoneInput ? String(phoneInput.value||'').trim() : '';
      const role = roleSel ? String(roleSel.value||'').trim() : defaultRole;
      if(!name){
        showFormError(form, L2('সব সদস্যের নাম লিখুন — '+(i+1)+' নং খালি','Enter all member names — row '+(i+1)+' is empty'));
        busy=false; return;
      }
      members.push({ name, phone, role: role || defaultRole, contribution: contrib, paid: 0, eventId: state.selectedEventId, orgId: state.currentOrgId });
    }
    if(!members.length){
      showFormError(form, L2('কমপক্ষে একজন সদস্য যোগ করুন','Add at least one member'));
      busy=false; return;
    }
    closeModal();
    try{
      for(let m of members){
        await saveGuard(()=> addDoc('members', m));
      }
      await reload();
      toast(L2('বাল্ক সদস্য যোগ হয়েছে ✓ — ','Bulk members added ✓ — ')+bn(members.length)+' '+L2('জন',''), 'ok');
    }catch(ex){
      toast(L2('সেভ করা যায়নি: ','Could not save: ')+(ex.message||''), 'err');
    }
    render();
  });
}
function bindTxnForm(ex){
  const f=document.getElementById('f'); if(!f) return;
  const typeSel=f.querySelector('#typeSel'), catSel=f.querySelector('#catSel');
  if(typeSel) typeSel.onchange=()=>{ catSel.innerHTML=(typeSel.value==='আয়'?INC:EXP).map(c=>`<option>${c}</option>`).join(''); };
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    closeModal();
    const data={...d, amount:Number(d.amount), eventId:state.selectedEventId, orgId:state.currentOrgId, receiptNo:d.receiptNo||''};
    try {
      await saveGuard(() => ex ? updDoc('transactions',ex.id,data) : addDoc('transactions',data));
      await reload();
      toast(L2('লেনদেন সেভ হয়েছে ✓', 'Entry saved ✓'), 'ok');
    }
    catch(err){ /* বার্তা toast-এ */ }
    render();
  });
}
function bindDonorForm(){
  const f=document.getElementById('f'); if(!f) return;
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    const amount=Number(d.amount||0);
    if(amount<=0){ showFormError(f, L2('টাকার পরিমাণ ০-এর বেশি হতে হবে', 'The amount must be greater than 0')); busy=false; return; }
    let donorId=d.donorId, name=d.donorId? (state.donors.find(x=>x.id===d.donorId)||{}).name : d.name;
    if(!name||!name.trim()){ showFormError(f, L2('দাতার নাম লিখুন', 'Please enter the donor name')); busy=false; return; }
    closeModal();
    try {
      if(donorId){
        const don=state.donors.find(x=>x.id===donorId)||{};
        await saveGuard(() => updDoc('donors',donorId,{totalDonated:(Number(don.totalDonated)||0)+amount, lastDonationDate:d.date, phone:d.phone||don.phone, orgId:state.currentOrgId, eventId:state.selectedEventId}));
      } else {
        const cr=await saveGuard(() => addDoc('donors',{name,phone:d.phone,totalDonated:amount,lastDonationDate:d.date,orgId:state.currentOrgId,eventId:state.selectedEventId}));
        donorId=cr && cr.id;
      }
      await saveGuard(() => addDoc('transactions',{eventId:state.selectedEventId,type:'আয়',category:'চাঁদা',amount,date:d.date,method:d.method,note:name+(d.note?` — ${d.note}`:''),receiptNo:'R-'+String(Date.now()).slice(-4),donorId,orgId:state.currentOrgId}));
      await reload();
      toast(L2('দান যোগ হয়েছে ✓', 'Donation added ✓'), 'ok');
    } catch(err){ /* বার্তা toast-এ */ }
    render();
  });
}

/* ============ Boot ============ */
let booted = false;
function boot(){
  if (booted) return; booted = true;
  window.__psDemo = () => { goDemo('ব্যবহারকারীর পছন্দ'); APP_RENDERED = true; render(); };
  /* ৫ সেকেন্ডেও কিছু দেখা না গেলে স্প্ল্যাশে স্পষ্ট বার্তা */
  setTimeout(() => {
    if (APP_RENDERED) return;
    const m = document.getElementById('bootMsg');
    if (m) m.innerHTML = L2('সংযোগ করা হচ্ছে… নেটওয়ার্ক ধীর হতে পারে।<br>না হলে <b>⚡ ডেমো মোডে চালান</b> চাপুন।', 'Connecting… the network may be slow.<br>Otherwise tap <b>⚡ Demo mode</b>.');
  }, 5000);
  try { document.documentElement.lang = LANG; } catch(_){}
  try { console.log('[Puja Sarathi] ' + APP_VER + ' | mode: ' + (useFb() ? ('Firebase:' + FB.projectId) : 'demo(local)') + ' | lang: ' + LANG + ' | ' + location.protocol); } catch(_){}

  if (!useFb()){
    try {
      const uid0 = store.get(LSU);
      if (uid0){
        const a = JSON.parse(store.get(LSA)||'[]').find(x => x.uid === uid0);
        const cur = store.get(LSC) || (a && a.orgIds && a.orgIds[0]);
        if (a){ state.user = { ...a, currentOrgId:cur }; state.orgs = JSON.parse(store.get(LSO)||'[]').filter(o => a.orgIds.includes(o.id)); }
      }
    } catch(e){}
    if (state.user){ reload().then(render).catch(ex => { noteWarn(fbErrMsg(ex)); render(); }); }
    else { render(); }
  } else {
    withTimeout(loadFirebase(), 30000, L2('Firebase লোড হলো না (ইন্টারনেট/CDN ব্লকড?)', 'Firebase could not load (internet/CDN blocked?)'))
      .then(() => {
        fb.auth.onAuthStateChanged(async (u) => {
          /* লগইন/সাইনআপ চলতে থাকলে এই হ্যান্ডলার হস্তক্ষেপ করবে না —
             আগে এটাই race বানিয়ে অ্যাপকে লগইন স্ক্রিনে আটকে রাখত */
          if (authBusy > 0) return;
          if (!u){ state.user = null; state.orgs = []; state.currentOrgId = ''; render(); return; }
          try {
            let p = {};
            for (let attempt = 0; attempt < 3; attempt++){
              try {
                const snap = await fbGet(fb.db.collection('users').doc(u.uid), 'প্রোফাইল পড়া');
                p = (snap && snap.exists !== false && snap.data()) ? (snap.data() || {}) : {};
              } catch(e){ if (permDenied(e)) noteBlocked('প্রোফাইল ডেটা (users)'); else noteWarn(fbErrMsg(e)); }
              if (p && p.orgIds && p.orgIds.length) break;
              if (attempt < 2) await new Promise(r => setTimeout(r, 1200));
            }
            state.user = {
              uid: u.uid,
              name: p.name || u.displayName || (u.email||'').split('@')[0],
              email: p.email || u.email || '',
              photoData: p.photoData || '',
              orgIds: p.orgIds || [],
              currentOrgId: p.currentOrgId || ((p.orgIds||[])[0] || '')
            };
            state.orgs = await fbGetOrgs(u.uid);
            syncOrg();
            await reload();
            render();
          } catch(ex){
            /* যেকোনো সমস্যা হলেও ব্যবহারকারী লগইন অবস্থাতেই থাকে — আটকে থাকে না */
            if (!state.user) state.user = { uid:u.uid, name:(u.email||'').split('@')[0], email:u.email||'', orgIds:[], currentOrgId:'' };
            if (!state.orgs) state.orgs = [];
            noteWarn(L2('ডেটা লোডে সমস্যা: ', 'Problem loading data: ') + fbErrMsg(ex));
            syncOrg();
            render();
          }
        });
      })
      .catch(ex => {
        goDemo(fbErrMsg(ex));
        state.user = null;
        render();
      });
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-route]');
    if (a){ e.preventDefault(); state.route = a.dataset.route; render(); }
  });
  window.closeModal = closeModal;
}
if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
<script>
// PWA Service Worker + Install Prompt
(function(){
  // Register SW for PWA (works on http://localhost and https)
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      // Only register if not file:// protocol
      if(location.protocol === 'file:'){
        console.log('[PWA] File protocol - SW skipped, but manifest still works for installability check');
        return;
      }
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(reg => {
          console.log('[PWA] SW registered:', reg.scope);
          // Check for updates
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if(nw){
              nw.addEventListener('statechanged', () => {
                if(nw.state === 'installed' && navigator.serviceWorker.controller){
                  console.log('[PWA] New content available, refresh to update');
                  // Optionally show update banner
                  try{
                    const b = document.createElement('div');
                    b.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center';
                    b.innerHTML='<span>🔄 New version available</span><button onclick="location.reload()" style="background:#f59e0b;border:0;color:white;padding:4px 10px;border-radius:999px;font-weight:700;cursor:pointer">Reload</button><button onclick="this.parentElement.remove()" style="background:transparent;border:0;color:#94a3b8;cursor:pointer">✕</button>';
                    document.body.appendChild(b);
                    setTimeout(()=> b.remove(), 15000);
                  }catch(_){}
                }
              });
            }
          });
        })
        .catch(err => console.warn('[PWA] SW registration failed:', err));
    });
  }

  // PWA Install Prompt
  let deferredPrompt = null;
  const installBtnId = 'pwaInstallBtn';
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('[PWA] beforeinstallprompt fired');
    // Show install button if exists, or create floating button
    let btn = document.getElementById(installBtnId);
    if(!btn){
      try{
        btn = document.createElement('button');
        btn.id = installBtnId;
        btn.innerHTML = '📲 Install App';
        btn.style.cssText='position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:white;border:0;padding:12px 18px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 8px 24px -4px rgba(245,158,11,.5);z-index:9998;cursor:pointer;display:flex;align-items:center;gap:6px';
        btn.onclick = async () => {
          if(!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] Install outcome:', outcome);
          deferredPrompt = null;
          btn.remove();
        };
        document.body.appendChild(btn);
        // Auto hide after 20s
        setTimeout(()=> { try{ btn.style.opacity='0'; btn.style.transform='translateY(10px)'; setTimeout(()=> btn.remove(), 400);}catch(_){} }, 20000);
      }catch(_){}
    } else {
      btn.style.display = 'flex';
    }
    // Also show in settings if button there
    try{
      const sBtn = document.getElementById('settingsPwaInstall');
      if(sBtn) sBtn.style.display = 'inline-flex';
    }catch(_){}
  });

  window.addEventListener('appinstalled', () => {
    console.log('[PWA] App installed');
    deferredPrompt = null;
    const btn = document.getElementById(installBtnId);
    if(btn) btn.remove();
    try{
      const sBtn = document.getElementById('settingsPwaInstall');
      if(sBtn) sBtn.style.display = 'none';
    }catch(_){}
  });

  // Expose install trigger for settings button
  window.triggerPwaInstall = async () => {
    if(deferredPrompt){
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      return outcome;
    } else {
      // Fallback instructions
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if(isIOS){
        alert('iPhone: Tap Share button (⎙) → Add to Home Screen → Add');
      } else {
        alert('To install: Open browser menu (⋮) → Install app / Add to Home Screen');
      }
      return 'dismissed';
    }
  };
})();
</script>
