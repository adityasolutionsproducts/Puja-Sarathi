<script>/* থিম-বুট: সংরক্ষিত পছন্দ বা সিস্টেম অনুযায়ী আগেই ঠিক করা হয় */
(function(){try{
  var t=null; try{ t=localStorage.getItem('ps_theme'); }catch(e){}
  var dark=(t==='dark')||((t!=='light')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  var m=(t==='light'||t==='dark')?t:'system';
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  document.documentElement.setAttribute('data-theme-mode', m);
  if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(m==='system'){
      document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); } });
}catch(e){}})();</script>
<style>
/* ═══════════════════════════════════════════════════════════════
     পূজা সারথি ৪.০ — প্রফেশনাল ডিজাইন সিস্টেম (glass, restrained)
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --ink:#0b1220; --ink-2:#1f2937; --body:#334155; --muted:#64748b; --faint:#94a3b8;
    --line:#e6eaf1; --line-2:#eef1f7; --line-3:rgba(15,23,42,.08);
    --bg:#f5f7fa;
    --surface:rgba(255,255,255,.88); --surface-2:rgba(255,255,255,.62); --surface-3:rgba(255,255,255,.42);
    --brand:#d97706; --brand-2:#f59e0b; --brand-3:#b45309; --brand-soft:#fffbeb;
    --navy-1:#0a1120; --navy-2:#111c33; --navy-3:#16233d;
    --ok:#047857; --ok-2:#059669; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
    --bad:#be123c; --bad-2:#e11d48; --bad-bg:#fff1f2; --bad-line:#fecdd3;
    --info:#1d4ed8; --info-bg:#eff6ff; --info-line:#bfdbfe;
    --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-ink:#92400e;
    --shadow-xs:0 1px 2px rgba(16,24,40,.05);
    --shadow-s:0 1px 2px rgba(16,24,40,.04), 0 6px 16px -10px rgba(16,24,40,.16);
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 14px 34px -18px rgba(16,24,40,.26);
    --shadow-l:0 30px 70px -24px rgba(16,24,40,.34);
    --r-xs:8px; --r-s:10px; --r:14px; --r-l:20px;
    --ff:'Inter','Noto Sans Bengali','Hind Siliguri','Nirmala UI','Segoe UI',system-ui,-apple-system,sans-serif;
    --fm:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
    /* কাচ/কঠিন পৃষ্ঠ — থিম বদলালে এগুলোও বদলায় */
    --glass-1:rgba(255,255,255,.88); --glass-2:rgba(255,255,255,.82); --glass-3:rgba(255,255,255,.7);
    --solid-1:#ffffff; --solid-2:#fbfcfe; --solid-3:#f8fafc; --solid-4:#f7f9fc;
    --row-hover:#fafbfe; --soft-2:#f1f5f9; --soft-line:#e2e8f0; --bar-bg:#eef2f7; --hover-line:#d8dee8;
    --field-bg:rgba(255,255,255,.92); --field-bg-focus:#ffffff; --field-line:#dbe2ec; --field-line-2:#cdd6e3; --field-ph:#a8b3c4;
    --btn-ink-1:#141f36; --btn-ink-2:#0b1220; --btn-ink-3:#1b2942; --btn-ink-4:#111c33;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; overflow-x:hidden; overflow-y:auto !important; min-height:100%; height:auto !important; }
  body{
    margin:0; color:var(--body); font-family:var(--ff); font-size:14px; line-height:1.55;
    background-color:var(--bg);
    overflow-x:hidden !important; overflow-y:auto !important; -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:auto !important; overscroll-behavior-x:hidden;
    position:relative; min-height:100vh; height:auto !important;
    /* Force scroll */
    display:block !important;
    background-image:
      radial-gradient(900px 420px at 6% -8%, rgba(217,119,6,.08) 0%, rgba(217,119,6,0) 62%),
      radial-gradient(760px 420px at 100% -6%, rgba(29,78,216,.06) 0%, rgba(29,78,216,0) 60%),
      linear-gradient(180deg,#fbfcfe 0%, #f4f6fa 55%, #f2f4f8 100%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4{ color:var(--ink); font-weight:700; letter-spacing:-.012em; margin:0; }
  a{ color:var(--info); }
  ::selection{ background:rgba(217,119,6,.22); }
  :focus-visible{ outline:2px solid rgba(217,119,6,.55); outline-offset:2px; border-radius:6px; }
  .num,.v,.money,td .amt{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }

  /* ── ANIMATED BACKGROUND - HIGHLY VISIBLE ── */
  .blobs{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .blobs i{ position:absolute; display:block; border-radius:50%; filter:blur(45px); opacity:.55; will-change:transform; }
  .blobs i:nth-child(1){ width:600px;height:600px; background:radial-gradient(circle, #fde68a 0%, #fbbf24 35%, #f59e0b 70%, #d97706 100%); top:-180px; left:-160px; animation:float1 8s ease-in-out infinite; }
  .blobs i:nth-child(2){ width:540px;height:540px; background:radial-gradient(circle, #c7d2fe 0%, #a5b4fc 40%, #818cf8 70%, #6366f1 100%); bottom:-180px; right:-150px; animation:float2 10s ease-in-out infinite; }
  .blobs i:nth-child(3){ width:420px;height:420px; background:radial-gradient(circle, #fed7aa 0%, #fdba74 40%, #fb923c 80%); top:35%; right:10%; opacity:.45; animation:float1 12s ease-in-out infinite reverse; }
  .blobs i:nth-child(4){ width:320px;height:320px; background:radial-gradient(circle, #bbf7d0 0%, #86efac 60%, #4ade80 100%); top:60%; left:5%; opacity:.35; animation:float2 14s ease-in-out infinite reverse; display:block; }
  .blobs i:nth-child(5){ width:260px;height:260px; background:radial-gradient(circle, #fecaca 0%, #fca5a5 60%, #f87171 100%); top:10%; right:20%; opacity:.30; animation:float1 16s ease-in-out infinite; display:block; }
  @keyframes float1{ 0%,100%{ transform:translate3d(0,0,0) scale(1); } 25%{ transform:translate3d(60px,50px,0) scale(1.12); } 50%{ transform:translate3d(30px,-50px,0) scale(1.08); } 75%{ transform:translate3d(-40px,30px,0) scale(1.10); } }
  @keyframes float2{ 0%,100%{ transform:translate3d(0,0,0) scale(1); } 33%{ transform:translate3d(-50px,-40px,0) scale(1.10); } 66%{ transform:translate3d(40px,30px,0) scale(1.12); } }
  @keyframes pulse1{ 0%,100%{ opacity:.55; } 50%{ opacity:.75; } }
  @keyframes pulse2{ 0%,100%{ opacity:.35; } 50%{ opacity:.60; } }
  @keyframes gradientShift{ 0%{ background-position:0% 50%; } 25%{ background-position:100% 0%; } 50%{ background-position:100% 100%; } 75%{ background-position:0% 100%; } 100%{ background-position:0% 50%; } }
  @keyframes float{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-10px) scale(1.03); } }
  @keyframes shimmer{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(200%); } }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 14px 34px -12px rgba(217,119,6,.75), 0 0 0 1px rgba(251,191,36,.35) inset, 0 0 20px rgba(251,191,36,.2); } 50%{ box-shadow:0 18px 44px -12px rgba(217,119,6,.9), 0 0 0 1px rgba(251,191,36,.5) inset, 0 0 35px rgba(251,191,36,.35); } }
  /* Auth wrap - FAST VISIBLE animated gradient */
  .auth-wrap{ 
    background:linear-gradient(135deg, #fffbeb 0%, #fef3c7 20%, #ffedd5 40%, #fed7aa 60%, #fff7e6 80%, #fffbeb 100%);
    background-size:300% 300%;
    animation:gradientShift 6s ease infinite;
    position:relative;
    overflow:hidden;
  }
  .auth-wrap::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(700px 400px at 20% 0%, rgba(251,191,36,.18), transparent 60%),
               radial-gradient(600px 400px at 80% 100%, rgba(99,102,241,.12), transparent 60%),
               radial-gradient(500px 300px at 50% 50%, rgba(251,113,133,.08), transparent 60%);
    animation:pulse1 4s ease-in-out infinite;
  }
  /* Floating diya particles - VISIBLE animation */
  .auth-wrap::after{
    content:'🪔 ✨ 🪔 ✨ 🪔'; position:absolute; inset:0; pointer-events:none; z-index:1;
    font-size:18px; letter-spacing:80px; line-height:180px; opacity:.07;
    animation:particleFloat 20s linear infinite;
    white-space:pre-wrap; word-break:break-all; padding:20px;
  }
  @keyframes particleFloat{ 0%{ transform:translateY(100%) rotate(0deg); } 100%{ transform:translateY(-100%) rotate(5deg); } }
  .auth-card{ 
    animation:cardFloat 4s ease-in-out infinite; 
    box-shadow:0 24px 70px -20px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.9) !important;
    position:relative;
  }
  .auth-card::after{
    content:''; position:absolute; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg, transparent, #fbbf24, #f59e0b, transparent);
    animation:shimmer 3s ease-in-out infinite;
    z-index:2;
  }
  @keyframes cardFloat{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-6px) rotate(.3deg); } }
  .auth-logo.hero{ animation:logoPop .5s cubic-bezier(.2,.9,.3,1.2), float 3s ease-in-out infinite 0.6s, glowPulse 3s ease-in-out infinite !important; }
  .auth-side .mark.hero-mark{ animation:float 4s ease-in-out infinite, glowPulse 4s ease-in-out infinite !important; }
  @media (prefers-reduced-motion: reduce){ .blobs i{ animation:none; } .auth-wrap{ animation:none; } .auth-card{ animation:none; } .auth-wrap::after{ animation:none; } }

  /* ── শেল: উপরে টপবার, নিচে নেভিগেশন, পাশে হ্যামবার্গার ড্রয়ার ── */
  .app{ display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1; overflow:visible !important; }
  .main{ display:flex; flex-direction:column; flex:1; min-width:0; overflow:visible !important; }

  /* ── নিচের নেভিগেশন (মোবাইল-ফার্স্ট, ডেস্কটপেও) ── */
  .side{
    position:fixed; left:0; right:0; bottom:0; z-index:40; width:100%;
    display:flex; align-items:stretch; color:var(--muted);
    background:var(--glass-1);
    -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%);
    border-top:1px solid var(--line);
    box-shadow:0 -1px 0 rgba(16,24,40,.03), 0 -12px 30px -22px rgba(16,24,40,.5);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .side nav{ display:flex; flex:1; gap:2px; overflow:hidden; justify-content:space-around; flex-wrap:nowrap; }
  .side{ }
  .content{ padding-bottom:120px !important; overflow:visible !important; min-height:50vh; }
  @media(min-width:960px){ .content{ padding-bottom:130px !important; } }
  .app{ min-height:100vh; overflow:visible !important; }
  .main{ flex:1; overflow:visible !important; }
  .side nav::-webkit-scrollbar{ display:none; }
  .side nav a{
    position:relative; flex:1 1 0; min-width:62px; text-decoration:none; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:7px 4px 6px; border-radius:12px; font-size:10.5px; font-weight:600; letter-spacing:.01em;
    transition:background .16s ease, color .16s ease;
  }
  .side nav a .nav-t{ max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side nav a .ic{ width:20px; height:20px; color:var(--faint); transition:color .16s ease, transform .16s ease; }
  .side nav a:hover{ background:var(--line-3); color:var(--ink-2); }
  .side nav a:hover .ic{ color:var(--ink-2); transform:translateY(-1px); }
  .side nav a.active{ color:var(--brand-3); background:var(--brand-soft); font-weight:700; }
  .side nav a.active .ic{ color:var(--brand); }
  .side nav a.active::after{ content:''; position:absolute; top:2px; width:18px; height:3px; border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,#fbbf24,#d97706); }
  @media(min-width:960px){
    .side{ left:50%; transform:translateX(-50%); right:auto; width:min(900px, 96vw); bottom:14px;
      border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-l); padding:6px; }
    .side nav a{ flex-direction:row; gap:7px; font-size:12.5px; padding:9px 8px; min-width:0; }
    .side nav a .nav-t{ max-width:none; }
    .side nav a .ic{ width:18px; height:18px; }
    .side nav a.active::after{ display:none; }
  }
  .content{ padding-bottom:120px; }
  @media(min-width:960px){ .content{ padding-bottom:130px; } }

  /* ═══ ড্যাশবোর্ড: বর্গাকার কাচ-কার্ড, ঝলক (glow), এক লাইনে দুটি (৪.৩) ═══ */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; max-width:760px; margin-left:auto; margin-right:auto; }
  .kpi-grid .kpi-card{
    display:flex; flex-direction:column; justify-content:center; position:relative;
    min-height:92px; max-height:118px; padding:11px 12px 10px; border-radius:12px;
    background:linear-gradient(155deg, var(--glass-1) 0%, var(--glass-3) 100%);
    -webkit-backdrop-filter:blur(18px) saturate(165%); backdrop-filter:blur(18px) saturate(165%);
    border:1px solid var(--line); overflow:hidden;
    transition:transform .18s ease, box-shadow .2s ease;
  }
  .kpi-grid .kpi-card::after{ content:''; position:absolute; inset:-40% -30% auto auto; width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 70%); opacity:.4; pointer-events:none; }
  .kpi-grid .kpi-card .kpi{ flex-direction:column; align-items:flex-start; gap:5px; }
  .kpi-grid .kpi-card .kpi .v{ font-size:24px; font-weight:900; letter-spacing:-.03em; line-height:1; }
  .kpi-grid .kpi-card:hover{ transform:translateY(-2px); }
  .kpi-grid .kpi-card[data-act]{ cursor:pointer; position:relative; }
  .kpi-grid .kpi-card[data-act]:hover{ transform:translateY(-3px) scale(1.01); box-shadow:0 12px 32px -12px rgba(0,0,0,.18), var(--shadow-s); }
  .kpi-grid .kpi-card[data-act]:active{ transform:translateY(-1px) scale(.99); }
  .kpi-grid .kpi-card[data-act]::before{ content:''; position:absolute; top:10px; right:10px; width:6px; height:6px; border-radius:50%; background:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,.2); animation:livePulse 2s ease-in-out infinite; }
  @keyframes livePulse{ 0%,100%{ transform:scale(1); opacity:1 } 50%{ transform:scale(1.2); opacity:.7 } }
  .kpi-card.tone-ok{ box-shadow:0 0 0 1px rgba(4,120,87,.16), 0 22px 46px -26px rgba(4,120,87,.72), var(--shadow-s); }
  .kpi-card.tone-bad{ box-shadow:0 0 0 1px rgba(190,18,60,.16), 0 22px 46px -26px rgba(190,18,60,.72), var(--shadow-s); }
  .kpi-card.tone-info{ box-shadow:0 0 0 1px rgba(29,78,216,.16), 0 22px 46px -26px rgba(29,78,216,.72), var(--shadow-s); }
  .kpi-card.tone-brand{ box-shadow:0 0 0 1px rgba(217,119,6,.18), 0 22px 46px -26px rgba(217,119,6,.78), var(--shadow-s); }
  .kpi-card.tone-ok:hover{ box-shadow:0 0 0 1px rgba(4,120,87,.26), 0 26px 54px -24px rgba(4,120,87,.85), var(--shadow); }
  .kpi-card.tone-bad:hover{ box-shadow:0 0 0 1px rgba(190,18,60,.26), 0 26px 54px -24px rgba(190,18,60,.85), var(--shadow); }
  .kpi-card.tone-info:hover{ box-shadow:0 0 0 1px rgba(29,78,216,.26), 0 26px 54px -24px rgba(29,78,216,.85), var(--shadow); }
  .kpi-card.tone-brand:hover{ box-shadow:0 0 0 1px rgba(217,119,6,.28), 0 26px 54px -24px rgba(217,119,6,.9), var(--shadow); }
  .glasscard{ background:linear-gradient(155deg, var(--glass-1), var(--glass-3)) !important;
    -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 18px 40px -26px rgba(16,24,40,.45) !important; }
  @media(max-width:520px){
    .kpi-grid{ gap:7px; max-width:100% !important; }
    .kpi-grid .kpi-card{ min-height:78px; max-height:96px; padding:9px 10px 8px; border-radius:10px; }
    .kpi-grid .kpi-card .kpi{ gap:4px; }
    .kpi-grid .kpi-card .kpi .v{ font-size:20px; font-weight:900; }
    .kpi-grid .kpi-card .kpi .lbl{ font-size:10px; }
    .kpi-grid .kpi-card .kpi .cap{ font-size:9.5px; line-height:1.1; }
    .kpi-grid .kpi-card .ic-badge{ width:28px; height:28px; border-radius:8px; }
    .kpi-grid .kpi-card .ic-badge .ic{ width:14px; height:14px; }
  }
  @media(max-width:760px){
    .kpi-grid{ gap:8px; }
    .kpi-grid .kpi-card{ min-height:84px; padding:10px 11px; }
    .kpi-grid .kpi-card .kpi .v{ font-size:22px; font-weight:900; }
  }
  :root[data-theme="dark"] .kpi-grid .kpi-card::after{ background:radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 70%); }
  :root[data-theme="dark"] .kpi-card.tone-ok{ box-shadow:0 0 0 1px rgba(52,211,153,.2), 0 22px 46px -26px rgba(16,185,129,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-bad{ box-shadow:0 0 0 1px rgba(251,113,133,.2), 0 22px 46px -26px rgba(244,63,94,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-info{ box-shadow:0 0 0 1px rgba(138,180,255,.2), 0 22px 46px -26px rgba(59,130,246,.7), var(--shadow-s); }
  :root[data-theme="dark"] .kpi-card.tone-brand{ box-shadow:0 0 0 1px rgba(245,158,11,.22), 0 22px 46px -26px rgba(217,119,6,.75), var(--shadow-s); }

  .tableWrap{ overflow:auto; overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--r); background:var(--glass-3); max-width:100%; }

  .auth-card h2{ text-align:center; }

  /* ── মডাল ── */
  .modal{ position:fixed; inset:0; background:rgba(11,18,32,.42); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    display:flex; align-items:center; justify-content:center; padding:16px; z-index:80; animation:fade .18s ease; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .modal .box{ background:rgba(255,255,255,.97); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:18px; width:100%; max-width:560px; max-height:92vh; overflow:hidden;
    box-shadow:var(--shadow-l); animation:pop .2s cubic-bezier(.2,.9,.3,1.2); display:flex; flex-direction:column; }
  @keyframes pop{ from{ transform:translateY(10px) scale(.985); opacity:.6 } to{ transform:none; opacity:1 } }

  :root[data-theme="dark"] .modal .head span{ color:#e2e8f0 !important; }
  :root:not([data-theme="light"]) .modal .head{ background:#1e293b; color:#e2e8f0; border-bottom-color:#334155; }
  :root:not([data-theme="light"]) .modal .head span{ color:#e2e8f0; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .modal .box{ background:rgba(19,26,42,.98) !important; }
    :root:not([data-theme="light"]) .modal .head{ background:#1e293b !important; color:#e2e8f0 !important; }
  }
    display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:15px; letter-spacing:-.01em; position:sticky; top:0;
    background:rgba(255,255,255,.96); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); z-index:1; }
  .modal .body{ padding:20px; }

  /* ── ৪.৫: অ্যাপ আইকনের প্রদীপ — শিখা হালকা করে নড়ে, আভা ধীরে শ্বাস নেয় ── */
  .appmark .flame, .appmark .flame-in{ transform-box:fill-box; transform-origin:50% 100%; will-change:transform; }
  .appmark .flame{ animation:flameFlick 2.9s ease-in-out infinite; }
  .appmark .flame-in{ animation:flameFlickIn 2.1s ease-in-out infinite; }
  .appmark .halo{ transform-box:fill-box; transform-origin:50% 62%; animation:haloPulse 3.4s ease-in-out infinite; }
  @keyframes flameFlick{
    0%,100%{ transform:scale(1,1) rotate(0deg); }
    18%{ transform:scale(.97,1.05) rotate(-1.4deg); }
    38%{ transform:scale(1.03,.96) rotate(1.1deg); }
    58%{ transform:scale(.985,1.03) rotate(-.7deg); }
    78%{ transform:scale(1.02,.98) rotate(.6deg); }
  }
  @keyframes flameFlickIn{
    0%,100%{ transform:scale(1,1) rotate(0deg); opacity:.95; }
    30%{ transform:scale(.94,1.08) rotate(1.6deg); opacity:.9; }
    65%{ transform:scale(1.05,.94) rotate(-1.2deg); opacity:1; }
  }
  @keyframes haloPulse{ 0%,100%{ opacity:.75; transform:scale(1) } 50%{ opacity:1; transform:scale(1.06) } }
  @media (prefers-reduced-motion: reduce){
    .appmark .flame, .appmark .flame-in, .appmark .halo{ animation:none !important; }
  }

  /* ── ৪.৬: খাতা (লেজার) — দুই ভাগ, চলতি ব্যালেন্স ── */

  /* ── টোস্ট সিস্টেম (৪.৪) — একাধিক বার্তা সাজিয়ে দেখায় ── */
  /* ৪.৫ — বার্তা এখন উপরে (হেডারের ঠিক নিচে, ডান কোণে); নতুন বার্তা সবচেয়ে নিচে */
  .toasts{ position:fixed; right:18px; top:64px; z-index:400; display:flex; flex-direction:column; gap:9px;
    width:min(380px, calc(100vw - 28px)); pointer-events:none; }
  .toasts > *{ pointer-events:auto; }
  .toast{ position:relative; display:flex; align-items:flex-start; gap:11px; width:100%; max-width:none;
    padding:13px 14px; border-radius:14px; font-size:13.2px; line-height:1.5; color:var(--ink);
    background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--line); border-left:4px solid var(--brand);
    box-shadow:var(--shadow-l), 0 10px 30px -14px rgba(15,23,42,.35);
    animation:toastIn .26s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes toastIn{ from{ transform:translateY(-14px) scale(.985); opacity:0 } to{ transform:none; opacity:1 } }
  .toast.out{ animation:toastOut .22s ease forwards; }
  @keyframes toastOut{ to{ transform:translateY(-12px) scale(.985); opacity:0 } }
  .toast .toast-ic{ flex:0 0 auto; width:26px; height:26px; border-radius:9px; display:grid; place-items:center; margin-top:1px; }
  .toast .toast-tx{ flex:1 1 auto; min-width:0; padding-top:2px; word-break:break-word; }
  .toast .toast-x{ flex:0 0 auto; width:24px; height:24px; border:0; background:transparent; color:var(--faint);
    border-radius:7px; display:grid; place-items:center; cursor:pointer; padding:0; }
  /* ৪.৬: টোস্টের ভিতরের কাজের বাটন (যেমন "ফিরিয়ে আনুন") + সময়ের রেখা */
  .toast .toast-act{ flex:0 0 auto; align-self:center; border:1px solid var(--line); background:var(--solid-1); color:var(--ink-2);
    font:inherit; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:9px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:6px; transition:.15s; }
  .toast .toast-act:hover{ background:var(--brand-soft); border-color:rgba(217,119,6,.35); color:var(--brand-3); }
  .toast .toast-act .toast-secs{ min-width:1.1em; text-align:right; color:var(--brand-3); font-variant-numeric:tabular-nums; }
  .toast .toast-bar{ position:absolute; left:0; right:0; bottom:0; height:3px; border-radius:0 0 14px 14px;
    background:linear-gradient(90deg,var(--brand-2),var(--brand)); transform-origin:left center;
    animation:toastBar linear forwards; }
  .toast.t-ok .toast-bar{ background:linear-gradient(90deg,#10b981,#047857); }
  .toast.t-err .toast-bar{ background:linear-gradient(90deg,#f43f5e,#be123c); }
  .toast.t-warn .toast-bar{ background:linear-gradient(90deg,#fbbf24,#b45309); }
  .toast.t-info .toast-bar{ background:linear-gradient(90deg,#60a5fa,#1d4ed8); }
  @keyframes toastBar{ from{ transform:scaleX(1) } to{ transform:scaleX(0) } }
  :root[data-theme="dark"] .toast .toast-act{ background:rgba(148,163,184,.12); border-color:#2b3752; color:#dbe3ef; }
  :root[data-theme="dark"] .toast .toast-act:hover{ background:rgba(245,158,11,.16); color:#fcd34d; }
  .toast .toast-x:hover{ background:var(--soft-2); color:var(--ink-2); }
  .toast.t-ok{ border-left-color:#10b981; }
  .toast.t-ok .toast-ic{ background:rgba(16,185,129,.14); color:#047857; }
  .toast.t-err{ border-left-color:#e11d48; }
  .toast.t-err .toast-ic{ background:rgba(225,29,72,.13); color:#be123c; }
  .toast.t-warn{ border-left-color:#f59e0b; }
  .toast.t-warn .toast-ic{ background:rgba(245,158,11,.16); color:#b45309; }
  .toast.t-info{ border-left-color:#3b82f6; }
  .toast.t-info .toast-ic{ background:rgba(59,130,246,.14); color:#1d4ed8; }
  @media(max-width:520px){
    .toasts{ left:50%; right:auto; transform:translateX(-50%); top:10px; width:calc(100vw - 24px); }
    .toast{ animation:toastInM .26s cubic-bezier(.2,.9,.3,1.15); }
    @keyframes toastInM{ from{ transform:translateY(-14px) scale(.98); opacity:0 } to{ transform:none; opacity:1 } }
  }
  @media print{ .toasts{ display:none !important; } }
  :root[data-theme="dark"] .toast{ background:rgba(17,24,39,.94); border-color:#26314a; color:#e6ecf7; }
  :root[data-theme="dark"] .toast .toast-x{ color:#8b9cba; }
  :root[data-theme="dark"] .toast .toast-x:hover{ background:rgba(148,163,184,.16); color:#e6ecf7; }
  :root[data-theme="dark"] .toast.t-ok .toast-ic{ background:rgba(16,185,129,.2); color:#6ee7b7; }
  :root[data-theme="dark"] .toast.t-err .toast-ic{ background:rgba(225,29,72,.22); color:#fda4af; }
  :root[data-theme="dark"] .toast.t-warn .toast-ic{ background:rgba(245,158,11,.22); color:#fcd34d; }
  :root[data-theme="dark"] .toast.t-info .toast-ic{ background:rgba(59,130,246,.22); color:#93c5fd; }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; }
  .spin-d{ width:26px; height:26px; border:3px solid rgba(217,119,6,.18); border-top-color:var(--brand); border-radius:50%; animation:sp .8s linear infinite; margin:0 auto; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* ── বিবিধ ── */
  summary{ outline:none; }
  .hidecode{ user-select:all; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(100,116,139,.35); border-radius:999px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(100,116,139,.55); background-clip:content-box; }

  .filterbar .input{ max-width:300px; padding-left:34px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='6.3'/><path d='M20 20l-4.7-4.7'/></svg>");
    background-repeat:no-repeat; background-position:11px center; }
  .seg{ display:inline-flex; background:rgba(15,23,42,.045); border:1px solid var(--line); border-radius:999px; padding:3px; }

    cursor:pointer; font-family:inherit; transition:.16s; }

  /* ═══════════ PDF / প্রিন্ট — শুধু রিপোর্ট ═══════════ */
  /* ═══════════ থিম: সিস্টেম / হালকা / গাঢ় (৪.১) ═══════════ */
  :root{ color-scheme:light; }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#e9eff8; --ink-2:#cdd7e6; --body:#b4c0d2; --muted:#8b9ab1; --faint:#6f7f97;
    --line:#26324b; --line-2:#1e2840; --line-3:rgba(255,255,255,.08);
    --bg:#070b14;
    --surface:rgba(19,26,42,.82); --surface-2:rgba(19,26,42,.6); --surface-3:rgba(19,26,42,.42);
    --glass-1:rgba(21,29,47,.88); --glass-2:rgba(21,29,47,.8); --glass-3:rgba(21,29,47,.62);
    --solid-1:#151d2f; --solid-2:#131a2b; --solid-3:#182033; --solid-4:#161e30;
    --row-hover:rgba(255,255,255,.04); --soft-2:#1d273c; --soft-line:#2b3852; --bar-bg:#1b2336; --hover-line:#33415e;
    --field-bg:rgba(13,19,33,.72); --field-bg-focus:rgba(13,19,33,.9); --field-line:#2b3852; --field-line-2:#3a4a6b; --field-ph:#63748f;
    --btn-ink-1:#243149; --btn-ink-2:#1a2338; --btn-ink-3:#2c3b57; --btn-ink-4:#212c45;
    --brand-soft:rgba(217,119,6,.14);
    --ok:#34d399; --ok-2:#10b981; --ok-bg:rgba(5,150,105,.14); --ok-line:rgba(52,211,153,.3);
    --bad:#fb7185; --bad-2:#f43f5e; --bad-bg:rgba(190,18,60,.16); --bad-line:rgba(251,113,133,.3);
    --info:#8ab4ff; --info-bg:rgba(29,78,216,.18); --info-line:rgba(138,180,255,.3);
    --warn-bg:rgba(217,119,6,.15); --warn-line:rgba(245,158,11,.34); --warn-ink:#fcd34d;
    --shadow-xs:0 1px 2px rgba(0,0,0,.5);
    --shadow-s:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -14px rgba(0,0,0,.7);

    --shadow-l:0 34px 80px -30px rgba(0,0,0,.9);
    --navy-1:#060a13; --navy-2:#0b1322; --navy-3:#101a2e;
  }
  :root[data-theme="dark"] body{
    background-image:
      radial-gradient(900px 420px at 6% -8%, rgba(217,119,6,.16) 0%, rgba(217,119,6,0) 62%),
      radial-gradient(760px 420px at 100% -6%, rgba(59,130,246,.14) 0%, rgba(59,130,246,0) 60%),
      linear-gradient(180deg,#080d18 0%, #070b14 58%, #060a12 100%);
  }
  :root[data-theme="dark"] .blobs i{ opacity:.45; filter:blur(50px); } :root[data-theme="dark"] .auth-wrap{ background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #1e293b 70%, #0f172a 100%) !important; background-size:300% 300% !important; animation:gradientShift 6s ease infinite !important; }
  /* Dark mode for new features - Backup/Restore/Reminders/Notifications */
  :root[data-theme="dark"] .notif-panel{ background:rgba(15,23,42,.98) !important; border-left-color:#1e293b !important; }
  :root[data-theme="dark"] .notif-panel > div:first-child{ background:linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important; }
  :root[data-theme="dark"] .notif-item{ background:#1e293b !important; border-color:#334155 !important; color:#e2e8f0 !important; }
  :root[data-theme="dark"] .notif-item.unread{ background:linear-gradient(135deg, #1e293b 0%, #422006 100%) !important; border-color:#f59e0b !important; }
  :root[data-theme="dark"] .notif-item.overdue{ background:linear-gradient(135deg, #1e293b 0%, #450a0a 100%) !important; border-color:#ef4444 !important; }
  :root[data-theme="dark"] .notif-item.today{ background:linear-gradient(135deg, #1e293b 0%, #422006 100%) !important; }
  :root[data-theme="dark"] .notif-item .notif-ic{ filter:brightness(0.9); }
  :root[data-theme="dark"] .card[style*="f0fdf4"], :root[data-theme="dark"] .card[style*="eff6ff"], :root[data-theme="dark"] .card[style*="fffbeb"], :root[data-theme="dark"] .card[style*="f5f3ff"], :root[data-theme="dark"] .card[style*="fef2f2"], :root[data-theme="dark"] .card[style*="fef3c7"], :root[data-theme="dark"] .card[style*="dcfce7"], :root[data-theme="dark"] .card[style*="dbeafe"], :root[data-theme="dark"] .card[style*="ede9fe"], :root[data-theme="dark"] .card[style*="fecaca"], :root[data-theme="dark"] .card[style*="bfdbfe"]{ background:var(--solid-1) !important; border-color:var(--line) !important; }

    if (permDenied(e)) { scopeMode = 'event'; }
    else { scopeMode = 'org'; }   // নেটওয়ার্ক সমস্যা — পরের বার আবার চেষ্টা হবে

async function listDocs(col, orgId, eventIds){

    try {

      if (got.length) return got;
      /* ফাঁকা ফলাফল এলেও থামা যাবে না — নিরাপত্তা-নিয়মে ফাঁকা কুয়েরি "সফল" দেখাতে পারে,

async function addDoc(col, data){

  if (col !== 'users' && col !== 'organizations'){
    if (payload.orgId === undefined && org) payload.orgId = org;
    if (payload.eventId === undefined && col !== 'events' && state.selectedEventId) payload.eventId = state.selectedEventId;
  }
  if (!dataLocal()){
    await loadFirebase();
    try {
      const ref = await fbTimeout(fb.db.collection(col).add({ ...payload, createdAt: Date.now() }), 20000, 'সংরক্ষণ');
      return { id: ref.id, ...payload };
    } catch(e){
      /* লগআউট/রিকানেক্টের সময় SDK নিজের পাঠানো লেখাটিই আবার পাঠায় → already-exists।
         ডেটা সেভ হয়েই আছে, তাই এটিকে সফল ধরা হয়। */

async function updDoc(col, id, data){
  if (!dataLocal()){
    await loadFirebase();

    catch(e){ markWriteBlocked(e); throw e; }

  }

  const arr = await listDemo(col, key);
  const i = arr.findIndex(x => x.id === id);

    await fbTimeout(fb.db.collection(col).doc(id).set(data), 20000, 'ফিরিয়ে আনা');
    return;
  }
  const key = localKey(col);
  const arr = await listDemo(col, key);
  if (!arr.some(x => x.id === id)) arr.push({ ...data, id });
  saveDemo(col, arr, key);
}
/* এক বা একাধিক রেকর্ড একসাথে মোছা + ফিরিয়ে আনার সুবিধা */
async function softDeleteMany(items, msg, restoreMsg){
  const saved = [];
  for (const it of items){
    const data = await fetchDoc(it.col, it.id);
    if (data) saved.push({ ...it, data });
    try { await delDoc(it.col, it.id); } catch(e){ /* নিচে বার্তা */ }
  }
  if (!saved.length){ toast(L2('মুছে ফেলা যায়নি', 'Could not delete'), 'err'); return; }
  try { await reload(); } catch(e){}
  render();
  toast(msg, 'ok', {
    duration: 10000,
    action: {
      label: L2('ফিরিয়ে আনুন', 'Undo'),
      secs: 10,
      fn: async () => {
        for (const it of saved){
          try { await restoreDoc(it.col, it.id, it.data); } catch(e){}
        }
        try { await reload(); } catch(e){}
        render();
        toast(restoreMsg || L2('ফিরিয়ে আনা হয়েছে', 'Restored'), 'ok');
      }
    }
  });
}
function softDelete(col, id, msg, restoreMsg){
  return softDeleteMany([{ col, id }], msg, restoreMsg);
}

const LSA = 'ps_accounts', LSO='ps_orgs', LSU='ps_user', LSC='ps_cur_org', LSI='ps_orgInvites';
function genInviteCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = 'PS-';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function demoGetInviteByCode(code){
  code=String(code||'').trim().toUpperCase();
  if(!code) return null;
  try { 
    const arr=JSON.parse(store.get(LSI)||'[]'); 
    let found = arr.find(x=> (x.code||'').toUpperCase()===code);
    if(found) return found;
    // Fallback: search in orgs where inviteCode == code (for backward compat)
    try {
      const orgs=JSON.parse(store.get(LSO)||'[]');
      const o=orgs.find(x=> (x.inviteCode||'').toUpperCase()===code);
      if(o){
        // Reconstruct invite from org
        return { code, orgId:o.id, role:'member', createdAt:o.createdAt||Date.now(), used:false, singleUse:false };
      }
    } catch(e2){}
    return null; 
  } catch(e){ return null; }
}

/* Firebase auth — সব ধাপে টাইমআউট, তাই কখনোই "দাঁড়িয়ে থাকবে" না */
async function fbGetInviteByCode(code){
  code=String(code||'').trim().toUpperCase();
  if(!code) return null;
  try {
    await loadFirebase();
    // Try direct get - for signup, user is not yet auth, so rules must allow get without auth
    // If rules block, try with timeout and better error
    let doc = null;
    try {
      doc = await fbTimeout(fb.db.collection('orgInvites').doc(code).get(), 8000, 'invite');
    } catch(e){
      // If permission denied due to auth required, try alternative via users collection check
      // For now return null but log
      console.warn('[Invite] get failed', e);
      // Still try fbGet wrapper which has error handling
      try { doc = await fbGet(fb.db.collection('orgInvites').doc(code), 'invite কোড'); } catch(e2){ doc = null; }
    }
    if(doc && doc.exists) return { code, id:doc.id, ...doc.data() };
    // Fallback: search orgs where inviteCode == code (if old orgs have inviteCode field)
    try {
      const snap = await fbTimeout(fb.db.collection('organizations').where('inviteCode','==',code).limit(1).get(), 8000, 'org by invite');
      if(!snap.empty){
        const d = snap.docs[0];
        return { code, orgId:d.id, role:'member', createdAt:Date.now(), used:false, singleUse:false, ...d.data() };
      }
    } catch(e2){}
    return null;
  } catch(e){ 
    console.warn('[Invite] fbGetInviteByCode error', e);
    return null; 
  }
}

/* সংগঠনের তালিকা: আগে প্রোফাইলের orgIds থেকে সরাসরি ডকুমেন্ট পড়া (এই নিয়মে সবচেয়ে নির্ভরযোগ্য),
   না পেলে ownerId কুয়েরি — যেটা কাজ করে সেটাই ব্যবহার হয় */
async function fbGetOrgs(uid){
  await loadFirebase();
  const out = [], seen = {};
  // 1) from users.orgIds
  try {
    const s = await fbGet(fb.db.collection('users').doc(uid), 'প্রোফাইল পড়া');
    const ids = (s && s.exists !== false && s.data()) ? (s.data().orgIds || []) : [];
    for (let k = 0; k < ids.length; k++){
      if (seen[ids[k]]) continue; seen[ids[k]] = true;
      try {
        const o = await fbGet(fb.db.collection('organizations').doc(ids[k]), 'সংগঠন পড়া');
        if (o && o.exists) out.push({ id:ids[k], ...o.data() });
      } catch(e){ if (permDenied(e)) noteBlocked('সংগঠন ডকুমেন্ট'); }
    }
  } catch(e){ if (permDenied(e)) noteBlocked('প্রোফাইল ডেটা (users)'); else noteWarn(fbErrMsg(e)); }
  // 2) from orgMembers where uid == uid
  try {
    const snap = await fbGet(fb.db.collection('orgMembers').where('uid','==',uid), 'orgMembers তালিকা (uid)');
    const mems = fbDocs(snap);
    for(const m of mems){
      const orgId = m.orgId;
      if(!orgId || seen[orgId]) continue;
      seen[orgId]=true;
      try {
        const o = await fbGet(fb.db.collection('organizations').doc(orgId), 'সংগঠন পড়া');
        if (o && o.exists) out.push({ id:orgId, ...o.data() });
      } catch(e){}
    }
  } catch(e){ if(permDenied(e)) noteBlocked('orgMembers তালিকা (uid)'); }
  // 3) also from orgMembers where email == current user's email (invite claimed)
  try {
    const email = (state.user && state.user.email) ? state.user.email.toLowerCase() : '';
    if(email){
      const snap2 = await fbGet(fb.db.collection('orgMembers').where('email','==',email), 'orgMembers তালিকা (email)');
      const mems2 = fbDocs(snap2);
      for(const m of mems2){
        const orgId = m.orgId;
        if(!orgId || seen[orgId]) continue;
        seen[orgId]=true;
        // claim uid if missing
        if(!m.uid){
          try { await fbTimeout(fb.db.collection('orgMembers').doc(m.id).set({ uid }, {merge:true}), 10000, 'invite claim'); } catch(e){}
          // add to user's orgIds
          try {
            await fbTimeout(fb.db.collection('users').doc(uid).set({ orgIds: firebase.firestore.FieldValue.arrayUnion(orgId) }, {merge:true}), 10000, 'প্রোফাইল সংরক্ষণ');
          } catch(e){}
        }
        try {
          const o = await fbGet(fb.db.collection('organizations').doc(orgId), 'সংগঠন পড়া');
          if (o && o.exists) out.push({ id:orgId, ...o.data() });
        } catch(e){}
      }
    }
  } catch(e){}
  if (out.length) return out;
  try {
    return fbDocs(await fbGet(fb.db.collection('organizations').where('ownerId','==',uid), 'সংগঠনের তালিকা'));

const state = { user:null, orgs:[], events:[], members:[], transactions:[], donors:[], orgMembers:[], orgInvites:[], reminders:[], notifications:[], currentOrgId:'', currentRole:'', selectedEventId:'', route:'/', modal:null, fbErr:'', ledgerTab:'entries', reportFilter:{type:'all', category:'all', q:''} };

/* state.currentOrgId আর state.user.currentOrgId — দুটোই সবসময় মিলিয়ে রাখা হয় (আগে এটাই সেট হতো না) */
function syncOrg(){
  if (!state.user){ state.currentOrgId = ''; return ''; }
  const orgs = state.orgs || [];
  let id = state.user.currentOrgId || '';
  if (!id || !orgs.some(o => o.id === id)) id = (orgs[0] && orgs[0].id) || state.currentOrgId || '';
  state.currentOrgId = id;
  state.user.currentOrgId = id;
  return id;
}
async function signup(d){
  authBusy++;                    // এর মধ্যে onAuthStateChanged যেন হস্তক্ষেপ না করে
  try {
    const u = useFb() ? await fbSignup(d) : await demoSignup(d);
    state.user = u;
    await loadOrgsQuiet(u);
    syncOrg();
    return u;
  } finally { authBusy--; }
}
/* সংগঠনের তথ্য আনার চেষ্টা — ব্যর্থ হলেও লগইন আটকাবে না */
async function loadOrgsQuiet(u){
  if (!state.orgs) state.orgs = [];
  for (let attempt = 0; attempt < 3; attempt++){
    try {
      const o = useFb() ? await fbGetOrgs(u.uid) : await demoOrgs(u.uid);
      if (o && o.length){ state.orgs = o; return; }
      if (attempt === 2){ state.orgs = o || []; return; }
    } catch(e){ if (attempt === 2){ noteWarn(L2('সংগঠনের তথ্য আনা যায়নি: ', 'Could not fetch organization data: ') + fbErrMsg(e)); } }
    await new Promise(r => setTimeout(r, 1200));   // নতুন অ্যাকাউন্টের ডকুমেন্ট লেখা শেষ হওয়ার জন্য অপেক্ষা
  }
}
async function login(d){
  authBusy++;
  try {
    const u = useFb() ? await fbLogin(d) : await demoLogin(d);
    state.user = u;                     // লগইন সফল — এখন আর কোনো কারণেই আটকে থাকবে না
    await loadOrgsQuiet(u);
    syncOrg();
    return u;
  } finally { authBusy--; }
}

  try { useFb() ? await fbLogout() : demoLogout(); } catch(e){}
  state.user = null; state.orgs = []; state.currentOrgId = ''; state.selectedEventId = ''; state.currentRole = ''; state._roleUid = ''; state.orgMembers = []; state.orgInvites = []; state.members = []; state.transactions = []; state.donors = []; state.events = [];

}
async function switchOrg(orgId){
  if (!state.user) return;
  try { useFb() ? await fbSetOrg(state.user.uid, orgId) : demoSetOrg(state.user.uid, orgId); } catch(e){}
  state.user = { ...state.user, currentOrgId: orgId };
  state.currentOrgId = orgId;
  state.selectedEventId = '';

}
async function addOrg(name){
  const o = useFb() ? await fbCreateOrg(name, state.user.uid) : await demoCreateOrg(name, state.user.uid);
  try { state.orgs = useFb() ? await fbGetOrgs(state.user.uid) : await demoOrgs(state.user.uid); } catch(e){}

  await switchOrg(o.id);
}

/* ব্রাউজারে জমানো ডেটা Firebase-এ পাঠানো (নিয়ম ঠিক করার পরে এক ক্লিকে) */
async function migrateLocalToFirebase(){
  if (!useFb()){ toast(L2('Firebase সংযুক্ত নেই — এই ব্রাউজারেই ডেটা জমছে', 'Firebase is not connected — data is stored in this browser'), 'warn'); return; }
  if (LOCAL_STORE){ toast(L2('প্রথমে সেটিংস → “Firebase-এ সেভ” মোডে ফিরুন', 'First switch back to “Save to Firebase” in Settings'), 'warn'); return; }
  if (!state.user) return;
  let ok = 0, bad = 0;
  const oldKey = k => 'ps_u_' + state.user.uid + '_' + k;
  try {
    const eMap = {};
    for (const item of await listDemo('events', oldKey('events'))){
      const { id, createdAt, ...data } = item;
      try { const ref = await fbTimeout(fb.db.collection('events').add({ ...data, createdAt: createdAt||Date.now() }), 20000, 'মাইগ্রেশন'); eMap[id] = ref.id; ok++; }
      catch(e){ bad++; }
    }
    for (const col of ['members','transactions','donors']){
      for (const item of await listDemo(col, oldKey(col))){
        const { id, createdAt, ...data } = item;
        if (data.eventId && eMap[data.eventId]) data.eventId = eMap[data.eventId];
        try { await fbTimeout(fb.db.collection(col).add({ ...data, createdAt: createdAt||Date.now() }), 20000, 'মাইগ্রেশন'); ok++; }
        catch(e){ bad++; }
      }
    }
    if (!bad){ ['events','members','transactions','donors'].forEach(c => saveDemo(c, [], oldKey(c))); }
    toast(bad ? L2('পাঠানো হয়েছে ', 'Sent ') + bn(ok) + L2(' টি, যায়নি ', ' entries, failed ') + bn(bad) + L2(' টি (নিয়ম আটকাচ্ছে)', ' (rules are blocking)') : L2('সবগুলোই পাঠানো হয়েছে — ', 'All ') + bn(ok) + L2(' টি এন্ট্রি এখন Firebase-এ', ' entries are now in Firebase'), bad ? 'warn' : 'ok');
    WRITE_BLOCKED = false;
  } catch(e){ toast(L2('পাঠানো যায়নি: ', 'Could not send: ') + fbErrMsg(e), 'err'); }
  await reload(); render();
}

async function reload(){
  syncOrg();
  const orgId = state.currentOrgId || '';
  // load orgMembers first to know role
  try {
    state.orgMembers = await listOrgMembers(orgId);
  } catch(e){ state.orgMembers = state.orgMembers||[]; }
  try {
    state.orgInvites = await listOrgInvites(orgId);
  } catch(e){ state.orgInvites = state.orgInvites||[]; }
  state.currentRole = getMyRole(orgId);
  state._roleUid = state.user ? state.user.uid : '';
  const e = await listDocs('events', orgId);
  state.events = e;
  if (e.length && !e.find(x => x.id === state.selectedEventId)) state.selectedEventId = e[0].id;
  if (!e.length) state.selectedEventId = '';
  const eids = e.map(x => x.id);
  const [m, t, d, r] = await Promise.all([
    listDocs('members', orgId, eids),
    listDocs('transactions', orgId, eids),
    listDocs('donors', orgId, eids),
    listDocs('reminders', orgId, eids)
  ]);
  state.members = m; state.transactions = t; state.donors = d; state.reminders = r || [];
  state.currentRole = getMyRole(orgId);
  state._roleUid = state.user ? state.user.uid : '';
  // check reminders after load
  try{ checkReminders(); }catch(_){}
}

async function fbInviteMember(orgId, email, role, name){
  email = String(email||'').trim().toLowerCase();
  if(!email) throw new Error(L2('ইমেইল দিন','Enter email'));
  if(!APP_ROLES.some(r=>r.id===role)) throw new Error('Invalid role');
  const payload = { orgId, email, role, name:name||'', addedAt:Date.now(), addedBy: state.user ? state.user.uid : '', uid:'' };
  // check if user exists to get uid
  if(!dataLocal()){
    await loadFirebase();
    // try to find user by email via users collection? We can't query all, but try where email==?
    try {
      const q = await fbGet(fb.db.collection('users').where('email','==',email).limit(1), 'user খোঁজা');
      const docs = fbDocs(q);
      if(docs.length) payload.uid = docs[0].id || docs[0].uid || '';
    } catch(e){ /* ignore, rules may block */ }
    const ref = await fbTimeout(fb.db.collection('orgMembers').add(payload), 20000, 'সদস্য আমন্ত্রণ');
    // also add orgId to user's orgIds if we have uid
    if(payload.uid){
      try {
        const uRef = fb.db.collection('users').doc(payload.uid);
        const snap = await fbGet(uRef, 'প্রোফাইল পড়া');
        const data = snap && snap.data ? (snap.data()||{}) : {};
        const orgIds = data.orgIds||[];
        if(!orgIds.includes(orgId)){
          await fbTimeout(uRef.set({ orgIds:[...orgIds, orgId] }, {merge:true}), 15000, 'প্রোফাইল সংরক্ষণ');
        }
      } catch(e){}
    }
    return { id:ref.id, ...payload };
  } else {
    // demo local
    const key = 'ps_orgMembers_'+orgId;
    let arr=[];
    try { arr = JSON.parse(store.get(key)||'[]'); } catch(e){}
    // prevent duplicate
    if(arr.some(x=> (x.email||'').toLowerCase()===email)) throw new Error(L2('এই ইমেইল আগেই যোগ করা আছে','This email already added'));
    const item = { ...payload, id:'om_'+uid() };
    arr.push(item);
    store.set(key, JSON.stringify(arr));
    // also add to demo accounts orgIds if exists
    try {
      const accs = JSON.parse(store.get(LSA)||'[]');
      const a = accs.find(x=> (x.email||'').toLowerCase()===email);
      if(a && !a.orgIds.includes(orgId)){ a.orgIds.push(orgId); store.set(LSA, JSON.stringify(accs)); }
    } catch(e){}
    return item;
  }
}
async function fbUpdateMemberRole(orgMemberId, newRole){
  if(!APP_ROLES.some(r=>r.id===newRole)) throw new Error('Invalid role');
  if(!dataLocal()){
    await loadFirebase();
    await fbTimeout(fb.db.collection('orgMembers').doc(orgMemberId).set({ role:newRole }, {merge:true}), 15000, 'রোল বদল');
  } else {
    // find orgId from state
    const orgId = state.currentOrgId;
    const key = 'ps_orgMembers_'+orgId;
    let arr=[]; try { arr = JSON.parse(store.get(key)||'[]'); } catch(e){}
    const idx = arr.findIndex(x=>x.id===orgMemberId);
    if(idx>=0){ arr[idx].role=newRole; store.set(key, JSON.stringify(arr)); }
  }
}
async function fbRemoveMember(orgMemberId){
  if(!dataLocal()){
    await loadFirebase();
    await fbTimeout(fb.db.collection('orgMembers').doc(orgMemberId).delete(), 15000, 'সদস্য সরানো');
  } else {
    const orgId = state.currentOrgId;
    const key = 'ps_orgMembers_'+orgId;
    let arr=[]; try { arr = JSON.parse(store.get(key)||'[]'); } catch(e){}
    arr = arr.filter(x=>x.id!==orgMemberId);
    store.set(key, JSON.stringify(arr));
  }
}

const BN={'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
/* বাংলা মোডে বাংলা সংখ্যা, English মোডে ইংরেজি সংখ্যা */
function bn(n){ return LANG === 'en' ? String(n) : String(n).replace(/[0-9]/g, c => BN[c] || c); }
function money(n){ return '₹ ' + bn(Number(n || 0).toLocaleString('en-IN')); }
function fmtDate(s){
  if (!s) return '—';
  const d = new Date(s); if (isNaN(d)) return s;
  return bn(d.getDate()) + ' ' + monthName(d.getMonth()) + ' ' + bn(d.getFullYear());
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ═══════════════ ৪.৪/৪.৬ — টোস্ট সিস্টেম (পুরো অ্যাপে) ═══════════════
   চার ধরনের টোস্ট: ok (সবুজ ✓) · err (লাল !) · warn (সোনালি) · info (নীল i)
   • একাধিক টোস্ট সাজিয়ে দেখায় (stack), উপরে-ডানে (মোবাইলে উপরে-মাঝে)
   • নিজে থেকে মিলিয়ে যায় (হোভার করলে থেমে থাকে), ✕ চেপে সরানো যায়
   • ৪.৬: কাজের বাটন (যেমন "ফিরিয়ে আনুন") + কাউন্টডাউন + সময়ের রেখা
*/
const TOAST_MAX = 4;
function ensureToastHost(){
  let h = document.getElementById('toastHost');
  if (!h){
    h = document.createElement('div');
    h.id = 'toastHost';
    h.className = 'toasts no-print';
    h.setAttribute('role', 'status');
    h.setAttribute('aria-live', 'polite');
    h.setAttribute('aria-atomic', 'false');
    document.body.appendChild(h);
  }
  return h;
}
function toastKind(t){
  if (/^(❌|⚠️|🚫|⛔)/.test(t) || /আটকে|ব্যর্থ|হয়নি|যায়নি|ভুল|সমস্যা|error|failed|cannot|blocked|incorrect/i.test(t)) return 'err';
  if (/^(⚠️|⚠)/.test(t) || /সতর্ক|rules|নিয়ম|না হলে|তবে |সংযুক্ত নেই|not connected/i.test(t)) return 'warn';
  if (/^(✅|✔|✓)/.test(t)) return 'ok';
  return 'ok';
}
function toastClean(t){
  return String(t == null ? '' : t).replace(/^(✅|❌|⚠️|⚠|🚫|⛔|ℹ️|💾|📄|☁️|🔎|🔐|📥|🧾|🔄)\s*/g, '').trim();
}
function toast(msg, kind, opt){
  opt = opt || {};
  try {
    /* পুরনো এক-আর্গুমেন্ট কল: বার্তা দেখে ধরন ঠিক করি (তবে সেভ-আটকানো বার্তা err-ই থাকে) */
    if (kind !== 'ok' && kind !== 'err' && kind !== 'warn' && kind !== 'info') kind = toastKind(msg);
    if (/rules আটক|security rules blocked/i.test(String(msg))) kind = 'err';
    const txt = toastClean(msg);
    if (!txt) return;
    const host = ensureToastHost();
    while (host.children.length >= TOAST_MAX) host.removeChild(host.firstElementChild);
    const ic = kind === 'err' ? 'alert' : kind === 'warn' ? 'alert' : kind === 'info' ? 'info' : 'check';
    const el = document.createElement('div');
    el.className = 'toast t-' + kind;
    const act = opt.action || null;
    el.innerHTML = '<span class="toast-ic">' + icon(ic, 'ic-sm') + '</span>'
      + '<span class="toast-tx">' + esc(txt) + '</span>'
      + (act ? '<button type="button" class="toast-act" id="toastActBtn">' + esc(act.label || '') + (act.secs ? ' <b class="toast-secs">' + bn(act.secs) + '</b>' : '') + '</button>' : '')
      + '<button type="button" class="toast-x" aria-label="' + L2('বার্তা সরান', 'Dismiss message') + '">' + icon('x', 'ic-sm') + '</button>'
      + (act ? '<span class="toast-bar"></span>' : '');
    if (opt.detail) el.title = String(opt.detail);
    const ms = opt.duration || Math.max(2600, Math.min(10000, 3400 + txt.length * 45));
    let killed = false, tick = null;
    const kill = () => {
      if (killed) return; killed = true;
      clearTimeout(el._t); clearInterval(tick);
      el.classList.add('out');
      setTimeout(() => { try { el.remove(); } catch(e){} }, 240);
    };
    el.querySelector('.toast-x').onclick = kill;
    el.addEventListener('mouseenter', () => clearTimeout(el._t));
    el.addEventListener('mouseleave', () => { if (!killed) el._t = setTimeout(kill, 1800); });
    host.appendChild(el);
    if (act){
      const bar = el.querySelector('.toast-bar');
      if (bar){ bar.style.animationDuration = ms + 'ms'; }
      let left = Math.round(ms / 1000);
      const secEl = el.querySelector('.toast-secs');
      if (secEl){
        tick = setInterval(() => {
          left -= 1;
          if (left <= 0){ clearInterval(tick); return; }
          secEl.textContent = bn(left);
        }, 1000);
      }
      const btn = el.querySelector('.toast-act');
      if (btn) btn.onclick = async () => {
        kill();
        try { await act.fn(); } catch(e){ toast(L2('ফিরিয়ে আনা যায়নি: ', 'Could not undo: ') + (e.message || e), 'err'); }
      };
    }
    el._t = setTimeout(kill, ms);
  } catch(e){
    /* কোনো কারণে টোস্ট না দেখাতে পারলে অ্যাপ আটকাবে না — কনসোলে জানাই */
    try { console.log('[toast]', msg); } catch(_){}
  }
}

service cloud.firestore {
  match /databases/{database}/documents {

    function isAuth() { return request.auth != null; }

    // USERS - any authenticated can read/write (for invite lookup)
    match /users/{uid} {
      allow read, write: if isAuth();
    }

    // ORGANIZATIONS - any authenticated can read/write
    match /organizations/{orgId} {
      allow read, write: if isAuth();
      allow list: if true;
    }

    // ORG MEMBERS - role system
    match /orgMembers/{id} {
      allow read, write: if isAuth();
    }

    // INVITE CODES - allow anyone to read by code for signup
    match /orgInvites/{code} {
      allow get: if true;
      allow list, create, update, delete: if isAuth();
    }

    // EVENTS
    match /events/{id} {
      allow read, write: if isAuth();
    }

    // COMMITTEE MEMBERS
    match /members/{id} {
      allow read, write: if isAuth();
    }

    // TRANSACTIONS (ledger)
    match /transactions/{id} {
      allow read, write: if isAuth();
    }

    // DONORS
    match /donors/{id} {
      allow read, write: if isAuth();
    }

    // REMINDERS
    match /reminders/{id} {
      allow read, write: if isAuth();
    }
  }
}
`;

function ev(){ return state.events.find(e=>e.id===state.selectedEventId); }
function txns(){ return state.transactions.filter(t=>t.eventId===state.selectedEventId); }
function income(){ return txns().filter(t=>t.type==='আয়').reduce((s,t)=>s+Number(t.amount||0),0); }
function expense(){ return txns().filter(t=>t.type==='ব্যয়').reduce((s,t)=>s+Number(t.amount||0),0); }
function orgNow(){ return state.orgs.find(o => o.id === state.currentOrgId); }
function evtNow(){ try{ return (typeof ev==='function' ? ev() : null); }catch(_){ return null; } }
function getMyRole(orgId){
  const oid = orgId || state.currentOrgId || '';
  if(!oid || !state.user) return '';
  // Cache only if same org AND same user - prevent member getting secretary cache
  if(state.currentRole && state.currentOrgId===oid && state._roleUid===state.user.uid) return state.currentRole;
  // secretary/owner check - org owner is always secretary
  const org = state.orgs.find(o=>o.id===oid);
  if(org && org.ownerId && org.ownerId===state.user.uid) return 'secretary';
  // check orgMembers state
  const email = (state.user.email||'').toLowerCase();
  const mem = (state.orgMembers||[]).find(m=> (m.orgId===oid) && ( (m.uid && m.uid===state.user.uid) || (m.email && m.email.toLowerCase()===email) ) );
  if(mem && mem.role){
    // normalize old roles
    if(mem.role==='owner' || mem.role==='editor') return 'secretary';
    if(mem.role==='viewer') return 'member';
    return mem.role;
  }
  // fallback: if user orgIds contains, member
  if(state.user.orgIds && state.user.orgIds.includes(oid)) return 'member';
  return '';
}
function canWrite(orgId){ const r=getMyRole(orgId); return ['secretary','cashier','owner','editor'].includes(r); }
function canManageMembers(orgId){ const r=getMyRole(orgId); return ['secretary','owner','editor'].includes(r); }
function canManageOrg(orgId){ const r=getMyRole(orgId); return ['secretary','owner'].includes(r); }
function isViewer(){ const r=getMyRole(); return r==='member' || r==='viewer'; }
function inr(n){ return money(n); }
function pct(a, b){ return b > 0 ? Math.round(a / b * 100) : 0; }

document.addEventListener('click', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('.nb-toggle') : null;
  if (!t) return;
  const key = t.getAttribute('data-nbkey') || '';
  const box = t.closest('.noticebar');
  if (!box) return;
  window.__psNoticeOpen = window.__psNoticeOpen || {};
  const on = !window.__psNoticeOpen[key];
  window.__psNoticeOpen[key] = on;
  box.classList.toggle('open', on);
  t.setAttribute('aria-expanded', String(on));
});

const THEME_KEY = 'ps_theme';
function sysDark(){ try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch(e){ return false; } }
function themeMode(){ try { const v = store.get(THEME_KEY); return (v === 'light' || v === 'dark') ? v : 'system'; } catch(e){ return 'system'; } }
function applyTheme(mode){
  const m = (mode === 'light' || mode === 'dark') ? mode : themeMode();   /* না দিলে সংরক্ষিত পছন্দ */
  const dark = (m === 'dark') || (m === 'system' && sysDark());
  try {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-mode', m);
  } catch(e){}
}
function setTheme(mode){
  try { store.set(THEME_KEY, mode); } catch(e){}
  applyTheme(mode);
  render();
  toast(L2('থিম বদলানো হলো', 'Theme updated'));
}
function themeLabel(m){
  return m === 'light' ? L2('হালকা', 'Light') : m === 'dark' ? L2('গাঢ়', 'Dark') : L2('সিস্টেম', 'System');
}
function themeBtns(){

       + '<button type="button" data-act="theme" data-id="light" class="' + (m === 'light' ? 'on' : '') + '">' + icon('sun', 'ic-sm') + L2('হালকা', 'Light') + '</button>'
       + '<button type="button" data-act="theme" data-id="dark" class="' + (m === 'dark' ? 'on' : '') + '">' + icon('moon', 'ic-sm') + L2('গাঢ়', 'Dark') + '</button>';

function themeHint(){
  const m = themeMode();

}
try {

function initials(txt){

function bindDrawer(){
  const d = document.getElementById('drawer'), s = document.getElementById('scrim'), b = document.getElementById('menuBtn');
  if (!d || !s || !b) return;
  const set = (open) => {
    d.classList.toggle('open', open);
    s.classList.toggle('open', open);
    s.hidden = !open;
    try { open ? d.removeAttribute('inert') : d.setAttribute('inert', ''); } catch(e){}
    d.setAttribute('aria-hidden', open ? 'false' : 'true');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.classList.toggle('on', open);
    if (open) document.body.classList.add('menu-open'); else document.body.classList.remove('menu-open');
  };
  b.onclick = () => set(!d.classList.contains('open'));
  const cl = document.getElementById('drawerClose'); if (cl) cl.onclick = () => set(false);
  s.onclick = () => set(false);
  if (!window.__psEsc){
    window.__psEsc = true;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Esc'){
        const dd = document.getElementById('drawer');
        if (dd && dd.classList.contains('open')){ const bb = document.getElementById('menuBtn'); if (bb) bb.click(); }
      }
    });
  }
  d.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-qact], [data-act]');
    if (a){ e.preventDefault(); set(false); await runAct(a.dataset.qact || a.dataset.act, a.dataset.id); return; }
    if (e.target.closest('[data-route]')) set(false);
  });
  const lo = document.getElementById('drawerLogout');
  if (lo) lo.onclick = async () => { set(false); await logout(); render(); };
  set(false);
}
function renderRoute(){
  switch (state.route){
    case '/events': return viewEvents();
    case '/transactions': return viewTransactions();
    case '/donors': return viewDonors();
    case '/members': return viewMembers();
    case '/app-members': return viewAppMembers();
    case '/reminders': return viewReminders();
    case '/about': return viewAbout();
    case '/reports': return viewReports();
    case '/settings': return viewSettings();
    default: return viewDashboard();
  }
}

  const filtered = allT.filter(x=>{
    if(rf.type!=='all' && x.type!==rf.type) return false;
    if(rf.category!=='all' && x.category!==rf.category) return false;
    if(q){
      const hay = ((x.note||'')+' '+(x.receiptNo||'')+' '+(x.category||'')+' '+(x.method||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const inc = filtered.filter(t=>t.type==='আয়').reduce((s,t)=>s+Number(t.amount||0),0);
  const exp = filtered.filter(t=>t.type==='ব্যয়').reduce((s,t)=>s+Number(t.amount||0),0);
  const bal = inc - exp;
  const cats = [...INC, ...EXP].map(c => ({
    label: c,
    inc: filtered.filter(x => x.category === c && x.type === 'আয়').reduce((s, x) => s + Number(x.amount || 0), 0),
    exp: filtered.filter(x => x.category === c && x.type === 'ব্যয়').reduce((s, x) => s + Number(x.amount || 0), 0),
    net: 0
  }));
  cats.forEach(c => { c.net = c.inc - c.exp; });
  const rows = cats.filter(c => c.inc || c.exp);
  const org = orgNow();
  const bud = Number((e && e.budget) || 0);

  const _canWrite = canWrite();
  const upcoming = list.filter(r=> r.date >= todayStr && !r.completed).length;
  const overdue = list.filter(r=> r.date < todayStr && !r.completed).length;
  const completed = list.filter(r=> r.completed).length;

  </div>
  
  <div class="card" style="background:linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); border:1px solid #c4b5fd; margin-top:14px">
    <div class="card-head"><div><div class="t">${icon('settings')}${L2('নোটিফিকেশন সেটিংস','Notification Settings')}</div>
      <div class="s">${L2('আওয়াজ ও ব্রাউজার নোটিফিকেশন','Sound & browser notifications')}</div></div></div>

}

        <h2>${ini === 'signup' ? L2('অ্যাকাউন্ট খুলুন', 'Create account') : L2('আবার স্বাগতম', 'Welcome back')}</h2>

        : L2('এই ইমেইলে ডেমো মোডে কোনো অ্যাকাউন্ট নেই। নতুন অ্যাকাউন্ট খুলুন।', 'No demo account exists with this email. Please create an account.'), 'info');

  };

  let busy = false;
  const runAuth = async (d) => {
    if (busy) return;
    const isSignup = !document.getElementById('signupFields').classList.contains('hide');
    const err = document.getElementById('authErr');
    FB_WARN = ''; err.innerHTML = '';
    try {
      if (isSignup){

        if (!d.name || !d.name.trim()) throw new Error(L2('আপনার নাম দিতে হবে', 'Enter your name'));
        if (!hasInvite && (!d.orgName || !d.orgName.trim())) throw new Error(L2('সংগঠনের নাম দিন, অথবা Invite কোড থাকলে সেটা দিন', 'Enter organization name or invite code'));
        if ((d.password || '').length < 6) throw new Error(L2('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে', 'Password must be at least 6 characters'));
        if (d.password !== d.confirm) throw new Error(L2('দুইবার লেখা পাসওয়ার্ড মিলছে না', 'The two passwords do not match'));
        d.inviteCode = String(d.inviteCode||'').trim().toUpperCase();
        d.orgName = String(d.orgName||'').trim();
      } else {
        if (!d.email || !d.password) throw new Error(L2('ইমেইল ও পাসওয়ার্ড দুটোই দিতে হবে', 'Enter both email and password'));

      busy = true;
      if (document.body.contains(submitBtn)){
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spin"></span>' + (isSignup ? L2('অ্যাকাউন্ট তৈরি হচ্ছে…', 'Creating account…') : L2('লগইন হচ্ছে…', 'Signing in…'));

      if (isSignup) await withTimeout(signup(d), 60000, L2('অ্যাকাউন্ট তৈরি হতে বেশি সময় লাগছে — ইন্টারনেট সংযোগ বা Firebase কনফিগ পরীক্ষা করুন', 'Account creation is taking too long — check your internet connection or Firebase config'));
      else await withTimeout(login(d), 60000, L2('লগইনে বেশি সময় লাগছে — ইন্টারনেট সংযোগ বা Firebase কনফিগ পরীক্ষা করুন', 'Signing in is taking too long — check your internet connection or Firebase config'));

  // Helper: parse ?join=CODE from URL
  function parseJoinCode(){
    try {
      const u = new URL(location.href);
      let c = u.searchParams.get('join') || u.searchParams.get('code') || u.searchParams.get('invite') || '';
      c = String(c||'').trim().toUpperCase();
      // Also check hash #join=CODE
      if(!c && location.hash){
        const h = new URLSearchParams(location.hash.replace(/^#/, '?'));
        c = (h.get('join') || h.get('code') || '').trim().toUpperCase();
      }
      // Validate format PS-XXXXXX
      if(c && /^PS-[A-Z0-9]{4,10}$/.test(c)) return c;
      // Also accept plain code without PS- prefix? No, require PS-
      return c || '';
    } catch(e){ return ''; }
  }
  // Prefill invite code from ?join=CODE
  try {
    const jc = parseJoinCode();
    if(jc){
      const icf = document.getElementById('inviteCodeField');
      if(icf){ icf.value = jc; }

  } catch(e){}
}

   ['memberSearch', 'memberGrid', 'memberEmpty', 'memberCount', L2('জন সদস্য', 'members')]].forEach(([id, gridId, emptyId, cntId, unit]) => {
    const inp = document.getElementById(id); if (!inp) return;

      const q = (inp.value || '').trim().toLowerCase();

        const cards = document.querySelectorAll('[data-reminder-card]');

        cards.forEach(c=>{

          const date = c.getAttribute('data-date');
          const todayStr = new Date().toISOString().slice(0,10);

          else if(f==='upcoming') hit = status==='upcoming' || status==='today';

function filterRows(){
  const inp = document.getElementById('txnSearch');
  const seg = document.getElementById('txnSeg');
  const mode = seg ? (seg.querySelector('button.on') || {}).dataset?.seg || 'all' : 'all';
  const q = (inp ? inp.value : '').trim().toLowerCase();
  const tb = document.getElementById('txnTbody'); if (!tb) return;
  let shown = 0;
  tb.querySelectorAll('tr').forEach(tr => {
    const okType = mode === 'all' || tr.dataset.type === mode;
    const okText = !q || (tr.textContent || '').toLowerCase().includes(q);
    const hit = okType && okText;
    tr.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  const em = document.getElementById('txnEmpty'); if (em) em.classList.toggle('hide', shown > 0);
  const ct = document.getElementById('txnCount'); if (ct) ct.textContent = bn(shown) + ' ' + L2('টি এন্ট্রি', 'entries');
}
function exportCsv(){
  try {
    const t = [...txns()].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const head = ['তারিখ', 'ধরণ', 'খাত', 'মাধ্যম', 'রশিদ', 'নোট', 'পরিমাণ'];
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(',')].concat(t.map(x => [x.date, x.type, x.category, x.method, x.receiptNo || '', x.note || '', Number(x.amount || 0)].map(q).join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'puja-sarathi-' + (ev() ? String(ev().name).replace(/[^\w\u0980-\u09FF]+/g, '-') : 'ledger') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(L2('CSV ডাউনলোড শুরু হয়েছে', 'CSV download started'));
  } catch(e){ toast(L2('CSV তৈরি করা যায়নি', 'Could not create CSV')); }
}
