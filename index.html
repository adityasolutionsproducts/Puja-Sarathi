/* ═══════════════ ৪.৪/৪.৬ — টোস্ট সিস্টেম (পুরো অ্যাপে) ═══════════════
   চার ধরনের টোস্ট: ok (সবুজ ✓) · err (লাল !) · warn (সোনালি) · info (নীল i)
   • একাধিক টোস্ট সাজিয়ে দেখায় (stack), উপরে-ডানে (মোবাইলে উপরে-মাঝে)
   • নিজে থেকে মিলিয়ে যায় (হোভার করলে থেমে থাকে), ✕ চেপে সরানো যায়
   • ৪.৬: কাজের বাটন (যেমন "ফিরিয়ে আনুন") + কাউন্টডাউন + সময়ের রেখা
*/
const TOAST_MAX = 4;
function ensureToastHost(){
  let h = document.getElementById('toastHost');
  if (!h){
    h = document.createElement('div');
    h.id = 'toastHost';
    h.className = 'toasts no-print';
    h.setAttribute('role', 'status');
    h.setAttribute('aria-live', 'polite');
    h.setAttribute('aria-atomic', 'false');
    document.body.appendChild(h);
  }
  return h;
}
function toastKind(t){
  if (/^(❌|⚠️|🚫|⛔)/.test(t) || /আটকে|ব্যর্থ|হয়নি|যায়নি|ভুল|সমস্যা|error|failed|cannot|blocked|incorrect/i.test(t)) return 'err';
  if (/^(⚠️|⚠)/.test(t) || /সতর্ক|rules|নিয়ম|না হলে|তবে |সংযুক্ত নেই|not connected/i.test(t)) return 'warn';
  if (/^(✅|✔|✓)/.test(t)) return 'ok';
  return 'ok';
}
function toastClean(t){
  return String(t == null ? '' : t).replace(/^(✅|❌|⚠️|⚠|🚫|⛔|ℹ️|💾|📄|☁️|🔎|🔐|📥|🧾|🔄)\s*/g, '').trim();
}
function toast(msg, kind, opt){
  opt = opt || {};
  try {
    /* পুরনো এক-আর্গুমেন্ট কল: বার্তা দেখে ধরন ঠিক করি (তবে সেভ-আটকানো বার্তা err-ই থাকে) */
    if (kind !== 'ok' && kind !== 'err' && kind !== 'warn' && kind !== 'info') kind = toastKind(msg);
    if (/rules আটক|security rules blocked/i.test(String(msg))) kind = 'err';
    const txt = toastClean(msg);
    if (!txt) return;
    const host = ensureToastHost();
    while (host.children.length >= TOAST_MAX) host.removeChild(host.firstElementChild);
    const ic = kind === 'err' ? 'alert' : kind === 'warn' ? 'alert' : kind === 'info' ? 'info' : 'check';
    const el = document.createElement('div');
    el.className = 'toast t-' + kind;
    const act = opt.action || null;
    el.innerHTML = '<span class="toast-ic">' + icon(ic, 'ic-sm') + '</span>'
      + '<span class="toast-tx">' + esc(txt) + '</span>'
      + (act ? '<button type="button" class="toast-act" id="toastActBtn">' + esc(act.label || '') + (act.secs ? ' <b class="toast-secs">' + bn(act.secs) + '</b>' : '') + '</button>' : '')
      + '<button type="button" class="toast-x" aria-label="' + L2('বার্তা সরান', 'Dismiss message') + '">' + icon('x', 'ic-sm') + '</button>'
      + (act ? '<span class="toast-bar"></span>' : '');
    if (opt.detail) el.title = String(opt.detail);
    const ms = opt.duration || Math.max(2600, Math.min(10000, 3400 + txt.length * 45));
    let killed = false, tick = null;
    const kill = () => {
      if (killed) return; killed = true;
      clearTimeout(el._t); clearInterval(tick);
      el.classList.add('out');
      setTimeout(() => { try { el.remove(); } catch(e){} }, 240);
    };
    el.querySelector('.toast-x').onclick = kill;
    el.addEventListener('mouseenter', () => clearTimeout(el._t));
    el.addEventListener('mouseleave', () => { if (!killed) el._t = setTimeout(kill, 1800); });
    host.appendChild(el);
    if (act){
      const bar = el.querySelector('.toast-bar');
      if (bar){ bar.style.animationDuration = ms + 'ms'; }
      let left = Math.round(ms / 1000);
      const secEl = el.querySelector('.toast-secs');
      if (secEl){
        tick = setInterval(() => {
          left -= 1;
          if (left <= 0){ clearInterval(tick); return; }
          secEl.textContent = bn(left);
        }, 1000);
      }
      const btn = el.querySelector('.toast-act');
      if (btn) btn.onclick = async () => {
        kill();
        try { await act.fn(); } catch(e){ toast(L2('ফিরিয়ে আনা যায়নি: ', 'Could not undo: ') + (e.message || e), 'err'); }
      };
    }
    el._t = setTimeout(kill, ms);
  } catch(e){
    /* কোনো কারণে টোস্ট না দেখাতে পারলে অ্যাপ আটকাবে না — কনসোলে জানাই */
    try { console.log('[toast]', msg); } catch(_){}
  }
}

const RULES_TEXT = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function isIn() { return request.auth != null; }
    function myOrgIds() {
      return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.orgIds;
    }

    // USERS - each user can read/write own doc, list for invite lookup
    match /users/{uid} {
      allow read, write: if isIn() && request.auth.uid == uid;
      allow list: if isIn();
    }

    // ORGANIZATIONS - any logged-in user can read, create if ownerId == uid
    // For invite-code join to work, get/list must be allowed for any authenticated
    match /organizations/{orgId} {
      allow get, list: if isIn();
      allow create: if isIn() && request.resource.data.ownerId == request.auth.uid;
      allow update, delete: if isIn();
    }

    // ORG MEMBERS - role system (secretary/cashier/member)
    // Permissive for app to work - any authenticated can read/write
    // Client-side checks role (secretary can invite etc.)
    match /orgMembers/{id} {
      allow get, list: if isIn();
      allow create: if isIn();
      allow update, delete: if isIn();
    }

    // INVITE CODES - for PS-XXXXXX join system
    // Any authenticated can read a code to join, only org members can create
    match /orgInvites/{code} {
      allow get, list: if isIn();
      allow create: if isIn();
      allow update, delete: if isIn();
    }

    // EVENTS
    match /events/{id} {
      allow get, list: if isIn();
      allow create: if isIn() && request.resource.data.orgId is string;
      allow update, delete: if isIn();
    }

    // COMMITTEE MEMBERS (puja committee, not app members)
    match /members/{id} {
      allow get, list: if isIn();
      allow create: if isIn() && request.resource.data.orgId is string;
      allow update, delete: if isIn();
    }

    // TRANSACTIONS (income/expense ledger)
    match /transactions/{id} {
      allow get, list: if isIn();
      allow create: if isIn() && request.resource.data.orgId is string;
      allow update, delete: if isIn();
    }

    // DONORS
    match /donors/{id} {
      allow get, list: if isIn();
      allow create: if isIn() && request.resource.data.orgId is string;
      allow update, delete: if isIn();
    }
  }
}
`;

function getMyRole(orgId){
  const oid = orgId || state.currentOrgId || '';
  if(!oid || !state.user) return '';
  if(state.currentRole && state.currentOrgId===oid) return state.currentRole;
  // secretary/owner check - org owner is always secretary
  const org = state.orgs.find(o=>o.id===oid);
  if(org && org.ownerId && org.ownerId===state.user.uid) return 'secretary';
  // check orgMembers state
  const email = (state.user.email||'').toLowerCase();
  const mem = (state.orgMembers||[]).find(m=> (m.orgId===oid) && ( (m.uid && m.uid===state.user.uid) || (m.email && m.email.toLowerCase()===email) ) );
  if(mem && mem.role){
    // normalize old roles
    if(mem.role==='owner' || mem.role==='editor') return 'secretary';
    if(mem.role==='viewer') return 'member';
    return mem.role;
  }
  // fallback: if user orgIds contains, member
  if(state.user.orgIds && state.user.orgIds.includes(oid)) return 'member';
  return '';
}
function canWrite(orgId){ const r=getMyRole(orgId); return ['secretary','cashier','owner','editor'].includes(r); }

/* ৪.৬: ছোট বার্তা-স্ট্রিপের "বিস্তারিত" খোলা/বন্ধ (একবারই বাঁধা হয়, প্রতিটি render-এ কাজ করে) */
document.addEventListener('click', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('.nb-toggle') : null;
  if (!t) return;
  const key = t.getAttribute('data-nbkey') || '';
  const box = t.closest('.noticebar');
  if (!box) return;
  window.__psNoticeOpen = window.__psNoticeOpen || {};
  const on = !window.__psNoticeOpen[key];
  window.__psNoticeOpen[key] = on;
  box.classList.toggle('open', on);
  t.setAttribute('aria-expanded', String(on));
});

/* ═══════════════ থিম: সিস্টেম / হালকা / গাঢ় (৪.১) ═══════════════ */
const THEME_KEY = 'ps_theme';
function sysDark(){ try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch(e){ return false; } }
function themeMode(){ try { const v = store.get(THEME_KEY); return (v === 'light' || v === 'dark') ? v : 'system'; } catch(e){ return 'system'; } }
function applyTheme(mode){
  const m = (mode === 'light' || mode === 'dark') ? mode : themeMode();   /* না দিলে সংরক্ষিত পছন্দ */
  const dark = (m === 'dark') || (m === 'system' && sysDark());
  try {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-mode', m);
  } catch(e){}
}
function setTheme(mode){
  try { store.set(THEME_KEY, mode); } catch(e){}
  applyTheme(mode);
  render();
  toast(L2('থিম বদলানো হলো', 'Theme updated'));
}
function themeLabel(m){
  return m === 'light' ? L2('হালকা', 'Light') : m === 'dark' ? L2('গাঢ়', 'Dark') : L2('সিস্টেম', 'System');
}
function themeBtns(){
  const m = themeMode();
  return '<button type="button" data-act="theme" data-id="system" class="' + (m === 'system' ? 'on' : '') + '">' + icon('monitor', 'ic-sm') + L2('সিস্টেম', 'System') + '</button>'
       + '<button type="button" data-act="theme" data-id="light" class="' + (m === 'light' ? 'on' : '') + '">' + icon('sun', 'ic-sm') + L2('হালকা', 'Light') + '</button>'
       + '<button type="button" data-act="theme" data-id="dark" class="' + (m === 'dark' ? 'on' : '') + '">' + icon('moon', 'ic-sm') + L2('গাঢ়', 'Dark') + '</button>';
}
function themeHint(){
  const m = themeMode();
  if (m === 'system') return L2('আপনার ফোন/কম্পিউটারের সেটিং অনুযায়ী নিজেই বদলাবে (এখন: ', 'Follows your device setting (now: ') + (sysDark() ? L2('গাঢ়', 'dark') : L2('হালকা', 'light')) + ')';
  return m === 'dark' ? L2('সবসময় গাঢ় (ডার্ক) থিম', 'Always dark') : L2('সবসময় হালকা থিম', 'Always light');
}
try {
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener)
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themeMode() === 'system') applyTheme('system'); });
} catch(e){}
applyTheme();

    + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>'
    + (actHtml ? '<div class="acts">' + actHtml + '</div>' : '') + '</div>';
}
function kpiCard(label, value, ic, tone, cap){
  return '<div class="card hoverable kpi-card' + (tone ? ' tone-' + tone : '') + '"><div class="kpi"><div class="ic-badge' + (tone ? ' icb-' + tone : '') + '">' + icon(ic, 'ic-lg') + '</div>'
    + '<div style="min-width:0"><div class="lbl">' + esc(label) + '</div>'
    + '<div class="v' + (tone === 'ok' ? ' v-ok' : tone === 'bad' ? ' v-bad' : '') + '">' + value + '</div>'
    + (cap ? '<div class="cap">' + cap + '</div>' : '') + '</div></div></div>';
}
function statusPill(v){
  const cls = v === 'সম্পন্ন' ? '' : (v === 'পরিকল্পনাধীন' ? 'p-grey' : 'p-info');
  return '<span class="pill ' + cls + '"><span class="dot"></span>' + esc(dv(v)) + '</span>';
}
function typePill(v){
  return '<span class="pill ' + (v === 'ব্যয়' ? 'p-exp' : '') + '">' + esc(dv(v)) + '</span>';
}
function emptyBox(text, ic, hint){
  return '<div class="empty">' + icon(ic || 'info', 'ic-xl') + '<div class="t">' + esc(text) + '</div>'
    + (hint ? '<div class="h">' + esc(hint) + '</div>' : '') + '</div>';
}
function modeLabel(){
  return !useFb() ? L2('ডেমো মোড', 'Demo mode')
    : (LOCAL_STORE ? L2('ব্রাউজার-সেভ', 'Browser save') : 'Firebase');
}
function initials(txt){
  const s = String(txt || '').trim();
  if (!s) return '?';
  const parts = s.split(/\s+/).slice(0, 2);
  return parts.map(p => p.charAt(0)).join('').toUpperCase();
}
function avTone(seed){
  const s = String(seed || '');
  let n = 0; for (let i = 0; i < s.length; i++) n += s.charCodeAt(i);
  return ['', 'g', 't', 'p'][n % 4];
}

function bindDrawer(){
  const d = document.getElementById('drawer'), s = document.getElementById('scrim'), b = document.getElementById('menuBtn');
  if (!d || !s || !b) return;
  const set = (open) => {
    d.classList.toggle('open', open);
    s.classList.toggle('open', open);
    s.hidden = !open;
    try { open ? d.removeAttribute('inert') : d.setAttribute('inert', ''); } catch(e){}
    d.setAttribute('aria-hidden', open ? 'false' : 'true');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.classList.toggle('on', open);
    if (open) document.body.classList.add('menu-open'); else document.body.classList.remove('menu-open');
  };
  b.onclick = () => set(!d.classList.contains('open'));
  const cl = document.getElementById('drawerClose'); if (cl) cl.onclick = () => set(false);
  s.onclick = () => set(false);
  if (!window.__psEsc){
    window.__psEsc = true;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Esc'){
        const dd = document.getElementById('drawer');
        if (dd && dd.classList.contains('open')){ const bb = document.getElementById('menuBtn'); if (bb) bb.click(); }
      }
    });
  }
  d.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-qact], [data-act]');
    if (a){ e.preventDefault(); set(false); await runAct(a.dataset.qact || a.dataset.act, a.dataset.id); return; }
    if (e.target.closest('[data-route]')) set(false);
  });
  const lo = document.getElementById('drawerLogout');
  if (lo) lo.onclick = async () => { set(false); await logout(); render(); };
  set(false);
}
function renderRoute(){
  switch (state.route){
    case '/events': return viewEvents();
    case '/transactions': return viewTransactions();
    case '/donors': return viewDonors();
    case '/members': return viewMembers();
    case '/app-members': return viewAppMembers();
    case '/about': return viewAbout();
    case '/reports': return viewReports();
    case '/settings': return viewSettings();
    default: return viewDashboard();
  }
}

    if(q){
      const hay = ((x.note||'')+' '+(x.receiptNo||'')+' '+(x.category||'')+' '+(x.method||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const inc = filtered.filter(t=>t.type==='আয়').reduce((s,t)=>s+Number(t.amount||0),0);
  const exp = filtered.filter(t=>t.type==='ব্যয়').reduce((s,t)=>s+Number(t.amount||0),0);
  const bal = inc - exp;
  const cats = [...INC, ...EXP].map(c => ({
    label: c,
    inc: filtered.filter(x => x.category === c && x.type === 'আয়').reduce((s, x) => s + Number(x.amount || 0), 0),
    exp: filtered.filter(x => x.category === c && x.type === 'ব্যয়').reduce((s, x) => s + Number(x.amount || 0), 0),
    net: 0
  }));
  cats.forEach(c => { c.net = c.inc - c.exp; });

        <h2>${ini === 'signup' ? L2('অ্যাকাউন্ট খুলুন', 'Create account') : L2('আবার স্বাগতম', 'Welcome back')}</h2>

              <div class="muted" style="font-size:11px; margin-top:6px">${L2('যদি Secretary আপনাকে invite কোড দিয়ে থাকে, সেটা এখানে দিন — তাহলে আপনি সরাসরি সেই সংগঠনে সদস্য হিসেবে যোগ হবেন, নতুন সংগঠন বানাতে হবে না।','If Secretary gave you an invite code, enter it here — you will join that organization as member, no need to create new org.')}</div>

          </div>
          <label><span class="lbl">${icon('mail')}${L2('ইমেইল', 'Email')}</span><input name="email" type="email" autocomplete="email" placeholder="name@gmail.com"></label>
          <label><span class="lbl">${icon('lock')}${L2('পাসওয়ার্ড', 'Password')}</span>
            <span class="pw-wrap"><input id="pwField" name="password" type="password" autocomplete="current-password" placeholder="${L2('কমপক্ষে ৬ অক্ষর', 'At least 6 characters')}"><button type="button" class="pw-eye" data-for="pwField" aria-pressed="false" aria-label="${L2('পাসওয়ার্ড দেখান', 'Show password')}" title="${L2('পাসওয়ার্ড দেখান / লুকান', 'Show / hide password')}">${icon('eye', 'ic-sm')}</button></span></label>
          <div id="confirmField" class="${ini === 'signup' ? '' : 'hide'}">
            <label><span class="lbl">${icon('shield')}${L2('পাসওয়ার্ড নিশ্চিত', 'Confirm password')}</span>
              <span class="pw-wrap"><input id="pwField2" name="confirm" type="password" autocomplete="new-password"><button type="button" class="pw-eye" data-for="pwField2" aria-pressed="false" aria-label="${L2('পাসওয়ার্ড দেখান', 'Show password')}" title="${L2('পাসওয়ার্ড দেখান / লুকান', 'Show / hide password')}">${icon('eye', 'ic-sm')}</button></span></label>

  const f = document.getElementById('authForm');

    document.getElementById('tabLogin').classList.toggle('on', !isSignup);
    document.getElementById('tabSignup').classList.toggle('on', isSignup);
    document.getElementById('signupFields').classList.toggle('hide', !isSignup);

  root.querySelectorAll('.pw-eye').forEach(b => {

      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.innerHTML = icon(show ? 'eyeoff' : 'eye', 'ic-sm');
      b.setAttribute('aria-pressed', show ? 'true' : 'false');
      b.setAttribute('aria-label', show ? L2('পাসওয়ার্ড লুকান', 'Hide password') : L2('পাসওয়ার্ড দেখান', 'Show password'));

    const keep = forgotBtn.innerHTML;

    try {
      await fbReset({ email });
      toast(L2('রিসেট লিংক পাঠানো হয়েছে — ইমেইল দেখুন (Spam ফোল্ডারও)', 'Reset link sent — check your email (and the spam folder)'), 'ok');

  };
  root.querySelectorAll('[data-lang]').forEach(b => {

  let busy = false;
  const runAuth = async (d) => {
    if (busy) return;
    const isSignup = !document.getElementById('signupFields').classList.contains('hide');
    const err = document.getElementById('authErr');

      if (isSignup){

      else await withTimeout(login(d), 60000, L2('লগইনে বেশি সময় লাগছে — ইন্টারনেট সংযোগ বা Firebase কনফিগ পরীক্ষা করুন', 'Signing in is taking too long — check your internet connection or Firebase config'));
      await withTimeout(reload(), 60000, L2('ডেটা লোড হতে বেশি সময় লাগছে', 'Loading data is taking too long'));
      busy = false;
      render();
      return;
    } catch(ex){
      busy = false;
      const em = fbErrMsg(ex);
      /* ৪.৬ (সংশোধন): কার্ডের ভিতরের বড় লাল বাক্স আর দেখানো হয় না —
         একই কথা উপরে টোস্টেই (শিরোনাম + কারণ) পরিষ্কার দেখা যায়। */
      err.innerHTML = '';

      const storageIssue = /web-storage-unsupported|operation-not-supported/i.test(errCode(ex));
      if (useFb() && (netFail(ex) || ex.__timeout || storageIssue)){
        /* ইন্টারনেট/Firebase কনফিগ সমস্যা হলে শুধু ছোট ফলব্যাক বাটন (লাল বাক্স নয়) */
        err.innerHTML = '<button type="button" class="btn s brand" id="demoBtn2" style="margin:2px 0 10px">' + icon('bolt') + L2('ডেমো মোডে চালান (ইন্টারনেট ছাড়াই)', 'Use demo mode (no internet needed)') + '</button>';

      }

        submitBtn.disabled = false;
        submitBtn.innerHTML = isSignup ? icon('spark') + L2('অ্যাকাউন্ট খুলুন', 'Create account') : icon('logout') + L2('লগইন করুন', 'Sign in');
      }
    }
  };

    }

}

function bindPro(){
  const si = document.getElementById('txnSearch');
  if (si) si.oninput = () => filterRows();
  const seg = document.getElementById('txnSeg');
  if (seg) seg.querySelectorAll('button').forEach(b => { b.onclick = () => {
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); filterRows();
  }; });
  // Report filters - Income/Expense/Category/Search
  const rt = document.getElementById('reportTypeFilter');
  if(rt) rt.onchange = () => { state.reportFilter.type = rt.value; render(); };
  const rc = document.getElementById('reportCategoryFilter');
  if(rc) rc.onchange = () => { state.reportFilter.category = rc.value; render(); };
  const rs = document.getElementById('reportSearch');
  if(rs) rs.oninput = () => { state.reportFilter.q = rs.value; render(); };
  const rclr = document.getElementById('reportClearBtn');
  if(rclr) rclr.onclick = () => { state.reportFilter = {type:'all', category:'all', q:''}; render(); };
  /* খাতার দুই ভাগ: এন্ট্রির খাতা / ইভেন্টের খাতা (৪.৬) */
  const ls = document.getElementById('ledgerSeg');
  if (ls) ls.querySelectorAll('button').forEach(b => { b.onclick = () => {
    state.ledgerTab = b.dataset.tab; render();
  }; });
  [['donorSearch', 'donorGrid', 'donorEmpty', 'donorCount', L2('জন দাতা', 'donors')],
   ['memberSearch', 'memberGrid', 'memberEmpty', 'memberCount', L2('জন সদস্য', 'members')]].forEach(([id, gridId, emptyId, cntId, unit]) => {
    const inp = document.getElementById(id); if (!inp) return;
    inp.oninput = () => {
      const q = (inp.value || '').trim().toLowerCase();
      const grid = document.getElementById(gridId); if (!grid) return;
      const items = grid.children; let shown = 0;
      for (const el of items){ const hit = !q || (el.textContent || '').toLowerCase().includes(q); el.style.display = hit ? '' : 'none'; if (hit) shown++; }
      const em = document.getElementById(emptyId); if (em) em.classList.toggle('hide', shown > 0);
      const ct = document.getElementById(cntId); if (ct) ct.textContent = bn(shown) + ' ' + unit;
    };
  });
  const csv = document.getElementById('csvBtn');
  if (csv) csv.onclick = exportCsv;
  /* থিম বদলের বাটন — সেটিংস ও হ্যামবার্গার মেনু, দুই জায়গাতেই */
  ['themeSeg', 'themeSegD'].forEach(id => {
    const ts = document.getElementById(id);
    if (ts) ts.querySelectorAll('button').forEach(b => { b.onclick = () => setTheme(b.dataset.id); });
  });
  /* ভাষা বদলের বাটন — টপবার ও সেটিংস, দুই জায়গাতেই */
  ['bn', 'en'].forEach(l => {
    document.querySelectorAll('[data-lang="' + l + '"]').forEach(b => {
      b.onclick = () => { setLang(l); render(); };
    });
  });
}
function filterRows(){
  const inp = document.getElementById('txnSearch');
  const seg = document.getElementById('txnSeg');
  const mode = seg ? (seg.querySelector('button.on') || {}).dataset?.seg || 'all' : 'all';
  const q = (inp ? inp.value : '').trim().toLowerCase();
  const tb = document.getElementById('txnTbody'); if (!tb) return;
  let shown = 0;
  tb.querySelectorAll('tr').forEach(tr => {
    const okType = mode === 'all' || tr.dataset.type === mode;
    const okText = !q || (tr.textContent || '').toLowerCase().includes(q);
    const hit = okType && okText;
    tr.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  const em = document.getElementById('txnEmpty'); if (em) em.classList.toggle('hide', shown > 0);
  const ct = document.getElementById('txnCount'); if (ct) ct.textContent = bn(shown) + ' ' + L2('টি এন্ট্রি', 'entries');
}
function exportCsv(){
  try {
    const t = [...txns()].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const head = ['তারিখ', 'ধরণ', 'খাত', 'মাধ্যম', 'রশিদ', 'নোট', 'পরিমাণ'];
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(',')].concat(t.map(x => [x.date, x.type, x.category, x.method, x.receiptNo || '', x.note || '', Number(x.amount || 0)].map(q).join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'puja-sarathi-' + (ev() ? String(ev().name).replace(/[^\w\u0980-\u09FF]+/g, '-') : 'ledger') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(L2('CSV ডাউনলোড শুরু হয়েছে', 'CSV download started'));
  } catch(e){ toast(L2('CSV তৈরি করা যায়নি', 'Could not create CSV')); }
}

/* ============ Modals ============ */
function openModal(title, bodyHtml){
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
  m.innerHTML = '<div class="box"><div class="head"><span>' + esc(title) + '</span>'
    + '<button type="button" class="iconbtn" onclick="closeModal()" aria-label="close">' + icon('x', 'ic-sm') + '</button></div>'
    + '<div class="body">' + bodyHtml + '</div></div>';
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });
  document.addEventListener('keydown', escClose);
  document.body.appendChild(m);
}
function escClose(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  const m = document.getElementById('modal'); if (m) m.remove();
  document.removeEventListener('keydown', escClose);
}
/* টোস্ট এখন toast_v44.js-এ (৪.৪) — পুরনো একক-টোস্ট এখান থেকে সরানো হলো */
async function saveGuard(fn){
  try { return await fn(); }
  catch(ex){
    if (errCode(ex) === 'already-exists' || /already exists/i.test(errCode(ex))) return null;
    markWriteBlocked(ex);
    toast(L2('সংরক্ষণ হয়নি: ', 'Not saved: ') + fbErrMsg(ex));
    try { await reload(); } catch(e){}
    throw ex;
  }
}
window.addEventListener('unhandledrejection', (e) => {
  try {
    const m = fbErrMsg(e.reason);
    if (!/cancel|abort/i.test(String((e.reason && e.reason.message) || ''))) console.log('[পূজা সারথি] silent failure:', m);
  } catch(_){}
});

function formFields(form){ return Object.fromEntries(new FormData(form).entries()); }
function isHiddenField(el){ try { return !!el.closest('.hide') || el.offsetParent === null; } catch(e){ return false; } }
/* নিজের ভ্যালিডেশন — নেটিভ ইংরেজি বাবলের উপর নির্ভরতা নেই, বার্তা বাংলায় */
function validateForm(form){
  const bad = [];
  const els = form.querySelectorAll('input, select, textarea');
  for (let i = 0; i < els.length; i++){
    const el = els[i];
    if (el.disabled || isHiddenField(el)) continue;
    const v = (el.value == null ? '' : String(el.value)).trim();
    let lbl = '';
    try { const wrap = el.closest('label'); lbl = wrap ? wrap.textContent.replace(/\s+/g, ' ').trim().slice(0, 40) : ''; } catch(e){}
    if (el.hasAttribute('required') && !v){ bad.push(lbl ? (lbl + ' — ' + L2('পূরণ করুন', 'is required')) : L2('সব ঘর পূরণ করুন', 'Please fill in all the fields')); continue; }
    if (v && el.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ bad.push(L2('ইমেইলের ঠিকানাটি ঠিক নয় (যেমন: name@gmail.com)', 'The email address is not valid (e.g. name@gmail.com)')); continue; }
    if (v && el.type === 'number' && isNaN(Number(v))){ bad.push(lbl ? (lbl + ' — ' + L2('ঠিক সংখ্যা লিখুন', 'must be a number')) : L2('সংখ্যার ঘর ঠিক নয়', 'Please enter a valid number')); continue; }
    if (v && el.type === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(v)){ bad.push(L2('তারিখ ঠিক নয়', 'The date is not valid')); continue; }
  }
  return bad;
}
function showFormError(form, msg){
  const box = form.querySelector('.formErr');
  let el = box;
  if (!el){ el = document.createElement('div'); el.className = 'err formErr'; el.style.marginBottom = '10px'; form.insertBefore(el, form.firstChild); }
  el.innerHTML = icon('alert', 'ic-sm') + ' ' + esc(msg);
  try { el.scrollIntoView({ block:'nearest' }); } catch(e){}
}
/* run() — ফর্মের আসল কাজ; বার্তা দেখানো/লোডিং অবস্থা run()-এর ভিতরে */
function bindSubmit(form, run){
  if (!form) return;
  form.setAttribute('novalidate', 'novalidate');   // ভ্যালিডেশন আমাদের হাতেই (বার্তা বাংলায়)
  let last = 0;
  const fire = () => {
    const now = Date.now();
    if (now - last < 400) return;                  // ক্লিক ও submit — দুটোই এলে দ্বিগুণ যাবে না
    last = now;
    const bad = validateForm(form);
    if (bad.length){ showFormError(form, bad[0] + (bad.length > 1 ? (' (' + L2('আরও ', 'and ') + bn(bad.length - 1) + L2(' টি ঘর বাকি', ' more field(s) left') + ')') : '')); return; }
    run(formFields(form));
  };
  form.onsubmit = (e) => { e.preventDefault(); e.stopPropagation(); fire(); return false; };
  const btn = form.querySelector('button[type=submit], button:not([type]), input[type=submit]');
  if (btn){
    btn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); fire(); return false; };
  }
  form.onkeydown = (e) => {
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){ e.preventDefault(); fire(); }
  };
  return { fire };
}

async function runAct(act, id){

  if(writeActs.includes(act) && !canWrite()){
    toast(L2('আপনার শুধু দেখার অনুমতি আছে — edit করতে পারবেন না','You have read-only access — cannot edit'), 'warn');

  }

      editEvent: L2('ইভেন্ট সম্পাদনা', 'Edit event'),
      newTxn: L2('নতুন লেনদেন', 'New entry'),
      editTxn: L2('লেনদেন সম্পাদনা', 'Edit entry'),
      newDonor: L2('দান যোগ করুন', 'Add donation'),
      newMember: L2('নতুন সদস্য', 'New member'),
      editMember: L2('সদস্য সম্পাদনা', 'Edit member')
    };
    if (act === 'newEvent'){ openModal(t.newEvent, eventForm(null)); bindForm('f', async (d) => { await addDoc('events', { ...d, budget: Number(d.budget || 0) }); }); }
    else if (act === 'editEvent'){ const x = state.events.find(z => z.id === id); openModal(t.editEvent, eventForm(x)); bindForm('f', async (d) => { await updDoc('events', id, { ...d, budget: Number(d.budget || 0) }); }); }
    else if (act === 'delEvent'){
      if (confirm(L2('এই ইভেন্ট ও তার সব লেনদেনসহ মুছে ফেলবেন? (১০ সেকেন্ডের মধ্যে ফিরিয়ে আনা যাবে)', 'Delete this event along with all its entries? (you can undo within 10 seconds)'))){
        const kids = [];
        ['transactions', 'members', 'donors'].forEach(col => {
          (state[col] || []).forEach(x => { if (x.eventId === id) kids.push({ col, id: x.id }); });
        });
        await softDeleteMany([{ col: 'events', id }, ...kids],
          L2('ইভেন্ট মুছে ফেলা হয়েছে — ' , 'Event deleted — ') + bn(kids.length) + L2(' টি রেকর্ডসহ', ' records with it'),

      }
    }
    else if (act === 'setEvt'){ state.selectedEventId = id; render(); return; }
    else if (act === 'newTxn'){ openModal(t.newTxn, txnForm(null)); bindTxnForm(); }
    else if (act === 'editTxn'){ const x = state.transactions.find(z => z.id === id); openModal(t.editTxn, txnForm(x)); bindTxnForm(x); }
    else if (act === 'delTxn'){
      if (confirm(L2('এই লেনদেনটি মুছে ফেলবেন? (১০ সেকেন্ডের মধ্যে ফিরিয়ে আনা যাবে)', 'Delete this entry? (you can undo within 10 seconds)'))){

      }

    else if (act === 'newMember'){ openModal(t.newMember, memberForm(null)); bindForm('f', async (d) => { await addDoc('members', { ...d, contribution: Number(d.contribution||0), paid: Number(d.paid||0), eventId: state.selectedEventId, orgId: state.currentOrgId }); }); }

        else if (act === 'delMember'){
      if (confirm(L2('এই সদস্যকে মুছে ফেলবেন? (১০ সেকেন্ডের মধ্যে ফিরিয়ে আনা যাবে)', 'Remove this member? (you can undo within 10 seconds)'))){

  if (rb) rb.onclick = () => {
    if (confirm(L2('ব্রাউজারে জমানো সব ডেমো ডেটা মুছে ফেলবেন?', 'Clear all demo data stored in this browser?'))){
      ['ps_events','ps_members','ps_transactions','ps_donors','ps_organizations','ps_users',LSA,LSO,LSU,LSC,LSI].forEach(k => store.del(k));
      alert(L2('রিসেট হয়েছে', 'Reset done'));
    }
  };
}

function bindForm(formId, onSave, afterSave){
  const f=document.getElementById(formId); if(!f) return;
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    closeModal();
    try {
      await saveGuard(() => onSave(d));
      if (afterSave) await afterSave(d);
      await reload();
      toast(L2('সেভ হয়েছে ✓', 'Saved ✓'), 'ok');
    } catch(ex){ /* বার্তা toast-এ দেখানো হয়েছে */ }
    render();
  });
}
function bindTxnForm(ex){
  const f=document.getElementById('f'); if(!f) return;
  const typeSel=f.querySelector('#typeSel'), catSel=f.querySelector('#catSel');
  if(typeSel) typeSel.onchange=()=>{ catSel.innerHTML=(typeSel.value==='আয়'?INC:EXP).map(c=>`<option>${c}</option>`).join(''); };
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    closeModal();
    const data={...d, amount:Number(d.amount), eventId:state.selectedEventId, orgId:state.currentOrgId, receiptNo:d.receiptNo||''};
    try {
      await saveGuard(() => ex ? updDoc('transactions',ex.id,data) : addDoc('transactions',data));
      await reload();
      toast(L2('লেনদেন সেভ হয়েছে ✓', 'Entry saved ✓'), 'ok');
    }
    catch(err){ /* বার্তা toast-এ */ }
    render();
  });
}
function bindDonorForm(){
  const f=document.getElementById('f'); if(!f) return;
  let busy = false;
  bindSubmit(f, async (d) => {
    if (busy) return; busy = true;
    const amount=Number(d.amount||0);
    if(amount<=0){ showFormError(f, L2('টাকার পরিমাণ ০-এর বেশি হতে হবে', 'The amount must be greater than 0')); busy=false; return; }
    let donorId=d.donorId, name=d.donorId? (state.donors.find(x=>x.id===d.donorId)||{}).name : d.name;
    if(!name||!name.trim()){ showFormError(f, L2('দাতার নাম লিখুন', 'Please enter the donor name')); busy=false; return; }
    closeModal();
    try {
      if(donorId){
        const don=state.donors.find(x=>x.id===donorId)||{};
        await saveGuard(() => updDoc('donors',donorId,{totalDonated:(Number(don.totalDonated)||0)+amount, lastDonationDate:d.date, phone:d.phone||don.phone, orgId:state.currentOrgId, eventId:state.selectedEventId}));
      } else {
        const cr=await saveGuard(() => addDoc('donors',{name,phone:d.phone,totalDonated:amount,lastDonationDate:d.date,orgId:state.currentOrgId,eventId:state.selectedEventId}));
        donorId=cr && cr.id;
      }
      await saveGuard(() => addDoc('transactions',{eventId:state.selectedEventId,type:'আয়',category:'চাঁদা',amount,date:d.date,method:d.method,note:name+(d.note?` — ${d.note}`:''),receiptNo:'R-'+String(Date.now()).slice(-4),donorId,orgId:state.currentOrgId}));
      await reload();
      toast(L2('দান যোগ হয়েছে ✓', 'Donation added ✓'), 'ok');
    } catch(err){ /* বার্তা toast-এ */ }
    render();
  });
}

/* ============ Boot ============ */
let booted = false;
function boot(){
  if (booted) return; booted = true;
  window.__psDemo = () => { goDemo('ব্যবহারকারীর পছন্দ'); APP_RENDERED = true; render(); };
  /* ৫ সেকেন্ডেও কিছু দেখা না গেলে স্প্ল্যাশে স্পষ্ট বার্তা */
  setTimeout(() => {
    if (APP_RENDERED) return;
    const m = document.getElementById('bootMsg');
    if (m) m.innerHTML = L2('সংযোগ করা হচ্ছে… নেটওয়ার্ক ধীর হতে পারে।<br>না হলে <b>⚡ ডেমো মোডে চালান</b> চাপুন।', 'Connecting… the network may be slow.<br>Otherwise tap <b>⚡ Demo mode</b>.');
  }, 5000);
  try { document.documentElement.lang = LANG; } catch(_){}
  try { console.log('[Puja Sarathi] ' + APP_VER + ' | mode: ' + (useFb() ? ('Firebase:' + FB.projectId) : 'demo(local)') + ' | lang: ' + LANG + ' | ' + location.protocol); } catch(_){}

  if (!useFb()){
    try {
      const uid0 = store.get(LSU);
      if (uid0){
        const a = JSON.parse(store.get(LSA)||'[]').find(x => x.uid === uid0);
        const cur = store.get(LSC) || (a && a.orgIds && a.orgIds[0]);
        if (a){ state.user = { ...a, currentOrgId:cur }; state.orgs = JSON.parse(store.get(LSO)||'[]').filter(o => a.orgIds.includes(o.id)); }
      }
    } catch(e){}
    if (state.user){ reload().then(render).catch(ex => { noteWarn(fbErrMsg(ex)); render(); }); }
    else { render(); }
  } else {
    withTimeout(loadFirebase(), 30000, L2('Firebase লোড হলো না (ইন্টারনেট/CDN ব্লকড?)', 'Firebase could not load (internet/CDN blocked?)'))
      .then(() => {
        fb.auth.onAuthStateChanged(async (u) => {
          /* লগইন/সাইনআপ চলতে থাকলে এই হ্যান্ডলার হস্তক্ষেপ করবে না —
             আগে এটাই race বানিয়ে অ্যাপকে লগইন স্ক্রিনে আটকে রাখত */
          if (authBusy > 0) return;
          if (!u){ state.user = null; state.orgs = []; state.currentOrgId = ''; render(); return; }
          try {
            let p = {};
            for (let attempt = 0; attempt < 3; attempt++){
              try {
                const snap = await fbGet(fb.db.collection('users').doc(u.uid), 'প্রোফাইল পড়া');
                p = (snap && snap.exists !== false && snap.data()) ? (snap.data() || {}) : {};
              } catch(e){ if (permDenied(e)) noteBlocked('প্রোফাইল ডেটা (users)'); else noteWarn(fbErrMsg(e)); }
              if (p && p.orgIds && p.orgIds.length) break;
              if (attempt < 2) await new Promise(r => setTimeout(r, 1200));
            }
            state.user = {
              uid: u.uid,
              name: p.name || u.displayName || (u.email||'').split('@')[0],
              email: p.email || u.email || '',
              orgIds: p.orgIds || [],
              currentOrgId: p.currentOrgId || ((p.orgIds||[])[0] || '')
            };
            state.orgs = await fbGetOrgs(u.uid);
            syncOrg();
            await reload();
            render();
          } catch(ex){
            /* যেকোনো সমস্যা হলেও ব্যবহারকারী লগইন অবস্থাতেই থাকে — আটকে থাকে না */
            if (!state.user) state.user = { uid:u.uid, name:(u.email||'').split('@')[0], email:u.email||'', orgIds:[], currentOrgId:'' };
            if (!state.orgs) state.orgs = [];
            noteWarn(L2('ডেটা লোডে সমস্যা: ', 'Problem loading data: ') + fbErrMsg(ex));
            syncOrg();
            render();
          }
        });
      })
      .catch(ex => {
        goDemo(fbErrMsg(ex));
        state.user = null;
        render();
      });
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-route]');
    if (a){ e.preventDefault(); state.route = a.dataset.route; render(); }
  });
  window.closeModal = closeModal;
}
if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
<script>
// PWA Service Worker + Install Prompt
(function(){
  // Register SW for PWA (works on http://localhost and https)
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      // Only register if not file:// protocol
      if(location.protocol === 'file:'){
        console.log('[PWA] File protocol - SW skipped, but manifest still works for installability check');
        return;
      }
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(reg => {
          console.log('[PWA] SW registered:', reg.scope);
          // Check for updates
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if(nw){
              nw.addEventListener('statechanged', () => {
                if(nw.state === 'installed' && navigator.serviceWorker.controller){
                  console.log('[PWA] New content available, refresh to update');
                  // Optionally show update banner
                  try{
                    const b = document.createElement('div');
                    b.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center';
                    b.innerHTML='<span>🔄 New version available</span><button onclick="location.reload()" style="background:#f59e0b;border:0;color:white;padding:4px 10px;border-radius:999px;font-weight:700;cursor:pointer">Reload</button><button onclick="this.parentElement.remove()" style="background:transparent;border:0;color:#94a3b8;cursor:pointer">✕</button>';
                    document.body.appendChild(b);
                    setTimeout(()=> b.remove(), 15000);
                  }catch(_){}
                }
              });
            }
          });
        })
        .catch(err => console.warn('[PWA] SW registration failed:', err));
    });
  }

  // PWA Install Prompt
  let deferredPrompt = null;
  const installBtnId = 'pwaInstallBtn';
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('[PWA] beforeinstallprompt fired');
    // Show install button if exists, or create floating button
    let btn = document.getElementById(installBtnId);
    if(!btn){
      try{
        btn = document.createElement('button');
        btn.id = installBtnId;
        btn.innerHTML = '📲 Install App';
        btn.style.cssText='position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:white;border:0;padding:12px 18px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 8px 24px -4px rgba(245,158,11,.5);z-index:9998;cursor:pointer;display:flex;align-items:center;gap:6px';
        btn.onclick = async () => {
          if(!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] Install outcome:', outcome);
          deferredPrompt = null;
          btn.remove();
        };
        document.body.appendChild(btn);
        // Auto hide after 20s
        setTimeout(()=> { try{ btn.style.opacity='0'; btn.style.transform='translateY(10px)'; setTimeout(()=> btn.remove(), 400);}catch(_){} }, 20000);
      }catch(_){}
    } else {
      btn.style.display = 'flex';
    }
    // Also show in settings if button there
    try{
      const sBtn = document.getElementById('settingsPwaInstall');
      if(sBtn) sBtn.style.display = 'inline-flex';
    }catch(_){}
  });

  window.addEventListener('appinstalled', () => {
    console.log('[PWA] App installed');
    deferredPrompt = null;
    const btn = document.getElementById(installBtnId);
    if(btn) btn.remove();
    try{
      const sBtn = document.getElementById('settingsPwaInstall');
      if(sBtn) sBtn.style.display = 'none';
    }catch(_){}
  });

  // Expose install trigger for settings button
  window.triggerPwaInstall = async () => {
    if(deferredPrompt){
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      return outcome;
    } else {
      // Fallback instructions
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if(isIOS){
        alert('iPhone: Tap Share button (⎙) → Add to Home Screen → Add');
      } else {
        alert('To install: Open browser menu (⋮) → Install app / Add to Home Screen');
      }
      return 'dismissed';
    }
  };
})();
</script>
